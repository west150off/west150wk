<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TextCard - SNS 카드 메이커</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --accent: #0A84FF;
      --bg: #000;
      --card-bg: #1C1C1E;
      --text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* ===== Top Bar ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
      z-index: 100;
    }

    .top-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .top-btn:active {
      background: rgba(255,255,255,0.22);
    }

    .top-btn.primary {
      background: var(--accent);
    }

    /* ===== Preview Area ===== */
    .preview-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .placeholder-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
    }

    /* ===== Card ===== */
    #card {
      position: absolute;
      z-index: 10;
      width: 78%;
      max-width: 340px;
      min-width: 200px;
      padding: 28px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      color: #1a1a1a;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      cursor: grab;
      touch-action: none;
      transition: box-shadow 0.2s;
    }

    #card:active {
      cursor: grabbing;
    }

    #card.dragging {
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Template Styles */
    #card.template-basic {
      background: rgba(255,255,255,0.92);
      color: #1a1a1a;
      border-radius: 18px;
    }

    #card.template-instagram {
      background: #fff;
      color: #262626;
      border-radius: 12px;
    }

    #card.template-story {
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
      color: white;
      border-radius: 16px;
      aspect-ratio: 9/16;
      max-height: 70%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    #card.template-x {
      background: #000;
      color: #e7e9ea;
      border-radius: 16px;
      border: 1px solid #2f3336;
    }

    #card.template-dark {
      background: rgba(28,28,30,0.95);
      color: #f5f5f7;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    #card.template-glass {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: white;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.25);
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    #card.template-note {
      background: #fef9e7;
      color: #3d3d3d;
      border-radius: 4px;
      box-shadow: 2px 3px 12px rgba(0,0,0,0.2);
      background-image: repeating-linear-gradient(
        transparent,
        transparent 27px,
        #e8e0c8 28px
      );
      line-height: 28px;
      padding-top: 20px;
    }

    #text-content {
      outline: none;
      min-height: 60px;
      font-size: 22px;
      line-height: 1.45;
      word-break: keep-all;
      user-select: text;
      -webkit-user-select: text;
    }

    #text-content:empty:before {
      content: "여기에 글을 입력하세요";
      color: rgba(0,0,0,0.35);
    }

    #card.template-story #text-content:empty:before,
    #card.template-dark #text-content:empty:before,
    #card.template-glass #text-content:empty:before,
    #card.template-x #text-content:empty:before {
      color: rgba(255,255,255,0.4);
    }

    /* Brand & Source (outside card) */
    .corner-label {
      position: absolute;
      z-index: 20;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      max-width: 42%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0,0,0,0.25);
    }

    #brand-display {
      left: 12px;
      bottom: 12px;
    }

    #source-display {
      right: 12px;
      bottom: 12px;
      text-align: right;
    }

    /* ===== Bottom Panel ===== */
    .bottom-panel {
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 0.5px solid rgba(255,255,255,0.1);
      padding: 12px 0 8px;
      z-index: 100;
    }

    /* Template Selector */
    .template-scroll {
      display: flex;
      gap: 10px;
      padding: 0 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .template-scroll::-webkit-scrollbar {
      display: none;
    }

    .template-item {
      flex-shrink: 0;
      width: 64px;
      text-align: center;
      cursor: pointer;
    }

    .template-thumb {
      width: 64px;
      height: 48px;
      border-radius: 10px;
      border: 2px solid transparent;
      overflow: hidden;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      transition: border-color 0.15s;
    }

    .template-item.active .template-thumb {
      border-color: var(--accent);
    }

    .template-item span {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    .template-item.active span {
      color: white;
      font-weight: 500;
    }

    /* Controls */
    .controls {
      padding: 0 16px 4px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .control-label {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      min-width: 52px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn {
      width: 42px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tool-btn:active,
    .tool-btn.active {
      background: var(--accent);
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
    }

    .color-swatch.active {
      border-color: white;
      transform: scale(1.15);
    }

    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
    }

    .size-value {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      min-width: 36px;
      text-align: right;
    }

    /* Brand / Source inputs (hidden, controlled via JS) */
    .hidden-inputs {
      display: none;
    }

    /* Loading overlay for download */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: white;
      font-size: 16px;
    }

    .loading-overlay.show {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="top-btn" id="btn-upload">
      <span>↑</span> 이미지
    </button>
    <button class="top-btn primary" id="btn-download">
      <span>↓</span> 저장
    </button>
  </div>

  <!-- Preview -->
  <div class="preview-wrapper" id="preview">
    <div class="placeholder-bg" id="placeholder">이미지를 업로드하세요</div>
    <img id="bg-image" style="display:none;" alt="background">
    
    <div id="card" class="template-basic">
      <div id="text-content" contenteditable="true" spellcheck="false">
        오늘도 수고했어.<br>내일은 더 나아질 거야.
      </div>
    </div>

    <!-- Brand & Source outside card -->
    <div class="corner-label" id="brand-display">Daily Note</div>
    <div class="corner-label" id="source-display">개인 기록</div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <!-- Templates -->
    <div class="template-scroll" id="template-list">
      <div class="template-item active" data-template="basic">
        <div class="template-thumb" style="background:#f5f5f5; color:#333;">기본</div>
        <span>기본</span>
      </div>
      <div class="template-item" data-template="instagram">
        <div class="template-thumb" style="background:#fff; color:#262626; border:1px solid #ddd;">인스타</div>
        <span>인스타</span>
      </div>
      <div class="template-item" data-template="story">
        <div class="template-thumb" style="background:linear-gradient(#833ab4,#fd1d1d); color:white;">스토리</div>
        <span>스토리</span>
      </div>
      <div class="template-item" data-template="x">
        <div class="template-thumb" style="background:#000; color:#e7e9ea;">X</div>
        <span>X스타일</span>
      </div>
      <div class="template-item" data-template="dark">
        <div class="template-thumb" style="background:#1c1c1e; color:#f5f5f7;">다크</div>
        <span>다크</span>
      </div>
      <div class="template-item" data-template="glass">
        <div class="template-thumb" style="background:rgba(255,255,255,0.2); color:white; backdrop-filter:blur(4px);">글래스</div>
        <span>글래스</span>
      </div>
      <div class="template-item" data-template="note">
        <div class="template-thumb" style="background:#fef9e7; color:#3d3d3d;">노트</div>
        <span>노트</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Card Size -->
      <div class="control-row">
        <span class="control-label">카드크기</span>
        <input type="range" id="card-size" min="55" max="95" value="78">
        <span class="size-value" id="card-size-val">78%</span>
      </div>

      <!-- Font Size -->
      <div class="control-row">
        <span class="control-label">글자크기</span>
        <input type="range" id="font-size" min="14" max="42" value="22">
        <span class="size-value" id="font-size-val">22px</span>
      </div>

      <!-- Text Color -->
      <div class="control-row">
        <span class="control-label">글자색</span>
        <div class="color-row">
          <input type="color" id="text-color" value="#1a1a1a">
          <div class="color-swatch" data-color="#1a1a1a" style="background:#1a1a1a"></div>
          <div class="color-swatch" data-color="#ffffff" style="background:#ffffff"></div>
          <div class="color-swatch" data-color="#0A84FF" style="background:#0A84FF"></div>
          <div class="color-swatch" data-color="#FF453A" style="background:#FF453A"></div>
          <div class="color-swatch" data-color="#FFD60A" style="background:#FFD60A"></div>
        </div>
      </div>

      <!-- Style Buttons -->
      <div class="control-row">
        <span class="control-label">스타일</span>
        <div class="btn-group">
          <button class="tool-btn" id="btn-bold" title="굵게">B</button>
          <button class="tool-btn" id="btn-italic" title="기울임"><i>I</i></button>
          <button class="tool-btn" id="btn-align-left" title="왼쪽">⬅</button>
          <button class="tool-btn" id="btn-align-center" title="가운데">⬛</button>
          <button class="tool-btn" id="btn-align-right" title="오른쪽">➡</button>
        </div>
      </div>

      <!-- Highlight & Underline -->
      <div class="control-row">
        <span class="control-label">강조</span>
        <div class="btn-group">
          <button class="tool-btn" id="btn-highlight" title="하이라이트">H</button>
          <input type="color" id="highlight-color" value="#FFE566" title="하이라이트 색">
          <button class="tool-btn" id="btn-underline" title="밑줄">U</button>
          <input type="color" id="underline-color" value="#FF453A" title="밑줄 색">
        </div>
      </div>

      <!-- Underline thickness -->
      <div class="control-row">
        <span class="control-label">밑줄두께</span>
        <input type="range" id="underline-width" min="1" max="6" value="2">
        <span class="size-value" id="underline-width-val">2px</span>
      </div>

      <!-- Opacity -->
      <div class="control-row">
        <span class="control-label">투명도</span>
        <input type="range" id="card-opacity" min="30" max="100" value="92">
        <span class="size-value" id="card-opacity-val">92%</span>
      </div>

      <!-- Brand & Source -->
      <div class="control-row" style="margin-top:6px;">
        <span class="control-label">브랜드</span>
        <input type="text" id="brand-input" value="Daily Note" style="flex:1; background:rgba(255,255,255,0.1); border:none; color:white; padding:8px 12px; border-radius:10px; font-size:14px;">
      </div>
      <div class="control-row">
        <span class="control-label">출처</span>
        <input type="text" id="source-input" value="개인 기록" style="flex:1; background:rgba(255,255,255,0.1); border:none; color:white; padding:8px 12px; border-radius:10px; font-size:14px;">
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" style="display:none;">

  <div class="loading-overlay" id="loading">저장 중...</div>

  <script>
    // ===== Elements =====
    const card = document.getElementById('card');
    const textContent = document.getElementById('text-content');
    const bgImage = document.getElementById('bg-image');
    const placeholder = document.getElementById('placeholder');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');

    // ===== State =====
    let currentTemplate = 'basic';
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    // ===== Template Switching =====
    document.querySelectorAll('.template-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.template-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentTemplate = item.dataset.template;

        // Remove all template classes
        card.className = '';
        card.classList.add('template-' + currentTemplate);

        // Reset some styles based on template
        if (['story', 'dark', 'glass', 'x'].includes(currentTemplate)) {
          textContent.style.color = '#ffffff';
          document.getElementById('text-color').value = '#ffffff';
        } else if (currentTemplate === 'note') {
          textContent.style.color = '#3d3d3d';
          document.getElementById('text-color').value = '#3d3d3d';
        } else {
          textContent.style.color = '#1a1a1a';
          document.getElementById('text-color').value = '#1a1a1a';
        }

        // Story specific
        if (currentTemplate === 'story') {
          card.style.width = '62%';
          document.getElementById('card-size').value = 62;
          document.getElementById('card-size-val').textContent = '62%';
        }
      });
    });

    // ===== Card Size =====
    document.getElementById('card-size').addEventListener('input', (e) => {
      const val = e.target.value;
      card.style.width = val + '%';
      document.getElementById('card-size-val').textContent = val + '%';
    });

    // ===== Font Size =====
    document.getElementById('font-size').addEventListener('input', (e) => {
      const val = e.target.value;
      textContent.style.fontSize = val + 'px';
      document.getElementById('font-size-val').textContent = val + 'px';
    });

    // ===== Text Color =====
    document.getElementById('text-color').addEventListener('input', (e) => {
      textContent.style.color = e.target.value;
    });

    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        const color = swatch.dataset.color;
        textContent.style.color = color;
        document.getElementById('text-color').value = color;
      });
    });

    // ===== Bold / Italic =====
    document.getElementById('btn-bold').addEventListener('click', () => {
      document.execCommand('bold', false, null);
      textContent.focus();
    });

    document.getElementById('btn-italic').addEventListener('click', () => {
      document.execCommand('italic', false, null);
      textContent.focus();
    });

    // ===== Alignment =====
    document.getElementById('btn-align-left').addEventListener('click', () => {
      textContent.style.textAlign = 'left';
    });
    document.getElementById('btn-align-center').addEventListener('click', () => {
      textContent.style.textAlign = 'center';
    });
    document.getElementById('btn-align-right').addEventListener('click', () => {
      textContent.style.textAlign = 'right';
    });

    // ===== Highlight =====
    document.getElementById('btn-highlight').addEventListener('click', () => {
      const color = document.getElementById('highlight-color').value;
      document.execCommand('hiliteColor', false, color);
      textContent.focus();
    });

    // ===== Underline =====
    document.getElementById('btn-underline').addEventListener('click', () => {
      const color = document.getElementById('underline-color').value;
      const width = document.getElementById('underline-width').value + 'px';
      
      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      if (range.collapsed) {
        document.execCommand('underline', false, null);
        return;
      }

      // Wrap selection with span for custom underline
      const span = document.createElement('span');
      span.style.textDecoration = 'underline';
      span.style.textDecorationColor = color;
      span.style.textDecorationThickness = width;
      span.style.textUnderlineOffset = '3px';

      try {
        range.surroundContents(span);
      } catch (e) {
        // fallback
        document.execCommand('underline', false, null);
      }
      textContent.focus();
    });

    document.getElementById('underline-width').addEventListener('input', (e) => {
      document.getElementById('underline-width-val').textContent = e.target.value + 'px';
    });

    // ===== Opacity =====
    document.getElementById('card-opacity').addEventListener('input', (e) => {
      const val = e.target.value;
      document.getElementById('card-opacity-val').textContent = val + '%';

      // Apply opacity differently per template
      const opacity = val / 100;
      if (currentTemplate === 'glass') {
        card.style.background = `rgba(255,255,255,${opacity * 0.25})`;
      } else if (currentTemplate === 'dark') {
        card.style.background = `rgba(28,28,30,${opacity})`;
      } else if (currentTemplate === 'x') {
        card.style.background = `rgba(0,0,0,${opacity})`;
      } else if (currentTemplate === 'story') {
        // keep gradient, just adjust overall
        card.style.opacity = opacity;
      } else if (currentTemplate === 'note') {
        card.style.background = `rgba(254,249,231,${opacity})`;
      } else {
        card.style.background = `rgba(255,255,255,${opacity})`;
      }
    });

    // ===== Brand & Source =====
    document.getElementById('brand-input').addEventListener('input', (e) => {
      document.getElementById('brand-display').textContent = e.target.value || '';
    });

    document.getElementById('source-input').addEventListener('input', (e) => {
      document.getElementById('source-display').textContent = e.target.value || '';
    });

    // ===== Image Upload =====
    document.getElementById('btn-upload').addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        bgImage.src = ev.target.result;
        bgImage.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    });

    // ===== Drag Card =====
    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    card.addEventListener('pointerdown', (e) => {
      // Don't start drag if clicking inside text content
      if (e.target.closest('#text-content')) return;

      isDragging = true;
      card.classList.add('dragging');
      const pos = getEventPos(e);
      startX = pos.x;
      startY = pos.y;

      const rect = card.getBoundingClientRect();
      const previewRect = preview.getBoundingClientRect();
      initialLeft = rect.left - previewRect.left;
      initialTop = rect.top - previewRect.top;

      card.style.left = initialLeft + 'px';
      card.style.top = initialTop + 'px';
      card.style.transform = 'none';
      card.setPointerCapture(e.pointerId);
    });

    card.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const pos = getEventPos(e);
      const dx = pos.x - startX;
      const dy = pos.y - startY;

      card.style.left = (initialLeft + dx) + 'px';
      card.style.top = (initialTop + dy) + 'px';
    });

    card.addEventListener('pointerup', (e) => {
      isDragging = false;
      card.classList.remove('dragging');
      card.releasePointerCapture(e.pointerId);
    });

    card.addEventListener('pointercancel', () => {
      isDragging = false;
      card.classList.remove('dragging');
    });

    // Center card initially
    function centerCard() {
      card.style.left = '50%';
      card.style.top = '50%';
      card.style.transform = 'translate(-50%, -50%)';
    }
    centerCard();

    // ===== Download PNG =====
    document.getElementById('btn-download').addEventListener('click', async () => {
      const loading = document.getElementById('loading');
      loading.classList.add('show');

      // Temporarily hide selection outlines etc
      const originalOutline = textContent.style.outline;
      textContent.style.outline = 'none';

      try {
        const canvas = await html2canvas(preview, {
          useCORS: true,
          backgroundColor: null,
          scale: 2,
          logging: false,
          allowTaint: true
        });

        const link = document.createElement('a');
        link.download = 'textcard_' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('저장 중 오류가 발생했습니다. 다시 시도해주세요.');
        console.error(err);
      } finally {
        textContent.style.outline = originalOutline;
        loading.classList.remove('show');
      }
    });

    // Prevent zoom on double tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    // Keep text editable
    textContent.addEventListener('focus', () => {
      // allow selection
    });
  </script>
</body>
</html>
