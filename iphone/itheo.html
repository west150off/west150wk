<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>신학 카드뉴스 에디터</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{
  font-family:'RIDIBatang';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
  font-weight:normal; font-style:normal; font-display:swap;
}
:root{
  --bg:#f4f4f6; --panel:#fff; --line:#e6e6ea; --ink:#1c1c1f; --ink-dim:#8a8a92;
  --accent:#2f6fed; --accent-soft:#eaf1ff; --danger:#e6503f;
  --radius:14px; --radius-sm:9px; --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  height:100%; margin:0; overscroll-behavior:none;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  color:var(--ink); background:var(--bg); touch-action:none; user-select:none;
}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
#app{position:fixed; inset:0; display:flex; flex-direction:column;}
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  height:calc(52px + var(--safe-t)); padding:var(--safe-t) 10px 0;
  background:var(--panel); border-bottom:1px solid var(--line); z-index:50;
}
#topbar .tb-btn{width:var(--tap); height:40px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); font-size:18px;}
#topbar .tb-btn:active{background:var(--accent-soft);}
#topbar .tb-btn:disabled{opacity:.3;}
#topTitle{flex:1; text-align:center; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#btnSave,#btnTpl{padding:0 12px; height:36px; border-radius:999px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:4px;}
#btnSave{background:var(--accent); color:#fff;}
#btnTpl{background:var(--bg); border:1px solid var(--line);}
#mainArea{flex:1; display:flex; min-height:0;}
#toolsPanel{display:none; flex-direction:column; gap:4px; width:88px; padding:10px 6px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto;}
#propPanel{display:none; flex-direction:column; width:270px; padding:14px; gap:14px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto;}
#canvasViewport{flex:1; position:relative; overflow:hidden; background:var(--bg);}
#canvasStage{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;}
#cardCanvas{position:relative; background:#fff; box-shadow:0 2px 24px rgba(0,0,0,.14); overflow:hidden;}
#highlightCanvas,#inkCanvas{position:absolute; inset:0; width:100%; height:100%;}
#elementsLayer{position:absolute; inset:0;}
#selectionOverlay{position:absolute; inset:0; pointer-events:none;}
#zoomControls{position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; background:var(--panel); border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.12); overflow:hidden; z-index:20;}
#zoomControls button{width:40px; height:40px; font-size:16px;}
#zoomLevel{font-size:10px; text-align:center; color:var(--ink-dim); padding-bottom:4px;}
.el{position:absolute; cursor:grab; outline:none;}
.el.dragging{cursor:grabbing;}
.el-text,.el-scripture{padding:4px; white-space:pre-wrap; word-break:break-word; line-height:1.3; min-width:20px; min-height:20px;}
.el-text[contenteditable="true"],.el-scripture[contenteditable="true"]{cursor:text;}
.el.is-placeholder{opacity:.42; font-style:italic;}
.el-image{overflow:hidden; background:#e8e6e2;}
.el-image .img-inner{width:100%; height:100%; background-size:cover; background-position:center; background-repeat:no-repeat; pointer-events:none;}
.el-image.is-placeholder .img-inner{
  display:flex; align-items:center; justify-content:center; color:#8a8680; font-size:16px; font-style:italic;
}
.el-image.is-placeholder .img-inner::after{content:attr(data-ph);}
.el-shape svg{width:100%; height:100%; display:block; pointer-events:none;}
.el-scripture .sc-ref{display:block; font-size:0.45em; letter-spacing:.12em; opacity:.65; margin-bottom:.35em; font-style:normal; font-family:Pretendard,sans-serif;}
.sel-box{position:absolute; border:2px solid var(--accent); pointer-events:none;}
.handle{position:absolute; width:26px; height:26px; margin:-13px; display:flex; align-items:center; justify-content:center; pointer-events:auto;}
.handle::after{content:""; width:14px; height:14px; background:#fff; border:2px solid var(--accent); border-radius:50%;}
.handle.rot::after{background:var(--accent);}
.handle.tl{left:0;top:0;cursor:nwse-resize;} .handle.tr{left:100%;top:0;cursor:nesw-resize;}
.handle.bl{left:0;top:100%;cursor:nesw-resize;} .handle.br{left:100%;top:100%;cursor:nwse-resize;}
.handle.rot{left:50%;top:-40px;cursor:grab;}
.rot-line{position:absolute; left:50%; top:-40px; width:2px; height:40px; margin-left:-1px; background:var(--accent);}
.fit-warn{position:absolute; left:10px; top:10px; background:rgba(230,80,63,.94); color:#fff; font-size:12px; padding:8px 12px; border-radius:10px; z-index:30; max-width:85%; pointer-events:none; line-height:1.4;}
.tool-btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:var(--radius-sm); padding:8px 4px; min-width:56px; min-height:var(--tap); color:var(--ink-dim); font-size:10px; font-weight:600;}
.tool-btn .ic{font-size:19px;} .tool-btn.active{background:var(--accent-soft); color:var(--accent);}
#bottomToolbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-around; padding:4px 4px calc(4px + var(--safe-b)); background:var(--panel); border-top:1px solid var(--line); z-index:40; position:relative;}
.submenu{position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--panel); border-radius:var(--radius); box-shadow:0 8px 28px rgba(0,0,0,.18); display:flex; gap:4px; padding:8px; z-index:60; flex-wrap:wrap; max-width:92vw;}
#pageStrip{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 10px calc(8px + var(--safe-b)); background:var(--panel); border-top:1px solid var(--line); overflow-x:auto;}
.page-thumb{flex:0 0 auto; width:34px; height:42px; border-radius:6px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-dim); background:#fff; position:relative;}
.page-thumb.active{border-color:var(--accent); color:var(--accent);}
#btnAddPage{flex:0 0 auto; width:34px; height:42px; border-radius:6px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-dim);}
.page-menu-btn{position:absolute; right:-4px; top:-6px; width:16px; height:16px; border-radius:50%; background:var(--ink-dim); color:#fff; font-size:9px; display:none; align-items:center; justify-content:center;}
.page-thumb.active .page-menu-btn{display:flex;}
.prop-group{display:flex; flex-direction:column; gap:6px;}
.prop-label{font-size:11px; font-weight:700; color:var(--ink-dim);}
.prop-row{display:flex; align-items:center; gap:8px;}
.seg{display:flex; background:var(--bg); border-radius:8px; padding:2px; flex-wrap:wrap;}
.seg button{flex:1; min-width:48px; padding:6px 4px; border-radius:6px; font-size:11px; font-weight:700; color:var(--ink-dim);}
.seg button.active{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15);}
input[type="range"]{flex:1;}
input[type="color"]{width:34px; height:30px; border:1px solid var(--line); border-radius:8px; padding:0; background:none;}
input[type="text"],input[type="number"],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--bg); font-family:inherit;
}
textarea{min-height:80px; resize:vertical;}
.prop-btn{flex:1; padding:9px 0; border-radius:8px; background:var(--bg); font-size:12px; font-weight:700; text-align:center;}
.prop-btn.danger{color:var(--danger);}
.empty-hint{font-size:12px; color:var(--ink-dim); text-align:center; padding:20px 6px; line-height:1.5;}
.role-tag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:6px; margin-bottom:4px;}
#sheetOverlay,#tplOverlay{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:70; opacity:0; pointer-events:none; transition:opacity .18s;}
#sheetOverlay.show,#tplOverlay.show{opacity:1; pointer-events:auto;}
#propSheet{
  position:fixed; left:0; right:0; bottom:0; background:var(--panel); z-index:71;
  border-radius:18px 18px 0 0; padding:10px 16px calc(16px + var(--safe-b));
  transform:translateY(100%); transition:transform .2s ease; max-height:62vh; overflow-y:auto;
}
#propSheet.show{transform:translateY(0);}
#tplSheet{
  position:fixed; left:0; right:0; bottom:0; top:10%; background:var(--panel); z-index:81;
  border-radius:18px 18px 0 0; padding:12px 16px calc(20px + var(--safe-b));
  transform:translateY(100%); transition:transform .22s ease; overflow-y:auto;
}
#tplOverlay{z-index:80;}
#tplSheet.show{transform:translateY(0);}
.sheet-grip{width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 12px;}
.tpl-title{font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--ink-dim); margin-bottom:12px;}
.tpl-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tpl-card{border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; background:#fff;}
.tpl-preview{height:110px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; letter-spacing:.08em;}
.tpl-name{padding:10px 12px 2px; font-size:12px; font-weight:700;}
.tpl-desc{padding:0 12px 12px; font-size:11px; color:var(--ink-dim);}
@media (min-width:760px){
  #toolsPanel,#propPanel{display:flex;}
  #bottomToolbar{display:none;}
  #sheetOverlay,#propSheet{display:none !important;}
  .tpl-grid{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:759px){ #toolsPanel,#propPanel{display:none;} }
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn" id="btnBack">←</button>
    <div id="topTitle">신학 카드뉴스 에디터</div>
    <button class="tb-btn" id="btnUndo">↶</button>
    <button class="tb-btn" id="btnRedo">↷</button>
    <button id="btnTpl">TEMPLATES</button>
    <button id="btnSave">⬆ 저장</button>
  </header>

  <div id="mainArea">
    <aside id="toolsPanel"></aside>

    <div id="canvasViewport">
      <div id="canvasStage">
        <div id="cardCanvas">
          <canvas id="highlightCanvas"></canvas>
          <div id="elementsLayer"></div>
          <canvas id="inkCanvas"></canvas>
          <div id="selectionOverlay"></div>
        </div>
      </div>

      <div id="zoomControls">
        <button id="zoomIn">＋</button>
        <div id="zoomLevel">100%</div>
        <button id="zoomOut">－</button>
        <button id="zoomFit" style="font-size:11px;">FIT</button>
      </div>
    </div>

    <aside id="propPanel"></aside>
  </div>

  <div id="bottomToolbar"></div>
  <div id="pageStrip"></div>
  <input type="file" id="fileInput" accept="image/*" hidden>
</div>

<div id="sheetOverlay"></div>
<div id="propSheet">
  <div class="sheet-grip"></div>
  <div id="propSheetBody"></div>
</div>

<div id="tplOverlay"></div>
<div id="tplSheet">
  <div class="sheet-grip"></div>
  <div class="tpl-title">TEMPLATES</div>
  <div class="tpl-grid" id="tplGrid"></div>
</div>

<script>
(function(){
"use strict";

const CARD_W=1080, CARD_H=1350, MIN_SIZE=24;
const $= (s,r=document)=>r.querySelector(s);
const $all=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=p=>p+"_"+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const deg2rad=d=>d*Math.PI/180;
const isWide=()=>window.innerWidth>=760;

const C={
  black:"#0A0A0A",
  ivory:"#F5F2EC",
  off:"#F8F7F4",
  charcoal:"#242424",

  brown:"#3D3429",
  burgundy:"#6B2D3C",

  stone:"#D8D4CC",
  sand:"#C7B9A5",
  taupe:"#8C8378",
  graphite:"#17191C",
  olive:"#4E5547",
  navy:"#202832",
  silver:"#B9BAB7",
  champagne:"#C7B28A",

  rule:"#D6D1C8",
  mute:"#77746E",
  white:"#FFFFFF",
  soft:"#ECEAE5"
};

const FONT_SANS="Pretendard, -apple-system, sans-serif";
const FONT_SERIF="RIDIBatang, 'Apple Myungjo', serif";

const ROLE_PH={
  title:"[제목을 입력하세요]",
  subtitle:"[부제목을 입력하세요]",
  body:"[본문을 입력하세요]",
  caption:"[캡션을 입력하세요]",
  scripture:"[성경 구절을 입력하세요]",
  quote:"[인용문을 입력하세요]",
  author:"[저자]",
  date:"[날짜]",
  category:"[카테고리]",
  custom:"[내용을 입력하세요]",
  image:"[이미지를 넣으세요]",
  heroImage:"[대표 이미지를 넣으세요]"
};

/* ---------- element factories ---------- */
function baseText(o){
  return Object.assign({
    id:uid("el"), type:"text", role:"body",
    x:72,y:100,width:900,height:80,rotation:0,
    content:"", placeholder:ROLE_PH.body,
    editable:true, required:false, maxLength:null,
    fontSize:32, bold:false, italic:false, align:"left",
    color:C.charcoal, lineHeight:1.35, letterSpacing:0, fontFamily:FONT_SANS,
    autoFit:false, fitMode:"box", minFontSize:20, maxFontSize:72, maxLines:null,
    autoFitLocked:false
  }, o);
}

function baseShape(o){
  return Object.assign({
    id:uid("el"), type:"shape", shape:"rect", role:"custom",
    x:0,y:0,width:100,height:2,rotation:0,
    fill:C.rule, opacity:1, strokeColor:C.charcoal, strokeWidth:0
  }, o);
}

function baseImage(o){
  return Object.assign({
    id:uid("el"), type:"image", role:"image",
    x:0,y:0,width:400,height:300,rotation:0,
    src:"", opacity:1, placeholder:true,
    crop:{ mode:"fill", scale:1, offsetX:0, offsetY:0, focalPoint:{x:0.5,y:0.5} },
    frame:{ radius:0, circle:false, borderColor:null, borderWidth:0 }
  }, o);
}

function baseScripture(o){
  return Object.assign({
    id:uid("el"), type:"scripture", role:"scripture",
    x:96,y:300,width:888,height:360,rotation:0,
    version:"개역개정", book:"요한복음", chapter:1, startVerse:1, endVerse:1,
    text:"", placeholder:true,
    fontSize:40, bold:false, italic:false, align:"center",
    color:C.charcoal, lineHeight:1.7, letterSpacing:0, fontFamily:FONT_SERIF,
    autoFit:true, fitMode:"box", minFontSize:28, maxFontSize:48, maxLines:null,
    autoFitLocked:false, showRef:true
  }, o);
}

function pageOf(bg, elements){
  return {
    id:uid("page"),
    width:CARD_W,
    height:CARD_H,
    background:bg,
    elements:elements,
    strokes:[]
  };
}

function newPage(){ return pageOf(C.white, []); }

function isEmptyContent(el){
  if(el.type==="image") return !el.src;
  if(el.type==="scripture") return !(el.text||"").trim();
  return !(el.content||"").trim();
}

function displayText(el){
  if(el.type==="scripture"){
    if(isEmptyContent(el)) return el.placeholder===true ? ROLE_PH.scripture : (el.placeholder||ROLE_PH.scripture);
    return el.text;
  }
  if(isEmptyContent(el)){
    if(typeof el.placeholder==="string") return el.placeholder;
    return ROLE_PH[el.role]||ROLE_PH.custom;
  }
  return el.content;
}

function scriptureRef(el){
  const end=el.endVerse && el.endVerse!==el.startVerse ? `-${el.endVerse}` : "";
  return `${el.book} ${el.chapter}:${el.startVerse}${end}`;
}



/* ---------- templates ---------- */

const TEMPLATE_META=[
  {id:"ATELIER", name:"ATELIER", desc:"아트 디렉션", previewBg:C.off, previewColor:C.graphite},
  {id:"NOCTURNE", name:"NOCTURNE", desc:"다크 저널", previewBg:C.black, previewColor:C.ivory},
  {id:"MONUMENT", name:"MONUMENT", desc:"건축적 에디토리얼", previewBg:C.graphite, previewColor:C.ivory},
  {id:"CINEMA", name:"CINEMA", desc:"시네마틱 포스터", previewBg:C.black, previewColor:C.ivory},
  {id:"OBJECT", name:"OBJECT", desc:"오브젝트 중심", previewBg:C.stone, previewColor:C.graphite},
  {id:"SILHOUETTE", name:"SILHOUETTE", desc:"인물과 빛", previewBg:C.graphite, previewColor:C.ivory},
  {id:"GRID", name:"GRID", desc:"모던 그리드", previewBg:C.off, previewColor:C.graphite},
  {id:"FRAME", name:"FRAME", desc:"프리미엄 프레임", previewBg:C.sand, previewColor:C.graphite},
  {id:"MUSE", name:"MUSE", desc:"아트 매거진", previewBg:C.ivory, previewColor:C.graphite},
  {id:"EDITORIAL", name:"EDITORIAL", desc:"럭셔리 에디토리얼", previewBg:C.off, previewColor:C.graphite},

  {id:"NOIR", name:"NOIR", desc:"블랙 에디토리얼", previewBg:C.black, previewColor:C.ivory},
  {id:"IVORY", name:"IVORY", desc:"클래식 신학 출판", previewBg:C.ivory, previewColor:C.black},
  {id:"SCRIPTURA", name:"SCRIPTURA", desc:"성경 본문", previewBg:C.ivory, previewColor:C.charcoal},
  {id:"STUDY", name:"STUDY", desc:"연구 노트", previewBg:"#f9f6f0", previewColor:C.charcoal},
  {id:"PORTRAIT", name:"PORTRAIT", desc:"인물 도록", previewBg:C.black, previewColor:C.ivory},
  {id:"GALLERY", name:"GALLERY", desc:"전시 도록", previewBg:C.off, previewColor:C.charcoal},
  {id:"SCARLET", name:"SCARLET", desc:"버건디 포인트", previewBg:C.black, previewColor:C.burgundy},
  {id:"DUALITY", name:"DUALITY", desc:"A / B 비교", previewBg:C.off, previewColor:C.charcoal},
  {id:"ARCHIVE", name:"ARCHIVE", desc:"역사 아카이브", previewBg:C.ivory, previewColor:C.brown},
  {id:"MONOGRAPH", name:"MONOGRAPH", desc:"학술 저널", previewBg:C.off, previewColor:C.charcoal},
  {id:"LEGALPAD", name:"LEGAL PAD", desc:"리갈패드 노트", previewBg:"#FFF4A8", previewColor:C.graphite},
  {id:"GRIDPAPER", name:"GRID PAPER", desc:"모눈 연구지", previewBg:"#F8FAF4", previewColor:C.graphite},
  {id:"NOTEBOOK", name:"NOTEBOOK", desc:"줄노트", previewBg:"#F7F1E5", previewColor:C.navy},
  {id:"INDEXCARD", name:"INDEX CARD", desc:"인덱스 카드", previewBg:"#F4E8C8", previewColor:C.brown},
  {id:"RECEIPT", name:"RECEIPT", desc:"기록 영수증", previewBg:"#F5F5F0", previewColor:C.graphite},
  {id:"FOLDER", name:"FOLDER", desc:"서류철", previewBg:"#D9C39A", previewColor:C.graphite},
  {id:"TYPEWRITER", name:"TYPEWRITER", desc:"타자기 원고", previewBg:"#EEE9DD", previewColor:C.graphite},
  {id:"MARGINALIA", name:"MARGINALIA", desc:"책 여백 주석", previewBg:C.ivory, previewColor:C.burgundy},
  {id:"FIELDNOTE", name:"FIELD NOTE", desc:"현장 조사 노트", previewBg:"#DCE2D1", previewColor:C.olive},
  {id:"LIBRARYCARD", name:"LIBRARY CARD", desc:"도서관 카드", previewBg:"#E9D6B0", previewColor:C.brown},
  {id:"TAB", name:"TAB", desc:"파일 탭 문서", previewBg:"#E5D2B5", previewColor:C.graphite},
  {id:"DOCUMENT", name:"DOCUMENT", desc:"공식 문서", previewBg:"#F4F4F0", previewColor:C.graphite},
  {id:"GRAPH", name:"GRAPH", desc:"그래프 용지", previewBg:"#EDF2F0", previewColor:C.navy},
  {id:"TRACING", name:"TRACING", desc:"트레이싱 레이어", previewBg:"#E7E3DC", previewColor:C.graphite},
  {id:"LEDGER", name:"LEDGER", desc:"기록 장부", previewBg:"#E2E5D8", previewColor:C.olive},
  {id:"FORM", name:"FORM", desc:"행정 서식", previewBg:"#F0F0EC", previewColor:C.graphite},
  {id:"DOSSIER", name:"DOSSIER", desc:"기밀 문서", previewBg:"#CFCFC8", previewColor:C.graphite},
  {id:"NEWSPAPER", name:"NEWSPAPER", desc:"신문 1면", previewBg:"#E8E5DC", previewColor:C.black},
  {id:"LETTER", name:"LETTER", desc:"서신", previewBg:"#F5EFE2", previewColor:C.brown},

/* ---------- state ---------- */
const State={
  pages:[newPage()], currentPageIndex:0, selectedId:null, zoom:1, pan:{x:0,y:0},
  tool:"select", fingerDraw:false,
  penColor:"#1c1c1f", penWidth:8, penOpacity:1,
  hlColor:"#ffe066", hlWidth:34, hlOpacity:0.4,
  eraserSize:36,
  history:[], historyIndex:-1,
  fitWarning:null
};

function currentPage(){ return State.pages[State.currentPageIndex]; }
function findElement(id){ return currentPage().elements.find(e=>e.id===id); }

function snapshot(){
  return JSON.parse(JSON.stringify({
    pages:State.pages,
    currentPageIndex:State.currentPageIndex
  }));
}

function pushHistory(){
  State.history=State.history.slice(0, State.historyIndex+1);
  State.history.push(snapshot());
  if(State.history.length>80) State.history.shift();
  State.historyIndex=State.history.length-1;
  updateUndoRedoButtons();
}

function undo(){
  if(State.historyIndex<=0) return;
  State.historyIndex--;
  restoreSnapshot(State.history[State.historyIndex]);
}

function redo(){
  if(State.historyIndex>=State.history.length-1) return;
  State.historyIndex++;
  restoreSnapshot(State.history[State.historyIndex]);
}

function restoreSnapshot(snap){
  const s=JSON.parse(JSON.stringify(snap));
  State.pages=s.pages;
  State.currentPageIndex=s.currentPageIndex;
  State.selectedId=null;
  renderAll();
  updateUndoRedoButtons();
}

function updateUndoRedoButtons(){
  $("#btnUndo").disabled=State.historyIndex<=0;
  $("#btnRedo").disabled=State.historyIndex>=State.history.length-1;
}

/* ---------- auto-fit text ---------- */
const _measure=document.createElement("div");
_measure.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;word-break:break-word;padding:4px;";
document.documentElement.appendChild(_measure);

function measureTextHeight(text, fontSize, width, lineHeight, fontFamily, bold, letterSpacing){
  _measure.style.width=width+"px";
  _measure.style.fontSize=fontSize+"px";
  _measure.style.lineHeight=String(lineHeight);
  _measure.style.fontFamily=fontFamily||FONT_SANS;
  _measure.style.fontWeight=bold?"700":"400";
  _measure.style.letterSpacing=(letterSpacing||0)+"px";
  _measure.textContent=text||"";
  return _measure.offsetHeight;
}

function measureTextWidth(text, fontSize, fontFamily, bold, letterSpacing){
  _measure.style.width="auto";
  _measure.style.whiteSpace="nowrap";
  _measure.style.fontSize=fontSize+"px";
  _measure.style.fontFamily=fontFamily||FONT_SANS;
  _measure.style.fontWeight=bold?"700":"400";
  _measure.style.letterSpacing=(letterSpacing||0)+"px";
  _measure.textContent=text||"";
  const w=_measure.offsetWidth;
  _measure.style.whiteSpace="pre-wrap";
  return w;
}

function applyAutoFit(el){
  if(!el.autoFit || el.autoFitLocked) return true;
  const text=el.type==="scripture" ? (el.text||"") : (el.content||"");
  if(!text.trim()) return true;
  const mode=el.fitMode||"box";
  const min=el.minFontSize||20, max=el.maxFontSize||el.fontSize||48;

  if(mode==="fixed") return true;

  if(mode==="expand"){
    let fs=el.fontSize||max;
    const h=measureTextHeight(text, fs, el.width-8, el.lineHeight||1.35, el.fontFamily, el.bold, el.letterSpacing);
    el.height=Math.max(el.height, h+8);
    return true;
  }

  let lo=min, hi=max, best=min, ok=false;

  while(lo<=hi){
    const mid=Math.floor((lo+hi)/2);
    let fits=false;

    if(mode==="width"){
      const lines=text.split("\n");
      fits=lines.every(ln=>
        measureTextWidth(ln, mid, el.fontFamily, el.bold, el.letterSpacing) <= el.width-8
      );
    } else {
      const h=measureTextHeight(
        text,
        mid,
        el.width-8,
        el.lineHeight||1.35,
        el.fontFamily,
        el.bold,
        el.letterSpacing
      );

      fits=h <= el.height-4;

      if(el.maxLines){
        const approxLines=Math.ceil(h/(mid*(el.lineHeight||1.35)));
        if(approxLines>el.maxLines) fits=false;
      }
    }

    if(fits){
      best=mid;
      ok=true;
      lo=mid+1;
    } else {
      hi=mid-1;
    }
  }

  el.fontSize=best;

  if(!ok){
    State.fitWarning={
      id:el.id,
      msg:"텍스트가 너무 깁니다. 내용을 줄이거나 박스 크기를 조정해 주세요."
    };
    return false;
  }

  if(State.fitWarning && State.fitWarning.id===el.id) State.fitWarning=null;
  return true;
}

/* ---------- image crop CSS ---------- */
function imageBackgroundStyle(el){
  if(!el.src) return {};

  const crop=el.crop||{
    mode:"fill",
    scale:1,
    offsetX:0,
    offsetY:0,
    focalPoint:{x:0.5,y:0.5}
  };

  const mode=crop.mode||"fill";
  const fp=crop.focalPoint||{x:0.5,y:0.5};

  let size="cover";
  let pos=`${fp.x*100}% ${fp.y*100}%`;

  if(mode==="fit"){
    size="contain";
    pos="center";
  } else if(mode==="center"){
    size="cover";
    pos="center";
  } else if(mode==="custom"){
    size=`${(crop.scale||1)*100}%`;
    pos=`calc(50% + ${crop.offsetX||0}px) calc(50% + ${crop.offsetY||0}px)`;
  }

  return {
    backgroundImage:`url(${el.src})`,
    backgroundSize:size,
    backgroundPosition:pos
  };
}

/* ---------- template apply ---------- */
function deepCloneTemplate(id){
  const factory=TEMPLATES[id];
  if(!factory) return null;

  const master=factory();
  const clone=JSON.parse(JSON.stringify(master));

  clone.id=uid("page");
  clone.elements.forEach(e=>e.id=uid("el"));
  clone.strokes=[];

  return clone;
}

function applyTemplate(id){
  const clone=deepCloneTemplate(id);
  if(!clone) return;

  const page=currentPage();
  page.background=clone.background;
  page.elements=clone.elements;
  page.strokes=[];

  State.selectedId=null;
  setToolSilently("select");
  pushHistory();
  renderAll();
  hideTpl();
}

function buildToolButtons(container){
  container.innerHTML="";

  TOOL_DEFS.forEach(def=>{
    const wrap=document.createElement("div");
    wrap.style.position="relative";

    const btn=document.createElement("button");
    btn.className="tool-btn";
    btn.dataset.tool=def.id;
    btn.innerHTML=`<span class="ic">${def.icon}</span><span>${def.label}</span>`;

    btn.addEventListener("click", ()=>onToolButtonTap(def, wrap));

    wrap.appendChild(btn);

let openSubmenuEl=null;

function closeSubmenu(){
  if(openSubmenuEl){
    openSubmenuEl.remove();
    openSubmenuEl=null;
  }
}

function onToolButtonTap(def, wrap){
  closeSubmenu();

  if(def.id==="text"){
    addText();
    return;
  }

  if(def.id==="scripture"){
    addScripture();
    return;
  }

  if(def.id==="image"){
    $("#fileInput").click();
    return;
  }

  if(def.submenu){
    const menu=document.createElement("div");
    menu.className="submenu";

    def.submenu.forEach(sub=>{
      const b=document.createElement("button");
      b.className="tool-btn";
      b.innerHTML=`<span class="ic">${sub.icon}</span><span>${sub.label}</span>`;

      b.addEventListener("click", ()=>{
        addShape(sub.id.split(":")[1]);
        closeSubmenu();
      });

      menu.appendChild(b);
    });

    wrap.appendChild(menu);
    openSubmenuEl=menu;
    return;
  }

  setTool(def.id);
}

function setTool(t){

function addImageFromFile(file, targetEl){
  const reader=new FileReader();

  reader.onload=ev=>{
    const img=new Image();

    img.onload=()=>{
      if(targetEl){
        targetEl.src=ev.target.result;
        targetEl.placeholder=false;

        if(!targetEl.crop){
          targetEl.crop={
            mode:"fill",
            scale:1,
            offsetX:0,
            offsetY:0,
            focalPoint:{x:0.5,y:0.5}
          };
        }
      } else {
        let w=480,h=480;
        const r=img.naturalWidth/img.naturalHeight;

        if(r>1){
          w=480;
          h=480/r;
        } else {
          h=480;
          w=480*r;
        }

        const el=baseImage({
          src:ev.target.result,
          placeholder:false,
          x:(CARD_W-w)/2,
          y:(CARD_H-h)/2,
          width:w,
          height:h
        });

        currentPage().elements.push(el);
        selectElement(el.id);
      }

      pushHistory();
      renderElements();
      setToolSilently("select");
    };

    img.src=ev.target.result;
  };

  reader.readAsDataURL(file);
}

$("#fileInput").addEventListener("change", e=>{
  const f=e.target.files[0];
  if(!f) return;

  const sel=findElement(State.selectedId);

  if(sel && sel.type==="image"){
    addImageFromFile(f, sel);
  } else {
    addImageFromFile(f, null);
  }

  e.target.value="";
});

/* ---------- viewport ---------- */
const viewport=$("#canvasViewport");
const stage=$("#canvasStage");
const cardCanvas=$("#cardCanvas");
const hlCanvas=$("#highlightCanvas");
const inkCanvas=$("#inkCanvas");
const elementsLayer=$("#elementsLayer");
const selectionOverlay=$("#selectionOverlay");
const hlCtx=hlCanvas.getContext("2d");
const inkCtx=inkCanvas.getContext("2d");

function applyCardSize(){
  cardCanvas.style.width=CARD_W+"px";
  cardCanvas.style.height=CARD_H+"px";
  hlCanvas.width=CARD_W;
  hlCanvas.height=CARD_H;
  inkCanvas.width=CARD_W;
  inkCanvas.height=CARD_H;
}

function applyStageTransform(){
  stage.style.transform=
    `translate(${State.pan.x}px,${State.pan.y}px) scale(${State.zoom})`;

  $("#zoomLevel").textContent=Math.round(State.zoom*100)+"%";
}

function fitToScreen(){
  const vw=viewport.clientWidth-40;
  const vh=viewport.clientHeight-40;
  const z=clamp(Math.min(vw/CARD_W, vh/CARD_H), 0.05, 4);

  State.zoom=z;
  State.pan.x=(viewport.clientWidth-CARD_W*z)/2;
  State.pan.y=(viewport.clientHeight-CARD_H*z)/2;

  applyStageTransform();
}

function setZoom(z,ax,ay){
  const old=State.zoom;
  z=clamp(z,0.1,4);

  if(ax===undefined){
    ax=viewport.clientWidth/2;
    ay=viewport.clientHeight/2;
  }

  const wx=(ax-State.pan.x)/old;
  const wy=(ay-State.pan.y)/old;

  State.zoom=z;
  State.pan.x=ax-wx*z;
  State.pan.y=ay-wy*z;

  applyStageTransform();
}

$("#zoomIn").onclick=()=>setZoom(State.zoom*1.2);
$("#zoomOut").onclick=()=>setZoom(State.zoom/1.2);
$("#zoomFit").onclick=fitToScreen;

function clientToCard(cx,cy){
  const r=cardCanvas.getBoundingClientRect();

  return {
    x:(cx-r.left)*(CARD_W/r.width),
    y:(cy-r.top)*(CARD_H/r.height)
  };
}

(function setupGestures(){
  let mode=null, startPan, startDist, startZoom, startMid;

  viewport.addEventListener("pointerdown", e=>{
    if(e.target!==viewport && e.target!==stage) return;
    if(State.tool!=="select") return;

    mode="pan";
    startPan={...State.pan};
    viewport._ps={x:e.clientX,y:e.clientY};
  });

  viewport.addEventListener("pointermove", e=>{
    if(mode==="pan" && viewport._ps){
      State.pan.x=startPan.x+(e.clientX-viewport._ps.x);
      State.pan.y=startPan.y+(e.clientY-viewport._ps.y);
      applyStageTransform();
    }
  });

  const end=()=>{
    mode=null;
    viewport._ps=null;
  };

  viewport.addEventListener("pointerup", end);
  viewport.addEventListener("pointercancel", end);

  viewport.addEventListener("wheel", e=>{
    e.preventDefault();
    setZoom(
      State.zoom*(e.deltaY<0?1.08:1/1.08),
      e.clientX,
      e.clientY
    );
  }, {passive:false});

  viewport.addEventListener("touchstart", e=>{
    if(e.touches.length===2){
      mode="pinch";

      const [a,b]=e.touches;

      startDist=Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      startZoom=State.zoom;

      startMid={
        x:(a.clientX+b.clientX)/2,
        y:(a.clientY+b.clientY)/2
      };

      startPan={...State.pan};
    }
  }, {passive:true});

  viewport.addEventListener("touchmove", e=>{
    if(mode==="pinch" && e.touches.length===2){
      const [a,b]=e.touches;

      const dist=Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      const mid={
        x:(a.clientX+b.clientX)/2,
        y:(a.clientY+b.clientY)/2
      };

      State.pan.x=startPan.x+(mid.x-startMid.x);
      State.pan.y=startPan.y+(mid.y-startMid.y);

      State.zoom=clamp(
        startZoom*(dist/startDist),
        0.1,
        4
      );

      applyStageTransform();
    }
  }, {passive:true});

  viewport.addEventListener("touchend", e=>{
    if(e.touches.length<2) mode=null;
  });
})();

/* ---------- render elements ---------- */
function renderElements(){
  const page=currentPage();

  cardCanvas.style.background=page.background||"#fff";

  const live=new Set(page.elements.map(e=>e.id));

  $all(".el", elementsLayer).forEach(n=>{
    if(!live.has(n.dataset.id)) n.remove();
  });

  page.elements.forEach((el,i)=>{
    if(
      (el.type==="text"||el.type==="scripture") &&
      el.autoFit &&
      !isEmptyContent(el)
    ){
      applyAutoFit(el);
    }

    let node=document.getElementById("node_"+el.id);

    if(!node){
      node=createElementNode(el);
      elementsLayer.appendChild(node);
    }

    updateElementNode(node, el);
    node.style.zIndex=i+1;
  });

  drawAllStrokes();
  renderSelectionOverlay();
  renderFitWarning();
}

function renderFitWarning(){
  let w=$(".fit-warn", cardCanvas);

  if(State.fitWarning){
    if(!w){
      w=document.createElement("div");
      w.className="fit-warn";
      cardCanvas.appendChild(w);
    }

    w.textContent=State.fitWarning.msg;
  } else if(w){
    w.remove();
  }
}

function createElementNode(el){
  const node=document.createElement("div");

  node.className="el el-"+el.type;
  node.id="node_"+el.id;
  node.dataset.id=el.id;

  if(el.type==="text"||el.type==="scripture"){
    node.setAttribute("contenteditable","false");

    node.addEventListener("input", ()=>{
      if(el.type==="scripture"){
        el.text=node.innerText.replace(
          /^[^\n]*\n/,
          m=>{
            return node.dataset.editing==="body"
              ? node.innerText
              : el.text;
          }
        );
      }

      if(el.type==="scripture"){
        const t=node.innerText;
        const ref=scriptureRef(el);

        el.text=t.startsWith(ref)
          ? t.slice(ref.length).replace(/^\n/,"")
          : t;
      } else {
        el.content=node.innerText;
      }

      if(el.autoFit){
        el.autoFitLocked=false;
        applyAutoFit(el);
      }

      updateElementNode(node, el);
    });

    node.addEventListener("dblclick", e=>{
      if(el.editable===false) return;

      node.setAttribute("contenteditable","true");
      node.focus();
      e.stopPropagation();
    });

    node.addEventListener("blur", ()=>{
      node.setAttribute("contenteditable","false");

      if(
        el.maxLength &&
        el.type==="text" &&
        el.content.length>el.maxLength
      ){
        el.content=el.content.slice(0,el.maxLength);
      }

      pushHistory();
      renderElements();
    });

  } else if(el.type==="image"){
    const inner=document.createElement("div");
    inner.className="img-inner";
    node.appendChild(inner);

  } else if(el.type==="shape"){
    node.innerHTML=shapeSVG(el);
  }

  attachElementPointerHandlers(node);

  return node;
}

function shapeSVG(el){
  const w=100,h=100;

  const sa=el.strokeWidth>0
    ? `stroke="${el.strokeColor}" stroke-width="${el.strokeWidth}"`
    : "";

  if(el.shape==="rect"){
    if(el.fill==="transparent"){
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <rect x="1" y="1" width="${w-2}" height="${h-2}"
        fill="none"
        stroke="${el.strokeColor||C.rule}"
        stroke-width="${Math.max(1,el.strokeWidth||1)}"/>
      </svg>`;
    }

    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <rect x="1" y="1" width="${w-2}" height="${h-2}"
      fill="${el.fill}" ${sa}/>
    </svg>`;
  }

  if(el.shape==="ellipse"){
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <ellipse cx="50" cy="50" rx="49" ry="49"
      fill="${el.fill}" ${sa}/>
    </svg>`;
  }

  if(el.shape==="line"){
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="0" y1="50" x2="100" y2="50"
      stroke="${el.fill}"
      stroke-width="${Math.max(1,h)}"/>
    </svg>`;
  }

  if(el.shape==="triangle"){
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="50,2 98,98 2,98"
      fill="${el.fill}" ${sa}/>
    </svg>`;
  }

  return "";
}

function updateElementNode(node, el){
  node.style.left=el.x+"px";
  node.style.top=el.y+"px";
  node.style.width=el.width+"px";
  node.style.height=el.height+"px";
  node.style.transform=`rotate(${el.rotation||0}deg)`;
  node.style.transformOrigin="center center";

  const empty=isEmptyContent(el);
  node.classList.toggle("is-placeholder", empty);

  if(el.type==="text"){
    if(document.activeElement!==node){
      node.textContent=displayText(el);
    }

    node.style.fontSize=el.fontSize+"px";
    node.style.fontWeight=el.bold?"700":"400";
    node.style.fontStyle=empty?"italic":(el.italic?"italic":"normal");
    node.style.textAlign=el.align;
    node.style.color=el.color;
    node.style.lineHeight=el.lineHeight;
    node.style.letterSpacing=(el.letterSpacing||0)+"px";
    node.style.fontFamily=el.fontFamily||FONT_SANS;

  } else if(el.type==="scripture"){
    if(document.activeElement!==node){
      if(empty){
        node.textContent=displayText(el);
      } else {
        node.innerHTML="";

        if(el.showRef!==false){
          const ref=document.createElement("span");
          ref.className="sc-ref";
          ref.textContent=
            scriptureRef(el)+"  ·  "+(el.version||"");
          node.appendChild(ref);
        }

        node.appendChild(document.createTextNode(el.text));
      }
    }

    node.style.fontSize=el.fontSize+"px";
    node.style.fontWeight=el.bold?"700":"400";
    node.style.fontStyle=empty?"italic":(el.italic?"italic":"normal");
    node.style.textAlign=el.align;
    node.style.color=el.color;
    node.style.lineHeight=el.lineHeight;
    node.style.letterSpacing=(el.letterSpacing||0)+"px";
    node.style.fontFamily=el.fontFamily||FONT_SERIF;

  } else if(el.type==="image"){
    const inner=node.querySelector(".img-inner");
    const fr=el.frame||{};

    node.style.borderRadius=
      fr.circle ? "50%" : (fr.radius||0)+"px";

    node.style.overflow="hidden";

    if(fr.borderWidth){
      node.style.boxShadow=
        `inset 0 0 0 ${fr.borderWidth}px ${fr.borderColor||C.rule}`;
    } else {
      node.style.boxShadow="none";
    }

    node.style.opacity=el.opacity;

    if(empty){
      inner.style.backgroundImage="none";
      inner.setAttribute(
        "data-ph",
        ROLE_PH[el.role]||ROLE_PH.image
      );
    } else {
      const st=imageBackgroundStyle(el);

      inner.style.backgroundImage=st.backgroundImage;
      inner.style.backgroundSize=st.backgroundSize;
      inner.style.backgroundPosition=st.backgroundPosition;
      inner.removeAttribute("data-ph");
    }

  } else if(el.type==="shape"){
    node.innerHTML=shapeSVG(el);
    node.style.opacity=el.opacity;
  }
}

function selectElement(id){
  State.selectedId=id;
  renderSelectionOverlay();
  renderPropPanel();
}

function attachElementPointerHandlers(node){
  node.addEventListener("pointerdown", e=>{
    if(State.tool!=="select") return;
    if(node.getAttribute("contenteditable")==="true") return;

    e.stopPropagation();

    selectElement(node.dataset.id);
    startElementDrag(e, node.dataset.id);
  });
}

function startElementDrag(e, id){
  const el=findElement(id);
  const start=clientToCard(e.clientX,e.clientY);
  const orig={x:el.x,y:el.y};
  let moved=false;

  const node=document.getElementById("node_"+id);
  node.classList.add("dragging");

  function onMove(ev){
    const c=clientToCard(ev.clientX,ev.clientY);

    el.x=orig.x+(c.x-start.x);
    el.y=orig.y+(c.y-start.y);

    moved=true;
    renderElements();
  }

  function onUp(){
    node.classList.remove("dragging");

    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",onUp);

    if(moved) pushHistory();
  }

  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",onUp);
}

const CORNER={
  tl:{sx:-1,sy:-1},
  tr:{sx:1,sy:-1},
  bl:{sx:-1,sy:1},
  br:{sx:1,sy:1}
};

function startResize(e, id, corner){
  const el=findElement(id);
  const sign=CORNER[corner];
  const rad=deg2rad(el.rotation||0);

  const ux={
    x:Math.cos(rad),
    y:Math.sin(rad)
  };

  const uy={
    x:-Math.sin(rad),
    y:Math.cos(rad)
  };

  const center={
    x:el.x+el.width/2,
    y:el.y+el.height/2
  };

  const anchor={
    x:center.x+(-sign.sx*el.width/2)*ux.x+(-sign.sy*el.height/2)*uy.x,
    y:center.y+(-sign.sx*el.width/2)*ux.y+(-sign.sy*el.height/2)*uy.y
  };

  function onMove(ev){
    const p=clientToCard(ev.clientX,ev.clientY);
    const v={
      x:p.x-anchor.x,
      y:p.y-anchor.y
    };

    let w=Math.max(
      MIN_SIZE,
      sign.sx*(v.x*ux.x+v.y*ux.y)
    );

    let h=Math.max(
      MIN_SIZE,
      sign.sy*(v.x*uy.x+v.y*uy.y)
    );

    const nc={
      x:anchor.x+sign.sx*(w/2)*ux.x+sign.sy*(h/2)*uy.x,
      y:anchor.y+sign.sx*(w/2)*ux.y+sign.sy*(h/2)*uy.y
    };

    el.width=w;
    el.height=h;
    el.x=nc.x-w/2;
    el.y=nc.y-h/2;

    if(el.autoFit){
      el.autoFitLocked=false;
      applyAutoFit(el);
    }

    renderElements();
  }

  function onUp(){
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",onUp);
    pushHistory();
  }

  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",onUp);
}

function startRotate(e, id){
  const el=findElement(id);

  const c={
    x:el.x+el.width/2,
    y:el.y+el.height/2
  };

  const sa=Math.atan2(
    clientToCard(e.clientX,e.clientY).y-c.y,
    clientToCard(e.clientX,e.clientY).x-c.x
  );

  const sr=el.rotation||0;

  function onMove(ev){
    const p=clientToCard(ev.clientX,ev.clientY);

    el.rotation=Math.round(
      sr+
      (Math.atan2(p.y-c.y,p.x-c.x)-sa)*180/Math.PI
    );

    renderElements();
  }

  function onUp(){
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",onUp);
    pushHistory();
  }

  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",onUp);
}

function reorderLayer(action){
  const page=currentPage();
  const idx=page.elements.findIndex(
    e=>e.id===State.selectedId
  );

  if(idx<0) return;

  const [el]=page.elements.splice(idx,1);

  if(action==="front"){
    page.elements.push(el);
  } else if(action==="back"){
    page.elements.unshift(el);
  } else if(action==="forward"){
    page.elements.splice(
      Math.min(idx+1,page.elements.length),
      0,
      el
    );
  } else if(action==="backward"){
    page.elements.splice(
      Math.max(idx-1,0),
      0,
      el
    );
  }

  pushHistory();
  renderElements();
}

/* ---------- strokes ---------- */
let currentStroke=null, erased=false;

function paintStroke(ctx, s){
  if(!s.points || s.points.length<2) return;

  ctx.save();

  ctx.globalAlpha=s.opacity;
  ctx.strokeStyle=s.color;
  ctx.lineWidth=s.width;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(s.type==="highlight"){
    ctx.globalCompositeOperation="multiply";
  } else {
    ctx.globalCompositeOperation="source-over";
  }

  ctx.beginPath();
  ctx.moveTo(s.points[0].x,s.points[0].y);

  for(let i=1;i<s.points.length;i++){
    const p=s.points[i];
    ctx.lineTo(p.x,p.y);
  }

  ctx.stroke();
  ctx.restore();
}

function drawAllStrokes(){
  hlCtx.clearRect(0,0,CARD_W,CARD_H);
  inkCtx.clearRect(0,0,CARD_W,CARD_H);

  const strokes=currentPage().strokes||[];

  strokes.forEach(s=>{
    if(s.type==="highlight"){
      paintStroke(hlCtx,s);
    } else {
      paintStroke(inkCtx,s);
    }
  });

  if(currentStroke){
    if(currentStroke.type==="highlight"){
      paintStroke(hlCtx,currentStroke);
    } else {
      paintStroke(inkCtx,currentStroke);
    }
  }
}

function ptSegDist(p,a,b){
  const l2=(b.x-a.x)**2+(b.y-a.y)**2;

  if(l2===0){
    return Math.hypot(
      p.x-a.x,
      p.y-a.y
    );
  }

  let t=
    ((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/l2;

  t=clamp(t,0,1);

  return Math.hypot(
    p.x-(a.x+t*(b.x-a.x)),
    p.y-(a.y+t*(b.y-a.y))
  );
}

function eraseNear(p){
  const page=currentPage();
  const before=page.strokes.length;

  page.strokes=page.strokes.filter(s=>{
    for(let i=0;i<s.points.length-1;i++){
      if(
        ptSegDist(
          p,
          s.points[i],
          s.points[i+1]
        )<State.eraserSize
      ){
        return false;
      }
    }

    if(
      s.points.length===1 &&
      Math.hypot(
        p.x-s.points[0].x,
        p.y-s.points[0].y
      )<State.eraserSize
    ){
      return false;
    }

    return true;
  });

  return page.strokes.length!==before;
}

function allowDraw(pt){
  return pt==="pen"||
         pt==="mouse"||
         (pt==="touch"&&State.fingerDraw);
}

function activeDrawCanvas(){
  if(State.tool==="highlighter") return hlCanvas;
  return inkCanvas;
}

function bindDraw(canvas){
  canvas.addEventListener("pointerdown", e=>{
    const isDraw=[
      "pen",
      "highlighter",
      "eraser"
    ].includes(State.tool);

    if(!isDraw || !allowDraw(e.pointerType)) return;

    canvas.setPointerCapture(e.pointerId);

    const p=clientToCard(
      e.clientX,
      e.clientY
    );

    const pressure=e.pressure>0?e.pressure:0.5;

    if(State.tool==="eraser"){
      erased=eraseNear(p);
      drawAllStrokes();
      return;
    }

    const isHL=State.tool==="highlighter";

    currentStroke={
      id:uid("stroke"),
      type:isHL?"highlight":"pen",
      color:isHL?State.hlColor:State.penColor,
      width:isHL?State.hlWidth:State.penWidth,
      opacity:isHL?State.hlOpacity:State.penOpacity,
      points:[
        {
          x:p.x,
          y:p.y,
          pressure,
          tiltX:e.tiltX||0,
          tiltY:e.tiltY||0
        }
      ]
    };

    drawAllStrokes();
  });

  canvas.addEventListener("pointermove", e=>{
    const isDraw=[
      "pen",
      "highlighter",
      "eraser"
    ].includes(State.tool);

    if(!isDraw || !allowDraw(e.pointerType)) return;

    if(
      e.buttons===0 &&
      e.pointerType!=="pen"
    ) return;

    const p=clientToCard(
      e.clientX,
      e.clientY
    );

    if(State.tool==="eraser"){
      if(eraseNear(p)) erased=true;
      drawAllStrokes();
      return;
    }

    if(currentStroke){
      currentStroke.points.push({
        x:p.x,
        y:p.y,
        pressure:e.pressure>0?e.pressure:0.5,
        tiltX:e.tiltX||0,
        tiltY:e.tiltY||0
      });

      drawAllStrokes();
    }
  });

  function endStroke(){
    if(
      currentStroke &&
      currentStroke.points.length>1
    ){
      currentPage().strokes.push(currentStroke);
      currentStroke=null;
      pushHistory();
    } else {
      currentStroke=null;
    }

    if(erased){
      erased=false;
      pushHistory();
    }

    drawAllStrokes();
  }

  canvas.addEventListener("pointerup",endStroke);
  canvas.addEventListener("pointercancel",endStroke);
}

bindDraw(hlCanvas);
bindDraw(inkCanvas);

function updateDrawInteractivity(){
  const isHL=State.tool==="highlighter";
  const isInk=
    State.tool==="pen"||
    State.tool==="eraser";

  const drawing=isHL||isInk;

  hlCanvas.style.pointerEvents=
    isHL||State.tool==="eraser"
      ?"auto"
      :"none";

  inkCanvas.style.pointerEvents=
    isInk
      ?"auto"
      :"none";

  if(State.tool==="eraser"){
    hlCanvas.style.pointerEvents="auto";
    inkCanvas.style.pointerEvents="auto";
  }

  elementsLayer.style.pointerEvents=
    drawing
      ?"none"
      :"auto";
}

  State.pages.forEach((p,i)=>{

      "page-thumb"+
      (i===State.currentPageIndex?" active":"");

    th.textContent=i+1;

    th.onclick=()=>{
      State.currentPageIndex=i;
      State.selectedId=null;
      renderAll();
    };

    const mb=document.createElement("div");

    mb.className="page-menu-btn";
    mb.textContent="⋯";

    mb.onclick=e=>{
      e.stopPropagation();
      openPageMenu(i,mb);
    };

    th.appendChild(mb);
    strip.appendChild(th);
  });

  const add=document.createElement("button");

  add.id="btnAddPage";
  add.textContent="+";

  add.onclick=()=>{
    State.pages.push(newPage());

    renderAll();

function openPageMenu(i,anchor){
  closeSubmenu();

  const menu=document.createElement("div");
  menu.className="submenu";

  [
    ["복제",()=>{
      const c=JSON.parse(
        JSON.stringify(State.pages[i])
      );

      c.id=uid("page");
      c.elements.forEach(
        e=>e.id=uid("el")
      );

      State.pages.splice(i+1,0,c);
      State.currentPageIndex=i+1;
      pushHistory();
      renderAll();
    }],

    ["삭제",()=>{
      if(State.pages.length<=1) return;

      State.pages.splice(i,1);

      State.currentPageIndex=
        clamp(
          State.currentPageIndex,
          0,
          State.pages.length-1
        );

      pushHistory();
      renderAll();
    }]
  ].forEach(([l,fn])=>{
    const b=document.createElement("button");

    b.className="tool-btn";
    b.style.minWidth="60px";
    b.innerHTML=`<span>${l}</span>`;

    b.onclick=()=>{
      fn();
      closeSubmenu();
    };

    menu.appendChild(b);
  });

  anchor.parentElement.appendChild(menu);
  openSubmenuEl=menu;
}

function bindProp(root){
  $all("input[data-bind]",root).forEach(inp=>{
    inp.addEventListener("input",()=>{
      const el=findElement(State.selectedId);
      if(!el) return;

      const key=inp.dataset.bind;
      const val=
        inp.type==="color"
          ? inp.value
          : parseFloat(inp.value);

      el[key]=val;

      if(key==="fontSize"){
        el.autoFitLocked=true;
      }

      if(
        el.autoFit &&
        key!=="fontSize"
      ){
        el.autoFitLocked=false;
        applyAutoFit(el);
      }

      renderElements();
      renderPropPanel();
    });

    inp.addEventListener("change",pushHistory);
  });

  $all("input[data-tool-bind]",root).forEach(inp=>{
    inp.oninput=()=>{
      State[inp.dataset.toolBind]=
        inp.type==="color"
          ? inp.value
          : parseFloat(inp.value);

      renderPropPanel();
    };
  });

  $all("[data-align]",root).forEach(
    b=>b.onclick=()=>{
      const el=findElement(State.selectedId);
      if(!el) return;

      el.align=b.dataset.align;

      renderElements();
      renderPropPanel();
      pushHistory();
    }
  );

  $all("[data-font]",root).forEach(
    b=>b.onclick=()=>{
      const el=findElement(State.selectedId);
      if(!el) return;

      el.fontFamily=
        b.dataset.font==="serif"
          ? FONT_SERIF
          : FONT_SANS;

      renderElements();
      renderPropPanel();
      pushHistory();
    }
  );

  $all("[data-fit]",root).forEach(
    b=>b.onclick=()=>{
      const el=findElement(State.selectedId);
      if(!el) return;

      if(b.dataset.fit==="off"){
        el.autoFit=false;
        el.autoFitLocked=true;
      } else {
        el.autoFit=true;
        el.fitMode=b.dataset.fit;
        el.autoFitLocked=false;
        applyAutoFit(el);
      }

      renderElements();
      renderPropPanel();
      pushHistory();
    }
  );

  $all("[data-crop]",root).forEach(
    b=>b.onclick=()=>{
      const el=findElement(State.selectedId);

      if(!el||!el.crop) return;

      el.crop.mode=b.dataset.crop;

      renderElements();
      renderPropPanel();
      pushHistory();
    }
  );

  $all("[data-focal]",root).forEach(inp=>{
    inp.oninput=()=>{
      const el=findElement(State.selectedId);

      if(!el||!el.crop) return;

      if(!el.crop.focalPoint){
        el.crop.focalPoint={x:0.5,y:0.5};
      }

      el.crop.focalPoint[inp.dataset.focal]=
        parseFloat(inp.value);

      renderElements();
    };

    inp.onchange=pushHistory;
  });

  const scScale=root.querySelector("[data-crop-scale]");

  if(scScale){
    scScale.oninput=()=>{
      const el=findElement(State.selectedId);

      if(!el||!el.crop) return;

      el.crop.scale=parseFloat(scScale.value);
      el.crop.mode="custom";

      renderElements();
    };

    scScale.onchange=pushHistory;
  }

  $all("[data-sc]",root).forEach(inp=>{
    const ev=
      inp.tagName==="TEXTAREA"
        ?"input"
        :"change";

    inp.addEventListener(ev,()=>{
      const el=findElement(State.selectedId);
      if(!el) return;

      const k=inp.dataset.sc;

      el[k]=
        inp.type==="number"
          ? parseInt(inp.value,10)
          : inp.value;

      if(k==="text"){
        el.placeholder=false;
        el.autoFitLocked=false;
        applyAutoFit(el);
      }

      renderElements();
    });

    inp.addEventListener("change",pushHistory);
  });

  $all("[data-finger]",root).forEach(
    b=>b.onclick=()=>{
      State.fingerDraw=b.dataset.finger==="on";
      renderPropPanel();
    }
  );

  $all("[data-action]",root).forEach(
    b=>b.onclick=()=>handleAction(b.dataset.action)
  );
}

function handleAction(action){
  const el=findElement(State.selectedId);

  if(action.startsWith("layer:")){
    reorderLayer(action.split(":")[1]);
    return;
  }

  if(action==="toggleBold"){
    el.bold=!el.bold;
    renderElements();
    renderPropPanel();
    pushHistory();
    return;
  }

  if(action==="toggleItalic"){
    el.italic=!el.italic;
    renderElements();
    renderPropPanel();
    pushHistory();
    return;
  }

  if(action==="duplicate"){
    const c=JSON.parse(JSON.stringify(el));

    c.id=uid("el");
    c.x+=24;
    c.y+=24;

    currentPage().elements.push(c);

    pushHistory();
    renderElements();
    selectElement(c.id);
    return;
  }

  if(action==="delete"){
    currentPage().elements=
      currentPage().elements.filter(
        e=>e.id!==el.id
      );

    pushHistory();
    selectElement(null);
    renderElements();
    return;
  }

  if(action==="replaceImage"){
    $("#fileInput").click();
  }
}

async function exportPNG(){
  const page=currentPage();

  const off=document.createElement("canvas");
  off.width=CARD_W;
  off.height=CARD_H;

  const ctx=off.getContext("2d");

  ctx.fillStyle=page.background||"#fff";
  ctx.fillRect(0,0,CARD_W,CARD_H);

  const strokes=page.strokes||[];

  strokes
    .filter(s=>s.type==="highlight")
    .forEach(s=>paintStroke(ctx,s));

  for(const el of page.elements){

    if(
      (el.type==="text"||el.type==="scripture") &&
      isEmptyContent(el)
    ) continue;

    if(el.type==="image" && !el.src) continue;

    ctx.save();

    const cx=el.x+el.width/2;
    const cy=el.y+el.height/2;

    ctx.translate(cx,cy);
    ctx.rotate(deg2rad(el.rotation||0));
    ctx.translate(-el.width/2,-el.height/2);

    if(el.type==="shape"){
      ctx.globalAlpha=el.opacity;
      drawShape(ctx,el);
    } else if(el.type==="image"){
      ctx.globalAlpha=el.opacity;
      await drawImage(ctx,el);
    } else if(el.type==="text"){
      drawText(ctx,el,el.content);
    } else if(el.type==="scripture"){
      drawScripture(ctx,el);
    }

    ctx.restore();
  }

  strokes
    .filter(s=>s.type!=="highlight")
    .forEach(s=>paintStroke(ctx,s));

  off.toBlob(async blob=>{
    const file=new File(
      [blob],
      "theology-card.png",
      {type:"image/png"}
    );

    if(
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){
      try{
        await navigator.share({
          files:[file],
          title:"카드뉴스"
        });
        return;
      }catch(e){}
    }

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.href=url;
    a.download="theology-card.png";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(
      ()=>URL.revokeObjectURL(url),
      4000
    );
  },"image/png");
}

function drawShape(ctx,el){
  const w=el.width;
  const h=el.height;

  ctx.fillStyle=
    el.fill==="transparent"
      ?"rgba(0,0,0,0)"
      :el.fill;

  ctx.strokeStyle=el.strokeColor;
  ctx.lineWidth=el.strokeWidth;

  if(el.shape==="rect"){
    ctx.beginPath();
    ctx.rect(0,0,w,h);

    if(el.fill!=="transparent") ctx.fill();
    if(el.strokeWidth>0) ctx.stroke();

  } else if(el.shape==="ellipse"){
    ctx.beginPath();
    ctx.ellipse(
      w/2,
      h/2,
      w/2,
      h/2,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(el.strokeWidth>0) ctx.stroke();

  } else if(el.shape==="line"){
    ctx.beginPath();
    ctx.moveTo(0,h/2);
    ctx.lineTo(w,h/2);

    ctx.lineWidth=Math.max(1,h);
    ctx.strokeStyle=el.fill;

    ctx.stroke();

  } else if(el.shape==="triangle"){
    ctx.beginPath();
    ctx.moveTo(w/2,0);
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();

    ctx.fill();

    if(el.strokeWidth>0) ctx.stroke();
  }
}

function drawImage(ctx,el){
  return new Promise(resolve=>{
    const img=new Image();

    img.onload=()=>{
      const fr=el.frame||{};

      ctx.save();

      if(fr.circle){
        ctx.beginPath();

        ctx.ellipse(
          el.width/2,
          el.height/2,
          el.width/2,
          el.height/2,
          0,
          0,
          Math.PI*2
        );

        ctx.clip();

      } else if(fr.radius){
        roundRect(
          ctx,
          0,
          0,
          el.width,
          el.height,
          fr.radius
        );

        ctx.clip();
      }

      const crop=el.crop||{
        mode:"fill",
        focalPoint:{x:0.5,y:0.5}
      };

      const iw=img.naturalWidth;
      const ih=img.naturalHeight;
      const fw=el.width;
      const fh=el.height;

      let sx=0,sy=0,sw=iw,sh=ih;
      let dx=0,dy=0,dw=fw,dh=fh;

      if(crop.mode==="fit"){
        const r=Math.min(fw/iw,fh/ih);

        dw=iw*r;
        dh=ih*r;
        dx=(fw-dw)/2;
        dy=(fh-dh)/2;

        ctx.drawImage(
          img,
          0,0,iw,ih,
          dx,dy,dw,dh
        );

      } else if(crop.mode==="custom"){
        const sc=crop.scale||1;

        dw=fw*sc;
        dh=fh*sc;

        dx=(fw-dw)/2+(crop.offsetX||0);
        dy=(fh-dh)/2+(crop.offsetY||0);

        ctx.drawImage(
          img,
          0,0,iw,ih,
          dx,dy,dw,dh
        );

      } else {
        const r=Math.max(fw/iw,fh/ih);

        const tw=iw*r;
        const th=ih*r;

        const fp=crop.focalPoint||{
          x:0.5,
          y:0.5
        };

        let ox=(tw-fw)*fp.x;
        let oy=(th-fh)*fp.y;

        if(crop.mode==="center"){
          ox=(tw-fw)/2;
          oy=(th-fh)/2;
        }

        ctx.drawImage(
          img,
          ox/r,
          oy/r,
          fw/r,
          fh/r,
          0,
          0,
          fw,
          fh
        );
      }

      ctx.restore();

      if(fr.borderWidth){
        ctx.strokeStyle=
          fr.borderColor||C.rule;

        ctx.lineWidth=fr.borderWidth;

        ctx.strokeRect(
          0,
          0,
          el.width,
          el.height
        );
      }

      resolve();
    };

    img.onerror=resolve;
    img.src=el.src;
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}

function drawText(ctx,el,text){
  ctx.fillStyle=el.color;
  ctx.textBaseline="top";

  ctx.textAlign=
    el.align==="center"
      ?"center"
      :el.align==="right"
        ?"right"
        :"left";

  const weight=el.bold?"700":"400";
  const style=el.italic?"italic":"normal";

  ctx.font=
    `${style} ${weight} ${el.fontSize}px ${el.fontFamily||FONT_SANS}`;

  try{
    ctx.letterSpacing=
      (el.letterSpacing||0)+"px";
  }catch(e){}

  const lines=
    String(text||"").split("\n");

  const lh=
    el.fontSize*(el.lineHeight||1.35);

  const dx=
    el.align==="center"
      ?el.width/2
      :el.align==="right"
        ?el.width
        :0;

  lines.forEach((line,i)=>{
    ctx.fillText(
      line,
      dx,
      i*lh
    );
  });
}

function drawScripture(ctx,el){
  let y=0;

  if(el.showRef!==false){
    ctx.fillStyle=el.color;
    ctx.globalAlpha=0.65;

    ctx.font=
      `400 ${Math.max(14,el.fontSize*0.35)}px ${FONT_SANS}`;

    ctx.textAlign=
      el.align==="center"
        ?"center"
        :el.align==="right"
          ?"right"
          :"left";

    ctx.textBaseline="top";

    const dx=
      el.align==="center"
        ?el.width/2
        :el.align==="right"
          ?el.width
          :0;

    ctx.fillText(
      scriptureRef(el)+"  ·  "+(el.version||""),
      dx,
      0
    );

    y=el.fontSize*0.55;
    ctx.globalAlpha=1;
  }

  ctx.save();

  ctx.translate(0,y);

  drawText(
    ctx,
    Object.assign({},el,{height:el.height-y}),
    el.text
  );

  ctx.restore();
}
