<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="stylesheet" href="fonts/fonts.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WEST150 · 뉴스룸 화이트보드</title>
<style>
:root{
  --bg:#0D0D0D;
  --surface:#141414;
  --surface2:#1A1A1A;
  --border:#2A2A2A;
  --text:#F5F5F5;
  --dim:rgba(255,255,255,.55);
  --accent:#e0334c;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --col-w:280px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Pretendard',-apple-system,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#app{display:flex;flex-direction:column;height:100%;max-width:100%;margin:0 auto;position:relative;background:var(--bg);}

.top-nav{
  height:52px;padding-top:var(--safe-t);min-height:calc(52px + var(--safe-t));
  display:flex;align-items:center;justify-content:space-between;
  padding-left:10px;padding-right:10px;background:var(--bg);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:40;
}
.top-nav .left,.top-nav .right{display:flex;align-items:center;gap:4px;min-width:88px;}
.top-nav .right{justify-content:flex-end;}
.top-nav .center{font-size:13px;font-weight:700;letter-spacing:-.3px;opacity:.95;}
.icon-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text);border-radius:8px;cursor:pointer;opacity:.9;
  font-size:18px;
}
.icon-btn:active{background:rgba(255,255,255,.08);}
.icon-btn.accent{color:var(--accent);}

.board-wrap{
  flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:12px 12px 8px;
}
.board-wrap::-webkit-scrollbar{display:none;}
.board{
  display:flex;gap:10px;height:100%;align-items:stretch;
  min-width:min-content;padding-bottom:4px;
}

.column{
  width:var(--col-w);flex-shrink:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  max-height:100%;overflow:hidden;
}
.column-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 12px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.column-title{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-count{
  font-size:11px;font-weight:600;color:var(--dim);
  background:rgba(255,255,255,.06);padding:2px 7px;border-radius:10px;
}
.col-add{
  width:28px;height:28px;border:none;border-radius:8px;
  background:transparent;color:var(--dim);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.col-add:active{background:rgba(255,255,255,.08);color:var(--text);}

.column-body{
  flex:1;min-height:0;overflow-y:auto;padding:10px;
  display:flex;flex-direction:column;gap:8px;
  -webkit-overflow-scrolling:touch;
}
.column-body.drag-over{background:rgba(224,51,76,.08);}

.note{
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:12px 12px 10px;cursor:grab;position:relative;
  touch-action:none;transition:box-shadow .15s,transform .15s,opacity .15s;
}
.note:active,.note.dragging{cursor:grabbing;}
.note.dragging{opacity:.85;box-shadow:0 12px 28px rgba(0,0,0,.45);z-index:50;transform:scale(1.02);}
.note-tag{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;
  padding:3px 8px;border-radius:6px;margin-bottom:8px;text-transform:uppercase;
}
.note-tag.urgent{background:rgba(224,51,76,.2);color:#ff6b7a;}
.note-tag.watch{background:rgba(245,166,35,.18);color:#f5b84a;}
.note-tag.ok{background:rgba(18,183,106,.18);color:#3ddc84;}
.note-tag.normal{background:rgba(255,255,255,.08);color:#b0b0b8;}
.note-text{
  font-size:13.5px;line-height:1.45;word-break:keep-all;white-space:pre-wrap;
  color:var(--text);user-select:text;-webkit-user-select:text;
}
.note-meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;font-size:11px;color:var(--dim);
}
.note-actions{display:flex;gap:4px;}
.note-actions button{
  border:none;background:rgba(255,255,255,.06);color:var(--dim);
  width:28px;height:28px;border-radius:7px;font-size:13px;cursor:pointer;
}
.note-actions button:active{background:rgba(255,255,255,.12);color:var(--text);}

.bottom-bar{
  flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  padding:10px 12px calc(12px + var(--safe-b));
  display:flex;gap:8px;align-items:center;
}
.btn{
  flex:1;padding:13px 12px;border-radius:12px;border:none;font-size:13.5px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,#e0334c,#a3172e);color:#fff;}
.btn-primary:active{filter:brightness(1.08);}
.btn-secondary{background:#232329;color:var(--text);border:1px solid #34343d;}
.btn-secondary:active{background:#2a2a32;}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border);flex:0 0 auto;padding:13px 14px;}

.toast{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.92);color:#111;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:20px;z-index:200;opacity:0;transition:opacity .25s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:100;padding:0;
}
.modal-overlay.show{display:flex;}
.modal{
  background:#17171c;border:1px solid #2c2c35;border-radius:16px 16px 0 0;
  padding:16px 16px calc(18px + var(--safe-b));width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;
  animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:36px;height:4px;background:#444;border-radius:2px;margin:0 auto 14px;}
.modal h3{font-size:15px;margin-bottom:12px;font-weight:700;}
.field{margin-bottom:12px;}
.field-label{font-size:11px;color:var(--dim);margin-bottom:6px;}
textarea,input[type="text"],select{
  width:100%;background:#0f0f13;border:1px solid #2c2c35;border-radius:10px;
  color:var(--text);font-size:14px;padding:11px 12px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
textarea{min-height:100px;resize:vertical;line-height:1.45;}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.tag-chip{
  padding:8px 12px;border-radius:20px;font-size:12px;font-weight:600;
  background:#0f0f13;border:1px solid #2c2c35;color:#b6b6c0;cursor:pointer;
}
.tag-chip.active{border-color:var(--accent);color:#fff;background:rgba(224,51,76,.2);}
.modal-actions{display:flex;gap:8px;margin-top:8px;}
.modal-actions .btn{flex:1;}
.modal .danger{color:#ff8080;font-size:13px;background:none;border:none;padding:10px;cursor:pointer;width:100%;margin-top:4px;}

.empty-col{
  text-align:center;color:#555;font-size:12px;padding:24px 12px;line-height:1.5;
}

.ghost-note{
  border:1.5px dashed var(--accent);border-radius:12px;background:rgba(224,51,76,.06);
  min-height:64px;pointer-events:none;
}
</style>
</head>
<body>
<div id="app">
  <div class="top-nav">
    <div class="left">
      <button class="icon-btn" id="btnBack" title="뒤로">←</button>
    </div>
    <div class="center">WEST150 · 화이트보드</div>
    <div class="right">
      <button class="icon-btn" id="btnExport" title="텍스트로 복사">📋</button>
      <button class="icon-btn accent" id="btnAddQuick" title="빠른 추가">＋</button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" id="btnClear" title="초기화">초기화</button>
    <button class="btn btn-secondary" id="btnPaste">클립보드 메모</button>
    <button class="btn btn-primary" id="btnNewNote">＋ 메모 추가</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modalTitle">메모 추가</h3>
    <div class="field">
      <div class="field-label">내용</div>
      <textarea id="noteText" placeholder="확인된 사실, 미확인 제보, 브리핑 일정…"></textarea>
    </div>
    <div class="field">
      <div class="field-label">중요도</div>
      <div class="tag-row" id="tagRow">
        <div class="tag-chip active" data-tag="normal">일반</div>
        <div class="tag-chip" data-tag="watch">확인 필요</div>
        <div class="tag-chip" data-tag="urgent">긴급</div>
        <div class="tag-chip" data-tag="ok">확인됨</div>
      </div>
    </div>
    <div class="field">
      <div class="field-label">칸</div>
      <select id="noteCol"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalSave">저장</button>
    </div>
    <button class="danger" id="modalDelete" style="display:none;">이 메모 삭제</button>
  </div>
</div>

<script>
(function(){
  const COLS = [
    {id:'unverified', name:'미확인', color:'#f5a623'},
    {id:'verified', name:'확인됨', color:'#12b76a'},
    {id:'official', name:'공식 발표', color:'#2f9bf0'},
    {id:'tocard', name:'카드로 갈 것', color:'#e0334c'},
  ];
  const TAG_LABEL = {normal:'일반', watch:'확인 필요', urgent:'긴급', ok:'확인됨'};
  const STORAGE_KEY = 'west150_whiteboard_v1';

  const board = document.getElementById('board');
  const toastEl = document.getElementById('toast');
  const modal = document.getElementById('modalOverlay');
  const noteText = document.getElementById('noteText');
  const noteCol = document.getElementById('noteCol');
  const modalTitle = document.getElementById('modalTitle');
  const modalDelete = document.getElementById('modalDelete');

  let notes = [];
  let editId = null;
  let currentTag = 'normal';
  let dragState = null;

  function uid(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function nowLabel(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'),1800);
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        notes = Array.isArray(data.notes) ? data.notes : [];
      }
    }catch(e){ notes = []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({notes})); }catch(e){}
  }

  COLS.forEach(c=>{
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    noteCol.appendChild(o);
  });

  function render(){
    board.innerHTML = '';
    COLS.forEach(col=>{
      const colNotes = notes.filter(n=>n.col===col.id);
      const el = document.createElement('div');
      el.className = 'column';
      el.dataset.col = col.id;
      el.innerHTML = `
        <div class="column-header">
          <div class="column-title">
            <span class="col-dot" style="background:${col.color}"></span>
            ${col.name}
            <span class="col-count">${colNotes.length}</span>
          </div>
          <button type="button" class="col-add" data-add="${col.id}" title="이 칸에 추가">＋</button>
        </div>
        <div class="column-body" data-body="${col.id}"></div>
      `;
      const body = el.querySelector('.column-body');
      if(colNotes.length===0){
        const empty = document.createElement('div');
        empty.className = 'empty-col';
        empty.textContent = '메모를 추가하거나\n여기로 드래그';
        body.appendChild(empty);
      } else {
        colNotes.forEach(n=> body.appendChild(makeNoteEl(n)));
      }
      board.appendChild(el);
    });
    bindColumnDrops();
    bindAddButtons();
  }

  function makeNoteEl(n){
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.id = n.id;
    el.innerHTML = `
      <div class="note-tag ${n.tag||'normal'}">${TAG_LABEL[n.tag]||'일반'}</div>
      <div class="note-text"></div>
      <div class="note-meta">
        <span>${n.time||''}</span>
        <div class="note-actions">
          <button type="button" data-edit="${n.id}" title="편집">✎</button>
          <button type="button" data-del="${n.id}" title="삭제">×</button>
        </div>
      </div>
    `;
    el.querySelector('.note-text').textContent = n.text;
    el.querySelector('[data-edit]').addEventListener('click',e=>{ e.stopPropagation(); openModal(n.id); });
    el.querySelector('[data-del]').addEventListener('click',e=>{
      e.stopPropagation();
      if(confirm('이 메모를 삭제할까요?')){
        notes = notes.filter(x=>x.id!==n.id);
        save(); render(); showToast('삭제됨');
      }
    });
    el.addEventListener('pointerdown', onNotePointerDown);
    return el;
  }

  function bindAddButtons(){
    document.querySelectorAll('[data-add]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        openModal(null, btn.dataset.add);
      });
    });
  }

  function bindColumnDrops(){
    document.querySelectorAll('.column-body').forEach(body=>{
      body.addEventListener('pointerup', onColumnPointerUp);
      body.addEventListener('pointerenter', ()=>{
        if(dragState) body.classList.add('drag-over');
      });
      body.addEventListener('pointerleave', ()=> body.classList.remove('drag-over'));
    });
  }

  function onNotePointerDown(e){
    if(e.target.closest('button')) return;
    const noteEl = e.currentTarget;
    const id = noteEl.dataset.id;
    dragState = {
      id,
      startX: e.clientX,
      startY: e.clientY,
      moved: false,
      el: noteEl,
      pointerId: e.pointerId,
    };
    noteEl.setPointerCapture(e.pointerId);
    noteEl.addEventListener('pointermove', onNotePointerMove);
    noteEl.addEventListener('pointerup', onNotePointerUp);
    noteEl.addEventListener('pointercancel', onNotePointerUp);
  }

  function onNotePointerMove(e){
    if(!dragState || dragState.el !== e.currentTarget) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if(!dragState.moved && Math.hypot(dx,dy) < 8) return;
    dragState.moved = true;
    dragState.el.classList.add('dragging');
    dragState.el.style.position = 'fixed';
    dragState.el.style.left = (e.clientX - 40) + 'px';
    dragState.el.style.top = (e.clientY - 20) + 'px';
    dragState.el.style.width = 'var(--col-w)';
    dragState.el.style.maxWidth = '260px';
    dragState.el.style.pointerEvents = 'none';
    dragState.el.style.zIndex = '100';
  }

  function onNotePointerUp(e){
    const el = e.currentTarget;
    el.removeEventListener('pointermove', onNotePointerMove);
    el.removeEventListener('pointerup', onNotePointerUp);
    el.removeEventListener('pointercancel', onNotePointerUp);
    if(!dragState) return;

    if(dragState.moved){
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const body = target && target.closest('.column-body');
      if(body){
        const newCol = body.dataset.body;
        const note = notes.find(n=>n.id===dragState.id);
        if(note && note.col !== newCol){
          note.col = newCol;
          save();
          showToast(COLS.find(c=>c.id===newCol).name + '으로 이동');
        }
      }
    } else {
      // tap = edit
      openModal(dragState.id);
    }
    dragState = null;
    document.querySelectorAll('.column-body').forEach(b=>b.classList.remove('drag-over'));
    render();
  }

  function onColumnPointerUp(){ /* handled via elementFromPoint on note up */ }

  document.querySelectorAll('#tagRow .tag-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('#tagRow .tag-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentTag = chip.dataset.tag;
    });
  });

  function openModal(id, defaultCol){
    editId = id || null;
    currentTag = 'normal';
    document.querySelectorAll('#tagRow .tag-chip').forEach(c=>{
      c.classList.toggle('active', c.dataset.tag==='normal');
    });
    if(id){
      const n = notes.find(x=>x.id===id);
      if(!n) return;
      modalTitle.textContent = '메모 수정';
      noteText.value = n.text;
      noteCol.value = n.col;
      currentTag = n.tag || 'normal';
      document.querySelectorAll('#tagRow .tag-chip').forEach(c=>{
        c.classList.toggle('active', c.dataset.tag===currentTag);
      });
      modalDelete.style.display = 'block';
    } else {
      modalTitle.textContent = '메모 추가';
      noteText.value = '';
      noteCol.value = defaultCol || 'unverified';
      modalDelete.style.display = 'none';
    }
    modal.classList.add('show');
    setTimeout(()=>noteText.focus(), 200);
  }

  function closeModal(){ modal.classList.remove('show'); editId = null; }

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
  document.getElementById('modalSave').addEventListener('click',()=>{
    const text = noteText.value.trim();
    if(!text){ showToast('내용을 입력하세요'); return; }
    if(editId){
      const n = notes.find(x=>x.id===editId);
      if(n){
        n.text = text;
        n.col = noteCol.value;
        n.tag = currentTag;
        n.time = nowLabel();
      }
      showToast('수정됨');
    } else {
      notes.push({
        id: uid(),
        text,
        col: noteCol.value,
        tag: currentTag,
        time: nowLabel(),
      });
      showToast('메모 추가됨');
    }
    save();
    closeModal();
    render();
  });
  document.getElementById('modalDelete').addEventListener('click',()=>{
    if(!editId) return;
    if(!confirm('이 메모를 삭제할까요?')) return;
    notes = notes.filter(x=>x.id!==editId);
    save(); closeModal(); render(); showToast('삭제됨');
  });

  document.getElementById('btnNewNote').addEventListener('click',()=>openModal(null,'unverified'));
  document.getElementById('btnAddQuick').addEventListener('click',()=>openModal(null,'unverified'));

  document.getElementById('btnPaste').addEventListener('click', async ()=>{
    let text = '';
    try{
      if(navigator.clipboard && navigator.clipboard.readText){
        text = await navigator.clipboard.readText();
      }
    }catch(e){}
    if(!text || !text.trim()){
      text = prompt('클립보드 텍스트를 붙여넣으세요') || '';
    }
    text = text.trim();
    if(!text){ showToast('붙여넣을 내용 없음'); return; }
    // split lines into separate notes if multiple
    const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    if(lines.length > 1 && confirm(lines.length+'줄을 각각 메모로 추가할까요?\n(취소 시 한 메모로 저장)')){
      lines.forEach(line=>{
        notes.push({id:uid(), text:line, col:'unverified', tag:'watch', time:nowLabel()});
      });
      showToast(lines.length+'개 메모 추가');
    } else {
      notes.push({id:uid(), text, col:'unverified', tag:'watch', time:nowLabel()});
      showToast('메모 추가됨');
    }
    save(); render();
  });

  document.getElementById('btnExport').addEventListener('click', async ()=>{
    const parts = COLS.map(col=>{
      const list = notes.filter(n=>n.col===col.id);
      if(!list.length) return '';
      return '【'+col.name+'】\n'+list.map(n=>'· '+n.text+(n.tag&&n.tag!=='normal'?' ('+TAG_LABEL[n.tag]+')':'')).join('\n');
    }).filter(Boolean);
    const out = parts.join('\n\n') || '(메모 없음)';
    try{
      await navigator.clipboard.writeText(out);
      showToast('전체 메모 복사됨');
    }catch(e){
      prompt('아래 내용을 복사하세요', out);
    }
  });

  document.getElementById('btnClear').addEventListener('click',()=>{
    if(!notes.length){ showToast('비어 있음'); return; }
    if(!confirm('모든 메모를 삭제하고 보드를 비울까요?')) return;
    notes = [];
    save(); render(); showToast('초기화됨');
  });

  document.getElementById('btnBack').addEventListener('click',()=>{
    if(confirm('화이트보드를 닫을까요?')) history.back();
  });

  // seed sample if empty first visit
  load();
  if(notes.length===0){
    notes = [
      {id:uid(), text:'목격자 제보: 오후 3시경 현장 연무 목격\n출처 미확인', col:'unverified', tag:'watch', time:nowLabel()},
      {id:uid(), text:'경찰 브리핑 오늘 16:00 예정', col:'official', tag:'urgent', time:nowLabel()},
      {id:uid(), text:'인명 피해 여부는 아직 공식 확인 전', col:'unverified', tag:'watch', time:nowLabel()},
      {id:uid(), text:'소방 당국: 대응 1단계 발령 (공식)', col:'verified', tag:'ok', time:nowLabel()},
      {id:uid(), text:'헤드라인 후보\n도심 화재, 대응 1단계', col:'tocard', tag:'urgent', time:nowLabel()},
    ];
    save();
  }
  render();
})();
</script>
</body>
</html>
