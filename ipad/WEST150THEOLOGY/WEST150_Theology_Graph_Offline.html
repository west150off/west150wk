지 아니함으로 많은 사람이 죄인 된 것 같이 한 사람이 순종하심으로 많은 사람이 의인이 되리라"}],quote:"하나님의 영광은 온전히 살아있는 사람이며, 인간의 생명은 하나님을 뵈옵는 데 있다.",importance:4},{id:"athanasius",name:"아타나시우스 (알렉산드리아)",latinName:"Sanctus Athanasius Alexandrinus",type:"theologian",tradition:"Patristic",startYear:296,endYear:373,eraDescription:"4세기 총대주교 및 정통신앙의 수호자",location:"알렉산드리아 (이집트)",summary:"아리우스주의에 맞서 그리스도의 완전한 신성과 성부와 성자의 '동일본질(Homoousios)'을 결사적으로 수호한 교부. 5차례의 유배 속에서도 진리를 지켜 '세상에 맞선 아타나시우스(Athanasius contra mundum)'라 불렸습니다.",majorWorks:["말씀의 성육신에 관하여 (De Incarnatione)","아리우스파 논박 (Contra Arianos)","성 안토니우스의 생애"],keyScriptures:[{ref:"요한복음 1:1",text:"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"},{ref:"골로새서 2:9",text:"그 안에는 신성의 모든 충만이 육체로 거하시고"}],quote:"하나님께서 사람이 되신 것은, 사람으로 하여금 그분 안에서 신의 성품에 참예하게 하려 하심이다.",importance:5},{id:"augustine",name:"아우구스티누스 (히포)",latinName:"Aurelius Augustinus Hipponensis",type:"theologian",tradition:"Patristic",startYear:354,endYear:430,eraDescription:"고대 말기 서방 교회의 위대한 은혜의 박사",location:"타가스테 / 히포 레기우스 (북아프리카)",summary:"원죄론, 하나님의 주권적 은혜, 삼위일체론, 신국론을 정립하여 중세 스콜라주의와 종교개혁 신학 전체에 결정적 기초를 놓은 서구 기독교 최대의 교부입니다.",majorWorks:["고백록 (Confessiones)","하나님의 도성 (De Civitate Dei)","삼위일체론 (De Trinitate)","기독교 교리 (De Doctrina Christiana)"],keyScriptures:[{ref:"로마서 9:16",text:"그런즉 원하는 자로 말미암음도 아니요 달음박질하는 자로 말미암음도 아니요 오직 긍휼히 여기시는 하나님으로 말미암음이니라"},{ref:"에베소서 2:8-9",text:"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라"}],quote:"주여, 당신은 우리를 당신을 향해 살도록 창조하셨기에, 우리의 마음이 당신 안에서 쉼을 얻기까지는 평안이 없나이다.",importance:5},{id:"chrysostom",name:"요한 크리소스토무스",latinName:"Ioannes Chrysostomus (황금의 입)",type:"theologian",tradition:"Patristic",startYear:349,endYear:407,eraDescription:"4세기 콘스탄티노폴리스 대주교 및 설교의 황제",location:"안디옥 / 콘스탄티노폴리스",summary:"웅변적인 강해설교와 문자적·역사적 안디옥 학파 성경해석으로 유명한 총대주교. 그리스도인의 철저한 윤리적 삶과 가난한 자들을 향한 실천적 목회를 강조했습니다.",majorWorks:["창세기·마태복음·로마서 강해","성직론 (De Sacerdotio)","성 요한 크리소스토무스 성찬예전문"],keyScriptures:[{ref:"로마서 8:31",text:"만일 하나님이 우리를 위하시면 누가 우리를 대적하리요"},{ref:"마태복음 25:40",text:"너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라"}],quote:"기도는 모든 축복의 뿌리요 샘이며 어머니이다.",importance:4},{id:"anselm",name:"안셀무스 (캔터베리)",latinName:"Anselmus Cantuariensis",type:"theologian",tradition:"Scholastic",startYear:1033,endYear:1109,eraDescription:"11세기 스콜라주의의 아버지",location:"베크 (노르망디) / 캔터베리 (잉글랜드)",summary:"'이해를 추구하는 신앙(Fides quaerens intellectum)', 하나님의 존재에 관한 본체론적 논증, 그리고 십자가 구속에 관한 '만족설(Satisfaction Theory)'을 체계화했습니다.",majorWorks:["프로슬로기온 (Proslogion)","왜 하나님은 사람이 되셨는가 (Cur Deus Homo)","모놀로기온 (Monologion)"],keyScriptures:[{ref:"이사야 53:5",text:"그가 찔림은 우리의 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고"},{ref:"시편 14:1",text:"어리석은 자는 그의 마음에 이르기를 하나님이 없다 하는도다"}],quote:"나는 이해하기 위해 믿는 것이 아니요, 믿기 때문에 이해하나이다.",importance:4},{id:"aquinas",name:"토마스 아퀴나스",latinName:"Doctor Angelicus (천사적 박사)",type:"theologian",tradition:"Scholastic",startYear:1225,endYear:1274,eraDescription:"중세 전성기 도미니코회 스콜라 거장",location:"로카세카 / 파리 / 로마",summary:"아리스토텔레스 철학과 기독교 계시를 장엄하게 집대성한 중세 최고의 신학자. 신 존재 증명의 5가지 길, 하나님의 단순성(Simplicitas Dei), 자연법과 은총론을 완성했습니다.",majorWorks:["신학대전 (Summa Theologiae)","대이교도대전 (Summa contra Gentiles)","존재와 본질에 관하여 (De Ente et Essentia)"],keyScriptures:[{ref:"로마서 1:20",text:"창세로부터 그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성이 그가 만드신 만물에 분명히 보여 알려졌나니"},{ref:"고린도전서 13:12",text:"우리가 지금은 거울로 보는 것 같이 희미하나 그 때에는 얼굴과 얼굴을 대하여 볼 것이요"}],quote:"은혜는 자연을 파괴하지 않고, 오히려 자연을 완성한다.",importance:5},{id:"scotus",name:"존 둔스 스코투스",latinName:"Doctor Subtilis (미묘한 박사)",type:"theologian",tradition:"Scholastic",startYear:1266,endYear:1308,eraDescription:"후기 중세 프란치스코회 철학신학자",location:"둔스 (스코틀랜드) / 옥스퍼드 / 파리 / 쾰른",summary:"탁월하고 치밀한 사변철학으로 '미묘한 박사'로 불린 학자. 존재의 일의성(Univocity of Being), 형상적 구별, 그리고 주의주의(Voluntarism) 신학을 전개했습니다.",majorWorks:["옥스퍼드 저작집 (Ordinatio)","제일원리론 (De Primo Principio)","강의록 (Lectura)"],keyScriptures:[{ref:"출애굽기 3:14",text:"하나님이 모세에게 이르시되 나는 스스로 있는 자이니라"}],quote:"존재라는 개념은 하나님과 피조물 모두에게 동일한 의미로 적용된다.",importance:3},{id:"luther",name:"마르틴 루터",latinName:"Martinus Lutherus",type:"theologian",tradition:"Lutheran",startYear:1483,endYear:1546,eraDescription:"종교개혁의 도화선을 당긴 신학자",location:"아이슬레벤 / 비텐베르크 (독일)",summary:"95개조 반박문으로 종교개혁을 촉발한 독일의 신학자. 오직 믿음으로 말미암는 칭의(Sola Fide), 성경의 절대적 권위(Sola Scriptura), 십자가 신학(Theologia Crucis), 만인제사장직을 확립했습니다.",majorWorks:["95개조 반박문 (1517)","노예의지론 (De Servo Arbitrio)","대·소교리문답","갈라디아서 주석"],keyScriptures:[{ref:"로마서 1:17",text:"복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된 바 오직 의인은 믿음으로 말미암아 살리라 함과 같으니라"},{ref:"갈라디아서 2:16",text:"사람이 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로 말미암는 줄 알므로"}],quote:"내가 여기 서 있나이다. 나는 다른 선택을 할 수 없습니다. 하나님이여 나를 도우소서. 아멘.",importance:5},{id:"zwingli",name:"울리히 츠빙글리",latinName:"Ulricus Zuinglius",type:"theologian",tradition:"Reformed",startYear:1484,endYear:1531,eraDescription:"스위스 종교개혁의 선구자",location:"빌트하우스 / 취리히 (스위스)",summary:"취리히를 중심으로 스위스 종교개혁을 이끌고 개혁파 언약신학의 초석을 놓은 신학자. 마르부르크 회의에서 성찬론에 대해 루터의 공재설에 맞서 '기념설(Memorialism)'을 주장했습니다.",majorWorks:["참 종교와 거짓 종교에 관한 해설","하나님의 섭리론 (De Providentia Dei)","67개조 신조"],keyScriptures:[{ref:"누가복음 22:19",text:"너희가 이를 행하여 나를 기념하라"},{ref:"요한복음 6:63",text:"살리는 것은 영이니 육은 무익하니라 내가 너희에게 이른 말은 영이요 생명이라"}],quote:"그리스도는 과거와 현재와 미래에 살아갈 모든 사람을 위한 유일한 구원의 길이시다.",importance:4},{id:"calvin",name:"장 칼뱅 (존 칼빈)",latinName:"Ioannes Calvinus",type:"theologian",tradition:"Reformed",startYear:1509,endYear:1564,eraDescription:"개혁주의 조직신학의 대집성자",location:"누아용 (프랑스) / 제네바 (스위스)",summary:"제네바 종교개혁의 지도자이자 장로교 및 개혁주의 신학의 뼈대를 완성한 신학자. 대작 《기독교 강요》를 통해 하나님의 절대 주권, 이중 예정, 그리스도와의 신비적 연합, 성령의 내적 증언을 정립했습니다.",majorWorks:["기독교 강요 (Institutio Christianae Religionis)","성경 전권 주석집","제네바 요리문답"],keyScriptures:[{ref:"에베소서 1:4-5",text:"곧 창세 전에 그리스도 안에서 우리를 택하사... 그 기쁘신 뜻대로 우리를 예정하사 예수 그리스도로 말미암아 자기의 아들들이 되게 하셨으니"},{ref:"로마서 11:36",text:"이는 만물이 주에게서 나오고 주로 말미암고 주에게로 돌아감이라 그에게 영광이 세세에 있을지어다 아멘"}],quote:"우리가 가진 지혜의 총체는 두 부분으로 구성되어 있으니, 곧 하나님에 관한 지식과 우리 자신에 관한 지식이다.",importance:5},{id:"melanchthon",name:"필리프 멜란히톤",latinName:"Philipp Melanchthon",type:"theologian",tradition:"Lutheran",startYear:1497,endYear:1560,eraDescription:"독일의 교사 (Praeceptor Germaniae) & 인문주의자",location:"브레텐 / 비텐베르크 (독일)",summary:"루터의 가장 핵심적인 학문적 동역자. 프로테스탄트 최초의 조직신학서인 《신학통론(Loci Communes)》과 루터란 표준 신앙고백서인 《아우크스부르크 신앙고백서》를 작성했습니다.",majorWorks:["아우크스부르크 신앙고백서 (1530)","신학통론 (Loci Communes, 1521)","아우크스부르크 신앙고백 변증서"],keyScriptures:[{ref:"로마서 3:28",text:"그러므로 사람이 의롭다 하심을 얻는 것은 율법의 행위에 있지 않고 믿음으로 되는 줄 우리가 인정하노라"}],quote:"그리스도를 안다는 것은 그분의 구속 은택(은혜)을 아는 것이다.",importance:3},{id:"arminius",name:"야코부스 아르미니우스",latinName:"Jacobus Arminius",type:"theologian",tradition:"Arminian",startYear:1560,endYear:1609,eraDescription:"17세기 네덜란드 항론파(Remonstrant) 신학자",location:"아우데바테르 / 레이던 (네덜란드)",summary:"무조건적 예정론에 의문을 제기하며 조건적 선택, 저항 가능한 선행 은혜(Prevenient Grace), 보편적 속죄를 주장하여 아르미니우스주의(Arminianism)를 태동시킨 네덜란드 신학자입니다.",majorWorks:["감정 선언 (Declaration of Sentiments)","사적 논고집 (Disputationes Privatae)","퍼킨스 소논문 검토"],keyScriptures:[{ref:"디모데전서 2:3-4",text:"이것이 우리 구주 하나님 앞에 선하고 받으실 만한 것이니 하나님은 모든 사람이 구원을 받으며 진리를 아는 데에 이르기를 원하시느니라"},{ref:"베드로후서 3:9",text:"오직 주께서는 너희를 대하여 오래 참으사 아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라"}],quote:"은혜는 모든 사람에게 구원을 얻기에 충분하게 제공되지만, 오직 믿는 자들에게만 유효하다.",importance:4},{id:"owen",name:"존 오웬",latinName:"Doctor Puritanus (청교도의 황태자)",type:"theologian",tradition:"Reformed",startYear:1616,endYear:1683,eraDescription:"17세기 영국 청교도 최고의 신학자",location:"옥스퍼드 / 런던 (영국)",summary:"옥스퍼드 대학교 총장이자 개혁파 정통주의의 거장. 제한속죄론(제한적 속죄의 엄밀한 변증), 삼위일체 하나님과의 친밀한 교제, 신자 안에서의 죄 죽임(Mortification of Sin)을 심도 있게 탐구했습니다.",majorWorks:["그리스도의 죽으심 안에서의 죽음의 죽음","삼위일체 하나님과의 교제","신자의 죄 죽이기","성령론 (Pneumatologia)"],keyScriptures:[{ref:"로마서 8:13",text:"너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 살리니"},{ref:"히브리서 9:14",text:"하물며 영원하신 성령으로 말미암아 흠 없는 자기를 하나님께 드린 그리스도의 피가 어찌 너희 양심을 죽은 행실에서 깨끗하게 하고 살아 계신 하나님을 섬기게 하지 못하겠느냐"}],quote:"죄를 죽이십시오. 그렇지 않으면 죄가 당신을 죽일 것입니다.",importance:4},{id:"turretin",name:"프란시스 투레틴",latinName:"Franciscus Turretinus",type:"theologian",tradition:"Reformed",startYear:1623,endYear:1687,eraDescription:"제네바 개혁파 스콜라 정통주의 거장",location:"제네바 공화국",summary:"제네바 아카데미의 신학 교수. 그의 저작 《변증신학 강요》는 수백 년간 프린스턴 신학교를 비롯한 전 세계 개혁파 신학교의 표준 조직신학 교재로 사용되었습니다.",majorWorks:["변증신학 강요 (Institutio Theologiae Elencticae)","그리스도의 만족에 관한 논고"],keyScriptures:[{ref:"디모데후서 1:13",text:"너는 그리스도 예수 안에 있는 믿음과 사랑으로써 내게 들은 바 바른 말을 본받아 지키고"}],quote:"성경은 신학적 진리의 유일한 규범이자 무오한 안내자이다.",importance:3},{id:"edwards",name:"조나단 에드워즈",latinName:"Jonathan Edwards",type:"theologian",tradition:"Reformed",startYear:1703,endYear:1758,eraDescription:"미국 제1차 대각성운동의 지도자 & 철학신학자",location:"노샘프턴 / 프린스턴 (미국)",summary:"미국 역사상 가장 위대한 철학신학자이자 부흥 설교가. 칼뱅주의 신학과 로크의 경험주의, 하나님의 아름다움과 무한한 거룩에 관한 탁월한 신학적 미학을 정립했습니다.",majorWorks:["의지의 자유 (Freedom of the Will)","신앙 감정론 (Religious Affections)","하나님의 창조 목적","진노하시는 하나님의 손안에 있는 죄인"],keyScriptures:[{ref:"베드로전서 1:8",text:"예수를 너희가 보지 못하였으나 사랑하는도다 이제도 보지 못하나 믿고 말할 수 없는 영광스러운 즐거움으로 기뻐하니"},{ref:"로마서 11:36",text:"이는 만물이 주에게서 나오고 주로 말미암고 주에게로 돌아감이라"}],quote:"모든 아름다움 중의 최고의 아름다움은 하나님의 무한하신 거룩하심이다.",importance:5},{id:"schleiermacher",name:"프리드리히 슐라이어마허",latinName:"Pater Theologiae Liberalis (자유주의 신학의 아버지)",type:"theologian",tradition:"Contemporary",startYear:1768,endYear:1834,eraDescription:"19세기 근대 자유주의 프로테스탄트 신학의 창시자",location:"브레슬라우 / 할레 / 베를린 (프로이센)",summary:"신학의 출발점을 교리적 명제에서 인간의 내면적 종교의식으로 전환시킨 신학자. 종교를 '절대 의존의 감정(Gefühl der schlechthinnigen Abhängigkeit)'으로 정의했습니다.",majorWorks:["종교론: 종교를 멸시하는 교양인들을 위한 강연 (1799)","기독교 신앙 (Der christliche Glaube, 1821)"],keyScriptures:[{ref:"사도행전 17:28",text:"우리가 그를 힘입어 살며 기동하며 존재하느니라"}],quote:"종교는 무한자를 향한 직관과 감미로운 맛봄이다.",importance:4},{id:"kierkegaard",name:"쇠렌 키르케고르",latinName:"Søren Aabye Kierkegaard",type:"theologian",tradition:"Contemporary",startYear:1813,endYear:1855,eraDescription:"기독교 실존주의의 선구자",location:"코펜하겐 (덴마크)",summary:"덴마크 국교회의 형식주의와 헤겔의 합리주의를 통렬히 비판한 사상가. '주체성이 진리다', '신앙의 도약(Leap of Faith)', 하나님 앞에서의 단독자(Coram Deo)를 주창했습니다.",majorWorks:["공포와 전율 (Frygt og Bæven)","죽음에 이르는 병 (Sygdommen til Døden)","철학적 단편 후서","기독교계에 대한 공격"],keyScriptures:[{ref:"빌립보서 2:12",text:"항상 복종하여 두렵고 떨림으로 너희 구원을 이루라"},{ref:"히브리서 11:1",text:"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니"}],quote:"죄의 반의어는 덕이 아니라 바로 '믿음'이다.",importance:4},{id:"barth",name:"칼 바르트",latinName:"Carolus Barth",type:"theologian",tradition:"Neo-Orthodox",startYear:1886,endYear:1968,eraDescription:"20세기 신정통주의 & 변증법적 신학의 거장",location:"바젤 / 자펜빌 / 괴팅겐 / 본",summary:"《로마서 강해》로 19세기 자유주의 신학의 지평을 뒤흔든 20세기 최대의 신학자 중 한 사람. 나치 정권에 저항하는 '바르멘 선언'을 기초했고, 방대한 《교회교의학(Church Dogmatics)》을 저술했습니다.",majorWorks:["로마서 강해 (Der Römerbrief)","교회교의학 (Kirchliche Dogmatik, 전 14권)","바르멘 신학선언 (1934)"],keyScriptures:[{ref:"로마서 3:22-24",text:"곧 예수 그리스도를 믿음으로 말미암아 모든 믿는 자에게 미치는 하나님의 의니 차별이 없느니라... 값 없이 의롭다 하심을 얻은 자 되었느니라"},{ref:"요한복음 1:14",text:"말씀이 육신이 되어 우리 가운데 거하시매"}],quote:"예수 사랑하심은 거룩하신 말일세. 우리들은 약하나 예수 권세 많도다.",importance:5},{id:"bonhoeffer",name:"디트리히 본회퍼",latinName:"Theologus Martyrio Coronatus (순교자적 신학자)",type:"theologian",tradition:"Neo-Orthodox",startYear:1906,endYear:1945,eraDescription:"20세기 독일의 목회자, 신학자이자 반나치 순교자",location:"브레슬라우 / 베를린 / 플로센뷔르크",summary:"히틀러 독재에 맞서 고백교회를 이끌다 처형된 독일의 루터란 신학자. '싸구려 은혜'에 대항하여 '값비싼 은혜(Costly Grace)', '비종교적 기독교', 고난받는 자들과의 연대를 역설했습니다.",majorWorks:["나를 따르라 (제자도의 대가, Nachfolge)","신도의 공동생활 (Gemeinsames Leben)","옥중서간 (Widerstand und Ergebung)","윤리학 (Ethik)"],keyScriptures:[{ref:"마가복음 8:34",text:"누구든지 나를 따라오려거든 자기를 부인하고 자기 십자가를 지고 나를 따를 것이니라"},{ref:"마태복음 5:13-14",text:"너희는 세상의 소금이니... 너희는 세상의 빛이라"}],quote:"그리스도께서 사람을 부르실 때에는, 그에게 와서 죽으라고 명하시는 것이다.",importance:5},{id:"bultmann",name:"루돌프 불트만",latinName:"Rudolf Karl Bultmann",type:"theologian",tradition:"Contemporary",startYear:1884,endYear:1976,eraDescription:"20세기 신약학자 및 비신화화(Demythologization) 주창자",location:"마르부르크 (독일)",summary:"하이데거의 실존철학적 틀을 통해 신약성경의 복음 선포(Kerygma)를 현대인에게 맞게 '비신화화'해야 한다고 주장하여 20세기 성서학계에 거대한 논쟁을 불러일으켰습니다.",majorWorks:["신약성서와 신화 (Neues Testament und Mythologie)","신약성서신학","공관복음서 전승사"],keyScriptures:[{ref:"갈라디아서 2:20",text:"내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라"}],quote:"전깃불과 무선라디오를 사용하는 현대인이 신약성경의 기적과 귀신의 세계관을 그대로 믿는 것은 불가능하다.",importance:3},{id:"vantil",name:"코넬리우스 반틸",latinName:"Cornelius Van Til",type:"theologian",tradition:"Reformed",startYear:1895,endYear:1987,eraDescription:"전제주의 변증학(Presuppositional Apologetics)의 창시자",location:"네덜란드 / 필라델피아 (미국)",summary:"웨스트민스터 신학교 교수. 모든 인간의 사고와 학문은 전제(성경의 삼위일체 하나님 vs 자율적 인간 이성)에 기초한다는 점을 밝히며 전통적 증거주의를 혁신한 전제주의 변증학을 수립했습니다.",majorWorks:["신앙의 변호 (The Defense of the Faith)","기독교 변증학 (Christian Apologetics)","기독교 인식론 개론"],keyScriptures:[{ref:"잠언 1:7",text:"여호와를 경외하는 것이 지식의 근본이거늘 미련한 자는 지혜와 훈계를 멸시하느니라"},{ref:"골로새서 2:3",text:"그 안에는 지혜와 지식의 모든 보화가 감추어져 있느니라"}],quote:"기독교 유일신론과 완전한 인식론적 혼돈 사이에는 어떠한 중간 지대도 존재하지 않는다.",importance:4},{id:"cslewis",name:"C.S. 루이스",latinName:"Clive Staples Lewis",type:"theologian",tradition:"Contemporary",startYear:1898,endYear:1963,eraDescription:"20세기 옥스퍼드·케임브리지 기독교 변증가 및 영문학자",location:"벨파스트 / 옥스퍼드 / 케임브리지 (영국)",summary:"'순전한 기독교(Mere Christianity)', 도덕률 논증, 삼자택일 논증(주님·사기꾼·광인), 고통의 문제를 명쾌한 이성과 비유로 풀어내어 전 세계 수천만 명에게 복음을 전한 변증가입니다.",majorWorks:["순전한 기독교 (Mere Christianity)","고통의 문제 (The Problem of Pain)","기적 (Miracles)","인간 폐지","스크루테이프의 편지"],keyScriptures:[{ref:"로마서 2:14-15",text:"이런 이들은 그 마음에 새긴 율법의 행위를 나타내느니라"},{ref:"고린도후서 4:17",text:"우리가 잠시 받는 환난의 경한 것이 지극히 크고 영원한 영광의 중한 것을 우리에게 이루게 함이니"}],quote:"태양이 떠오른 것을 믿는 것처럼 나는 기독교를 믿는다. 태양을 볼 수 있을 뿐 아니라, 그 태양으로 인해 만물을 볼 수 있기 때문이다.",importance:5},{id:"council_nicaea",name:"제1차 니케아 공의회",latinName:"Concilium Nicaenum Primum (325)",type:"council",tradition:"Patristic",startYear:325,endYear:325,eraDescription:"기독교 역사상 제1차 세계 공의회",location:"비티니아 니케아 (현 터키 이즈니크)",summary:"콘스탄티누스 황제가 소집한 첫 세계 공의회. 아리우스의 이단을 단죄하고, 성자 예수 그리스도께서 성부와 '동일본질(호모우시오스, Homoousios)'이심을 선포하여 니케아 신조를 제정했습니다.",majorWorks:["니케아 신조 (325년 원문)","니케아 20개 조항 규례"],keyScriptures:[{ref:"요한복음 10:30",text:"나와 아버지는 하나이니라"},{ref:"히브리서 1:3",text:"이는 하나님의 영광의 광채시요 그 본체의 형상이시라"}],quote:"참 하나님으로부터 나신 참 하나님이시며, 창조되지 않고 나셨으며, 성부와 동일한 본질이시도다.",importance:5},{id:"council_chalcedon",name:"칼케돈 공의회",latinName:"Concilium Chalcedonense (451)",type:"council",tradition:"Patristic",startYear:451,endYear:451,eraDescription:"제4차 세계 공의회 (기독론의 기준)",location:"비티니아 칼케돈",summary:"기독론 논쟁을 종결지으며 그리스도께서 '참 하나님이시며 참 인간'으로서 '혼합되지 않고, 변하지 않으며, 분할되지 않고, 분리되지 않는(Inconfuse, Immutabiliter, Indivise, Inseparabiliter)' 신인 양성을 지니신 한 위격(위격적 연합)이심을 확정했습니다.",majorWorks:["칼케돈 신조 (Symbolum Chalcedonense)","레오의 서한 (Tome of Leo)"],keyScriptures:[{ref:"디모데전서 3:16",text:"크도다 경건의 비밀이여, 그렇지 않다 하는 이 없도다 그는 육신으로 나타난 바 되시고 영으로 의롭다 하심을 받으시고"},{ref:"빌립보서 2:6-8",text:"그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고"}],quote:"한 분이시요 동일하신 그리스도... 두 성품 안에서 혼합됨 없이, 변화됨 없이, 분할됨 없이, 분리됨 없이 인정되시도다.",importance:5},{id:"council_trent",name:"트렌트 공의회",latinName:"Concilium Tridentinum (1545-1563)",type:"council",tradition:"Scholastic",startYear:1545,endYear:1563,eraDescription:"로마 가톨릭 반종교개혁 공의회",location:"트렌토 / 볼로냐 (이탈리아 북부)",summary:"프로테스탄트 종교개혁에 대응하여 로마 가톨릭의 교리를 재정립한 공의회. 오직 믿음으로 말미암는 칭의를 거부하고, 7성사 체계, 라틴어 불가타 성경의 정경성, 교황권을 재확인했습니다.",majorWorks:["트렌트 공의회 교령 및 법령집","로마 요리문답 (Catechismus Romanus)"],keyScriptures:[{ref:"야고보서 2:24",text:"이로 보건대 사람이 행함으로 의롭다 하심을 받고 믿음으로만은 아니니라"},{ref:"마태복음 16:18-19",text:"너는 베드로라 내가 이 반석 위에 내 교회를 세우리니"}],quote:"만일 누구든지 오직 믿음만으로 불경건한 자가 의롭다 함을 얻는다고 말한다면... 그는 아나테마(저주)를 받을지어다.",importance:4},{id:"synod_dort",name:"도르트 총회 (도르트 신조)",latinName:"Synodus Dordracena (1618-1619)",type:"council",tradition:"Reformed",startYear:1618,endYear:1619,eraDescription:"국제 개혁파 대표 총회",location:"도르드레흐트 (네덜란드)",summary:"아르미니우스주의자들의 5개 조항(항론)을 반박하기 위해 유럽 전역의 개혁파 대표들이 모인 총회. 이른바 칼뱅주의 5대 교리(T.U.L.I.P. - 전적 타락, 무조건적 선택, 제한 속죄, 불가항력적 은혜, 성도의 견인)를 신조화했습니다.",majorWorks:["도르트 신조 (Canons of Dort)","네덜란드 신앙고백서 및 하이델베르크 요리문답 인준"],keyScriptures:[{ref:"요한복음 6:44",text:"나를 보내신 아버지께서 이끌지 아니하시면 아무도 내게 올 수 없으니"},{ref:"로마서 8:29-30",text:"하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니"}],quote:"선택은 하나님의 불변하시는 목적이니, 창세 전에 오직 거저 주시는 은혜로 말미암아 그리스도 안에서 구원받을 자들을 택하셨도다.",importance:4},{id:"westminster_assembly",name:"웨스트민스터 총회",latinName:"Synodus Westmonasteriensis (1643-1649)",type:"council",tradition:"Reformed",startYear:1643,endYear:1649,eraDescription:"영국 의회 소집 청교도·장로교 신학자 총회",location:"웨스트민스터 사원 (런던)",summary:"영국 의회의 소집으로 120여 명의 청교도 신학자들이 모여 장로교 신학의 결정체인 《웨스트민스터 신앙고백서》와 《소요리문답》, 《대요리문답》을 제정했습니다.",majorWorks:["웨스트민스터 신앙고백서","웨스트민스터 소요리문답","웨스트민스터 대요리문답","공예배 지침서"],keyScriptures:[{ref:"고린도전서 10:31",text:"그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라"},{ref:"시편 73:25-26",text:"하늘에서는 주 외에 누가 내게 있으리요 땅에서는 주 밖에 내가 사모할 이 없나이다"}],quote:"사람의 제일 되는 목적은 하나님을 영화롭게 하는 것과, 영원토록 그분을 온전히 즐거워하는 것이다.",importance:5},{id:"doc_trinity",name:"삼위일체 교리 (동일본질 / 세 위격)",latinName:"Sanctissima Trinitas",type:"doctrine",tradition:"Patristic",startYear:325,eraDescription:"고전적 정통 삼위일체 도그마",location:"알렉산드리아 / 니케아 / 로마",summary:"하나님은 오직 한 분이신 유일한 신적 본질(Ousia / Substantia) 안에서, 동등하고 영원하신 세 위격(Hypostasis / Personae: 성부, 성자, 성령)으로 영원히 자존하십니다.",majorWorks:["아우구스티누스의 삼위일체론","바실리우스의 성령론","아타나시우스 신조 (Quicumque Vult)"],keyScriptures:[{ref:"마태복음 28:19",text:"그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고"},{ref:"고린도후서 13:13",text:"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다"}],quote:"한 본질, 세 위격 (Una substantia, tres personae).",importance:5},{id:"doc_hypostatic_union",name:"위격적 연합 (신인양성)",latinName:"Unio Hypostatica",type:"doctrine",tradition:"Patristic",startYear:451,eraDescription:"정통 기독론 교리",location:"칼케돈 / 알렉산드리아 / 안디옥",summary:"예수 그리스도는 온전한 참 하나님이시며 온전한 참 인간이시며, 신성과 인성이라는 두 본성이 혼합되거나 변화되거나 분할되거나 분리됨 없이 성자 하나님의 한 신적 위격 안에 연합되어 계십니다.",majorWorks:["칼케돈 신조 정의","키릴로스의 12개 조항","레오의 서한"],keyScriptures:[{ref:"요한복음 1:14",text:"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라"},{ref:"골로새서 1:19",text:"아버지께서는 모든 충만으로 예수 안에 거하게 하시고"}],quote:"참 하나님이시요 참 인간이시도다 (Vere Deus, vere homo).",importance:5},{id:"doc_divine_simplicity",name:"하나님의 단순성 (신적 단일성)",latinName:"Simplicitas Dei",type:"doctrine",tradition:"Scholastic",startYear:400,eraDescription:"고전적 유일신론 형이상학",location:"히포 / 파리 / 로마",summary:"하나님은 부분들이나 속성들의 조합으로 구성되어 계시지 않으며, 하나님의 존재와 본질, 지혜와 사랑 등 모든 속성은 곧 하나님 자신과 온전히 일치한다는 고전 기독교 신론의 핵심 원리입니다.",majorWorks:["토마스 아퀴나스 신학대전 제1부 제3문","아우구스티누스 삼위일체론","투레틴 변증신학강요"],keyScriptures:[{ref:"신명기 6:4",text:"이스라엘아 들으라 우리 하나님 여호와는 오직 유일한 여호와이시니"},{ref:"요한일서 1:5",text:"하나님은 빛이시라 그에게는 어둠이 조금도 없으시다는 것이니라"}],quote:"하나님 안에 있는 모든 것은 곧 하나님 자신이다.",importance:4},{id:"doc_penal_substitution",name:"형벌 대속적 속죄론",latinName:"Satisfactio Vicaria / Expiatio Christi",type:"doctrine",tradition:"Reformed",startYear:1098,eraDescription:"구원론의 핵심 구속 교리",location:"캔터베리 / 비텐베르크 / 제네바",summary:"그리스도께서 십자가에서 죄인들을 대신하여 하나님의 공의가 요구하는 죄의 형벌과 진노를 온전히 짊어지심으로써 하나님과 우리를 화목하게 하셨다는 성경적 구속의 핵심 교리입니다.",majorWorks:["안셀무스 왜 하나님은 사람이 되셨는가","존 오웬 그리스도의 죽음 안에서의 죽음의 죽음","칼뱅 기독교 강요 2권 16장"],keyScriptures:[{ref:"이사야 53:6",text:"우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다"},{ref:"고린도후서 5:21",text:"하나님이 죄를 알지도 못하신 이를 우리를 대신하여 죄로 삼으신 것은 우리로 하여금 그 안에서 하나님의 의가 되게 하려 하심이라"}],quote:"우리를 대신하신 그리스도 (Christus pro nobis).",importance:5},{id:"doc_sola_fide",name:"이신칭의 (오직 믿음으로 말미암는 칭의)",latinName:"Sola Fide (교회의 존폐가 걸린 조항)",type:"doctrine",tradition:"Lutheran",startYear:1517,eraDescription:"종교개혁의 본질적 내용 원리",location:"비텐베르크 / 제네바",summary:"죄인이 하나님 앞에서 의롭다 인정받는 것은 자신의 공로나 행위 때문이 아니라, 오직 믿음으로 그리스도의 온전한 전가된 의를 덧입음으로써 은혜로 주어진다는 교리입니다.",majorWorks:["루터 그리스도인의 자유","칼뱅 기독교 강요 3권 11장","아우크스부르크 신앙고백서 제4조"],keyScriptures:[{ref:"로마서 4:5",text:"일을 아니할지라도 경건하지 아니한 자를 의롭다 하시는 이를 믿는 자에게는 그의 믿음을 의로 여기시나니"},{ref:"빌립보서 3:9",text:"내가 가진 의는 율법에서 난 것이 아니요 오직 그리스도를 믿음으로 말미암은 것이니 곧 믿음으로 하나님께로부터 난 의라"}],quote:"이 조항에 교회의 서고 넘어짐이 달려 있다.",importance:5},{id:"doc_total_depravity",name:"전적 타락 및 주권적 은혜",latinName:"Corruptio Totius Naturae",type:"doctrine",tradition:"Reformed",startYear:412,eraDescription:"아우구스티누스 및 개혁파 인간론",location:"히포 / 제네바 / 도르트",summary:"타락한 인간은 지성, 감정, 의지를 포함한 전 인격이 죄로 인해 철저히 부패하여 영적으로 죽은 상태에 있으며, 오직 성령의 단독적인 중생 은혜 없이는 스스로 하나님을 택할 수 없다는 교리입니다.",majorWorks:["아우구스티누스 그리스도의 은혜와 원죄론","루터 노예의지론","도르트 신조 제3/4교리"],keyScriptures:[{ref:"에베소서 2:1",text:"그는 허물과 죄로 죽었던 너희를 살리셨도다"},{ref:"예레미야 17:9",text:"만물보다 거짓되고 심히 부패한 것은 마음이라 누가 능히 이를 알리요마는"}],quote:"죄를 짓지 않을 수 없는 상태 (Non posse non peccare).",importance:5}],edges:[{id:"e1",source:"athanasius",target:"council_nicaea",relation:"formulated",description:"호모우시오스(동일본질) 변증 및 니케아 신학의 기틀 제정",contextYear:325},{id:"e2",source:"athanasius",target:"doc_trinity",relation:"formulated",description:"성자의 영원한 출생 및 완전한 신성 신학 논증",contextYear:325},{id:"e3",source:"council_nicaea",target:"doc_trinity",relation:"formulated",description:"니케아 삼위일체 정통 신앙 조항 선포",contextYear:325},{id:"e4",source:"irenaeus",target:"athanasius",relation:"influenced",description:"이레나이우스의 총괄갱신론이 아타나시우스의 성육신론에 심대한 영향",contextYear:310},{id:"e5",source:"augustine",target:"doc_trinity",relation:"formulated",description:"《삼위일체론》에서 심리학적 삼위일체 모델 및 사랑의 유비 제시",contextYear:400},{id:"e6",source:"augustine",target:"doc_total_depravity",relation:"formulated",description:"펠라기우스주의 논쟁에서 원죄론과 인간 의지의 노예성 정립",contextYear:412},{id:"e7",source:"augustine",target:"doc_divine_simplicity",relation:"formulated",description:"하나님의 속성과 신적 본질의 완전한 일치성 논증",contextYear:410},{id:"e8",source:"council_chalcedon",target:"doc_hypostatic_union",relation:"formulated",description:"신인양성의 혼합·변화·분할·분리 없는 한 위격적 연합 선언",contextYear:451},{id:"e9",source:"athanasius",target:"council_chalcedon",relation:"influenced",description:"아타나시우스의 정통 기독론이 칼케돈 정의의 핵심 토대 형성",contextYear:451},{id:"e10",source:"augustine",target:"anselm",relation:"influenced",description:"이해를 추구하는 신앙(Credo ut intelligam) 방법론 계승",contextYear:1070},{id:"e11",source:"anselm",target:"doc_penal_substitution",relation:"formulated",description:"《왜 하나님은 사람이 되셨는가》에서 구속 만족설 정초",contextYear:1098},{id:"e12",source:"augustine",target:"aquinas",relation:"influenced",description:"은총론, 삼위일체론, 신적 예정에 관한 아우구스티누스 사상 종합",contextYear:1250},{id:"e13",source:"aquinas",target:"doc_divine_simplicity",relation:"formulated",description:"《신학대전》에서 순수현실태(Actus Purus)와 신적 단순성 엄밀 논증",contextYear:1265},{id:"e14",source:"scotus",target:"aquinas",relation:"opposed",description:"존재의 일의성
