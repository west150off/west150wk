/**
 * Robust helper to trigger file downloads in all browser and iframe environments.
 * Appends link to document.body before click and cleans up asynchronously.
 */
function triggerBlobDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    link.style.position = 'fixed';
    link.style.left = '-9999px';
    link.style.top = '-9999px';
    link.style.opacity = '0';
    document.body.appendChild(link);
    try {
        link.click();
    }
    catch (e) {
        console.error('Link click failed, attempting window.open as fallback:', e);
        window.open(url, '_blank');
    }
    setTimeout(() => {
        try {
            if (document.body.contains(link)) {
                document.body.removeChild(link);
            }
            URL.revokeObjectURL(url);
        }
        catch (e) {
            // ignore
        }
    }, 2000);
}
/**
 * Robust helper to trigger Base64 Data URL downloads.
 */
function triggerDataUrlDownload(dataUrl, fileName) {
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = fileName.endsWith('.png') ? fileName : `${fileName}.png`;
    link.style.position = 'fixed';
    link.style.left = '-9999px';
    link.style.top = '-9999px';
    link.style.opacity = '0';
    document.body.appendChild(link);
    try {
        link.click();
    }
    catch (e) {
        console.error('DataURL link click failed:', e);
    }
    setTimeout(() => {
        try {
            if (document.body.contains(link)) {
                document.body.removeChild(link);
            }
        }
        catch (e) {
            // ignore
        }
    }, 1000);
}
/**
 * Downloads a single slide DOM element as high-resolution PNG (2x scale for Retina)
 * Skips font network crawling to ensure instant rendering (sub-100ms) and prevents hangs/timeouts.
 */
async function downloadSlideAsImage(element, fileName) {
    const safeFileName = fileName.endsWith('.png') ? fileName : `${fileName}.png`;
    const width = element.offsetWidth || 540;
    const height = element.offsetHeight || 675;
    try {
        // Attempt 1: Fast direct Blob export with skipFonts (instant & memory efficient)
        const blob = await toBlob(element, {
            pixelRatio: 2.0,
            quality: 0.98,
            cacheBust: false,
            skipFonts: true,
            fontEmbedCSS: '',
            width,
            height,
            style: {
                transform: 'none',
                margin: '0',
            }
        });
        if (blob) {
            triggerBlobDownload(blob, safeFileName);
            return true;
        }
    }
    catch (err1) {
        console.warn('Fast toBlob failed, attempting toPng fallback:', err1);
    }
    try {
        // Attempt 2: toPng DataURL fallback
        const dataUrl = await toPng(element, {
            pixelRatio: 2.0,
            quality: 0.98,
            cacheBust: false,
            skipFonts: true,
            fontEmbedCSS: '',
            width,
            height,
            style: {
                transform: 'none',
                margin: '0',
            }
        });
        if (dataUrl) {
            triggerDataUrlDownload(dataUrl, safeFileName);
            return true;
        }
    }
    catch (err2) {
        console.error('All PNG export methods failed:', err2);
        throw new Error('이미지 렌더링에 실패했습니다. 브라우저 설정을 확인해 주세요.');
    }
    return false;
}
/**
 * Copies the rendered slide directly into clipboard as image/png
 */
async function copySlideImageToClipboard(element) {
    const width = element.offsetWidth || 540;
    const height = element.offsetHeight || 675;
    try {
        const blob = await toBlob(element, {
            pixelRatio: 2.0,
            quality: 0.95,
            cacheBust: false,
            skipFonts: true,
            fontEmbedCSS: '',
            width,
            height,
            style: {
                transform: 'none',
                margin: '0',
            }
        });
        if (blob && navigator.clipboard && typeof navigator.clipboard.write === 'function') {
            await navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
            ]);
            return true;
        }
    }
    catch (err) {
        console.warn('Clipboard write failed:', err);
    }
    return false;
}

/**
 * Batch renders all slides into a ZIP archive for easy Instagram carousel upload
 */
async function exportAllSlidesAsZip(doc, renderSlideCallback, onProgress) {
    const zip = new JSZip();
    const total = doc.slides.length;
    const folderName = (doc.title || 'Theology_Notes').replace(/[\\/:*?"<>|]/g, '_').substring(0, 30);
    const folder = zip.folder(folderName) || zip;
    for (let i = 0; i < total; i++) {
        if (onProgress)
            onProgress(i + 1, total);
        const slideElement = await renderSlideCallback(i);
        if (!slideElement)
            continue;
        // Small delay to ensure React DOM state has flushed
        await new Promise((res) => setTimeout(res, 80));
        const width = slideElement.offsetWidth || 540;
        const height = slideElement.offsetHeight || 675;
        let blob = null;
        try {
            blob = await toBlob(slideElement, {
                pixelRatio: 2.0,
                quality: 0.95,
                cacheBust: false,
                skipFonts: true,
                fontEmbedCSS: '',
                width,
                height,
                style: {
                    transform: 'none',
                    margin: '0',
                }
            });
        }
        catch (e) {
            console.warn(`Slide ${i + 1} capture error:`, e);
        }
        if (blob) {
            const slideNum = String(i + 1).padStart(2, '0');
            const slideType = doc.slides[i].type;
            folder.file(`slide_${slideNum}_${slideType}.png`, blob);
        }
    }
    // Also include a text file with formatted Instagram/Threads captions
    const captionText = generateSocialCaption(doc);
    folder.file('instagram_threads_caption.txt', captionText);
    // Also include full JSON source document
    folder.file('doc_backup.json', JSON.stringify(doc, null, 2));
    const content = await zip.generateAsync({ type: 'blob' });
    triggerBlobDownload(content, `${folderName}_carousel_pack.zip`);
}
/**
 * Creates formatted caption text tailored for Instagram & Threads
 */
function generateSocialCaption(doc) {
    const lines = [];
    // Header & Title
    lines.push(`📖 ${doc.title}`);
    if (doc.seriesName)
        lines.push(`[${doc.seriesName}]`);
    lines.push('');
    // Slides Summary
    doc.slides.forEach((slide, idx) => {
        lines.push(`──────── ${idx + 1}/${doc.slides.length} ────────`);
        if (slide.slideTitle)
            lines.push(`■ ${slide.slideTitle}`);
        if (slide.subtitle)
            lines.push(`- ${slide.subtitle}`);
        if (slide.scriptureVerse) {
            lines.push(`\n📜 "${slide.scriptureVerse.text}" (${slide.scriptureVerse.ref} ${slide.scriptureVerse.translation})`);
        }
        if (slide.theologyQuote) {
            lines.push(`\n💬 "${slide.theologyQuote.quote}"`);
            lines.push(`  — ${slide.theologyQuote.author}${slide.theologyQuote.work ? ` (${slide.theologyQuote.work})` : ''}`);
        }
        if (slide.originalWords && slide.originalWords.length > 0) {
            lines.push('\n🔍 [원어 묵상]');
            slide.originalWords.forEach(w => {
                lines.push(`• ${w.original} (${w.transliteration}): ${w.meaning}`);
            });
        }
        if (slide.bodyText) {
            lines.push(`\n${slide.bodyText}`);
        }
        if (slide.bulletPoints && slide.bulletPoints.length > 0) {
            lines.push('\n[핵심 요약]');
            slide.bulletPoints.forEach(p => lines.push(`• ${p}`));
        }
        lines.push('');
    });
    // Footer & Hashtags
    lines.push('───────────────────────');
    lines.push(`✍️ 작성: ${doc.authorName} (${doc.authorHandle})`);
    lines.push('📌 슬라이드를 넘겨 전체 내용을 확인해 보세요.');
    lines.push('');
    lines.push('#신학 #신학노트 #기독교 #성경묵상 #QT #신학생 #말씀묵상 #조직신학 #성경주해 #기독교고전 #인스타카드뉴스 #스레드 #Theology #ReformedTheology');
    return lines.join('\n');
}

            <div class="doc-quote-box">
              <div style="font-size: 15px; line-height: 1.6; margin-bottom: 10px;">"${escapeHtml(s.theologyQuote.quote)}"</div>
              <div style="font-size: 13px; color: #5C5A4E; font-weight: bold;">
                — ${escapeHtml(s.theologyQuote.author)} ${s.theologyQuote.work ? `『${escapeHtml(s.theologyQuote.work)}』` : ''}

                <div class="doc-word-card">
                  <div class="doc-word-orig">${escapeHtml(w.original)}</div>
                  <div style="font-size: 12px; color: #7A786F; margin-bottom: 6px;">${escapeHtml(w.transliteration)} [${w.language === 'greek' ? '신약 헬라어' : w.language === 'hebrew' ? '구약 히브리어' : '라틴어'}]</div>

  <script>
    // Embedded Document State
    const docData = ${JSON.stringify(doc)};
    let currentIndex = 0;

    function renderSlide(index) {
      const slide = docData.slides[index];
      if (!slide) return;

      const stage = document.getElementById('slide-stage');
      const isCover = slide.type === 'cover';

      let innerHtml = \`
        <div class="slide-header">
          <div>
            <div class="slide-header-series">\${slide.tagline || (docData.seriesName ? docData.seriesName + ' · NO. ' + String(index + 1).padStart(2, '0') : 'THEOLOGY NOTE')}</div>
            \${docData.category ? \`<span class="slide-header-badge">\${docData.category}</span>\` : ''}
          </div>
          <div class="slide-header-num">NO. \${String(index + 1).padStart(2, '0')} / \${String(totalSlides).padStart(2, '0')}</div>
        </div>

        <div class="slide-body-center">
          <h2 class="\${isCover ? 'slide-title-cover' : 'slide-title-standard'}">\${slide.slideTitle || ''}</h2>
          \${slide.subtitle ? \`<div class="slide-subtitle">\${slide.subtitle}</div>\` : ''}
          \${isCover || slide.type === 'scripture-focus' || slide.type === 'quote-focus' ? '<div class="slide-accent-divider"></div>' : ''}

          \${slide.scriptureVerse ? \`
            <div class="slide-verse-box">
              "\${slide.scriptureVerse.text}"
              <div class="slide-verse-ref">— \${slide.scriptureVerse.ref} (\${slide.scriptureVerse.translation || ''})</div>
            </div>
          \` : ''}

          \${slide.theologyQuote ? \`
            <div class="slide-quote-box">
              "\${slide.theologyQuote.quote}"
              <div class="slide-quote-author">
                <span>\${slide.theologyQuote.author}</span>
                \${slide.theologyQuote.work ? \`<span>『\${slide.theologyQuote.work}』</span>\` : ''}
              </div>
            </div>
          \` : ''}

          \${slide.originalWords && slide.originalWords.length > 0 ? \`
            <div class="slide-word-grid">
              \${slide.originalWords.map(w => \`
                <div class="slide-word-card">
                  <div class="slide-word-orig">\${w.original}</div>
                  <span class="slide-word-lang">\${w.transliteration} [\${w.language === 'greek' ? '헬라어' : '히브리어'}]</span>
                  <div class="slide-word-mean">\${w.meaning}</div>
                  \${w.note ? \`<div style="font-size: 10px; color: var(--muted-text); margin-top: 4px;">* \${w.note}</div>\` : ''}
                </div>
              \`).join('')}
            </div>
          \` : ''}

          \${slide.bodyText ? \`<p class="slide-body-paragraph">\${slide.bodyText}</p>\` : ''}

          \${slide.bulletPoints && slide.bulletPoints.length > 0 ? \`
            <ul class="slide-bullets">
              \${slide.bulletPoints.map(bp => \`<li>\${bp}</li>\`).join('')}
            </ul>
          \` : ''}

          \${slide.reflectionPrompt ? \`
            <div class="slide-reflection">
              <strong>묵상 질문:</strong> \${slide.reflectionPrompt}
            </div>
          \` : ''}
        </div>

        <div class="slide-footer">
          <div>
            <div class="slide-footer-label">Date</div>
            <div class="slide-footer-val">\${docData.updatedAt || '2024. 05. 24'}</div>

          <div style="text-align: right;">
            <div class="slide-footer-label">Series</div>
            <div class="slide-footer-val">\${docData.seriesName || docData.authorHandle || 'Meditations on Scripture'}</div>

        </div>

      document.getElementById('dock-counter').innerText = (index + 1) + ' / ' + totalSlides;
      document.getElementById('btn-prev').disabled = (index === 0);

      const dotsContainer = document.getElementById('dock-dots-container');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('div');
        dot.className = 'dock-dot ' + (i === index ? 'active' : '');
        dot.onclick = () => goToSlide(i);
        dotsContainer.appendChild(dot);
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentIndex = index;
        renderSlide(currentIndex);
      }
    }

    function nextSlide() {
      if (currentIndex < totalSlides - 1) {
        goToSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    function switchView(mode) {
      const carouselSec = document.getElementById('slide-carousel-section');
      const docSec = document.getElementById('doc-reading-section');
      const btnSlide = document.getElementById('btn-mode-slide');
      const btnDoc = document.getElementById('btn-mode-doc');

      if (mode === 'slide') {
        carouselSec.style.display = 'flex';
        docSec.style.display = 'none';
        btnSlide.classList.add('active');
        btnDoc.classList.remove('active');
      } else {
        carouselSec.style.display = 'none';
        docSec.style.display = 'block';
        btnSlide.classList.remove('active');
        btnDoc.classList.add('active');
      }
    }

    // Keyboard Arrow navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Touch swipe navigation for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    const stageCard = document.getElementById('slide-stage');
    stageCard.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    stageCard.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) {
        nextSlide(); // swipe left -> next
      } else if (touchEndX - touchStartX > 50) {
        prevSlide(); // swipe right -> prev
      }
    }, { passive: true });

    // Initial render
    renderSlide(0);
  <\/script>
</body>
</html>`;

    if (!str)

        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

        React.createElement(TheologyWordPickerModal, { isOpen: isWordPickerOpen, onClose: () => setIsWordPickerOpen(false), onSelectWord: handleInsertWord }),
        React.createElement(TheologianQuoteModal, { isOpen: isQuotePickerOpen, onClose: () => setIsQuotePickerOpen(false), onSelectQuote: handleInsertQuote }),
        React.createElement(TemplatePickerModal, { isOpen: isTemplateModalOpen, onClose: () => setIsTemplateModalOpen(false), onSelectTemplate: (tpl) => {
                setDoc(tpl);
                setActiveSlideIndex(0);
                showToast(`'${tpl.title}' 템플릿을 불러왔습니다.`);
            } })));
}
const rootEl = document.getElementById('root');
rootEl.innerHTML = '';
createRoot(rootEl).render(React.createElement(React.StrictMode, null, React.createElement(App)));
</script>
