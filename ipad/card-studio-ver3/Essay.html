sDark:!0,bgHex:"#0F0F10",textHex:"#F3F4F6"}],P0=[{id:"yellow",name:"파스텔 옐로우",bg:"rgba(255, 235, 59, 0.45)",border:"#FBC02D"},{id:"mint",name:"세이지 민트",bg:"rgba(167, 243, 208, 0.55)",border:"#34D399"},{id:"pink",name:"블러셔 핑크",bg:"rgba(251, 207, 232, 0.6)",border:"#F472B6"},{id:"lavender",name:"라벤더 퍼플",bg:"rgba(221, 214, 254, 0.6)",border:"#A78BFA"},{id:"coral",name:"소프트 코랄",bg:"rgba(254, 215, 170, 0.6)",border:"#FB923C"}],Os={classic_book:{id:"preset_classic_book",ratio:"4:5",templateId:"classic_book",texture:"classic_book",bgImage:{url:"",overlayOpacity:.1,blur:0,grayscale:!1,contrast:1,brightness:1},typography:{fontFamily:"ridi",titleFontFamily:"ridi",fontSize:32,titleSize:52,lineHeight:1.85,letterSpacing:-.02,paragraphSpacing:32,textAlign:"left",textColor:"#2C2621",titleColor:"#171412",accentColor:"#8C6239",highlightColor:"yellow",autoFit:!0,padding:96},byline:{showSignature:!0,authorName:"에디터 서연",instagramHandle:"@west150daily",categoryOrIssue:"ESSAY ARCHIVE · VOL. 04",dateString:"2026. 08. 29",customStampText:"WEST150 STUDIO"},content:{title:"우리가 침묵을 견디지 못하는 이유",subtitle:"소란스러운 세상 속에서 나만의 고요한 방을 짓는 연습",bodyText:`하루의 끝에 가만히 앉아 창밖의 불빛을 바라볼 때, 우리는 비로소 알게 됩니다. 

==진짜 중요한 생각은 소음이 멈춘 자리에서만 피어난다==는 것을요. 끊임없이 알림이 울리는 세상에서 잠시 연결을 끊는 일은 고립이 아니라 스스로를 온전히 회복하는 가장 능동적인 쉼입니다.

__오늘 하루, 당신의 마음에 고요한 여백을 한 조각 건네어 보세요.__ 사소한 산책길에 스치는 바람, 찻잔 위에 피어오르는 온기 속에서 잊고 지냈던 내면의 목소리가 들려옵니다.`,quoteText:"“고독은 외로움이 아니다. 그것은 온전한 나와 마주하는 가장 다정한 시간이다.”"}},editorial_column:{id:"preset_editorial_column",ratio:"4:5",templateId:"editorial_column",texture:"paper_clean",bgImage:{url:"",overlayOpacity:.1,blur:0,grayscale:!1,contrast:1,brightness:1},typography:{fontFamily:"chosun",titleFontFamily:"chosun",fontSize:30,titleSize:58,lineHeight:1.75,letterSpacing:-.03,paragraphSpacing:28,textAlign:"justify",textColor:"#1A1B1E",titleColor:"#0A0A0C",accentColor:"#B93826",highlightColor:"coral",autoFit:!0,padding:90},byline:{showSignature:!0,authorName:"WEST150 칼럼니스트",instagramHandle:"@west150daily",categoryOrIssue:"CULTURE & PERSPECTIVE · NO. 88",dateString:"2026. 08. 29",customStampText:"EDITORIAL DESK"},content:{title:"속도의 시대, 느리게 걷는 이들의 권리",subtitle:"효율이라는 잣대로 재단할 수 없는 삶의 본질적 가치들에 관하여",bodyText:`모든 것이 즉각적으로 배달되고 단 15초 안에 승부가 갈리는 숏폼의 시대다. 사람들은 더 빠른 결론, 더 짧은 요약만을 갈구한다.

그러나 ==깊은 사유와 예술적 통찰은 오직 지체되는 시간 속에서만 발효된다.== 

우리가 책장을 천천히 넘기며 행간을 음미하고, 미술관의 단 하나의 그림 앞에 서서 30분을 보낼 때 느끼는 지적 충만함은 그 어떤 알고리즘 추천도 흉내 낼 수 없다. 속도에 쫓기지 않고 나만의 리듬으로 세상을 응시할 용기가 지금 우리에게 절실하다.`,quoteText:"효율의 극단에서 우리가 놓치고 있는 것은 결국 인간다운 사유의 기쁨이다."}},minimal_poem:{id:"preset_minimal_poem",ratio:"9:16",templateId:"minimal_poem",texture:"soft_beige",bgImage:{url:"",overlayOpacity:.05,blur:0,grayscale:!1,contrast:1,brightness:1},typography:{fontFamily:"maruburi",titleFontFamily:"maruburi",fontSize:38,titleSize:46,lineHeight:2.1,letterSpacing:-.01,paragraphSpacing:40,textAlign:"center",textColor:"#2E2822",titleColor:"#1C1814",accentColor:"#7A624E",highlightColor:"mint",autoFit:!0,padding:110},byline:{showSignature:!0,authorName:"시인 유진",instagramHandle:"@west150daily",categoryOrIssue:"MIDNIGHT POEM · 09:16 STORY",dateString:"2026. 08. 29",customStampText:"POETRY NOTE"},content:{title:"여름의 끝자락에서",subtitle:"지나가는 계절의 옷자락을 붙잡지 않기로 했다",poemVerse:`어떤 말은 바람결에 흩어지고
어떤 침묵은 가슴속 깊이 뿌리를 내린다.

==그저 곁에 있어 주는 것만으로도==
충분한 온기가 되는 계절이 오고 있다.

__우리가 서로의 이름을 가만히 부를 때__
세상은 비로소 다정해진다.`,poemAuthor:"— 유진, 『바람이 머무는 자리』 중에서",bodyText:""}},book_cover:{id:"preset_book_cover",ratio:"4:5",templateId:"book_cover",texture:"dark_slate",bgImage:{url:"https://images.unsplash.com/photo-1516962215378-7fa2e137ae93?auto=format&fit=crop&w=1200&q=80",overlayOpacity:.7,blur:2,grayscale:!0,contrast:1.1,brightness:.9},typography:{fontFamily:"ridi",titleFontFamily:"cinzel",fontSize:28,titleSize:74,lineHeight:1.65,letterSpacing:.04,paragraphSpacing:24,textAlign:"center",textColor:"#EAEAEA",titleColor:"#FFFFFF",accentColor:"#D4AF37",highlightColor:"yellow",autoFit:!0,padding:100},byline:{showSignature:!0,authorName:"WEST150 SPECIAL EDITION",instagramHandle:"@west150daily",categoryOrIssue:"ESSAY COLLECTION · ISSUE 12",dateString:"2026. AUTUMN",customStampText:"CURATED ESSAY"},content:{title:"THE ART OF STILLNESS",subtitle:"아무것도 하지 않는 시간의 숭고함과 미학",bodyText:`멈춤이란 포기가 아니다.
더 멀리 바라보기 위해 숨을 고르는 
가장 지혜로운 찰나의 예술이다.`,quoteText:"A COLLECTION OF REFLECTIONS ON CONTEMPORARY SOLITUDE"}},interview_dialogue:{id:"preset_interview_dialogue",ratio:"4:5",templateId:"interview_dialogue",texture:"paper_warm",bgImage:{url:"",overlayOpacity:.1,blur:0,grayscale:!1,contrast:1,brightness:1},typography:{fontFamily:"pretendard",titleFontFamily:"maruburi",fontSize:28,titleSize:48,lineHeight:1.8,letterSpacing:-.02,paragraphSpacing:28,textAlign:"left",textColor:"#27292D",titleColor:"#111315",accentColor:"#2B5A8F",highlightColor:"mint",autoFit:!0,padding:85},byline:{showSignature:!0,authorName:"인터뷰어 민우 & 건축가 한결",instagramHandle:"@west150daily",categoryOrIssue:"TALK & DIALOGUE · EP. 24",dateString:"2026. 08. 29",customStampText:"DIALOGUE"},content:{title:"공간이 사람의 마음을 빚어내는 방식",subtitle:"자연을 담은 건축을 짓는 한결 소장과의 대화",quoteText:"“빛이 들어오는 창 하나가 한 사람의 하루를 완전히 구원할 수도 있습니다.”",interviewQnA:[{speakerQ:"Q. 에디터",q:"좋은 집이란 어떤 공간이라고 생각하시나요?",speakerA:"A. 한결",a:"화려한 자재보다 중요한 건 ==머무는 사람의 호흡이 편안해지는 여백==입니다. 바람길과 햇살의 궤적을 배려한 공간은 그 자체로 치유가 됩니다."},{speakerQ:"Q. 에디터",q:"도시인들에게 추천하고 싶은 나만의 작은 공간 팁이 있다면요?",speakerA:"A. 한결",a:"__아침마다 10분씩 멍하니 하늘을 볼 수 있는 작은 의자 하나__만 두어도 삶의 결이 확연히 달라집니다."}],bodyText:""}},manuscript_grid:{id:"preset_manuscript_grid",ratio:"1:1",templateId:"manuscript_grid",texture:"manuscript",bgImage:{url:"",overlayOpacity:.1,blur:0,grayscale:!1,contrast:1,brightness:1},typography:{fontFamily:"ridi",titleFontFamily:"ridi",fontSize:32,titleSize:50,lineHeight:1.9,letterSpacing:.01,paragraphSpacing:30,textAlign:"left",textColor:"#291C14",titleColor:"#1A0E08",accentColor:"#A44A29",highlightColor:"yellow",autoFit:!0,padding:90},byline:{showSignature:!0,authorName:"원고지 산문집",instagramHandle:"@west150daily",categoryOrIssue:"MANUSCRIPT 200자 · NO. 15",dateString:"2026. 08. 29",customStampText:"200자 원고"},content:{title:"기억의 서랍을 여는 밤",subtitle:"낡은 연필로 꾹꾹 눌러쓴 소박한 문장들",bodyText:`칸칸이 메워지는 글자들 사이로
그 시절 우리가 나누었던 말들이 스며든다.

==지우개로 지워도 자국이 남는 연필 자국처럼==
어떤 인연은 아무리 세월이 흘러도
마음의 결 위에 선명한 온기를 남긴다.

__그 따뜻했던 시절의 우리에게 안부를 전한다.__`,quoteText:"지나간 계절은 사라지지 않고 마음속 서랍에 켜켜이 쌓여간다."}},photo_fusion:{id:"preset_photo_fusion",ratio:"9:16",templateId:"photo_fusion",texture:"photo_custom",bgImage:{url:"https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1200&q=80",overlayOpacity:.45,blur:1,grayscale:!0,contrast:1.15,brightness:.85},typography:{fontFamily:"gowun_batang",titleFontFamily:"cinzel",fontSize:34,titleSize:54,lineHeight:1.85,letterSpacing:-.01,paragraphSpacing:34,textAlign:"center",textColor:"#FFFFFF",titleColor:"#FFFFFF",accentColor:"#F3C98B",highlightColor:"coral",autoFit:!0,padding:95},byline:{showSignature:!0,authorName:"WEST150 MOOD ARCHIVE",instagramHandle:"@west150daily",categoryOrIssue:"CINEMATIC STORY · VOL. 7",dateString:"2026. 08. 29",customStampText:"STORY SCENE"},content:{title:"RAINY DAY REFLECTIONS",subtitle:"빗소리가 세상의 불필요한 소음을 씻어내릴 때",bodyText:`유리창을 두드리는 빗방울 소리를 들으며
따뜻한 차 한 잔을 손에 쥡니다.

==세상이 잠시 멈춘 듯한 이 찰나의 순간==
우리는 비로소 온전한 자신과 마주하게 됩니다.
