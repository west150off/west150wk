<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X TODAY 큐레이션 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Pretendard:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  :root{
    --bg-app:#0d0d0f;
    --panel:#17171a;
    --panel-2:#1e1e22;
    --line:#2a2a2f;
    --text:#e7e2d6;
    --text-dim:#8d897f;
    --card-bg:#0a0a0b;
    --cream:#f2ede1;
    --gold:#c9a961;
    --gold-dim:#8f7a49;
    --maroon:#7a1d24;
    --maroon-bright:#a3272f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-app);
    color:var(--text);
    font-family:'Pretendard',sans-serif;
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:380px 1fr;
    min-height:100vh;
  }
  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .preview-col{order:-1;}
  }

  /* ---------- Left panel ---------- */
  .panel{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:20px 18px 100px;
    overflow-y:auto;
    max-height:100vh;
  }
  @media (max-width:900px){ .panel{max-height:none;} }
  .brand{
    display:flex; align-items:center; gap:8px;
    margin-bottom:18px;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--maroon-bright);}
  .brand h1{
    font-size:14px; letter-spacing:.12em; margin:0;
    font-family:'Oswald',sans-serif; text-transform:uppercase; color:var(--gold);
  }
  .section{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .section h2{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); margin:0 0 12px; font-family:'Oswald',sans-serif; font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .field{margin-bottom:10px;}
  .field label{
    display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px;
    letter-spacing:.02em;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select{
    width:100%;
    background:#0e0e10;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 9px;
    font-size:13px;
    font-family:inherit;
    resize:vertical;
  }
  .field textarea{min-height:56px; line-height:1.4;}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--gold-dim);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--maroon); color:#f2ede1;
    border:none; border-radius:6px;
    padding:9px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:'Pretendard',sans-serif;
    transition:background .15s;
    width:100%;
  }
  .btn:hover{background:var(--maroon-bright);}
  .btn.secondary{
    background:#26262b; color:var(--text);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{background:#2f2f35;}
  .btn.ghost{
    background:transparent; border:1px dashed var(--line); color:var(--text-dim);
  }
  .btn.small{padding:6px 9px; font-size:11.5px;}
  .btn.danger{background:transparent; color:#c96a6a; border:1px solid #4a2323;}
  .btn.danger:hover{background:#241414;}

  .imgdrop{
    border:1px dashed var(--line);
    border-radius:6px;
    padding:10px;
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    cursor:pointer;
    background:#0e0e10;
  }
  .imgdrop:hover{border-color:var(--gold-dim);}
  .imgdrop.has-img{color:var(--gold);}
  .hidden-file{display:none;}

  .story-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:#141417;
  }
  .story-block .story-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px;
  }
  .story-block .story-head span{
    font-size:11px; color:var(--gold-dim); font-family:'Oswald',sans-serif; letter-spacing:.06em;
  }

  .theme-swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{
    width:38px;height:38px;border-radius:8px;cursor:pointer;
    border:2px solid transparent; position:relative; flex:none;
  }
  .swatch.active{border-color:var(--gold);}
  .swatch span{
    position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    font-size:9px; color:var(--text-dim); white-space:nowrap;
  }

  .divider{height:1px;background:var(--line); margin:14px 0;}

  .footer-actions{
    position:sticky; bottom:0; left:0; right:0;
    background:var(--panel);
    padding-top:12px; margin-top:6px;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ---------- Right preview column ---------- */
  .preview-col{
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 24px;
    overflow:auto;
  }
  .canvas-wrap{
    transform-origin:top center;
  }

  #card{
    width:1000px;
    background:var(--card-bg);
    color:var(--cream);
    position:relative;
    padding:56px 60px 40px;
    font-family:'Pretendard',sans-serif;
  }
  #card.serif-heavy .headline{font-family:'Noto Serif KR',serif;}

  .masthead-top{
    display:flex; justify-content:flex-end; margin-bottom:10px;
  }
  .masthead-handle{
    font-size:13px; color:var(--text-dim); letter-spacing:.02em;
  }
  .masthead{
    text-align:center;
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    letter-spacing:.06em;
    color:var(--cream);
    margin:0 0 18px;
    line-height:1;
    white-space:nowrap;
  }
  .masthead-rule{
    border:none; border-top:1px solid var(--maroon-bright);
    margin:0 0 14px;
  }
  .masthead-sub{
    text-align:center;
    font-size:15px;
    color:var(--text-dim);
    letter-spacing:.03em;
    margin:0 0 30px;
    font-family:'Pretendard',sans-serif;
  }
  .masthead-sub b{color:var(--cream); font-weight:600;}

  .main-story{
    display:grid;
    grid-template-columns:1fr 420px;
    gap:36px;
    align-items:center;
    padding-bottom:36px;
    border-bottom:1px solid var(--maroon-bright);
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:.14em;
    color:var(--maroon-bright);
    font-weight:600;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .headline{
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    font-size:52px;
    line-height:1.18;
    color:var(--cream);
    margin:0 0 16px;
    white-space:pre-wrap;
  }
  .body-text{
    font-size:16px;
    line-height:1.65;
    color:#cfc9ba;
    margin:0 0 16px;
    white-space:pre-wrap;
  }
  .source-tag{
    font-size:13px;
    color:var(--text-dim);
  }
  .source-tag b{color:var(--gold); font-weight:600;}

  .art-box{
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    position:relative;
    background:#111113;
  }
  .art-box img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .art-box .art-placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:#3d3d42; font-size:13px; text-align:center; padding:20px;
  }
  .art-box .stat-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    font-size:110px;
    color:rgba(242,237,225,.9);
    text-shadow:0 4px 24px rgba(0,0,0,.6);
    pointer-events:none;
  }

  .sub-grid{
    display:grid;
    gap:0;
  }
  .sub-story{
    padding:0 30px;
    position:relative;
  }
  .sub-story:not(:first-child){
    border-left:1px solid var(--line);
  }
  .sub-story:first-child{padding-left:0;}
  .sub-story:last-child{padding-right:0;}
  .sub-headline{
    font-family:'Noto Serif KR',serif;
    font-weight:800;
    font-size:26px;
    line-height:1.28;
    color:var(--cream);
    margin:0 0 12px;
  }
  .sub-body{
    font-size:13.5px;
    line-height:1.6;
    color:#bdb7a8;
    margin:0 0 12px;
    white-space:pre-wrap;
  }
  .sub-source{
    font-size:12px; color:var(--text-dim); margin-bottom:14px;
  }
  .sub-art{
    width:100%;
    aspect-ratio:16/10;
    border-radius:3px;
    overflow:hidden;
    background:#111113;
  }
  .sub-art img{width:100%; height:100%; object-fit:cover; display:block;}
  .sub-art .art-placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:#3d3d42; font-size:11px;
  }

  .card-footer{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--line);
    text-align:right;
    font-size:11.5px;
    color:#5a564d;
  }

  /* Theme variants */
  #card.theme-crimson{ --maroon-bright:#a3272f; --gold:#c9a961; }
  #card.theme-midnight{ --maroon-bright:#3a5a8c; --gold:#9fb8d9; }
  #card.theme-emerald{ --maroon-bright:#2f6b4f; --gold:#a7c9a0; }
  #card.theme-amber{ --maroon-bright:#a3661f; --gold:#e0b667; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1e1e22; border:1px solid var(--gold-dim); color:var(--cream);
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:999;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .zoom-controls{display:flex; gap:6px; margin-top:8px;}
  .zoom-controls .btn{flex:1;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#33333a; border-radius:4px;}
</style>
</head>
<body>

<div class="app">
  <!-- ===================== LEFT PANEL ===================== -->
  <div class="panel">
    <div class="brand">
      <div class="dot"></div>
      <h1>X TODAY 큐레이션 편집기</h1>
    </div>

    <div class="section">
      <h2>테마</h2>
      <div class="theme-swatches" id="themeSwatches">
        <div class="swatch active" data-theme="theme-crimson" style="background:linear-gradient(135deg,#0d0d0f,#a3272f)"><span>크림슨</span></div>
        <div class="swatch" data-theme="theme-midnight" style="background:linear-gradient(135deg,#0d0d0f,#3a5a8c)"><span>미드나잇</span></div>
        <div class="swatch" data-theme="theme-emerald" style="background:linear-gradient(135deg,#0d0d0f,#2f6b4f)"><span>에메랄드</span></div>
        <div class="swatch" data-theme="theme-amber" style="background:linear-gradient(135deg,#0d0d0f,#a3661f)"><span>앰버</span></div>
      </div>
    </div>

    <div class="section">
      <h2>마스트헤드</h2>
      <div class="field">
        <label>매체명</label>
        <input type="text" id="brandName" value="X TODAY">
      </div>
      <div class="row2">
        <div class="field">
          <label>계정 핸들</label>
          <input type="text" id="handle" value="@트루스소셜">
        </div>
        <div class="field">
          <label>날짜/부제 라벨</label>
          <input type="text" id="dateLabel" value="2026.07.29 (수)">
        </div>
      </div>
      <div class="field">
        <label>부제 (강조는 **텍스트**)</label>
        <input type="text" id="subLabel" value="오늘의 **X** 큐레이션">
      </div>
    </div>

    <div class="section">
      <h2>메인 스토리</h2>
      <div class="field">
        <label>카테고리</label>
        <input type="text" id="mainCategory" value="US POLITICS">
      </div>
      <div class="field">
        <label>제목</label>
        <textarea id="mainTitle">CNN도 인정…
사진 신분증
지지 80%</textarea>
      </div>
      <div class="field">
        <label>본문</label>
        <textarea id="mainBody">CNN도 미국인 80%(민주당원 62% 포함)가 사진 신분증 의무화를 지지한다는 사실을 인정했다.</textarea>
      </div>
      <div class="field">
        <label>출처</label>
        <input type="text" id="mainSource" value="@EricLDaugh">
      </div>
      <div class="field">
        <label>배경 이미지</label>
        <div class="imgdrop" id="mainImgDrop">클릭해서 이미지 업로드</div>
        <input type="file" accept="image/*" class="hidden-file" id="mainImgFile">
        <div class="zoom-controls" id="mainZoomWrap" style="display:none;">
          <button class="btn small secondary" data-zoom="mainImg" data-dir="out">－</button>
          <button class="btn small secondary" data-zoom="mainImg" data-dir="in">＋</button>
          <button class="btn small danger" data-zoom="mainImg" data-dir="remove">삭제</button>
        </div>
      </div>
      <div class="field">
        <label>큰 강조 숫자 (선택, 비우면 표시 안 함)</label>
        <input type="text" id="mainStat" value="80%">
      </div>
    </div>

    <div class="section">
      <h2>서브 스토리 <button class="btn small secondary" id="addSubBtn" style="width:auto;">+ 추가</button></h2>
      <div id="subStoriesWrap"></div>
    </div>

    <div class="section">
      <h2>푸터</h2>
      <div class="field">
        <label>안내 문구</label>
        <input type="text" id="footerText" value="개인 제작 뉴스 큐레이션입니다.">
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn" id="exportBtn">📥 PNG로 저장</button>
      <button class="btn secondary" id="resetBtn">초기화</button>
    </div>
  </div>

  <!-- ===================== RIGHT PREVIEW ===================== -->
  <div class="preview-col">
    <div class="canvas-wrap" id="canvasWrap">
      <div id="card" class="theme-crimson">
        <div class="masthead-top"><span class="masthead-handle" id="pHandle">@트루스소셜</span></div>
        <h1 class="masthead" id="pBrand" style="font-size:88px;">X TODAY</h1>
        <hr class="masthead-rule">
        <p class="masthead-sub" id="pSub"><span id="pDate">2026.07.29 (수)</span> &nbsp;|&nbsp; <span id="pSubLabel">오늘의 <b>X</b> 큐레이션</span></p>

        <div class="main-story">
          <div>
            <div class="eyebrow" id="pMainCat">US POLITICS</div>
            <h2 class="headline" id="pMainTitle">CNN도 인정…
사진 신분증
지지 80%</h2>
            <p class="body-text" id="pMainBody">CNN도 미국인 80%(민주당원 62% 포함)가 사진 신분증 의무화를 지지한다는 사실을 인정했다.</p>
            <p class="source-tag">출처: <b id="pMainSource">@EricLDaugh</b></p>
          </div>
          <div class="art-box" id="mainImg">
            <div class="art-placeholder">이미지를 업로드하세요</div>
            <div class="stat-overlay" id="pMainStat">80%</div>
          </div>
        </div>

        <div class="sub-grid" id="subGrid"></div>

        <div class="card-footer" id="pFooter">개인 제작 뉴스 큐레이션입니다.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let subStories = [
  {
    id: 's1',
    category: '',
    title: '트럼프-젤렌스키\n백악관 회동',
    body: '두 정상이 우크라이나 방공망 강화와 종전 협상 재개를 논의했고, 젤렌스키는 애국심 표하며 린지 그레이엄 별세에 조의를 표했다.',
    source: 'Fox News',
    img: null, imgZoom: 1
  },
  {
    id: 's2',
    category: '',
    title: '랜드 폴 "파우치,\n위증하면 사면도 무효"',
    body: '폴 상원의원은 내일 청문회에서 파우치가 위증할 경우 바이든의 사전 사면이 그를 보호하지 못한다고 밝혔다.',
    source: '@EricLDaugh',
    img: null, imgZoom: 1
  }
];
let mainImgData = { src: null, zoom: 1, x: 50, y: 50 };
let idCounter = 3;

function escapeHtml(str){
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function applyBold(str){
  return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function nl2br(str){
  return escapeHtml(str).split('\n').join('<br>');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- render ---------- */
function render(){
  document.getElementById('pHandle').textContent = document.getElementById('handle').value;
  document.getElementById('pBrand').textContent = document.getElementById('brandName').value;
  document.getElementById('pDate').textContent = document.getElementById('dateLabel').value;
  document.getElementById('pSubLabel').innerHTML = applyBold(document.getElementById('subLabel').value);
  document.getElementById('pMainCat').textContent = document.getElementById('mainCategory').value;
  document.getElementById('pMainTitle').innerHTML = nl2br(document.getElementById('mainTitle').value);
  document.getElementById('pMainBody').textContent = document.getElementById('mainBody').value;
  document.getElementById('pMainSource').textContent = document.getElementById('mainSource').value;

  const statVal = document.getElementById('mainStat').value.trim();
  const statEl = document.getElementById('pMainStat');
  statEl.textContent = statVal;
  statEl.style.display = statVal ? 'flex' : 'none';

  // main image
  const mainImgBox = document.getElementById('mainImg');
  const ph = mainImgBox.querySelector('.art-placeholder');
  let img = mainImgBox.querySelector('img');
  if(mainImgData.src){
    if(!img){
      img = document.createElement('img');
      mainImgBox.insertBefore(img, mainImgBox.firstChild);
    }
    img.src = mainImgData.src;
    img.style.transform = `scale(${mainImgData.zoom})`;
    if(ph) ph.style.display='none';
  } else {
    if(img) img.remove();
    if(ph) ph.style.display='flex';
  }

  // footer
  document.getElementById('pFooter').textContent = document.getElementById('footerText').value;

  // sub grid columns
  const grid = document.getElementById('subGrid');
  const n = subStories.length;
  grid.style.gridTemplateColumns = n > 0 ? `repeat(${Math.min(n,3)}, 1fr)` : '1fr';
  grid.innerHTML = '';
  subStories.forEach(s=>{
    const div = document.createElement('div');
    div.className = 'sub-story';
    div.innerHTML = `
      ${s.category ? `<div class="eyebrow" style="font-size:11px;">${escapeHtml(s.category)}</div>` : ''}
      <h3 class="sub-headline">${nl2br(s.title)}</h3>
      <p class="sub-body">${escapeHtml(s.body)}</p>
      ${s.source ? `<p class="sub-source">출처: ${escapeHtml(s.source)}</p>` : ''}
      <div class="sub-art">
        ${s.img ? `<img src="${s.img}" style="transform:scale(${s.imgZoom||1})">` : `<div class="art-placeholder">이미지 없음</div>`}
      </div>
    `;
    grid.appendChild(div);
  });

  scaleToFit();
}

function scaleToFit(){
  const wrap = document.getElementById('canvasWrap');
  const card = document.getElementById('card');
  const available = Math.min(window.innerWidth * (window.innerWidth <= 900 ? 0.92 : 0.6), 1000);
  const scale = Math.min(1, available / 1000);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.marginBottom = (card.offsetHeight * (scale - 1)) + 'px';
}
window.addEventListener('resize', scaleToFit);

/* ---------- theme ---------- */
document.getElementById('themeSwatches').addEventListener('click', (e)=>{
  const sw = e.target.closest('.swatch');
  if(!sw) return;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  sw.classList.add('active');
  const card = document.getElementById('card');
  card.className = sw.dataset.theme;
});

/* ---------- inputs ---------- */
['brandName','handle','dateLabel','subLabel','mainCategory','mainTitle','mainBody','mainSource','mainStat','footerText']
  .forEach(id => document.getElementById(id).addEventListener('input', render));

/* ---------- main image upload ---------- */
document.getElementById('mainImgDrop').addEventListener('click', ()=>{
  document.getElementById('mainImgFile').click();
});
document.getElementById('mainImgFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    mainImgData.src = ev.target.result;
    mainImgData.zoom = 1;
    document.getElementById('mainImgDrop').textContent = '✓ ' + file.name;
    document.getElementById('mainImgDrop').classList.add('has-img');
    document.getElementById('mainZoomWrap').style.display = 'flex';
    render();
  };
  reader.readAsDataURL(file);
});
document.getElementById('mainZoomWrap').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const dir = btn.dataset.dir;
  if(dir === 'in') mainImgData.zoom = Math.min(3, mainImgData.zoom + 0.1);
  else if(dir === 'out') mainImgData.zoom = Math.max(1, mainImgData.zoom - 0.1);
  else if(dir === 'remove'){
    mainImgData.src = null; mainImgData.zoom = 1;
    document.getElementById('mainImgDrop').textContent = '클릭해서 이미지 업로드';
    document.getElementById('mainImgDrop').classList.remove('has-img');
    document.getElementById('mainImgFile').value = '';
    document.getElementById('mainZoomWrap').style.display = 'none';
  }
  render();
});

/* ---------- sub stories ---------- */
function renderSubPanel(){
  const wrap = document.getElementById('subStoriesWrap');
  wrap.innerHTML = '';
  subStories.forEach((s, idx)=>{
    const block = document.createElement('div');
    block.className = 'story-block';
    block.innerHTML = `
      <div class="story-head">
        <span>스토리 ${idx+1}</span>
        <button class="btn small danger" data-remove="${s.id}" style="width:auto;">삭제</button>
      </div>
      <div class="field">
        <label>카테고리 (선택)</label>
        <input type="text" data-field="category" data-id="${s.id}" value="${escapeHtml(s.category)}">
      </div>
      <div class="field">
        <label>제목</label>
        <textarea data-field="title" data-id="${s.id}">${s.title}</textarea>
      </div>
      <div class="field">
        <label>본문</label>
        <textarea data-field="body" data-id="${s.id}">${s.body}</textarea>
      </div>
      <div class="field">
        <label>출처 (선택)</label>
        <input type="text" data-field="source" data-id="${s.id}" value="${escapeHtml(s.source)}">
      </div>
      <div class="field">
        <label>이미지</label>
        <div class="imgdrop ${s.img ? 'has-img' : ''}" data-imgdrop="${s.id}">${s.img ? '✓ 이미지 업로드됨' : '클릭해서 이미지 업로드'}</div>
        <input type="file" accept="image/*" class="hidden-file" data-imgfile="${s.id}">
        ${s.img ? `<div class="zoom-controls">
          <button class="btn small secondary" data-subzoom="${s.id}" data-dir="out">－</button>
          <button class="btn small secondary" data-subzoom="${s.id}" data-dir="in">＋</button>
          <button class="btn small danger" data-subzoom="${s.id}" data-dir="remove">삭제</button>
        </div>` : ''}
      </div>
    `;
    wrap.appendChild(block);
  });

  wrap.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const s = subStories.find(x=>x.id === e.target.dataset.id);
      if(s) s[e.target.dataset.field] = e.target.value;
      render();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      subStories = subStories.filter(x=>x.id !== e.target.dataset.remove);
      renderSubPanel(); render();
    });
  });
  wrap.querySelectorAll('[data-imgdrop]').forEach(el=>{
    el.addEventListener('click', ()=>{
      wrap.querySelector(`[data-imgfile="${el.dataset.imgdrop}"]`).click();
    });
  });
  wrap.querySelectorAll('[data-imgfile]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const id = e.target.dataset.imgfile;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const s = subStories.find(x=>x.id === id);
        if(s){ s.img = ev.target.result; s.imgZoom = 1; }
        renderSubPanel(); render();
      };
      reader.readAsDataURL(file);
    });
  });
  wrap.querySelectorAll('[data-subzoom]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.dataset.subzoom;
      const dir = e.target.dataset.dir;
      const s = subStories.find(x=>x.id === id);
      if(!s) return;
      if(dir === 'in') s.imgZoom = Math.min(3, (s.imgZoom||1) + 0.1);
      else if(dir === 'out') s.imgZoom = Math.max(1, (s.imgZoom||1) - 0.1);
      else if(dir === 'remove'){ s.img = null; s.imgZoom = 1; }
      renderSubPanel(); render();
    });
  });
}

document.getElementById('addSubBtn').addEventListener('click', ()=>{
  if(subStories.length >= 4){ toast('서브 스토리는 최대 4개까지 추가할 수 있어요'); return; }
  subStories.push({
    id: 's' + (idCounter++),
    category: '', title: '새 스토리 제목', body: '본문을 입력하세요.', source: '',
    img: null, imgZoom: 1
  });
  renderSubPanel(); render();
});

/* ---------- export ---------- */
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const card = document.getElementById('card');
  const wrap = document.getElementById('canvasWrap');
  const prevTransform = wrap.style.transform;
  wrap.style.transform = 'none';
  toast('이미지 생성 중...');
  try{
    const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true });
    const link = document.createElement('a');
    link.download = `x-today-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('저장 완료!');
  }catch(err){
    toast('저장 중 오류가 발생했어요');
    console.error(err);
  }
  wrap.style.transform = prevTransform;
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('모든 내용을 초기화할까요?')) return;
  location.reload();
});

/* ---------- init ---------- */
renderSubPanel();
render();
setTimeout(scaleToFit, 100);
</script>
</body>
</html>
