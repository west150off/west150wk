<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Card Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --chrome-bg:#161221;
    --chrome-panel:#1d1830;
    --chrome-line:#2c2540;
    --chrome-text:#eae6f5;
    --chrome-sub:#8d84ab;
    --accent:#7c5cff;
    --accent-soft:#7c5cff22;
    --danger:#ff5c7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--chrome-bg);color:var(--chrome-text);}
  #app{display:flex;flex-direction:column;height:100vh;}

  #topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:var(--chrome-panel);border-bottom:1px solid var(--chrome-line);flex:none;position:relative;z-index:10;}
  #topbar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
  #topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  #topbar .actions{display:flex;gap:8px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;}
  select{font-family:inherit;}
  .btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;background:#2a2440;color:var(--chrome-text);transition:.15s;}
  .btn:hover{background:#352c54;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{background:#6c4aff;}
  .btn.ghost{background:transparent;color:var(--chrome-sub);border:1px solid var(--chrome-line);}
  .btn.ghost:hover{color:var(--chrome-text);border-color:var(--accent);}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn.full{width:100%;}

  .menuWrap{position:relative;}
  .dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#241d3a;border:1px solid var(--chrome-line);border-radius:10px;padding:6px;display:none;flex-direction:column;min-width:160px;box-shadow:0 14px 34px #000a;z-index:50;}
  .dropdown.open{display:flex;}
  .ddItem{padding:9px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--chrome-text);display:flex;align-items:center;gap:8px;}
  .ddItem:hover{background:#352c54;}
  .ddItem .ic{opacity:.7;font-size:14px;width:16px;text-align:center;}

  #body{flex:1;display:flex;min-height:0;}

  #left{width:172px;flex:none;background:var(--chrome-panel);border-right:1px solid var(--chrome-line);display:flex;flex-direction:column;}
  #left .hd{padding:14px 14px 8px;font-size:12px;color:var(--chrome-sub);font-weight:600;letter-spacing:.03em;}
  #slideList{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;}
  .thumb{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#000;aspect-ratio:4/5;}
  .thumb.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .thumb iframe{width:400%;height:400%;transform:scale(.25);transform-origin:top left;border:0;pointer-events:none;}
  .thumb .idx{position:absolute;top:4px;left:6px;font-size:10px;font-weight:700;color:#fff;background:#000a;padding:1px 5px;border-radius:5px;}
  .thumb .tag{position:absolute;bottom:4px;left:6px;font-size:9px;font-weight:700;color:#fff;background:#7c5cffcc;padding:1px 5px;border-radius:5px;}
  .thumb .del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:5px;background:#000a;color:#fff;font-size:11px;line-height:18px;text-align:center;opacity:0;transition:.15s;}
  .thumb:hover .del{opacity:1;}
  .thumb .del:hover{background:var(--danger);}
  #addSlide{margin:0 12px 14px;padding:10px;border-radius:10px;background:#2a2440;color:var(--chrome-sub);font-size:12px;font-weight:600;border:1px dashed var(--chrome-line);}
  #addSlide:hover{color:var(--chrome-text);border-color:var(--accent);}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:
      radial-gradient(circle at 30% 20%, #241c3a 0%, var(--chrome-bg) 60%);
    padding:40px;}
  #canvasWrap{box-shadow:0 30px 60px -20px #000a;border-radius:4px;}

  #card{width:400px;height:500px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:26px 26px 22px;}
  #card .rowTop{display:flex;justify-content:space-between;align-items:center;}
  #card .badgeTop{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  #card .pageNum{font-size:12px;font-weight:600;opacity:.6;}
  #card .frame{flex:1;margin-top:16px;border:1.5px solid #1a1a1a22;border-radius:2px;display:flex;flex-direction:column;justify-content:center;padding:26px 24px;position:relative;overflow:hidden;}
  #card .pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:5px 12px;border-radius:20px;margin-bottom:16px;width:fit-content;}
  #card .titleText{font-size:27px;line-height:1.35;font-weight:800;letter-spacing:-.01em;white-space:pre-wrap;word-break:keep-all;}
  #card .titleText mark{background:var(--mk,#f6b8c4);color:inherit;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  #card .subText{margin-top:14px;font-size:14px;line-height:1.6;font-weight:500;opacity:.72;white-space:pre-wrap;word-break:keep-all;}
  #card .rowBottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  #card .handle{font-size:12px;font-weight:700;opacity:.75;}
  #card .arrow{font-size:13px;font-weight:800;letter-spacing:.05em;}

  #card .imgBox{position:relative;overflow:hidden;border-radius:6px;background:#0002;}
  #card .imgBox.split{width:100%;height:44%;flex:none;margin-top:14px;}
  #card .imgBox.inset{width:100%;height:140px;flex:none;margin-bottom:16px;}
  #card .imgBox.full{position:absolute;inset:0;border-radius:0;z-index:0;}
  #card .imgBox .layer{position:absolute;inset:0;background-repeat:no-repeat;}
  #card .imgBox .duo{position:absolute;inset:0;mix-blend-mode:color;}
  #card .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;}
  #card .z2{position:relative;z-index:2;}

  #card .blk{margin-top:14px;}
  #card .timeline .tl-item{display:flex;gap:10px;margin-bottom:10px;}
  #card .tl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
  #card .tl-date{font-size:12px;font-weight:800;opacity:.85;}
  #card .tl-desc{font-size:12.5px;line-height:1.5;opacity:.72;margin-top:2px;}
  #card .list .ls-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  #card .ls-num{width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  #card .ls-text{font-size:13px;line-height:1.5;opacity:.85;padding-top:1px;}
  #card .stats{display:flex;flex-wrap:wrap;gap:16px;}
  #card .st-item{flex:1;min-width:80px;}
  #card .st-val{font-size:24px;font-weight:900;}
  #card .st-label{font-size:11px;opacity:.65;margin-top:2px;}
  #card .chart .ch-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  #card .ch-label{font-size:11px;width:56px;flex:none;opacity:.75;}
  #card .ch-track{flex:1;height:8px;background:#00000014;border-radius:4px;overflow:hidden;}
  #card .ch-fill{height:100%;border-radius:4px;}
  #card .ch-val{font-size:11px;width:30px;text-align:right;opacity:.7;}
  #card .quote{padding-top:2px;}
  #card .q-mark{font-size:34px;font-weight:900;line-height:1;}
  #card .q-text{font-size:16px;font-weight:700;line-height:1.5;margin-top:4px;}
  #card .q-author{font-size:12px;opacity:.6;margin-top:8px;}

  #right{width:300px;flex:none;background:var(--chrome-panel);border-left:1px solid var(--chrome-line);overflow-y:auto;}
  .sec{padding:16px 18px;border-bottom:1px solid var(--chrome-line);}
  .sec h3{margin:0 0 12px;font-size:12px;font-weight:700;color:var(--chrome-sub);letter-spacing:.04em;text-transform:uppercase;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;color:var(--chrome-sub);margin-bottom:6px;}
  .field input[type=text], .field textarea, .field select{width:100%;background:#100c1c;border:1px solid var(--chrome-line);color:var(--chrome-text);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;}
  .field textarea{min-height:56px;line-height:1.4;}
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .colorField{display:flex;align-items:center;gap:8px;background:#100c1c;border:1px solid var(--chrome-line);border-radius:7px;padding:6px 10px;}
  .colorField input[type=color]{width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;}
  .colorField span{font-size:12px;color:var(--chrome-sub);flex:1;}
  .slider{display:flex;align-items:center;gap:10px;}
  .slider input[type=range]{flex:1;accent-color:var(--accent);}
  .slider .val{font-size:11px;color:var(--chrome-sub);width:32px;text-align:right;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .sw{width:20px;height:20px;border-radius:5px;cursor:pointer;border:1px solid #ffffff22;}
  .imgPreviewRow{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .imgThumb{width:52px;height:52px;border-radius:8px;background-size:cover;background-position:center;background-color:#100c1c;border:1px solid var(--chrome-line);flex:none;}
  .hint{font-size:11px;color:var(--chrome-sub);margin-top:6px;line-height:1.5;}

  .modalOverlay{position:fixed;inset:0;background:#0a0716ee;padding:32px 40px;overflow-y:auto;display:none;z-index:200;}
  .modalOverlay.open{display:block;}
  .modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:var(--chrome-text);font-weight:700;font-size:15px;}
  .previewGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
  .previewGrid .thumb{aspect-ratio:4/5;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#3a3358;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot"></span>Card Studio</div>
    <div class="actions">
      <div class="menuWrap" id="blockMenuWrap">
        <button class="btn ghost" id="blockMenuBtn">콘텐츠 삽입 ▾</button>
        <div class="dropdown" id="blockMenu">
          <div class="ddItem" data-block="none"><span class="ic">Aa</span>텍스트 설명</div>
          <div class="ddItem" data-block="timeline"><span class="ic">⏱</span>타임라인</div>
          <div class="ddItem" data-block="list"><span class="ic">☰</span>번호 리스트</div>
          <div class="ddItem" data-block="stats"><span class="ic">#</span>통계 숫자</div>
          <div class="ddItem" data-block="chart"><span class="ic">▤</span>막대 그래프</div>
          <div class="ddItem" data-block="quote"><span class="ic">"</span>인용구</div>
        </div>
      </div>
      <button class="btn ghost" id="previewAllBtn">전체 미리보기</button>
      <button class="btn ghost" id="exportOne">현재 카드 저장</button>
      <button class="btn primary" id="exportAll">전체 저장</button>
    </div>
  </div>

  <div id="body">
    <div id="left">
      <div class="hd">슬라이드 (<span id="slideCount">0</span>)</div>
      <div id="slideList"></div>
      <button id="addSlide">+ 카드 추가</button>
    </div>

    <div id="stage">
      <div id="canvasWrap">
        <div id="card"></div>
      </div>
    </div>

    <div id="right">
      <div class="sec">
        <h3>템플릿</h3>
        <div class="field">
          <select id="templateSelect">
            <option value="text">텍스트 카드 (사진 없음)</option>
            <option value="full">풀 이미지 (사진 전체 배경)</option>
            <option value="split">이미지 + 텍스트 (상단 사진)</option>
            <option value="inset">이미지 인셋 (프레임 안 사진)</option>
          </select>
        </div>
      </div>

      <div class="sec">
        <h3>이미지</h3>
        <div class="imgPreviewRow">
          <div class="imgThumb" id="imgThumb"></div>
          <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
            <label class="btn small full" id="uploadBtn" style="text-align:center;">사진 업로드</label>
            <input type="file" id="imageUpload" accept="image/*" style="display:none;">
            <button class="btn ghost small full" id="imageRemove">사진 삭제</button>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>배치 방식</label>
            <select id="imageFit">
              <option value="cover">꽉 채우기</option>
              <option value="contain">전체 보이기</option>
            </select>
          </div>
          <div class="field">
            <label>위치</label>
            <select id="imagePos">
              <option value="top">상단</option>
              <option value="center" selected>중앙</option>
              <option value="bottom">하단</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>사진 효과</label>
          <select id="imageFilter">
            <option value="none">없음</option>
            <option value="gray">흑백</option>
            <option value="sepia">세피아</option>
            <option value="vivid">선명하게</option>
            <option value="dark">어둡게</option>
            <option value="duotone">듀오톤 (포인트색)</option>
          </select>
        </div>
        <div class="field">
          <label>오버레이 어둡기 (풀 이미지/상단 사진용)</label>
          <div class="slider"><input type="range" id="imageOverlay" min="0" max="85" value="55"><span class="val" id="imageOverlayVal">55</span></div>
        </div>
        <div class="hint">사진은 자동으로 리사이즈되어 저장됩니다.</div>
      </div>

      <div class="sec">
        <h3>글꼴</h3>
        <div class="field">
          <select id="fontSelect">
            <option value="pretendard">Pretendard (인기 국문 고딕)</option>
            <option value="noto">Noto Sans KR (기본 고딕)</option>
            <option value="plex">IBM Plex Sans KR (모던 고딕)</option>
            <option value="black">Black Han Sans (임팩트 헤드라인)</option>
            <option value="dohyeon">Do Hyeon (두꺼운 고딕)</option>
            <option value="jua">Jua (동글동글)</option>
            <option value="gaegu">Gaegu (손글씨풍)</option>
            <option value="myeongjo">Nanum Myeongjo (명조체)</option>
            <option value="batang">Gowun Batang (부드러운 바탕체)</option>
          </select>
        </div>
      </div>

      <div class="sec">
        <h3>텍스트</h3>
        <div class="field">
          <label>상단 배지</label>
          <input type="text" id="badgeTop" placeholder="MONEY NOTE">
        </div>
        <div class="field">
          <label>카드 배지 (선택)</label>
          <input type="text" id="pillText" placeholder="MONEY NOTE">
        </div>
        <div class="field">
          <label>제목</label>
          <textarea id="titleText" placeholder="카드뉴스를 직접 만드는 이유"></textarea>
        </div>
        <div class="field">
          <label>강조할 단어/구절</label>
          <input type="text" id="highlightWord" placeholder="직접">
        </div>
        <div class="field">
          <label>계정 핸들</label>
          <input type="text" id="handleText" placeholder="@kkongdon_story">
        </div>
      </div>

      <div class="sec">
        <h3>콘텐츠 블록 <span style="font-weight:400;text-transform:none;color:var(--chrome-sub);">(상단 메뉴에서도 선택 가능)</span></h3>
        <div class="field">
          <select id="contentBlockSelect">
            <option value="none">텍스트 설명</option>
            <option value="timeline">타임라인</option>
            <option value="list">번호 리스트</option>
            <option value="stats">통계 숫자</option>
            <option value="chart">막대 그래프</option>
            <option value="quote">인용구</option>
          </select>
        </div>
        <div class="field">
          <label id="blockDataLabel">내용</label>
          <textarea id="blockDataText" style="min-height:100px;" placeholder="AI가 아닌 나만의 문체로 만들어 보자."></textarea>
        </div>
        <div class="hint" id="blockDataHint">한 줄씩 입력하세요.</div>
      </div>

      <div class="sec">
        <h3>색상</h3>
        <div class="row2">
          <div class="field">
            <label>배경색</label>
            <div class="colorField"><input type="color" id="bgColor" value="#f4efe4"><span id="bgColorHex">#f4efe4</span></div>
          </div>
          <div class="field">
            <label>글자색</label>
            <div class="colorField"><input type="color" id="textColor" value="#1a1a1a"><span id="textColorHex">#1a1a1a</span></div>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>배지 배경</label>
            <div class="colorField"><input type="color" id="pillBg" value="#181818"><span id="pillBgHex">#181818</span></div>
          </div>
          <div class="field">
            <label>배지 글자</label>
            <div class="colorField"><input type="color" id="pillColor" value="#ffffff"><span id="pillColorHex">#ffffff</span></div>
          </div>
        </div>
        <div class="field">
          <label>하이라이트 색</label>
          <div class="colorField"><input type="color" id="mkColor" value="#f6b8c4"><span id="mkColorHex">#f6b8c4</span></div>
          <div class="swatches" id="mkSwatches"></div>
        </div>
        <div class="field">
          <label>포인트색 (화살표·듀오톤·그래프)</label>
          <div class="colorField"><input type="color" id="accentColor" value="#7c5cff"><span id="accentColorHex">#7c5cff</span></div>
        </div>
      </div>

      <div class="sec">
        <h3>크기</h3>
        <div class="field">
          <label>제목 크기</label>
          <div class="slider"><input type="range" id="titleSize" min="16" max="40" value="27"><span class="val" id="titleSizeVal">27</span></div>
        </div>
        <div class="field">
          <label>부제 크기</label>
          <div class="slider"><input type="range" id="subSize" min="10" max="22" value="14"><span class="val" id="subSizeVal">14</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modalOverlay" id="previewModal">
  <div class="modalHead"><span>전체 미리보기</span><button class="btn ghost small" id="closePreview">닫기 ✕</button></div>
  <div class="previewGrid" id="previewGrid"></div>
</div>

<script>
const templateLabels = {text:'TEXT', full:'FULL', split:'SPLIT', inset:'INSET'};

const sampleData = {
  timeline: '2024.01 | 프로젝트 시작\n2024.06 | 베타 출시\n2025.01 | 정식 출시',
  list: '첫 번째 항목을 입력하세요\n두 번째 항목을 입력하세요\n세 번째 항목을 입력하세요',
  stats: '128% | 성장률\n42만 | 사용자 수\n4.8 | 평점',
  chart: '1월 | 30\n2월 | 55\n3월 | 80',
  quote: '이 자리에 인용할 문장을 입력하세요.\n작성자 이름'
};

const blockLabels = {
  none: {label:'설명', hint:'한 줄이든 여러 줄이든 자유롭게 입력하세요.', ph:'AI가 아닌 나만의 문체로 만들어 보자.'},
  timeline: {label:'타임라인 항목', hint:'"날짜 | 설명" 형식으로 한 줄에 하나씩 입력하세요.', ph:'2024.01 | 프로젝트 시작'},
  list: {label:'리스트 항목', hint:'한 줄에 항목 하나씩 입력하면 자동으로 번호가 매겨집니다.', ph:'첫 번째 항목'},
  stats: {label:'통계 항목', hint:'"값 | 라벨" 형식으로 한 줄에 하나씩 입력하세요.', ph:'128% | 성장률'},
  chart: {label:'그래프 항목', hint:'"라벨 | 숫자값" 형식으로 한 줄에 하나씩 입력하세요.', ph:'1월 | 30'},
  quote: {label:'인용구', hint:'첫 줄은 인용 문장, 둘째 줄은 작성자(선택)입니다.', ph:'인용할 문장\n작성자 이름'}
};

const defaults = () => ({
  template:'text',
  badgeTop:'MONEY NOTE', pillText:'MONEY NOTE', title:'카드뉴스를 직접\n만드는 이유',
  highlight:'직접', sub:'AI가 아닌 나만의 문체로 만들어 보자.', handle:'@kkongdon_story',
  bg:'#f4efe4', text:'#1a1a1a', pillBg:'#181818', pillColor:'#ffffff',
  mk:'#f6b8c4', accent:'#7c5cff', titleSize:27, subSize:14,
  image:null, imageFit:'cover', imagePos:'center', imageFilter:'none', imageOverlay:55,
  font:'pretendard',
  contentBlock:'none', blockData:''
});

let slides = [defaults()];
let active = 0;

const $ = id => document.getElementById(id);

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightedHtml(title, word, mk){
  const safe = escapeHtml(title);
  if(!word || !word.trim()) return safe.replace(/\n/g,'<br>');
  const w = escapeHtml(word.trim());
  const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
  return safe.replace(/\n/g,'<br>').replace(re, '<mark style="--mk:' + mk + '">' + w + '</mark>');
}

function fontStack(id){
  const map = {
    pretendard: "'Pretendard Variable','Pretendard',sans-serif",
    noto: "'Noto Sans KR', sans-serif",
    plex: "'IBM Plex Sans KR', sans-serif",
    black: "'Black Han Sans', sans-serif",
    dohyeon: "'Do Hyeon', sans-serif",
    jua: "'Jua', sans-serif",
    gaegu: "'Gaegu', sans-serif",
    myeongjo: "'Nanum Myeongjo', serif",
    batang: "'Gowun Batang', serif"
  };
  return map[id] || map.pretendard;
}

function filterCss(f){
  switch(f){
    case 'gray': return 'grayscale(1)';
    case 'sepia': return 'sepia(.55) contrast(1.05)';
    case 'vivid': return 'saturate(1.5) contrast(1.15)';
    case 'dark': return 'brightness(.65) contrast(1.1)';
    case 'duotone': return 'grayscale(1) contrast(1.1)';
    default: return 'none';
  }
}

function imageBox(s, variantClass){
  if(!s.image) return '';
  const style = "background-image:url('" + s.image + "');background-size:" + s.imageFit + ";background-position:center " + s.imagePos + ";filter:" + filterCss(s.imageFilter) + ";";
  const duo = s.imageFilter === 'duotone' ? '<div class="duo" style="background:' + s.accent + ';opacity:.8;"></div>' : '';
  return '<div class="imgBox ' + variantClass + '"><div class="layer" style="' + style + '"></div>' + duo + '</div>';
}

function pillHtml(s){
  return s.pillText.trim() ? '<div class="pill" style="background:' + s.pillBg + ';color:' + s.pillColor + ';">' + escapeHtml(s.pillText) + '</div>' : '';
}
function titleHtml(s){
  return '<div class="titleText" style="font-size:' + s.titleSize + 'px;">' + highlightedHtml(s.title, s.highlight, s.mk) + '</div>';
}
function rowTopHtml(s, pageIdx, total, z){
  return '<div class="rowTop ' + (z?'z2':'') + '"><div class="badgeTop">' + escapeHtml(s.badgeTop) + '</div><div class="pageNum">' + (pageIdx+1) + ' / ' + total + '</div></div>';
}
function rowBottomHtml(s, z){
  return '<div class="rowBottom ' + (z?'z2':'') + '"><div class="handle">' + escapeHtml(s.handle) + '</div><div class="arrow" style="color:' + s.accent + ';">&gt;&gt;&gt;&gt;</div></div>';
}

function parseLines(data){
  return (data||'').split('\n').map(l=>l.trim()).filter(Boolean);
}

function renderTimeline(s){
  const lines = parseLines(s.blockData);
  if(!lines.length) return '';
  const items = lines.map(l => {
    const parts = l.split('|');
    const a = (parts[0]||'').trim(), b = (parts[1]||'').trim();
    return '<div class="tl-item"><div class="tl-dot" style="background:' + s.accent + ';"></div><div class="tl-body"><div class="tl-date">' + escapeHtml(a) + '</div><div class="tl-desc">' + escapeHtml(b) + '</div></div></div>';
  }).join('');
  return '<div class="blk timeline">' + items + '</div>';
}
function renderList(s){
  const lines = parseLines(s.blockData);
  if(!lines.length) return '';
  const items = lines.map((l,i) => '<div class="ls-item"><div class="ls-num" style="background:' + s.accent + ';">' + (i+1) + '</div><div class="ls-text">' + escapeHtml(l) + '</div></div>').join('');
  return '<div class="blk list">' + items + '</div>';
}
function renderStats(s){
  const lines = parseLines(s.blockData);
  if(!lines.length) return '';
  const items = lines.map(l => {
    const parts = l.split('|');
    const v = (parts[0]||'').trim(), label = (parts[1]||'').trim();
    return '<div class="st-item"><div class="st-val" style="color:' + s.accent + ';">' + escapeHtml(v) + '</div><div class="st-label">' + escapeHtml(label) + '</div></div>';
  }).join('');
  return '<div class="blk stats">' + items + '</div>';
}
function renderChart(s){
  const lines = parseLines(s.blockData);
  if(!lines.length) return '';
  const parsed = lines.map(l => { const parts = l.split('|'); return {label:(parts[0]||'').trim(), v: parseFloat(parts[1])||0}; });
  const max = Math.max.apply(null, parsed.map(p=>p.v).concat([1]));
  const items = parsed.map(p => '<div class="ch-row"><div class="ch-label">' + escapeHtml(p.label) + '</div><div class="ch-track"><div class="ch-fill" style="width:' + (p.v/max*100) + '%;background:' + s.accent + ';"></div></div><div class="ch-val">' + p.v + '</div></div>').join('');
  return '<div class="blk chart">' + items + '</div>';
}
function renderQuote(s){
  const lines = parseLines(s.blockData);
  if(!lines.length) return '';
  const quote = lines[0] || '';
  const author = lines[1] || '';
  return '<div class="blk quote"><div class="q-mark" style="color:' + s.accent + ';">&ldquo;</div><div class="q-text">' + escapeHtml(quote) + '</div>' + (author ? '<div class="q-author">- ' + escapeHtml(author) + '</div>' : '') + '</div>';
}
function subFallbackHtml(s){
  return s.sub && s.sub.trim() ? '<div class="subText" style="font-size:' + s.subSize + 'px;">' + escapeHtml(s.sub).replace(/\n/g,'<br>') + '</div>' : '';
}
function blockHtml(s){
  switch(s.contentBlock){
    case 'timeline': return renderTimeline(s);
    case 'list': return renderList(s);
    case 'stats': return renderStats(s);
    case 'chart': return renderChart(s);
    case 'quote': return renderQuote(s);
    default: return s.blockData && s.blockData.trim()
      ? '<div class="subText" style="font-size:' + s.subSize + 'px;">' + escapeHtml(s.blockData).replace(/\n/g,'<br>') + '</div>'
      : subFallbackHtml(s);
  }
}

function cardMarkup(s, pageIdx, total){
  const font = fontStack(s.font);
  const base = 'background:' + s.bg + ';color:' + s.text + ';font-family:' + font + ';';

  if(s.template === 'full'){
    const overlay = s.imageOverlay/100;
    return '<div id="card" style="' + base + '">' +
      imageBox(s,'full') +
      '<div class="scrim" style="background:linear-gradient(to top, rgba(0,0,0,' + overlay + ') 0%, rgba(0,0,0,' + (overlay*0.35) + ') 45%, rgba(0,0,0,0) 75%);"></div>' +
      rowTopHtml(s, pageIdx, total, true) +
      '<div class="z2" style="margin-top:auto;padding-top:20px;">' + pillHtml(s) + titleHtml(s) + blockHtml(s) + '</div>' +
      rowBottomHtml(s, true) +
    '</div>';
  }
  if(s.template === 'split'){
    return '<div id="card" style="' + base + '">' +
      rowTopHtml(s, pageIdx, total, false) +
      imageBox(s,'split') +
      '<div class="frame" style="border:none;padding:20px 2px 0;">' + pillHtml(s) + titleHtml(s) + blockHtml(s) + '</div>' +
      rowBottomHtml(s, false) +
    '</div>';
  }
  if(s.template === 'inset'){
    return '<div id="card" style="' + base + '">' +
      rowTopHtml(s, pageIdx, total, false) +
      '<div class="frame">' + imageBox(s,'inset') + pillHtml(s) + titleHtml(s) + blockHtml(s) + '</div>' +
      rowBottomHtml(s, false) +
    '</div>';
  }
  return '<div id="card" style="' + base + '">' +
    rowTopHtml(s, pageIdx, total, false) +
    '<div class="frame">' + pillHtml(s) + titleHtml(s) + blockHtml(s) + '</div>' +
    rowBottomHtml(s, false) +
  '</div>';
}

const fullCss = document.querySelector('style').textContent;
const fontLinksHtml = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(l=>l.outerHTML).join('');

function renderMainCard(){
  const s = slides[active];
  $('canvasWrap').innerHTML = cardMarkup(s, active, slides.length);
}
function thumbSrcDoc(s, idx){
  return '<!DOCTYPE html><html><head>' + fontLinksHtml + '<style>' + fullCss + '</style></head><body style="margin:0;">' + cardMarkup(s, idx, slides.length) + '</body></html>';
}
function renderList(){
  const list = $('slideList');
  list.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (i === active ? ' active' : '');
    const iframe = document.createElement('iframe');
    iframe.srcdoc = thumbSrcDoc(s, i);
    div.appendChild(iframe);
    const idx = document.createElement('div');
    idx.className = 'idx'; idx.textContent = i+1;
    div.appendChild(idx);
    const tag = document.createElement('div');
    tag.className = 'tag'; tag.textContent = templateLabels[s.template] || 'TEXT';
    div.appendChild(tag);
    const del = document.createElement('div');
    del.className = 'del'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteSlide(i); };
    div.appendChild(del);
    div.onclick = () => { active = i; syncForm(); renderMainCard(); renderList(); };
    list.appendChild(div);
  });
  $('slideCount').textContent = slides.length;
}
function deleteSlide(i){
  if(slides.length === 1) return;
  slides.splice(i,1);
  if(active >= slides.length) active = slides.length - 1;
  syncForm(); renderMainCard(); renderList();
}

function updateBlockHint(){
  const s = slides[active];
  const info = blockLabels[s.contentBlock] || blockLabels.none;
  $('blockDataLabel').textContent = info.label;
  $('blockDataHint').textContent = info.hint;
  $('blockDataText').placeholder = info.ph;
}

function syncForm(){
  const s = slides[active];
  $('templateSelect').value = s.template;
  $('badgeTop').value = s.badgeTop;
  $('pillText').value = s.pillText;
  $('titleText').value = s.title;
  $('highlightWord').value = s.highlight;
  $('handleText').value = s.handle;
  $('contentBlockSelect').value = s.contentBlock;
  $('blockDataText').value = s.contentBlock === 'none' ? (s.blockData || s.sub || '') : s.blockData;
  updateBlockHint();
  $('bgColor').value = s.bg; $('bgColorHex').textContent = s.bg;
  $('textColor').value = s.text; $('textColorHex').textContent = s.text;
  $('pillBg').value = s.pillBg; $('pillBgHex').textContent = s.pillBg;
  $('pillColor').value = s.pillColor; $('pillColorHex').textContent = s.pillColor;
  $('mkColor').value = s.mk; $('mkColorHex').textContent = s.mk;
  $('accentColor').value = s.accent; $('accentColorHex').textContent = s.accent;
  $('titleSize').value = s.titleSize; $('titleSizeVal').textContent = s.titleSize;
  $('subSize').value = s.subSize; $('subSizeVal').textContent = s.subSize;
  $('imageFit').value = s.imageFit;
  $('imagePos').value = s.imagePos;
  $('imageFilter').value = s.imageFilter;
  $('imageOverlay').value = s.imageOverlay; $('imageOverlayVal').textContent = s.imageOverlay;
  $('fontSelect').value = s.font;
  $('imgThumb').style.backgroundImage = s.image ? "url('" + s.image + "')" : 'none';
}

function bindField(id, prop, isColor){
  $(id).addEventListener('input', e => {
    slides[active][prop] = e.target.value;
    if(isColor) $(id+'Hex').textContent = e.target.value;
    renderMainCard(); renderList();
  });
}
bindField('badgeTop','badgeTop');
bindField('pillText','pillText');
bindField('titleText','title');
bindField('highlightWord','highlight');
bindField('handleText','handle');
bindField('bgColor','bg',true);
bindField('textColor','text',true);
bindField('pillBg','pillBg',true);
bindField('pillColor','pillColor',true);
bindField('mkColor','mk',true);
bindField('accentColor','accent',true);

$('blockDataText').addEventListener('input', e => {
  const s = slides[active];
  s.blockData = e.target.value;
  if(s.contentBlock === 'none') s.sub = e.target.value;
  renderMainCard(); renderList();
});

$('titleSize').addEventListener('input', e => {
  slides[active].titleSize = +e.target.value;
  $('titleSizeVal').textContent = e.target.value;
  renderMainCard(); renderList();
});
$('subSize').addEventListener('input', e => {
  slides[active].subSize = +e.target.value;
  $('subSizeVal').textContent = e.target.value;
  renderMainCard(); renderList();
});

$('templateSelect').addEventListener('change', e => {
  slides[active].template = e.target.value;
  renderMainCard(); renderList();
});
$('fontSelect').addEventListener('change', e => {
  slides[active].font = e.target.value;
  renderMainCard(); renderList();
});
$('imageFit').addEventListener('change', e => {
  slides[active].imageFit = e.target.value;
  renderMainCard(); renderList();
});
$('imagePos').addEventListener('change', e => {
  slides[active].imagePos = e.target.value;
  renderMainCard(); renderList();
});
$('imageFilter').addEventListener('change', e => {
  slides[active].imageFilter = e.target.value;
  renderMainCard(); renderList();
});
$('imageOverlay').addEventListener('input', e => {
  slides[active].imageOverlay = +e.target.value;
  $('imageOverlayVal').textContent = e.target.value;
  renderMainCard(); renderList();
});

function setContentBlock(type){
  const s = slides[active];
  s.contentBlock = type;
  if(type !== 'none' && !s.blockData.trim()){
    s.blockData = sampleData[type] || '';
  }
  syncForm(); renderMainCard(); renderList();
}
$('contentBlockSelect').addEventListener('change', e => setContentBlock(e.target.value));

$('blockMenuBtn').addEventListener('click', e => { e.stopPropagation(); $('blockMenu').classList.toggle('open'); });
document.addEventListener('click', () => $('blockMenu').classList.remove('open'));
Array.from(document.querySelectorAll('#blockMenu .ddItem')).forEach(item => {
  item.addEventListener('click', () => { setContentBlock(item.dataset.block); $('blockMenu').classList.remove('open'); });
});

function openPreview(){
  const grid = $('previewGrid'); grid.innerHTML = '';
  slides.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (i===active?' active':'');
    const iframe = document.createElement('iframe'); iframe.srcdoc = thumbSrcDoc(s,i);
    div.appendChild(iframe);
    const idx = document.createElement('div'); idx.className='idx'; idx.textContent = i+1; div.appendChild(idx);
    div.onclick = () => { active=i; syncForm(); renderMainCard(); renderList(); closePreview(); };
    grid.appendChild(div);
  });
  $('previewModal').classList.add('open');
}
function closePreview(){ $('previewModal').classList.remove('open'); }
$('previewAllBtn').addEventListener('click', openPreview);
$('closePreview').addEventListener('click', closePreview);

$('uploadBtn').addEventListener('click', () => $('imageUpload').click());
$('imageUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      slides[active].image = canvas.toDataURL('image/jpeg', 0.85);
      if(slides[active].template === 'text') slides[active].template = 'full';
      syncForm(); renderMainCard(); renderList();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
$('imageRemove').addEventListener('click', () => {
  slides[active].image = null;
  renderMainCard(); renderList();
  $('imgThumb').style.backgroundImage = 'none';
});

const mkPresets = ['#f6b8c4','#ffe08a','#b8e6c1','#a9d4ff','#d7bfff','#ffc7a3'];
mkPresets.forEach(c => {
  const sw = document.createElement('div');
  sw.className = 'sw'; sw.style.background = c;
  sw.onclick = () => { slides[active].mk = c; $('mkColor').value=c; $('mkColorHex').textContent=c; renderMainCard(); renderList(); };
  $('mkSwatches').appendChild(sw);
});

$('addSlide').addEventListener('click', () => {
  const clone = JSON.parse(JSON.stringify(slides[active]));
  slides.splice(active+1, 0, clone);
  active = active+1;
  syncForm(); renderMainCard(); renderList();
});

async function exportNode(node, filename){
  const canvas = await html2canvas(node, {backgroundColor:null, scale:3, useCORS:true});
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
$('exportOne').addEventListener('click', () => {
  exportNode($('canvasWrap'), 'card_' + (active+1) + '.png');
});
$('exportAll').addEventListener('click', async () => {
  const origActive = active;
  for(let i=0;i<slides.length;i++){
    active = i;
    renderMainCard();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await exportNode($('canvasWrap'), 'card_' + (i+1) + '.png');
    await new Promise(r => setTimeout(r, 300));
  }
  active = origActive;
  renderMainCard(); renderList();
});

syncForm();
renderMainCard();
renderList();
</script>
</body>
</html>
