<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Briefing Studio · Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
@font-face {
  font-family: 'RidiBatang';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
:root {
  --chrome-bg: #0e1218;
  --chrome-panel: #151b24;
  --chrome-line: #273040;
  --chrome-text: #e8eef5;
  --chrome-sub: #8494a8;
  --chrome-input: #1a222e;
  --chrome-btn: #243041;
  --chrome-btn-hover: #2f3d52;
  --accent: #2a5ba8;
  --accent-soft: #2a5ba822;
  --danger: #e85a6b;
  --navy: #1b3a5f;
  --gold: #c9a44c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
  background: var(--chrome-bg); color: var(--chrome-text);
}
#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 54px; flex: none;
  background: var(--chrome-panel); border-bottom: 1px solid var(--chrome-line);
  position: relative; z-index: 200;
}
.brand {
  font-weight: 700; font-size: 14px; letter-spacing: .06em;
  display: flex; align-items: center; gap: 10px;
}
.brand .mark {
  width: 8px; height: 8px; border-radius: 2px;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
.brand span.sub { font-weight: 500; font-size: 11px; color: var(--chrome-sub); letter-spacing: .12em; }
.actions { display: flex; gap: 6px; align-items: center; }
button { font-family: inherit; cursor: pointer; border: none; }
.btn {
  padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
  background: var(--chrome-btn); color: var(--chrome-text); transition: .15s;
}
.btn:hover { background: var(--chrome-btn-hover); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--chrome-sub); border: 1px solid var(--chrome-line); }
.btn.ghost:hover { color: var(--chrome-text); border-color: var(--accent); }
.btn.small { padding: 6px 10px; font-size: 11px; }
.btn.full { width: 100%; }

.menuWrap { position: relative; }
.dropdown {
  position: absolute; top: calc(100% + 6px); left: 0;
  background: #1a222e; border: 1px solid var(--chrome-line); border-radius: 10px;
  padding: 8px; display: none; flex-direction: column; min-width: 210px;
  box-shadow: 0 16px 40px #0008; z-index: 300;
}
.dropdown.open { display: flex; }
.dropdown.panel { width: 280px; max-height: 72vh; overflow-y: auto; padding: 14px; gap: 10px; }
.ddItem {
  padding: 9px 11px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  color: var(--chrome-text); display: flex; align-items: center; gap: 8px;
}
.ddItem:hover { background: var(--chrome-btn-hover); }
.ddItem.active { background: var(--accent-soft); color: #7eb6ff; }

#body { flex: 1; display: flex; min-height: 0; }

#left {
  width: 168px; flex: none; background: var(--chrome-panel);
  border-right: 1px solid var(--chrome-line); display: flex; flex-direction: column;
}
#left .hd {
  padding: 12px 12px 6px; font-size: 11px; color: var(--chrome-sub);
  font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
#slideList {
  flex: 1; overflow-y: auto; padding: 0 10px 10px;
  display: flex; flex-direction: column; gap: 10px;
}
.thumb {
  position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; background: #000; aspect-ratio: 4/5; flex-shrink: 0;
}
.thumb.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.thumb iframe {
  width: 400%; height: 400%; transform: scale(.25); transform-origin: top left;
  border: 0; pointer-events: none;
}
.thumb .idx {
  position: absolute; top: 4px; left: 5px; font-size: 10px; font-weight: 700;
  color: #fff; background: #000a; padding: 1px 5px; border-radius: 4px;
}
.thumb .tag {
  position: absolute; bottom: 4px; left: 5px; font-size: 9px; font-weight: 700;
  color: #fff; background: var(--navy); padding: 1px 5px; border-radius: 4px;
}
.thumb .del {
  position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
  border-radius: 4px; background: #000a; color: #fff; font-size: 11px;
  line-height: 18px; text-align: center; opacity: 0; transition: .15s;
}
.thumb:hover .del { opacity: 1; }
.thumb .del:hover { background: var(--danger); }
#addSlide {
  margin: 0 10px 12px; padding: 10px; border-radius: 8px;
  background: var(--chrome-btn); color: var(--chrome-sub); font-size: 12px;
  font-weight: 600; border: 1px dashed var(--chrome-line); width: calc(100% - 20px);
}
#addSlide:hover { color: var(--chrome-text); border-color: var(--accent); }

#stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: auto; padding: 36px;
  background: radial-gradient(ellipse at 50% 30%, #1a2433 0%, var(--chrome-bg) 65%);
}
#canvasWrap { box-shadow: 0 28px 60px -18px #000c; border-radius: 2px; }

/* ===== Card — MAX Magazine Art Direction ===== */
#card {
  width: 400px; height: 500px; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  background: #0a0a0a; color: #f3ecd9;
  font-family: 'Pretendard Variable', sans-serif;
}
#card .agency {
  font-size: 9.5px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
  color: #c9a44c;
}
#card .docType {
  display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .18em;
  text-transform: uppercase; color: #9a8b6a; background: none; border: none; border-radius: 0; padding: 0;
}
#card .titleText {
  font-family: 'Noto Serif KR', 'RidiBatang', serif;
  font-weight: 900; letter-spacing: -.03em; line-height: 1.12;
  white-space: pre-wrap; word-break: keep-all; color: #f5ecd8;
}
#card .bodyText {
  font-weight: 400; line-height: 1.75; color: #b7ad96;
  white-space: pre-wrap; word-break: keep-all;
}
#card .sourceLine { font-size: 10px; color: #7a6e55; letter-spacing: .06em; font-weight: 500; }
#card .timeLine {
  font-size: 10px; color: #5e5645; letter-spacing: .05em;
  font-variant-numeric: tabular-nums;
}
#card .navyRule {
  width: 28px; height: 1px; background: #c9a44c; margin: 18px 0 20px;
}
#card mark {
  background: var(--mk, #c9a44c); color: #0a0a0a; padding: 0 2px;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
#card .factItem {
  display: grid; grid-template-columns: 32px 1fr; gap: 14px;
  align-items: start; margin: 0; padding: 13px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
#card .factItem:last-child { border-bottom: none; }
#card .factNum {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px; font-weight: 700; color: #c9a44c;
  letter-spacing: 0; line-height: 1.3;
  background: none; border: none; width: auto; height: auto; border-radius: 0;
  display: block; min-width: 0; padding: 0;
}
#card .factTxt {
  font-size: inherit; line-height: 1.55; word-break: keep-all; color: #e4dcc8;
  padding-top: 2px;
}

/* ========== COVER : full editorial feature ========== */
#card.tpl-cover {
  background: #0a0a0a; padding: 0; color: #f3ecd9;
}
#card.tpl-cover .photoStrip {
  position: absolute; inset: 0; height: auto; z-index: 0; opacity: 1;
  margin: 0; border-radius: 0;
}
#card.tpl-cover .photoStrip .scrim {
  background:
    linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.2) 28%, rgba(10,10,10,.45) 55%, rgba(10,10,10,.92) 78%, #0a0a0a 100%);
}
#card.tpl-cover .coverFrame {
  position: absolute; inset: 16px; border: 1px solid rgba(201,164,76,.28);
  pointer-events: none; z-index: 2;
}
#card.tpl-cover .headBar {
  position: relative; z-index: 3;
  padding: 28px 36px 0;
  display: flex; justify-content: space-between; align-items: center;
  background: transparent; box-shadow: none;
}
#card.tpl-cover .headBar .agency {
  color: #c9a44c; letter-spacing: .28em; font-size: 9.5px;
}
#card.tpl-cover .headBar .agency::before { display: none; content: none; }
#card.tpl-cover .headBar .docType {
  color: rgba(243,236,217,.55); letter-spacing: .2em; font-size: 9px;
}
#card.tpl-cover .bodyArea {
  position: relative; z-index: 3;
  flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 36px 22px; margin: 0; border: none; background: transparent;
  box-shadow: none; border-radius: 0;
}
#card.tpl-cover .kickerLine {
  font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  color: #c9a44c; margin-bottom: 12px;
}
#card.tpl-cover .titleText {
  font-size: 32px; line-height: 1.1; color: #fffef8;
  text-shadow: 0 2px 24px rgba(0,0,0,.35);
}
#card.tpl-cover .bodyText {
  margin-top: 14px; font-size: 13px; color: rgba(230,220,200,.78);
  max-width: 92%; line-height: 1.65;
}
#card.tpl-cover .footer {
  position: relative; z-index: 3;
  padding: 14px 36px 28px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: none; margin: 0;
}
#card.tpl-cover .footer::before {
  content: ""; position: absolute; left: 36px; right: 36px; top: 0;
  height: 1px; background: linear-gradient(90deg, #c9a44c, rgba(201,164,76,.15));
}
#card.tpl-cover .footer .sourceLine { color: rgba(201,164,76,.75); }
#card.tpl-cover .footer .timeLine { color: rgba(243,236,217,.4); }

/* ========== FACTS : light magazine report ========== */
#card.tpl-facts {
  background: #f4efe6; color: #12100c; padding: 0; border: none;
}
#card.tpl-facts::before { display: none; content: none; }
#card.tpl-facts .factsTop {
  padding: 26px 30px 0;
}
#card.tpl-facts .topRow {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 0; padding-bottom: 0; border-bottom: none;
}
#card.tpl-facts .agency { color: #1a1a1a; letter-spacing: .24em; font-size: 9.5px; }
#card.tpl-facts .docType { color: #8a8275; letter-spacing: .16em; }
#card.tpl-facts .mastRule {
  height: 1px; background: #1a1a1a; margin: 16px 0 20px; opacity: .9;
}
#card.tpl-facts .titleText {
  font-size: 28px; line-height: 1.14; color: #0e0d0b; letter-spacing: -.03em;
  padding: 0 30px; font-family: 'Noto Serif KR', 'RidiBatang', serif;
}
#card.tpl-facts .deck {
  padding: 12px 30px 0; font-size: 12.5px; line-height: 1.6; color: #5a5348;
  font-weight: 500;
}
#card.tpl-facts .factList {
  flex: 1; margin: 22px 30px 0; padding: 0;
  border-top: 1px solid rgba(26,26,26,.12);
}
#card.tpl-facts .factItem { border-bottom-color: rgba(26,26,26,.1); padding: 12px 0; }
#card.tpl-facts .factNum {
  color: #1a1a1a; font-size: 16px; font-family: 'Noto Serif KR', serif;
}
#card.tpl-facts .factTxt { color: #1f1c17; }
#card.tpl-facts .footer {
  margin: 18px 30px 26px; padding-top: 14px;
  border-top: 1px solid rgba(26,26,26,.12);
  display: flex; justify-content: space-between; align-items: center;
}
#card.tpl-facts .sourceLine, #card.tpl-facts .timeLine { color: #8a8275; }

/* ========== SCHEDULE : dark contents page ========== */
#card.tpl-schedule {
  background: #0e0e0e; color: #f3ecd9; padding: 0; border: none;
  font-family: 'Pretendard Variable', sans-serif;
}
#card.tpl-schedule::before { display: none; content: none; }
#card.tpl-schedule .schInner {
  flex: 1; display: flex; flex-direction: column;
  margin: 18px; padding: 22px 22px 18px;
  border: 1px solid rgba(201,164,76,.22);
}
#card.tpl-schedule .topCenter {
  text-align: left; margin-bottom: 0; padding-bottom: 0; border: none;
}
#card.tpl-schedule .agency {
  letter-spacing: .28em; font-size: 9.5px; color: #c9a44c; font-weight: 700;
  font-family: 'Pretendard Variable', sans-serif; padding-left: 0;
}
#card.tpl-schedule .docType {
  display: block; margin-top: 8px; color: #7a6e55; letter-spacing: .16em;
  background: none; border: none;
}
#card.tpl-schedule .titleText {
  text-align: left; font-size: 24px; font-weight: 900; margin: 20px 0 6px;
  font-family: 'Noto Serif KR', 'RidiBatang', serif; line-height: 1.18;
  color: #f5ecd8;
}
#card.tpl-schedule .schList {
  flex: 1; margin-top: 8px; border-top: 1px solid rgba(201,164,76,.2);
}
#card.tpl-schedule .clause {
  display: grid; grid-template-columns: 40px 1fr; gap: 10px;
  margin: 0; padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  line-height: 1.5; font-size: 13.5px;
}
#card.tpl-schedule .clause:last-child { border-bottom: none; }
#card.tpl-schedule .clauseLabel {
  font-family: 'Noto Serif KR', serif;
  font-weight: 700; font-size: 15px; color: #c9a44c; min-width: 0;
  letter-spacing: 0; padding-top: 0;
}
#card.tpl-schedule .footer {
  margin-top: 8px; padding-top: 14px; border-top: 1px solid rgba(201,164,76,.18);
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'Pretendard Variable', sans-serif;
}

/* ========== QUOTE : monumental pull-quote ========== */
#card.tpl-quote {
  background: #0a0a0a; color: #f3ecd9; padding: 0; position: relative;
}
#card.tpl-quote::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: #c9a44c; z-index: 2;
}
#card.tpl-quote .quoteInner {
  flex: 1; display: flex; flex-direction: column;
  padding: 32px 34px 26px 38px; position: relative; z-index: 1;
}
#card.tpl-quote .topRow {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 36px;
}
#card.tpl-quote .agency { color: #c9a44c; }
#card.tpl-quote .docType { color: #7a6e55; }
#card.tpl-quote .quoteBox {
  flex: 1; background: transparent; border: none; box-shadow: none;
  border-radius: 0; padding: 0;
  display: flex; flex-direction: column; justify-content: center;
}
#card.tpl-quote .qMark {
  font-family: 'Noto Serif KR', Georgia, serif;
  font-size: 88px; line-height: .7; color: #c9a44c;
  margin: 0 0 8px -4px; font-weight: 900; opacity: 1;
}
#card.tpl-quote .titleText {
  font-size: 23px; font-weight: 700; line-height: 1.42; color: #f8f1e0;
  letter-spacing: -.02em;
}
#card.tpl-quote .bodyText { color: #9e9480; margin-top: 16px; font-size: 13px; }
#card.tpl-quote .speaker {
  margin-top: 32px; padding-top: 16px;
  border-top: 1px solid rgba(201,164,76,.25);
  font-size: 11.5px; font-weight: 700; color: #c9a44c;
  letter-spacing: .08em; text-transform: uppercase;
}
#card.tpl-quote .speaker span {
  display: block; margin: 6px 0 0; font-weight: 500; color: #7a6e55;
  letter-spacing: .04em; text-transform: none; font-size: 12px; opacity: 1;
}
#card.tpl-quote .footer {
  margin-top: 20px; padding-top: 0; border-top: none;
  display: flex; justify-content: space-between; align-items: center;
}

/* Logo / watermark */
#card .logoMark {
  position: absolute; z-index: 12; pointer-events: none;
  object-fit: contain; max-width: 32%; max-height: 14%;
}
#card .logoMark.pos-tr { top: 24px; right: 24px; }
#card .logoMark.pos-tl { top: 24px; left: 24px; }
#card .logoMark.pos-br { bottom: 24px; right: 24px; }
#card .logoMark.pos-bl { bottom: 24px; left: 24px; }
#card .logoMark.pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
#card .logoMark.logoBg {
  background: #fff; padding: 4px 7px; border-radius: 2px;
  box-shadow: 0 2px 14px rgba(0,0,0,.3); box-sizing: border-box;
}
#card.tpl-cover .logoMark.pos-tr,
#card.tpl-cover .logoMark.pos-tl { top: 26px; }
#card.tpl-facts .logoMark.pos-tr,
#card.tpl-facts .logoMark.pos-tl { top: 22px; }
#card.tpl-quote .logoMark.pos-tr { right: 28px; top: 28px; }
#card .wmText {
  position: absolute; z-index: 11; pointer-events: none;
  font-weight: 600; letter-spacing: .12em; white-space: nowrap; line-height: 1.2;
}
#card .wmText.pos-tr { top: 24px; right: 24px; }
#card .wmText.pos-tl { top: 24px; left: 24px; }
#card .wmText.pos-br { bottom: 24px; right: 24px; }
#card .wmText.pos-bl { bottom: 24px; left: 24px; }
#card .wmText.pos-center {
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-28deg);
  letter-spacing: .22em; opacity: .08 !important; font-size: 1.15em !important;
}

#card .photoStrip {
  height: 140px; background-size: cover; background-position: center;
  background-repeat: no-repeat; background-color: #151515; flex: none;
  position: relative; margin: 0; border-radius: 0; overflow: hidden;
}
#card .photoStrip.fit-contain { background-size: contain; }
#card .photoStrip .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #0a0a0a 0%, transparent 40%, #0a0a0a 100%);
}

#right {
  width: 300px; flex: none; background: var(--chrome-panel);
  border-left: 1px solid var(--chrome-line); overflow-y: auto;
}
.sec { padding: 14px 16px; border-bottom: 1px solid var(--chrome-line); }
.sec h3 {
  margin: 0 0 10px; font-size: 11px; font-weight: 700;
  color: var(--chrome-sub); letter-spacing: .06em; text-transform: uppercase;
}
.field { margin-bottom: 11px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 11.5px; color: var(--chrome-sub); margin-bottom: 5px; }
.field input[type=text], .field textarea, .field select, .field input[type=number] {
  width: 100%; background: var(--chrome-input); border: 1px solid var(--chrome-line);
  color: var(--chrome-text); border-radius: 6px; padding: 8px 10px;
  font-size: 12.5px; font-family: inherit; resize: vertical;
}
.field textarea { min-height: 72px; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--accent);
}
.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }
.colorField {
  display: flex; align-items: center; gap: 8px;
  background: var(--chrome-input); border: 1px solid var(--chrome-line);
  border-radius: 6px; padding: 5px 9px;
}
.colorField input[type=color] {
  width: 24px; height: 24px; border: none; background: none; padding: 0; cursor: pointer;
}
.colorField span { font-size: 11px; color: var(--chrome-sub); flex: 1; }
.slider { display: flex; align-items: center; gap: 8px; }
.slider input[type=range] { flex: 1; accent-color: var(--accent); }
.slider .val { font-size: 11px; color: var(--chrome-sub); width: 28px; text-align: right; }
.hint { font-size: 10.5px; color: var(--chrome-sub); margin-top: 5px; line-height: 1.45; }

#undoRedoFloat {
  position: fixed; right: 16px; bottom: 16px; z-index: 90;
  display: flex; gap: 5px; padding: 5px; border-radius: 10px;
  background: rgba(21,27,36,.8); border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
}
#undoRedoFloat button {
  width: 36px; height: 32px; border-radius: 7px;
  background: rgba(255,255,255,.06); color: var(--chrome-text);
  font-size: 14px; font-weight: 700;
}
#undoRedoFloat button:hover:not(:disabled) { background: var(--accent-soft); }
#undoRedoFloat button:disabled { opacity: .3; cursor: default; }

::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: #3a4a60; border-radius: 4px; }

#mobileBar { display: none; gap: 6px; }
@media (max-width: 960px) {
  #left {
    position: fixed; left: 0; top: 54px; bottom: 0; z-index: 80; width: min(260px, 80vw);
    transform: translateX(-105%); transition: transform .2s;
  }
  #left.open { transform: translateX(0); }
  #right {
    position: fixed; right: 0; top: 54px; bottom: 0; z-index: 80; width: min(300px, 88vw);
    transform: translateX(105%); transition: transform .2s;
  }
  #right.open { transform: translateX(0); }
  #stage { padding: 16px; }
  #mobileBar { display: flex !important; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app">

<script>
const $ = id => document.getElementById(id);
const FONTS = {
  pretendard: "'Pretendard Variable', sans-serif",
  ridibatang: "'RidiBatang', 'Noto Serif KR', serif",
  notoserif: "'Noto Serif KR', serif"
};
const TPL_LABEL = {
  cover: 'COVER',
  facts: 'FACTS',
  schedule: 'CLAUSE',
  quote: 'QUOTE'
};

function fontCss(key) { return FONTS[key] || FONTS.pretendard; }

function formatTimeInZone(date, zone) {
  const map = { KST: 'Asia/Seoul', ET: 'America/New_York', PT: 'America/Los_Angeles' };
  const tz = map[zone] || map.KST;
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(date);
    const get = t => (parts.find(p => p.type === t) || {}).value || '';
    return get('year') + '.' + get('month') + '.' + get('day') + ' ' + get('hour') + ':' + get('minute') + ' ' + zone;
  } catch (e) {
    const offset = zone === 'ET' ? -5 : zone === 'PT' ? -8 : 9;
    const d = new Date(date.getTime() + offset * 3600000);
    return d.getUTCFullYear() + '.' +
      String(d.getUTCMonth()+1).padStart(2,'0') + '.' +
      String(d.getUTCDate()).padStart(2,'0') + ' ' +
      String(d.getUTCHours()).padStart(2,'0') + ':' +
      String(d.getUTCMinutes()).padStart(2,'0') + ' ' + zone;
  }
}

function defaults() {
  const zone = 'KST';
  return {
    template: 'cover',
    agency: '관계 기관',
    docType: '보도자료',
    title: '공식 발표 제목을 입력하세요',
    body: '핵심 요지 첫 번째\n핵심 요지 두 번째\n핵심 요지 세 번째',
    highlight: '',
    speaker: '',
    speakerRole: '',
    source: '공식 보도자료',
    sourceUrl: '',
    timezone: zone,
    timestamp: formatTimeInZone(new Date(), zone),
    font: 'pretendard',
    titleFont: '',
    bodyFont: '',
    titleSize: 30,
    bodySize: 13,
    accent: '#c9a44c',
    mk: '#e8d9a8',
    image: null,
    imageFit: 'cover',
    imagePos: 'center',
    imageFilter: 'none',
    logo: null,
    logoPos: 'tr',
    logoSize: 12,
    logoOpacity: 75,
    logoBg: false,
    wmTextOn: false,
    wmText: '요약 · 비공식',
    wmTextPos: 'br',
    wmTextSize: 10,
    wmTextOpacity: 40,
    wmTextColor: '#1b3a5f'
  };
}

let slides = [defaults()];
let active = 0;

function applyHighlight(text, words, mk) {
  if (!text) return '';
  let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  if (!words || !words.trim()) return html;
  words.split(',').map(w => w.trim()).filter(Boolean).forEach(w => {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    html = html.replace(re, '<mark style="background:' + mk + '">$1</mark>');
  });
  return html;
}

function linesOf(body) {
  return String(body || '').split('\n').map(l => l.trim()).filter(Boolean);
}

function filterStyle(s) {
  const f = s.imageFilter || 'none';
  if (f === 'gray') return 'grayscale(1)';
  if (f === 'sepia') return 'sepia(.65)';
  if (f === 'dark') return 'brightness(.75)';
  return 'none';
}
function bgPos(s) {
  const p = s.imagePos || 'center';
  return p === 'top' ? 'center top' : p === 'bottom' ? 'center bottom' : 'center center';
}

function logoHtml(s) {
  let html = '';
  if (s.logo) {
    const pos = s.logoPos || 'tr';
    const size = s.logoSize != null ? s.logoSize : 12;
    const op = (s.logoOpacity != null ? s.logoOpacity : 75) / 100;
    const bg = s.logoBg ? ' logoBg' : '';
    html += '<img class="logoMark pos-' + pos + bg + '" src="' + s.logo + '" alt="" style="width:' + size + '%;opacity:' + op + ';" />';
  }
  if (s.wmTextOn && s.wmText && String(s.wmText).trim()) {
    const pos = s.wmTextPos || 'br';
    const size = s.wmTextSize != null ? s.wmTextSize : 10;
    const op = (s.wmTextOpacity != null ? s.wmTextOpacity : 40) / 100;
    const col = s.wmTextColor || '#1b3a5f';
    const safe = String(s.wmText).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html += '<div class="wmText pos-' + pos + '" style="font-size:' + size + 'px;opacity:' + op + ';color:' + col + ';">' + safe + '</div>';
  }
  return html;
}

function cardMarkup(s) {
  const titleFont = fontCss(s.titleFont || s.font);
  const bodyFont = fontCss(s.bodyFont || s.font);
  const baseFont = fontCss(s.font);
  const accent = s.accent || '#1b3a5f';
  const mk = s.mk || '#c5daf5';
  const titleHtml = applyHighlight(s.title, s.highlight, mk);
  const titleStyle = 'font-family:' + titleFont + ';font-size:' + (s.titleSize || 30) + 'px;';
  const bodyStyle = 'font-family:' + bodyFont + ';font-size:' + (s.bodySize || 13) + 'px;';
  const lines = linesOf(s.body);

  const ruleColor = accent || '#c9a44c';
  const deck = lines.length > 1 ? lines[0] : '';
  const factLines = (s.template === 'facts' && lines.length > 1) ? lines.slice(1) : lines;

  if (s.template === 'cover') {
    const photo = s.image
      ? '<div class="photoStrip' + (s.imageFit === 'contain' ? ' fit-contain' : '') + '" style="background-image:url(\'' + s.image + '\');background-position:' + bgPos(s) + ';filter:' + filterStyle(s) + ';"><div class="scrim"></div></div>'
      : '<div class="photoStrip" style="background:radial-gradient(ellipse at 30% 20%,#2a2418 0%,#0a0a0a 70%);"><div class="scrim"></div></div>';
    const bodyLines = lines.slice(0, 3).join('\n');
    return '<div id="card" class="tpl-cover" style="font-family:' + baseFont + ';">' +
      photo +
      '<div class="coverFrame"></div>' +
      '<div class="headBar">' +
        '<span class="agency">' + (s.agency || 'INSTITUTION') + '</span>' +
        '<span class="docType">' + (s.docType || 'BRIEFING') + '</span>' +
      '</div>' +
      '<div class="bodyArea">' +
        '<div class="kickerLine" style="color:' + ruleColor + ';">SPECIAL REPORT</div>' +
        '<div class="titleText" style="' + titleStyle + '">' + titleHtml + '</div>' +
        '<div class="navyRule" style="background:' + ruleColor + ';"></div>' +
        (bodyLines ? '<div class="bodyText" style="' + bodyStyle + '">' + applyHighlight(bodyLines, s.highlight, mk) + '</div>' : '') +
      '</div>' +
      '<div class="footer">' +
        '<span class="sourceLine">' + (s.source || '') + '</span>' +
        '<span class="timeLine">' + (s.timestamp || '') + '</span>' +
      '</div>' + logoHtml(s) + '</div>';
  }

  if (s.template === 'facts') {
    const listSrc = factLines.length ? factLines : lines;
    const items = listSrc.map(function(line, i) {
      return '<div class="factItem"><div class="factNum">' + String(i + 1).padStart(2, '0') + '</div>' +
        '<div class="factTxt" style="' + bodyStyle + '">' + applyHighlight(line, s.highlight, mk) + '</div></div>';
    }).join('');
    const deckHtml = (lines.length > 1)
      ? '<div class="deck">' + applyHighlight(lines[0], s.highlight, mk) + '</div>'
      : '';
    return '<div id="card" class="tpl-facts" style="font-family:' + baseFont + ';">' +
      '<div class="factsTop">' +
        '<div class="topRow">' +
          '<span class="agency">' + (s.agency || '') + '</span>' +
          '<span class="docType">' + (s.docType || 'FACT SHEET') + '</span>' +
        '</div>' +
        '<div class="mastRule"></div>' +
      '</div>' +
      '<div class="titleText" style="' + titleStyle + '">' + titleHtml + '</div>' +
      deckHtml +
      '<div class="factList">' + (items || '<div class="factTxt">요지를 입력하세요</div>') + '</div>' +
      '<div class="footer">' +
        '<span class="sourceLine">' + (s.source || '') + '</span>' +
        '<span class="timeLine">' + (s.timestamp || '') + '</span>' +
      '</div>' + logoHtml(s) + '</div>';
  }

  if (s.template === 'schedule') {
    const clauses = lines.map(function(line, i) {
      return '<div class="clause"><span class="clauseLabel" style="color:' + ruleColor + ';">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span style="' + bodyStyle + '">' + applyHighlight(line, s.highlight, mk) + '</span></div>';
    }).join('');
    return '<div id="card" class="tpl-schedule">' +
      '<div class="schInner">' +
        '<div class="topCenter">' +
          '<div class="agency">' + (s.agency || 'OFFICIAL') + '</div>' +
          '<span class="docType">' + (s.docType || 'OUTLINE') + '</span>' +
        '</div>' +
        '<div class="titleText" style="' + titleStyle + '">' + titleHtml + '</div>' +
        '<div class="schList">' + (clauses || '<div style="' + bodyStyle + '">항목을 입력하세요</div>') + '</div>' +
        '<div class="footer">' +
          '<span class="sourceLine">' + (s.source || '') + '</span>' +
          '<span class="timeLine">' + (s.timestamp || '') + '</span>' +
        '</div>' +
      '</div>' + logoHtml(s) + '</div>';
  }

  return '<div id="card" class="tpl-quote" style="font-family:' + baseFont + ';">' +
    '<div class="quoteInner">' +
      '<div class="topRow">' +
        '<span class="agency">' + (s.agency || '') + '</span>' +
        '<span class="docType">' + (s.docType || 'STATEMENT') + '</span>' +
      '</div>' +
      '<div class="quoteBox">' +
        '<div class="qMark" style="color:' + ruleColor + ';">“</div>' +
        '<div class="titleText" style="' + titleStyle + '">' + titleHtml + '</div>' +
        (s.body && lines.length ? '<div class="bodyText" style="' + bodyStyle + '">' + applyHighlight(lines.slice(0, 2).join('\n'), s.highlight, mk) + '</div>' : '') +
        ((s.speaker || s.speakerRole) ? '<div class="speaker">' + (s.speaker || '') +
          (s.speakerRole ? '<span>' + s.speakerRole + '</span>' : '') + '</div>' : '') +
      '</div>' +
      '<div class="footer">' +
        '<span class="sourceLine">' + (s.source || '') + '</span>' +
        '<span class="timeLine">' + (s.timestamp || '') + '</span>' +
      '</div>' +
    '</div>' + logoHtml(s) + '</div>';
}

const fullCss = document.querySelector('style').textContent;
const fontLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(l => l.outerHTML).join('');

function renderMain() {
  $('canvasWrap').innerHTML = cardMarkup(slides[active]);
}
function thumbSrcDoc(s) {
  return '<!DOCTYPE html><html><head>' + fontLinks + '<style>' + fullCss + '</style></head><body style="margin:0;">' +
    cardMarkup(s) + '</body></html>';
}
function renderList() {
  const list = $('slideList');
  list.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (i === active ? ' active' : '');
    const iframe = document.createElement('iframe');
    iframe.srcdoc = thumbSrcDoc(s);
    div.appendChild(iframe);
    const idx = document.createElement('div');
    idx.className = 'idx'; idx.textContent = i + 1;
    div.appendChild(idx);
    const tag = document.createElement('div');
    tag.className = 'tag'; tag.textContent = TPL_LABEL[s.template] || s.template;
    div.appendChild(tag);
    const del = document.createElement('div');
    del.className = 'del'; del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); if (slides.length === 1) return; slides.splice(i, 1); if (active >= slides.length) active = slides.length - 1; syncForm(); renderMain(); renderList(); };
    div.appendChild(del);
    div.onclick = () => { active = i; syncForm(); renderMain(); renderList(); };
    list.appendChild(div);
  });
  $('slideCount').textContent = '(' + slides.length + ')';
}

function syncForm() {
  const s = slides[active];
  $('agency').value = s.agency || '';
  $('docType').value = s.docType || '';
  $('titleText').value = s.title || '';
  $('bodyText').value = s.body || '';
  $('highlight').value = s.highlight || '';
  $('speaker').value = s.speaker || '';
  $('speakerRole').value = s.speakerRole || '';
  $('source').value = s.source || '';
  if ($('sourceUrl')) $('sourceUrl').value = s.sourceUrl || '';
  $('timestamp').value = s.timestamp || '';
  if ($('timezone')) $('timezone').value = s.timezone || 'KST';
  $('fontSelect').value = s.font || 'pretendard';
  $('titleFontSelect').value = s.titleFont || '';
  $('bodyFontSelect').value = s.bodyFont || '';
  $('titleSize').value = s.titleSize || 30;
  $('titleSizeVal').textContent = s.titleSize || 30;
  $('bodySize').value = s.bodySize || 13;
  $('bodySizeVal').textContent = s.bodySize || 13;
  $('accentColor').value = s.accent || '#c9a44c';
  $('accentHex').textContent = s.accent || '#c9a44c';
  $('mkColor').value = s.mk || '#e8d9a8';
  $('mkHex').textContent = s.mk || '#e8d9a8';
  if ($('imageFit')) $('imageFit').value = s.imageFit || 'cover';
  if ($('imagePos')) $('imagePos').value = s.imagePos || 'center';
  if ($('imageFilter')) $('imageFilter').value = s.imageFilter || 'none';
  if ($('logoPos')) $('logoPos').value = s.logoPos || 'tr';
  if ($('logoSize')) { $('logoSize').value = s.logoSize != null ? s.logoSize : 12; $('logoSizeVal').textContent = s.logoSize != null ? s.logoSize : 12; }
  if ($('logoOpacity')) { $('logoOpacity').value = s.logoOpacity != null ? s.logoOpacity : 75; $('logoOpacityVal').textContent = s.logoOpacity != null ? s.logoOpacity : 75; }
  if ($('logoBg')) $('logoBg').checked = !!s.logoBg;
  if ($('logoThumb')) $('logoThumb').style.backgroundImage = s.logo ? "url('" + s.logo + "')" : 'none';
  if ($('wmTextOn')) $('wmTextOn').checked = !!s.wmTextOn;
  if ($('wmText')) $('wmText').value = s.wmText || '';
  if ($('wmTextPos')) $('wmTextPos').value = s.wmTextPos || 'br';
  if ($('wmTextSize')) { $('wmTextSize').value = s.wmTextSize != null ? s.wmTextSize : 10; $('wmTextSizeVal').textContent = s.wmTextSize != null ? s.wmTextSize : 10; }
  if ($('wmTextOpacity')) { $('wmTextOpacity').value = s.wmTextOpacity != null ? s.wmTextOpacity : 40; $('wmTextOpacityVal').textContent = s.wmTextOpacity != null ? s.wmTextOpacity : 40; }
  if ($('wmTextColor')) { $('wmTextColor').value = s.wmTextColor || '#1b3a5f'; if ($('wmTextColorHex')) $('wmTextColorHex').textContent = s.wmTextColor || '#1b3a5f'; }
  Array.from(document.querySelectorAll('#tplMenu .ddItem')).forEach(el => {
    el.classList.toggle('active', el.dataset.tpl === s.template);
  });
}

function bind(id, prop) {
  const el = $(id);
  if (!el) return;
  el.addEventListener('input', e => {
    slides[active][prop] = e.target.value;
    renderMain(); renderList();
  });
}
['agency','docType','titleText','bodyText','highlight','speaker','speakerRole','source','sourceUrl','timestamp'].forEach(id => {
  const map = { titleText: 'title', bodyText: 'body' };
  bind(id, map[id] || id);
});

$('fontSelect').addEventListener('change', e => { slides[active].font = e.target.value; renderMain(); renderList(); });
$('titleFontSelect').addEventListener('change', e => { slides[active].titleFont = e.target.value; renderMain(); renderList(); });
$('bodyFontSelect').addEventListener('change', e => { slides[active].bodyFont = e.target.value; renderMain(); renderList(); });
$('titleSize').addEventListener('input', e => { slides[active].titleSize = +e.target.value; $('titleSizeVal').textContent = e.target.value; renderMain(); renderList(); });
$('bodySize').addEventListener('input', e => { slides[active].bodySize = +e.target.value; $('bodySizeVal').textContent = e.target.value; renderMain(); renderList(); });
$('accentColor').addEventListener('input', e => { slides[active].accent = e.target.value; $('accentHex').textContent = e.target.value; renderMain(); renderList(); });
$('mkColor').addEventListener('input', e => { slides[active].mk = e.target.value; $('mkHex').textContent = e.target.value; renderMain(); renderList(); });

if ($('imageFit')) $('imageFit').addEventListener('change', e => { slides[active].imageFit = e.target.value; renderMain(); renderList(); });
if ($('imagePos')) $('imagePos').addEventListener('change', e => { slides[active].imagePos = e.target.value; renderMain(); renderList(); });
if ($('imageFilter')) $('imageFilter').addEventListener('change', e => { slides[active].imageFilter = e.target.value; renderMain(); renderList(); });
if ($('timezone')) $('timezone').addEventListener('change', e => { slides[active].timezone = e.target.value; });
if ($('nowTimeBtn')) $('nowTimeBtn').addEventListener('click', () => {
  const zone = ($('timezone') && $('timezone').value) || 'KST';
  slides[active].timezone = zone;
  slides[active].timestamp = formatTimeInZone(new Date(), zone);
  $('timestamp').value = slides[active].timestamp;
  renderMain(); renderList();
});

function applyLogoProp(prop, value) {
  const scope = ($('logoScope') && $('logoScope').value) || 'one';
  if (scope === 'all') slides.forEach(sl => { sl[prop] = value; });
  else slides[active][prop] = value;
  renderMain(); renderList();
}
if ($('logoUploadBtn')) $('logoUploadBtn').addEventListener('click', () => $('logoUpload') && $('logoUpload').click());
if ($('logoUpload')) $('logoUpload').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 400 / img.width);
      const c = document.createElement('canvas');
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      applyLogoProp('logo', c.toDataURL('image/png'));
      if ($('logoThumb')) $('logoThumb').style.backgroundImage = "url('" + slides[active].logo + "')";
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
if ($('logoRemove')) $('logoRemove').addEventListener('click', () => {
  applyLogoProp('logo', null);
  if ($('logoThumb')) $('logoThumb').style.backgroundImage = 'none';
});
if ($('logoPos')) $('logoPos').addEventListener('change', e => applyLogoProp('logoPos', e.target.value));
if ($('logoSize')) $('logoSize').addEventListener('input', e => { $('logoSizeVal').textContent = e.target.value; applyLogoProp('logoSize', +e.target.value); });
if ($('logoOpacity')) $('logoOpacity').addEventListener('input', e => { $('logoOpacityVal').textContent = e.target.value; applyLogoProp('logoOpacity', +e.target.value); });
if ($('logoBg')) $('logoBg').addEventListener('change', e => applyLogoProp('logoBg', e.target.checked));
if ($('wmTextOn')) $('wmTextOn').addEventListener('change', e => applyLogoProp('wmTextOn', e.target.checked));
if ($('wmText')) $('wmText').addEventListener('input', e => applyLogoProp('wmText', e.target.value));
if ($('wmTextPos')) $('wmTextPos').addEventListener('change', e => applyLogoProp('wmTextPos', e.target.value));
if ($('wmTextSize')) $('wmTextSize').addEventListener('input', e => { $('wmTextSizeVal').textContent = e.target.value; applyLogoProp('wmTextSize', +e.target.value); });
if ($('wmTextOpacity')) $('wmTextOpacity').addEventListener('input', e => { $('wmTextOpacityVal').textContent = e.target.value; applyLogoProp('wmTextOpacity', +e.target.value); });
if ($('wmTextColor')) $('wmTextColor').addEventListener('input', e => { if ($('wmTextColorHex')) $('wmTextColorHex').textContent = e.target.value; applyLogoProp('wmTextColor', e.target.value); });

Array.from(document.querySelectorAll('#tplMenu .ddItem')).forEach(item => {
  item.addEventListener('click', () => {
    slides[active].template = item.dataset.tpl;
    syncForm(); renderMain(); renderList();
    closeMenus();
  });
});

function closeMenus() {
  Array.from(document.querySelectorAll('.dropdown')).forEach(d => d.classList.remove('open'));
}
function bindMenu(btnId, ddId) {
  $(btnId).addEventListener('click', e => {
    e.stopPropagation();
    const dd = $(ddId);
    const open = dd.classList.contains('open');
    closeMenus();
    if (!open) dd.classList.add('open');
  });
}
bindMenu('tplMenuBtn', 'tplMenu');
bindMenu('fontMenuBtn', 'fontMenu');
bindMenu('photoMenuBtn', 'photoMenu');
document.addEventListener('click', e => {
  if (e.target && e.target.closest && e.target.closest('.menuWrap')) return;
  closeMenus();
});
Array.from(document.querySelectorAll('.dropdown')).forEach(dd => {
  dd.addEventListener('click', e => e.stopPropagation());
  dd.addEventListener('mousedown', e => e.stopPropagation());
});

$('addSlide').addEventListener('click', () => {
  const next = JSON.parse(JSON.stringify(slides[active]));
  slides.splice(active + 1, 0, next);
  active = active + 1;
  syncForm(); renderMain(); renderList();
});

$('uploadBtn').addEventListener('click', () => $('imageUpload').click());
$('imageUpload').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1200 / img.width);
      const c = document.createElement('canvas');
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      slides[active].image = c.toDataURL('image/jpeg', 0.88);
      renderMain(); renderList();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
$('imageRemove').addEventListener('click', () => {
  slides[active].image = null;
  renderMain(); renderList();
});

async function captureBlob(node) {
  const canvas = await html2canvas(node, { backgroundColor: null, scale: 2, useCORS: true, logging: false, allowTaint: true });
  return new Promise(r => canvas.toBlob(b => r(b), 'image/png', 0.95));
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
$('exportOne').addEventListener('click', async () => {
  try {
    const blob = await captureBlob($('canvasWrap'));
    if (blob) downloadBlob(blob, 'briefing_' + (active + 1) + '.png');
  } catch (e) { alert('저장 실패'); }
});
$('exportAll').addEventListener('click', async () => {
  const orig = active;
  try {
    const zip = new JSZip();
    for (let i = 0; i < slides.length; i++) {
      active = i; renderMain();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const blob = await captureBlob($('canvasWrap'));
      if (blob) zip.file('briefing_' + (i + 1) + '.png', blob);
    }
    downloadBlob(await zip.generateAsync({ type: 'blob' }), 'briefing_cards.zip');
  } catch (e) { alert('ZIP 저장 실패'); }
  active = orig; renderMain(); renderList();
});

/* Undo */
let history = [], histIdx = -1, applying = false, histTimer = null;
function pushHist() {
  if (applying) return;
  const snap = JSON.stringify({ slides, active });
  if (histIdx >= 0 && history[histIdx] === snap) return;
  history = history.slice(0, histIdx + 1);
  history.push(snap);
  if (history.length > 40) history.shift();
  histIdx = history.length - 1;
  updateUndo();
}
function scheduleHist() {
  if (applying) return;
  clearTimeout(histTimer);
  histTimer = setTimeout(pushHist, 300);
}
function restore(idx) {
  if (idx < 0 || idx >= history.length) return;
  applying = true;
  try {
    const data = JSON.parse(history[idx]);
    slides = data.slides; active = data.active; histIdx = idx;
    syncForm(); renderMain(); renderList(); updateUndo();
  } finally { applying = false; }
}
function updateUndo() {
  $('undoBtn').disabled = histIdx <= 0;
  $('redoBtn').disabled = histIdx >= history.length - 1;
}
$('undoBtn').addEventListener('click', () => { if (histIdx > 0) restore(histIdx - 1); });
$('redoBtn').addEventListener('click', () => { if (histIdx < history.length - 1) restore(histIdx + 1); });
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); if (histIdx > 0) restore(histIdx - 1); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); if (histIdx < history.length - 1) restore(histIdx + 1); }
});
const _rm = renderMain;
renderMain = function () { _rm(); if (!applying) scheduleHist(); };

(function () {
  const left = $('left'), right = $('right');
  if ($('mobileSlidesBtn')) $('mobileSlidesBtn').addEventListener('click', e => {
    e.stopPropagation(); right.classList.remove('open'); left.classList.toggle('open');
  });
  if ($('mobilePanelBtn')) $('mobilePanelBtn').addEventListener('click', e => {
    e.stopPropagation(); left.classList.remove('open'); right.classList.toggle('open');
  });
})();

syncForm();
renderMain();
renderList();
pushHist();
updateUndo();
</script>
