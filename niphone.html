<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 템플릿 에디터 · iPhone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu:wght@400;700&family=Song+Myung&family=Poor+Story&family=Gamja+Flower&family=East+Sea+Dokdo&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Inter:wght@400;500;700;800;900&family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
@font-face{
  font-family:'RIDIBatang';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
  font-weight:normal; font-style:normal; font-display:swap;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --bg-app:#0e0f11; --panel:#17181b; --panel2:#1f2024; --line:#2a2b30;
    --text:#eceded; --text-dim:#98999e; --accent-ui:#e5372f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg-app); color:var(--text); font-family:'Pretendard','Noto Sans KR',sans-serif; min-height:100vh; }

  .app{ display:grid; grid-template-columns: 380px 1fr; min-height:100vh; }
  @media (max-width: 900px){ .app{ grid-template-columns: 1fr; } }

  /* ---------------- Sidebar ---------------- */
  .sidebar{ background:var(--panel); border-right:1px solid var(--line); padding:22px 20px 60px; overflow-y:auto; max-height:100vh; }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .brand .mark{ width:9px; height:9px; border-radius:50%; background:var(--accent-ui); }
  .brand h1{ font-size:15px; font-weight:800; letter-spacing:.01em; margin:0; }
  .brand-sub{ font-size:11.5px; color:var(--text-dim); margin:3px 0 18px; }

  .device-badge{ display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:11.5px; color:var(--text-dim); margin-bottom:18px; }
  .device-badge b{ color:var(--text); }

  .tabs{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:6px; }
  .tab{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 3px 7px; text-align:center; cursor:pointer; color:var(--text-dim); transition:.15s; }
  .tab .num{ font-size:10px; font-weight:800; display:block; color:var(--accent-ui); }
  .tab .name{ font-size:9.3px; font-weight:600; display:block; margin-top:2px; line-height:1.2; }
  .tab.active{ background:var(--accent-ui); border-color:var(--accent-ui); color:#fff; }
  .tab.active .num{ color:#ffd8d5; }
  .tab:hover:not(.active){ border-color:#454650; }

  .panelgroup{ margin-top:20px; border-top:1px solid var(--line); padding-top:14px; }
  .subtabs{ display:flex; gap:6px; margin-bottom:14px; }
  .subtab{ flex:1; text-align:center; padding:8px 6px; font-size:12px; font-weight:700; border-radius:7px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; color:var(--text-dim); }
  .subtab.active{ background:#2a2b30; color:#fff; border-color:#454650; }

  .section-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:18px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .field{ margin-bottom:13px; }
  .field label{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field label span.val{ color:#fff; font-weight:700; }
  .field input[type=text], .field textarea, .field select{
    width:100%; background:#0d0e10; border:1px solid var(--line); border-radius:7px; color:var(--text);
    font-family:inherit; font-size:13px; padding:9px 10px; resize:vertical; outline:none;
  }
  .field textarea{ min-height:52px; line-height:1.4; overflow:hidden; }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent-ui); }
  .field input[type=range]{ width:100%; accent-color: var(--accent-ui); }
  .field .hint{ font-size:10.5px; color:#63646a; margin-top:5px; }
  .checkrow{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:13px; }
  .checkrow input{ width:16px; height:16px; accent-color:var(--accent-ui); }

  .colorfield{ display:flex; align-items:center; gap:8px; }
  .colorfield input[type=color]{ width:38px; height:34px; padding:0; border:1px solid var(--line); border-radius:7px; background:#0d0e10; cursor:pointer; }
  .swatches{ display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
  .swatch{ width:18px; height:18px; border-radius:5px; border:1px solid rgba(255,255,255,.25); cursor:pointer; }

  .imgrow{ display:flex; gap:8px; }
  .imgrow input[type=text]{ flex:1; }
  .btn-mini{ flex-shrink:0; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:0 11px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-mini:hover{ border-color:#4a4b54; }
  .btn-row{ display:flex; gap:6px; margin-top:8px; }
  input[type=file]{ display:none; }

  .actions{ margin-top:24px; display:flex; flex-direction:column; gap:8px; }
  .btn{ border:none; border-radius:9px; padding:12px 14px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--accent-ui); color:#fff; }
  .btn-primary:hover{ background:#c92e27; }
  .btn-primary:disabled{ background:#5a3230; cursor:wait; }
  .btn-secondary{ background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .btn-secondary:hover{ border-color:#4a4b54; }

  /* ---------------- Preview / iPhone frame ---------------- */
  .preview-area{ display:flex; flex-direction:column; align-items:center; padding:44px 24px 60px; overflow-y:auto; }
  .preview-label{ color:var(--text-dim); font-size:12px; margin-bottom:20px; letter-spacing:.02em; }
  .preview-label b{ color:#fff; }

  .phone{
    position:relative; width:300px; height:650px;
    background:#050505; border-radius:52px; padding:14px;
    box-shadow: 0 0 0 2px #2c2d30 inset, 0 40px 80px -30px rgba(0,0,0,.75);
    transition: width .2s, height .2s, border-radius .2s;
  }
  .phone.device-iphone{ width:300px; height:650px; border-radius:52px; }
  .phone.device-galaxy{ width:300px; height:667px; border-radius:44px; }
  .phone.device-common{ width:300px; height:533px; border-radius:28px; }

  .phone::before{
    content:''; position:absolute; right:-2px; top:150px; width:3px; height:56px; background:#3a3b3f; border-radius:2px 0 0 2px;
  }
  .phone::after{
    content:''; position:absolute; left:-2px; top:120px; width:3px; height:34px; background:#3a3b3f; border-radius:0 2px 2px 0;
    box-shadow: 0 46px 0 0 #3a3b3f, 0 92px 0 0 #3a3b3f;
  }
  .screen{
    position:relative; width:100%; height:100%; border-radius:40px; overflow:hidden; background:#000;
  }
  .island{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:84px; height:24px; background:#000; border-radius:14px; z-index:20;
  }
  .card{ width:100%; height:100%; position:relative; overflow:hidden; font-family:'Pretendard',sans-serif; }

  .export-note{ margin-top:18px; font-size:11px; color:#63646a; text-align:center; max-width:320px; line-height:1.6; }

  /* ============ Template base helpers ============ */
  .card > div{ width:100%; height:100%; }
  .img-fit{ position:relative; overflow:hidden; background-color:#111; width:100%; height:100%; isolation:isolate; }
  .img-fit .img-el{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .img-fit-original .img-el{ width:auto !important; height:auto !important; inset:auto; }
  .img-fit .img-overlay{ position:absolute; inset:0; pointer-events:none; }
  .tpl-broadcast{ position:relative; }

  /* ===== 01 Breaking News ===== */
  .tpl-breaking{ background:#050506; color:#fff; display:flex; flex-direction:column; }
  .tpl-breaking .top{ padding:44px 20px 0; display:flex; justify-content:space-between; align-items:center; }
  .tpl-breaking .live{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.05em; }
  .tpl-breaking .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .tpl-breaking .logo{ font-size:11px; font-weight:700; letter-spacing:.05em; color:#c8c8c8; }
  .tpl-breaking .headline{ text-transform:uppercase; padding:16px 20px 0; }
  .tpl-breaking .headline div{ line-height:0.98; letter-spacing:-0.01em; }
  .tpl-breaking .meta{ padding:12px 20px 14px; font-size:11px; color:#b8b8b8; display:flex; gap:10px; }
  .tpl-breaking .meta b{ color:#fff; font-weight:700; }
  .tpl-breaking .photo{ flex:1; min-height:0; position:relative; }
  .tpl-breaking .photo-veil{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.88) 100%); z-index:2; }
  .tpl-breaking .bottom{ position:relative; z-index:3; padding:16px 20px 30px; display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }
  .tpl-breaking .bottom h3{ margin:0 0 6px; font-weight:700; }
  .tpl-breaking .bottom h3 div{ line-height:1.2; }
  .tpl-breaking .bottom .body-lines{ margin:0; font-size:11.5px; color:#c3c3c3; line-height:1.4; }
  .tpl-breaking .bottom .body-lines div{ line-height:1.4; }
  .tpl-breaking .bottom .source{ font-size:10px; color:#888; margin-top:6px; }
  .tpl-breaking .arrow{ flex-shrink:0; width:38px; height:38px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; }

  /* ===== 03 Broadcast Screen ===== */
  .tpl-broadcast{ background:#04060c; color:#fff; position:relative; overflow:hidden; }
  .tpl-broadcast .bgimg{ position:absolute; left:0; right:0; top:0; height:44%; z-index:0; overflow:hidden; }
  .tpl-broadcast .veil{ position:absolute; left:0; right:0; top:0; height:44%; z-index:1; background:linear-gradient(180deg, rgba(2,4,10,.25) 0%, rgba(2,4,10,.08) 48%, rgba(2,4,10,.72) 100%); pointer-events:none; }
  .tpl-broadcast .inner{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; height:100%; }
  .tpl-broadcast .top{ padding:44px 20px 0; display:flex; justify-content:space-between; align-items:center; }
  .tpl-broadcast .logo{ font-size:12px; font-weight:800; letter-spacing:.04em; }
  .tpl-broadcast .live{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; }
  .tpl-broadcast .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .tpl-broadcast .spacer{ flex:1; }
  .tpl-broadcast .bottom-group{ padding:16px 0 26px; background:#04060c; }
  .tpl-broadcast .headline{ padding:0 20px; margin-bottom:14px; text-transform:uppercase; }
  .tpl-broadcast .headline div{ line-height:1.1; letter-spacing:-0.01em; }
  .tpl-broadcast .badge-row{ padding:0 20px; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tpl-broadcast .badge{ background:var(--accent); font-size:10px; font-weight:800; letter-spacing:.04em; padding:5px 9px; border-radius:3px; }
  .tpl-broadcast .badge-date{ font-size:11px; color:#cfd2da; }
  .tpl-broadcast .desc{ padding:0 20px; line-height:1.5; color:#d7d9df; margin-bottom:8px; }
  .tpl-broadcast .desc div{ line-height:1.5; }
  .tpl-broadcast .source{ padding:0 20px 10px; font-size:10px; color:#9aa0aa; }
  .tpl-broadcast .ticker{ background:#1259d8; padding:11px 16px; font-size:11px; font-weight:600; display:flex; gap:8px; align-items:center; }
  .tpl-broadcast .ticker .next{ background:rgba(255,255,255,.18); padding:3px 8px; border-radius:3px; font-weight:800; font-size:10px; flex-shrink:0; }

  /* ===== 04 Magazine News ===== */
  .tpl-magazine{ background:#efe9df; color:#171512; display:flex; flex-direction:column; }
  .tpl-magazine .top{ padding:44px 20px 0; display:flex; justify-content:space-between; align-items:baseline; }
  .tpl-magazine .logo{ font-size:12px; font-weight:800; letter-spacing:.05em; }
  .tpl-magazine .date{ font-size:10.5px; color:#6b6558; }
  .tpl-magazine .badge{ display:inline-block; background:var(--accent); color:#fff; font-size:9.5px; font-weight:800; letter-spacing:.04em; padding:4px 9px; border-radius:2px; margin:16px 20px 8px; }
  .tpl-magazine .headline{ padding:0 20px; margin:0 0 12px; }
  .tpl-magazine .headline div{ line-height:1.16; }
  .tpl-magazine hr{ border:none; border-top:1px solid #cfc7b8; margin:0 20px 14px; }
  .tpl-magazine .photo{ margin:0 20px; height:190px; border-radius:2px; flex-shrink:0; overflow:hidden; position:relative; }
  .tpl-magazine .desc{ padding:14px 20px 0; line-height:1.6; color:#3a352d; flex:1; }
  .tpl-magazine .desc div{ line-height:1.6; }
  .tpl-magazine .source{ padding:4px 20px 0; font-size:10px; color:#6b6558; }
  .tpl-magazine .footer{ padding:10px 20px 26px; display:flex; align-items:flex-end; justify-content:flex-end; }
  .tpl-magazine .bignum{ font-weight:700; line-height:1; border-top:2px solid var(--accent); padding-top:6px; }

  /* ===== 07 Column Opinion ===== */
  .tpl-column{ background:#efe9df; color:#171512; display:flex; flex-direction:column; padding:44px 22px 26px; }
  .tpl-column .top{ display:flex; justify-content:space-between; align-items:center; }
  .tpl-column .cat{ color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.06em; }
  .tpl-column .top-right{ text-align:right; font-size:10px; color:#6b6558; }
  .tpl-column .top-right .logo{ font-weight:800; font-size:11.5px; color:#171512; display:block; }
  .tpl-column .headline{ margin:16px 0 14px; }
  .tpl-column .headline div{ line-height:1.22; }
  .tpl-column .byline{ display:flex; align-items:center; gap:9px; margin-bottom:16px; }
  .tpl-column .avatar{ width:36px; height:36px; border-radius:50%; flex-shrink:0; background-color:#c9c2b3; overflow:hidden; }
  .tpl-column .byline b{ font-size:12px; display:block; font-weight:700; }
  .tpl-column .byline span{ font-size:10.5px; color:#6b6558; }
  .tpl-column .body{ line-height:1.7; color:#2c2820; flex:1; }
  .tpl-column .dropcap{ float:left; font-size:2.9em; font-weight:700; line-height:.8; padding:4px 6px 0 0; }
  .tpl-column .quote{ border-top:1px solid #cfc7b8; margin-top:16px; padding-top:14px; display:flex; gap:10px; align-items:flex-start; }
  .tpl-column .quote .mark{ font-size:28px; color:var(--accent); line-height:.6; flex-shrink:0; }
  .tpl-column .quote .quote-text p{ font-style:italic; line-height:1.45; margin:0; }
  .tpl-column .source{ margin-top:12px; font-size:10px; color:#6b6558; }

  /* ===== 08 Mobile News Card ===== */
  .tpl-mobile{ background:#0a0b0d; color:#fff; display:flex; flex-direction:column; }
  .tpl-mobile .navbar{ display:flex; align-items:center; justify-content:space-between; padding:46px 18px 0; }
  .tpl-mobile .navbar .icon{ font-size:15px; color:#c7c8cc; }
  .tpl-mobile .navbar .logo{ font-weight:800; font-size:14px; letter-spacing:.02em; }
  .tpl-mobile .tabbar{ display:flex; gap:15px; padding:16px 18px 12px; font-size:11px; font-weight:700; color:#8b8c92; border-bottom:1px solid #1c1d21; overflow-x:auto; }
  .tpl-mobile .tabbar span{ flex-shrink:0; }
  .tpl-mobile .tabbar .active{ color:var(--accent); }
  .tpl-mobile .content{ padding:16px; flex:1; display:flex; flex-direction:column; min-height:0; }
  .tpl-mobile .photo{ height:220px; border-radius:12px; margin-bottom:14px; flex-shrink:0; overflow:hidden; position:relative; }
  .tpl-mobile .badge{ display:inline-block; background:var(--accent); font-size:9.5px; font-weight:800; letter-spacing:.04em; padding:4px 9px; border-radius:3px; margin-bottom:10px; }
  .tpl-mobile .headline{ margin-bottom:10px; }
  .tpl-mobile .headline div{ line-height:1.28; }
  .tpl-mobile .desc{ color:#a9aaae; line-height:1.5; margin-bottom:14px; flex:1; }
  .tpl-mobile .desc div{ line-height:1.5; }
  .tpl-mobile .footer-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:10.5px; color:#7d7e83; border-top:1px solid #1c1d21; padding-top:12px; flex-wrap:wrap; }
  .tpl-mobile .footer-row .read{ color:var(--accent); font-weight:700; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand"><span class="mark"></span><h1>NEWS TEMPLATE EDITOR</h1></div>
    <div class="brand-sub">뉴스형 템플릿 편집기 · 아이폰 전용</div>
    <div class="device-badge" style="flex-direction:column; align-items:stretch; gap:8px;">
  <div style="display:flex; align-items:center; gap:6px;">
    📱 기기 규격
  </div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
    <button type="button" class="btn-mini device-btn active" data-device="iphone" style="padding:8px 4px;">아이폰</button>
    <button type="button" class="btn-mini device-btn" data-device="galaxy" style="padding:8px 4px;">갤럭시</button>
    <button type="button" class="btn-mini device-btn" data-device="common" style="padding:8px 4px;">공용</button>
  </div>
  <div style="font-size:11px; color:var(--text-dim);">
    내보내기 <b id="exportSizeLabel">1179 × 2556px</b>
  </div>
</div>

    <div class="tabs" id="tabs"></div>

    <div class="panelgroup">
      <div class="subtabs">
        <div class="subtab active" data-panel="content">내용</div>
        <div class="subtab" data-panel="design">디자인</div>
        <div class="subtab" data-panel="image">이미지</div>
      </div>
      <div id="panel-content"></div>
      <div id="panel-design" style="display:none;"></div>
      <div id="panel-image" style="display:none;"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="downloadBtn">📥 PNG로 저장</button>
      <button class="btn btn-secondary" id="resetBtn">이 템플릿 초기화</button>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-label">미리보기 &nbsp;<b id="previewName">01 BREAKING NEWS</b></div>
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="card" id="card"></div>
      </div>
    </div>
    <div class="export-note">저장 시 이미지가 자동으로 안전한 형식으로 변환되어 화면 그대로 PNG로 내려받아져요.</div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   유틸
--------------------------------------------------------- */
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const lines = s => (s||'').split('\n').map(l =>
  l === '' ? `<div style="min-height:1em;">&nbsp;</div>` : `<div>${esc(l)}</div>`
).join('');
const linesP = s => (s||'').split('\n').map(l =>
  l === '' ? `<p style="margin:0;min-height:1em;">&nbsp;</p>` : `<p style="margin:0;">${esc(l)}</p>`
).join('');
const nl2br = s => esc(s||'').replace(/\n/g,'<br>');

function fontStack(name){
  const serifSet = ['RIDIBatang','Noto Serif KR','Playfair Display','DM Serif Display','Gowun Batang','Nanum Myeongjo','Song Myung'];
  const fallback = serifSet.includes(name) ? 'serif' : 'sans-serif';
  return `'${name}', 'Pretendard', 'Noto Sans KR', ${fallback}`;
}

const FONT_GROUPS = [
  { label:'한국어 · 필수', options:[
    { v:'Pretendard', l:'Pretendard 프리텐다드' },
    { v:'RIDIBatang', l:'RIDIBatang 리디바탕' },
  ]},
  { label:'한국어 · 고딕', options:[
    { v:'Noto Sans KR', l:'Noto Sans KR' },
    { v:'Nanum Gothic', l:'나눔고딕' },
    { v:'Black Han Sans', l:'검은고딕' },
    { v:'Do Hyeon', l:'도현체' },
    { v:'Jua', l:'주아체' },
    { v:'Gowun Dodum', l:'고운돋움' },

  none:{label:'원본', css:'none'},

/* ---------------------------------------------------------
   이미지 태그: fit / zoom / position / filter 적용
--------------------------------------------------------- */
function imgFitHTML(src, style, extraClass=''){
  const fit = style.imgFit || 'cover';
  const objectFit = fit === 'fill' ? 'fill' : (fit === 'original' ? 'none' : fit);
  const zoom = style.imgZoom || 100;
  const posX = style.imgPosX ?? 50;
  const posY = style.imgPosY ?? 50;
  const filterCss = (FILTERS[style.imgFilter]||FILTERS.none).css;
  const transform = fit === 'original'
    ? `translate(-50%, -50%) scale(${zoom/100})`
    : (objectFit === 'contain' ? 'none' : `scale(${zoom/100})`);
  const originalClass = fit === 'original' ? ' img-fit-original' : '';
  const overlay = style.imgFilter === 'duo'
    ? `<div class="img-overlay" style="background:${style.accentColor||'#e5372f'};mix-blend-mode:color;opacity:.75;"></div>`
    : '';
  return `<div class="img-fit${originalClass} ${extraClass}">
    <img class="img-el" src="${src}" style="object-fit:${objectFit};object-position:${posX}% ${posY}%;filter:${filterCss};transform:${transform};transform-origin:center center;left:${posX}%;top:${posY}%;right:auto;bottom:auto;">
    ${overlay}
  </div>`;
}

function textStyle(style, prefix){
  const font = style[prefix+'Font'];
  const size = style[prefix+'Size'];
  const color = style[prefix+'Color'];
  const underline = style[prefix+'Underline'];
  return `font-family:${fontStack(font)};font-size:${size}px;color:${color};${underline?`text-decoration:underline;text-decoration-color:${style.accentColor||color};text-decoration-thickness:2px;text-underline-offset:4px;`:''}`;
}

/* 기본 플레이스홀더(SVG data URI)도 data: 로 시작하기 때문에, 실제 사용자가 업로드한 사진(jpeg/png 등)인지 구분해서 안내 문구가 잘못 뜨지 않도록 함 */
function isUploadedImage(src){
  return !!src && src.startsWith('data:') && !src.startsWith('data:image/svg+xml');

function placeholderImage(label, w, h, bg){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>`+
    `<rect width='100%' height='100%' fill='${bg}'/>`+
    `<text x='50%' y='50%' font-family='sans-serif' font-size='${Math.round(w*0.05)}' fill='rgba(255,255,255,.85)' text-anchor='middle' dominant-baseline='middle'>${label}</text>`+
  `</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

  }).join('');

  // LIVE 토글 (breaking / broadcast)

    el.innerHTML += `

      </div>`;
    el.querySelector('#showLive').addEventListener('change', (e)=>{
      state[current].data.showLive = e.target.checked;
      renderCard();

  el.querySelectorAll('[data-k]').forEach(input=>{
    if(input.tagName === 'TEXTAREA'){
      autoGrow(input); // 엔터로 줄이 늘어나면 박스 높이도 즉시 같이 늘어나도록 처리

      renderCard();
    });
  });

    <div class="field"><select data-sk="headlineFont">${fontOptionsHTML(s.headlineFont)}</select></div>
    <div class="field"><label>크기 <span class="val" data-show="headlineSize">${s.headlineSize}px</span></label>
      <input type="range" min="14" max="72" step="1" data-sk="headlineSize" value="${s.headlineSize}"></div>
    <div class="field"><label>색상</label>
      <div class="colorfield"><input type="color" data-sk="headlineColor" value="${s.headlineColor}"><span style="font-size:11px;color:var(--text-dim)">${s.headlineColor}</span></div>
      ${swatchesHTML('headlineColor')}
    </div>
    <div class="checkrow"><input type="checkbox" id="ul" data-sk="headlineUnderline" ${s.headlineUnderline?'checked':''}><label for="ul" style="margin:0;color:var(--text)">밑줄 표시 (강조색으로 표시돼요)</label></div>

    <div class="section-title">본문 글꼴</div>
    <div class="field"><select data-sk="bodyFont">${fontOptionsHTML(s.bodyFont)}</select></div>
    <div class="field"><label>크기 <span class="val" data-show="bodySize">${s.bodySize}px</span></label>
      <input type="range" min="9" max="28" step="0.5" data-sk="bodySize" value="${s.bodySize}"></div>
    <div class="field"><label>색상</label>
      <div class="colorfield"><input type="color" data-sk="bodyColor" value="${s.bodyColor}"><span style="font-size:11px;color:var(--text-dim)">${s.bodyColor}</span></div>
      ${swatchesHTML('bodyColor')}
    </div>

    <div class="section-title">강조색 (배지 · 라이브점 · 밑줄 · 듀오톤)</div>
    <div class="field">
      <div class="colorfield"><input type="color" data-sk="accentColor" value="${s.accentColor}"><span style="font-size:11px;color:var(--text-dim)">${s.accentColor}</span></div>
      ${swatchesHTML('accentColor')}
    </div>
    ${current === 'broadcast' ? `
    <div class="section-title">하단 티커 바 색상</div>
    <div class="field">
      <div class="colorfield"><input type="color" data-sk="tickerColor" value="${s.tickerColor}"><span style="font-size:11px;color:var(--text-dim)">${s.tickerColor}</span></div>
      ${swatchesHTML('tickerColor')}
    </div>` : ''}
  `;
  bindDesignInputs();
}

function bindDesignInputs(){
  const el = document.getElementById('panel-design');
  el.querySelectorAll('[data-sk]').forEach(input=>{
    const key = input.dataset.sk;
    const handler = ()=>{
      const val = input.type === 'checkbox' ? input.checked
                 : input.type === 'range' ? parseFloat(input.value)
                 : input.value;
      state[current].style[key] = val;
      const showEl = el.querySelector(`[data-show="${key}"]`);
      if(showEl) showEl.textContent = val + 'px';
      if(input.type === 'color'){
        const swSpan = input.parentElement.querySelector('span');
        if(swSpan) swSpan.textContent = val;
      }
      applyAccentCSSVar();
      renderCard();
    };
    input.addEventListener('input', handler);
  });
  el.querySelectorAll('[data-swatch]').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      const key = sw.dataset.swatch;
      const color = sw.dataset.color;
      state[current].style[key] = color;
      buildDesignPanel();
      applyAccentCSSVar();
      renderCard();
    });
  });
}

function applyAccentCSSVar(){
  document.getElementById('card').style.setProperty('--accent', state[current].style.accentColor);
}

/* ---------------------------------------------------------
   이미지 패널
--------------------------------------------------------- */
function buildImagePanel(){
  const t = templates[current];
  const d = state[current].data;
  const s = state[current].style;
  const el = document.getElementById('panel-image');

  const imageInputs = t.imageFields.map(f => `
    <div class="section-title">${f.label}</div>
    <div class="field">
      <div class="btn-row" style="margin-top:0;">
        <button type="button" class="btn-mini" data-upload="${f.k}" style="flex:1;padding:10px;">📁 파일 업로드</button>
      </div>
      <div class="hint" data-uploaded-hint="${f.k}">${isUploadedImage(d[f.k]) ? '이미지가 업로드되어 있어요.' : '아직 업로드된 이미지가 없어요 (기본 이미지 표시 중).'}</div>
      <input type="file" accept="image/*" data-file-for="${f.k}">
    </div>
  `).join('');

  el.innerHTML = imageInputs + `
    <div class="section-title">맞춤 방식</div>
    <div class="field"><select data-sk="imgFit">
      <option value="cover" ${s.imgFit==='cover'?'selected':''}>꽉 채우기 (Cover)</option>
      <option value="contain" ${s.imgFit==='contain'?'selected':''}>전체 보기 (Contain)</option>
      <option value="original" ${s.imgFit==='original'?'selected':''}>원본 크기</option>
      <option value="fill" ${s.imgFit==='fill'?'selected':''}>늘려서 채우기 (Fill)</option>
    </select></div>

    <div class="field"><label>확대/축소 <span class="val" data-show="imgZoom">${s.imgZoom}%</span></label>
      <input type="range" min="80" max="220" step="1" data-sk="imgZoom" value="${s.imgZoom}"></div>

    <div class="field"><label>가로 위치 <span class="val" data-show="imgPosX">${s.imgPosX}%</span></label>
      <input type="range" min="0" max="100" step="1" data-sk="imgPosX" value="${s.imgPosX}"></div>

    <div class="field"><label>세로 위치 <span class="val" data-show="imgPosY">${s.imgPosY}%</span></label>
      <input type="range" min="0" max="100" step="1" data-sk="imgPosY" value="${s.imgPosY}"></div>

    <div class="section-title">이미지 효과</div>
    <div class="field"><select data-sk="imgFilter">
      ${Object.entries(FILTERS).map(([k,v])=>`<option value="${k}" ${s.imgFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select></div>
    <div class="hint" style="margin:-6px 0 12px;">듀오톤은 위 '디자인' 탭의 강조색으로 색이 입혀져요.</div>
  `;

  el.querySelectorAll('[data-upload]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      el.querySelector(`[data-file-for="${btn.dataset.upload}"]`).click();
    });
  });
  el.querySelectorAll('[data-file-for]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const key = inp.dataset.fileFor;
        state[current].data[key] = ev.target.result;
        const hint = el.querySelector(`[data-uploaded-hint="${key}"]`);
        if(hint) hint.textContent = '이미지가 업로드되어 있어요.';
        renderCard();
      };
      reader.readAsDataURL(file);
    });
  });

  el.querySelectorAll('[data-sk]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const key = input.dataset.sk;
      const val = input.type === 'range' ? parseFloat(input.value) : input.value;
      state[current].style[key] = val;
      const showEl = el.querySelector(`[data-show="${key}"]`);
      if(showEl) showEl.textContent = val + '%';
      renderCard();
    });
  });
}

/* ---------------------------------------------------------
   전체 패널 다시 그리기 + 카드 렌더링
--------------------------------------------------------- */
function buildAllPanels(){
  buildContentPanel();
  buildDesignPanel();
  buildImagePanel();
  applyAccentCSSVar();
}

function renderCard(){
  const t = templates[current];
  document.getElementById('card').innerHTML = t.render(state[current].data, state[current].style);
  document.getElementById('previewName').textContent = t.label;
  applyAccentCSSVar();
}

/* ---------------------------------------------------------
   초기화 / 저장
--------------------------------------------------------- */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state[current] = { data:{...templates[current].defaults}, style:{...templates[current].defaultStyle} };
  buildAllPanels(); renderCard();
});

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '변환 준비중...';

  try {
    if (typeof html2canvas === 'undefined') {
      throw new Error('이미지 변환 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 페이지를 새로고침해서 다시 시도해주세요.');
    }

    btn.textContent = '폰트 로딩중...';
    try { await document.fonts.ready; } catch(e) {}
    await new Promise(r => setTimeout(r, 150));

    btn.textContent = '이미지 생성중...';
    const card = document.getElementById('card');
    if (!card) throw new Error('카드 요소를 찾을 수 없습니다');
    if (!card.offsetWidth || !card.offsetHeight) {
      throw new Error('카드가 화면에 제대로 표시되지 않았어요. 잠시 후 다시 시도해주세요.');
    }

    const d = (typeof DEVICES !== 'undefined' && DEVICES[currentDevice])
      ? DEVICES[currentDevice]
      : { exportW: 1179 };
    const targetWidth = d.exportW || 1179;
    const scale = targetWidth / card.offsetWidth;

    const canvas = await html2canvas(card, {
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      scale,
      imageTimeout: 15000,
      logging: false
    });

    if (!canvas || !canvas.width || !canvas.height) {
      throw new Error('이미지 생성에 실패했어요 (빈 이미지). 다시 시도해주세요.');
    }

    const fileName = `${current}-template.png`;
    const dataUrl = canvas.toDataURL('image/png');
    if (!dataUrl || dataUrl.length < 100) throw new Error('이미지 데이터 생성 실패');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && !window.MSStream);

    if (isIOS) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('blob 생성 실패');
      const file = new File([blob], fileName, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        btn.textContent = '공유 시트 여는 중...';
        try {
          await navigator.share({ files: [file], title: fileName });
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') {
            /* 취소 */
          } else {
            const url = URL.createObjectURL(blob);
            const win = window.open('');
            if (win) {
              win.document.write(`<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${fileName}</title></head>
<body style="margin:0;background:#111;text-align:center;">
<p style="color:#fff;font-family:sans-serif;padding:16px;">이미지를 길게 눌러 저장하세요</p>
<img src="${url}" style="max-width:100%;">
</body></html>`);
              win.document.close();
            }
          }
        }
      } else {
        const url = URL.createObjectURL(blob);
        const win = window.open('');
        if (win) {
          win.document.write(`<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${fileName}</title></head>
<body style="margin:0;background:#111;text-align:center;">
<p style="color:#fff;font-family:sans-serif;padding:16px;">이미지를 길게 눌러 저장하세요</p>
<img src="${url}" style="max-width:100%;">
</body></html>`);
          win.document.close();
        }
      }
    } else {
      const link = document.createElement('a');
      link.download = fileName;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

  } catch (e) {
    console.error(e);
    alert('저장 중 문제: ' + (e && e.message ? e.message : e));
  }

  btn.disabled = false;
  btn.textContent = originalLabel;
});

/* ---------------------------------------------------------
   시작
--------------------------------------------------------- */
buildTabs();
buildAllPanels();
renderCard();
applyDevice();
const firstBtn = document.querySelector('.device-btn[data-device="iphone"]');
if (firstBtn) {
  firstBtn.style.background = 'var(--accent-ui)';
  firstBtn.style.borderColor = 'var(--accent-ui)';
  firstBtn.style.color = '#fff';
}
</script>
</body>
</html>
