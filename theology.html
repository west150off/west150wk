<style>
:root{
--ui-font:"Noto Sans KR",sans-serif;--card-font:"Noto Serif KR","Nanum Myeongjo",serif;
--bg:#0b0c0b;--panel:#101210;--line:#2a2c28;--text:#eeeae0;--muted:#92948d;
--paper:#ebe5d8;--ink:#191a17;--accent:#9a7b43;--accent2:#7f342b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui-font),-apple-system,BlinkMacSystemFont,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr 64px}
.top{display:flex;align-items:center;gap:28px;padding:0 22px;border-bottom:1px solid var(--line);background:#0a0b0a}
.brand{font-size:24px;font-weight:900;white-space:nowrap}.brand span{font-size:15px;font-weight:500;letter-spacing:.16em;color:#c8c5bc;margin-left:10px}
.menu{height:100%;display:flex;gap:30px;margin-left:24px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.menu button{height:100%;background:transparent;border:0;border-bottom:2px solid transparent;color:#939690;font-size:11px;letter-spacing:.08em;white-space:nowrap;flex:0 0 auto}.menu button.active{color:#fff;border-color:var(--accent)}
.topRight{margin-left:auto;display:flex;gap:8px}.topRight button{background:#131613;border:1px solid #31342f;color:#ddd;padding:10px 13px;border-radius:6px;font-size:10px}.export{font-weight:900!important}
.workspace{display:grid;grid-template-columns:290px minmax(0,1fr) 315px;min-height:0}
.workspace.panel-template{grid-template-columns:290px minmax(0,1fr)}
.workspace.panel-editor{grid-template-columns:minmax(0,1fr) 315px}
.workspace.panel-template .left{grid-column:1}.workspace.panel-template .center{grid-column:2}.workspace.panel-editor .center{grid-column:1}.workspace.panel-editor .right{grid-column:2}
.left,.right{background:#0d0f0d;padding:20px 16px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.center{padding:26px 20px;background:#0a0c0a;overflow:auto}.sideTitle{font-size:10px;font-weight:900;letter-spacing:.13em;margin:3px 6px 15px}
.template{display:grid;grid-template-columns:128px 1fr;gap:10px;width:100%;padding:5px;margin-bottom:7px;border:1px solid transparent;border-radius:6px;background:transparent;color:#ddd;text-align:left}.template:hover,.template.active{background:#141713}.template.active{border-color:#c8c0ae}
.thumb{height:72px;position:relative;overflow:hidden;border:1px solid #32352f;background:#1a1d18}
.thumb.scripture:before{content:"JOHN\A 3:16";white-space:pre;position:absolute;left:10px;top:10px;font:500 18px var(--card-font);line-height:1}.thumb.scripture:after{content:"FOR GOD SO LOVED THE WORLD";position:absolute;left:10px;bottom:9px;width:85px;font-size:6px;color:#c5bda9}
.thumb.quote:before{content:"“";font:900 55px var(--card-font);color:var(--accent);position:absolute;left:12px;top:-6px}.thumb.quote:after{content:"TRUTH\A HAS A\A VOICE";white-space:pre;position:absolute;right:13px;bottom:10px;font:500 13px var(--card-font)}
.thumb.concept:after{content:"GRACE\A    ↓\AFAITH";white-space:pre;position:absolute;left:16px;top:13px;font-size:10px;line-height:1.5;color:#ddd}.thumb.concept:before{content:"THEOLOGY";position:absolute;right:8px;top:8px;font-size:6px;color:#9a7b43}
.thumb.meditation{background:linear-gradient(135deg,#272b26,#a79b85 48%,#171914)}.thumb.meditation:after{content:"BE STILL";position:absolute;left:10px;bottom:9px;font:500 22px var(--card-font);color:#f4eee1}
.thumb.word:after{content:"01\A REDEEMED";white-space:pre;position:absolute;left:12px;top:11px;font:500 14px var(--card-font);line-height:1.7}.thumb.word:before{content:"단어 연구";position:absolute;right:8px;bottom:9px;font-size:6px;color:#a89266}
.thumb.chapter:after{content:"ROMANS\A 8";white-space:pre;position:absolute;left:12px;top:11px;font:500 24px var(--card-font);line-height:.9}.thumb.chapter:before{content:"A GUIDE TO THE CHAPTER";position:absolute;left:12px;bottom:9px;font-size:6px}
.tmeta{display:flex;flex-direction:column;justify-content:center}.tmeta span{font-size:9px;color:#858984}.tmeta b{font-size:10px;letter-spacing:.05em;margin-top:6px}.tmeta small{font-size:8px;color:#747772;margin-top:4px}
.canvasShell{width:min(100%,900px);margin:auto}
.card{width:100%;aspect-ratio:4/5;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 25px 85px #0008}.card.dark{background:#171914;color:#f1ecdf}.card.ink{background:#232018;color:#f0e9d8}
.cardHeader{position:absolute;left:4%;right:4%;top:4%;display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.1em}
.cardContent{position:absolute;left:4%;right:4%;top:13%;bottom:8%}
.kicker{position:relative;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.18em;margin-bottom:26px}
.ref{position:relative;font:500 clamp(40px,6.2vw,84px)/.92 var(--card-font);letter-spacing:-.06em;max-width:70%}
.divider{position:relative;width:120px;height:3px;background:var(--accent);margin:25px 0}
.verse{position:relative;font:500 clamp(27px,4vw,52px)/1.15 var(--card-font);max-width:80%}
.body{position:relative;max-width:50%;font-size:13px;line-height:1.7;color:#65635d;margin-top:22px}.dark .body,.ink .body{color:#c4c0b5}
.conceptBox{position:absolute;right:0;bottom:17%;width:37%;border-top:1px solid #bdb5a6;padding-top:14px}.conceptBox strong{font-size:10px;letter-spacing:.12em;color:var(--accent)}.conceptBox p{font:500 19px/1.25 var(--card-font);margin:10px 0 0}
.bottomMeta{position:absolute;left:0;right:0;bottom:0;border-top:1px solid #c7c0b2;padding:16px 0;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}.dark .bottomMeta,.ink .bottomMeta{border-color:#55564e}
.meta strong{display:block;font-size:13px;color:var(--accent)}.meta span{font-size:8px;color:#68655e}
.footer{position:absolute;left:4%;right:4%;bottom:3%;display:flex;justify-content:space-between;font-size:9px;color:#69665e}.dark .footer,.ink .footer{color:#aaa69b}
.control{margin-bottom:24px}.control h3{font-size:10px;letter-spacing:.12em;margin:0 0 12px}.label{display:block;font-size:9px;color:#929790;margin:9px 0 5px}.input,.textarea,.select{width:100%;border:1px solid #30352f;background:#131613;color:#e5e1d8;border-radius:5px;padding:10px;font-size:11px}.textarea{min-height:78px;resize:vertical}
.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice{background:#111410;border:1px solid #30352f;color:#a9aca5;padding:10px 6px;font-size:9px}.choice.active{border-color:var(--accent);color:#fff}
.swatches{display:flex;gap:10px}.swatch{width:33px;height:33px;border-radius:50%;border:1px solid #5a5c55}.swatch:nth-child(1){background:#9a7b43}.swatch:nth-child(2){background:#7f342b}.swatch:nth-child(3){background:#394541}.swatch:nth-child(4){background:#c5b7a0}.swatch.active{outline:2px solid var(--accent);outline-offset:3px}
.range{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:10px;color:#a7aaa3}.switch{width:35px;height:19px;border-radius:20px;background:#383c36;position:relative}.switch:after{content:"";position:absolute;width:17px;height:17px;top:1px;left:1px;background:#eee;border-radius:50%}.switch.on{background:var(--accent)}.switch.on:after{left:17px}
.bottom{display:flex;align-items:center;gap:10px;padding:7px 18px;border-top:1px solid var(--line);background:#0b0d0b;overflow:auto}.add{height:48px;min-width:88px;border:1px solid #353933;background:#121511;color:#a7aaa3}.film{display:flex;gap:8px}.mini{width:82px;height:48px;border:1px solid #30342e;background:#181b17;color:#aaa;font-size:8px}.mini.active{outline:2px solid var(--accent)}.zoom{margin-left:auto;color:#969991;font-size:10px;white-space:nowrap}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}.template{grid-template-columns:1fr}.tmeta{display:none}.left,.right{border:0}}
@media(max-width:700px){.app{grid-template-rows:58px 1fr 58px}.top{padding:0 10px}.brand{font-size:17px}.brand span{display:none}.menu{margin-left:6px;gap:14px}.menu button{font-size:8px}.topRight .iconBtn{display:none}.center{padding:10px}.ref{font-size:44px}.verse{font-size:29px}.body{font-size:10px}.conceptBox{width:42%}}
</style>

<script>
const $=id=>document.getElementById(id);
const STORAGE_KEY='west150_theology_studio_v2';
const $all=(q,root=document)=>[...root.querySelectorAll(q)];
const defaults={
 layout:'scripture',reference:'요한복음 3:16',translation:'NIV',kicker:'성경',
 mainText:'“하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니”',
 bodyText:'하나님의 사랑과 은혜가 우리 삶에 어떤 의미를 주는지 묵상합니다.',
 concept:'내어주는 사랑.',accent:'#9a7b43',bg:'paper',align:'left',scale:100,
 showNum:true,showConcept:true,chapter:'03',credit:'WEST150 신학',pageLabel:'01 / 01'
};
const presets={
 scripture:{...defaults},
 quote:{...defaults,layout:'quote',kicker:'신학 인용',reference:'AUGUSTINE',mainText:'“OUR HEART IS RESTLESS UNTIL IT RESTS IN YOU.”',bodyText:'A theological reflection on desire, rest, and the human heart before God.',concept:'REST IN GOD.',chapter:'01'},
 concept:{...defaults,layout:'concept',kicker:'핵심 개념',reference:'GRACE',mainText:'NOT EARNED. NOT DESERVED. FREELY GIVEN.',bodyText:'Grace begins before achievement and remains beyond deserving.',concept:'GIFT BEFORE RESPONSE.',chapter:'02'},
 meditation:{...defaults,layout:'meditation',kicker:'묵상',reference:'BE STILL',mainText:'SILENCE CAN BECOME A PLACE WHERE WE LEARN TO LISTEN.',bodyText:'Slow down. Attend. Wait before God without needing to fill every space.',concept:'WAIT WITH GOD.',chapter:'04'},
 word:{...defaults,layout:'word',kicker:'단어 연구',reference:'REDEEMED',mainText:'TO BE BROUGHT BACK AT A PRICE.',bodyText:'A study of restoration, ransom, and belonging.',concept:'RESTORATION.',chapter:'05'},
 chapter:{...defaults,layout:'chapter',kicker:'장별 안내',reference:'ROMANS 8',mainText:'NO CONDEMNATION. NEW LIFE. NOTHING CAN SEPARATE.',bodyText:'A chapter guide for tracing life in the Spirit and assurance in Christ.',concept:'LIFE IN THE SPIRIT.',chapter:'08'},
 gaeyeok:{...defaults,layout:'gaeyeok',translation:'개역개정',kicker:'성경 · 개역개정',reference:'요한복음 3:16',mainText:'“하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니”',bodyText:'개역개정 본문을 중심으로 말씀의 핵심과 신학적 의미를 정리합니다.',concept:'하나님의 사랑.',chapter:'03'}
};
let slides=[];let active=0;let history=[];let historyIndex=-1;let applying=false;
function clone(v){return JSON.parse(JSON.stringify(v))}
function makeSlide(data=defaults){return {id:crypto?.randomUUID?.()||Date.now()+Math.random(),...clone(data)}}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify({slides,active}))}
function pushHistory(){if(applying)return;const snap=JSON.stringify({slides,active});if(history[historyIndex]===snap)return;history=history.slice(0,historyIndex+1);history.push(snap);historyIndex=history.length-1;saveLocal();updateHistoryButtons()}
function restoreHistory(i){if(i<0||i>=history.length)return;applying=true;const d=JSON.parse(history[i]);slides=d.slides;active=d.active;historyIndex=i;renderAll();applying=false;updateHistoryButtons();saveLocal()}
function undo(){restoreHistory(historyIndex-1)}function redo(){restoreHistory(historyIndex+1)}
function updateHistoryButtons(){const bs=$all('.iconBtn');if(bs[0])bs[0].disabled=historyIndex<=0;if(bs[1])bs[1].disabled=historyIndex>=history.length-1}
function current(){return slides[active]}
function setField(k,v){current()[k]=v;renderCard();renderFilm();pushHistory()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderCard(){const s=current();if(!s)return;document.documentElement.style.setProperty('--accent',s.accent);$('card').className='card '+(s.bg==='paper'?'':s.bg);$('page').textContent=`${String(active+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;$('kicker').textContent=s.kicker;$('reference').innerHTML=esc(s.reference).replace(/\s+/, '<br>');$('mainText').textContent=s.mainText;$('mainText').style.fontSize=(s.scale/100)+'em';$('bodyText').textContent=s.bodyText;$('conceptText').textContent=s.concept;$('translation').textContent=s.translation;$('credit').textContent=s.credit;$('conceptBox').style.display=s.showConcept?'block':'none';['reference','mainText','bodyText'].forEach(id=>$(id).style.textAlign=s.align);$('bodyText').style.marginLeft=s.align==='center'?'auto':'0';$('bodyText').style.marginRight=s.align==='center'?'auto':'0'}
function syncForm(){const s=current();if(!s)return;$('referenceInput').value=s.reference;$('translationInput').value=s.translation;$('kickerInput').value=s.kicker;$('mainTextInput').value=s.mainText;$('bodyTextInput').value=s.bodyText;$('conceptInput').value=s.concept;$('scale').value=s.scale;$all('#swatches .swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===s.accent));$all('#bgStyle .choice').forEach(b=>b.classList.toggle('active',b.dataset.bg===s.bg));$all('#textAlign .choice').forEach(b=>b.classList.toggle('active',b.dataset.align===s.align));$('conceptToggle').classList.toggle('on',s.showConcept);$all('.template').forEach(b=>b.classList.toggle('active',b.dataset.layout===s.layout))}
function renderFilm(){const film=document.querySelector('.film');film.innerHTML=slides.map((s,i)=>`<button class="mini ${i===active?'active':''}" data-index="${i}">${String(i+1).padStart(2,'0')}<br>${esc(s.kicker.slice(0,14))}</button>`).join('');$all('.mini',film).forEach(b=>b.onclick=()=>{active=+b.dataset.index;renderAll();pushHistory()})}
function renderAll(){renderCard();syncForm();renderFilm()}
function addCard(data=clone(current()||defaults)){slides.splice(active+1,0,makeSlide(data));active++;renderAll();pushHistory()}
function deleteCard(){if(slides.length===1){slides[0]=makeSlide(defaults);active=0}else{slides.splice(active,1);active=Math.min(active,slides.length-1)}renderAll();pushHistory()}
function applyPreset(layout){const p=clone(presets[layout]||defaults);p.layout=layout;slides[active]={id:current().id,...p};renderAll();pushHistory()}
function bind(id,key,event='input'){ $(id).addEventListener(event,e=>setField(key,e.target.value)) }
bind('referenceInput','reference');bind('translationInput','translation','change');bind('kickerInput','kicker');bind('mainTextInput','mainText');bind('bodyTextInput','bodyText');bind('conceptInput','concept');
$('scale').oninput=e=>setField('scale',+e.target.value);
$all('#swatches .swatch').forEach(b=>b.onclick=()=>setField('accent',b.dataset.color));
$all('#bgStyle .choice').forEach(b=>b.onclick=()=>setField('bg',b.dataset.bg));
$all('#textAlign .choice').forEach(b=>b.onclick=()=>setField('align',b.dataset.align));
$all('.template').forEach(b=>b.onclick=()=>applyPreset(b.dataset.layout));
$('addCardBtn').onclick=()=>addCard();$('dupCardBtn').onclick=()=>addCard(clone(current()));$('delCardBtn').onclick=deleteCard;
const topBtns=$all('.topRight .iconBtn');topBtns[0].onclick=undo;topBtns[1].onclick=redo;topBtns[2].onclick=()=>previewAll();
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(!mod)return;if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
function previewAll(){const w=window.open('','WEST150 Preview');w.document.write(`<style>body{margin:20px;background:#111;color:#fff;font-family:Arial}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.item{background:#222;padding:8px}.item img{width:100%}</style><h1>WEST150 신학 — ALL 카드</h1><div class="grid" id="g"></div>`);const jobs=slides.map((_,i)=>{const old=active;active=i;renderAll();return html2canvas($('card'),{scale:1.5}).then(c=>c.toDataURL()).finally(()=>{active=old;renderAll()})});Promise.all(jobs).then(imgs=>{w.document.getElementById('g').innerHTML=imgs.map((x,i)=>`<div class="item"><b>${i+1}</b><img src="${x}"></div>`).join('')})}
$('exportBtn').onclick=async()=>{if(!window.html2canvas){alert('PNG 저장 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}const oldText=$('exportBtn').textContent;$('exportBtn').textContent='EXPORTING…';try{const c=await html2canvas($('card'),{scale:2,useCORS:true,backgroundColor:null});const a=document.createElement('a');a.download=`WEST150-THEOLOGY-${String(active+1).padStart(2,'0')}.png`;a.href=c.toDataURL('image/png');a.click()}finally{$('exportBtn').textContent=oldText}}
// Add requested category/template: 개역개정
const templates=$('templates');templates.insertAdjacentHTML('beforeend','<button class="template" data-layout="gaeyeok"><div class="thumb scripture"></div><div class="tmeta"><span>07</span><b>개역개정</b><small>한국어 성경 본문</small></div></button>');
// rebind newly added template
$all('.template').forEach(b=>b.onclick=()=>applyPreset(b.dataset.layout));
// panel menu
const menuBtns=$all('.menu button[data-panel]');const workspace=document.querySelector('.workspace');const leftAside=$('leftAside'),rightAside=$('rightAside'),scriptureControl=$('scriptureControl'),contentControl=$('contentControl'),styleControl=$('styleControl'),bottomBar=$('bottomBar');const wideQuery=window.matchMedia('(min-width:1101px)');let activePanel='template';
function applyPanel(){
  // 상단 메뉴가 데스크톱/모바일 모두 실제로 편집 패널을 전환하도록 처리
  const isTemplate=activePanel==='template';
  const isEditor=['scripture','content','style'].includes(activePanel);
  workspace.classList.toggle('panel-template',isTemplate);
  workspace.classList.toggle('panel-editor',isEditor);
  leftAside.style.display=isTemplate?'block':'none';
  rightAside.style.display=isEditor?'block':'none';
  scriptureControl.style.display=activePanel==='scripture'?'block':'none';
  contentControl.style.display=activePanel==='content'?'block':'none';
  styleControl.style.display=activePanel==='style'?'block':'none';
  if(activePanel==='cards') bottomBar.scrollIntoView({behavior:'smooth',block:'nearest'});
}
menuBtns.forEach(b=>b.onclick=()=>{
  const panel=b.dataset.panel;
  menuBtns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  if(panel==='save'){activePanel='save';$('exportBtn').click();return}
  activePanel=panel;
  applyPanel();
});
wideQuery.addEventListener('change',applyPanel);
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.slides?.length){slides=saved.slides;active=Math.min(saved.active||0,saved.slides.length-1)}else slides=[makeSlide(defaults)]}catch(e){slides=[makeSlide(defaults)]}renderAll();history=[JSON.stringify({slides,active})];historyIndex=0;applyPanel();
</script>
</body>
</html>
