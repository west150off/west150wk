<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>WEST150 BREAKING STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#111;border-bottom:1px solid #333;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:.08em}.logo small{display:block;color:#aaa;font-size:10px;letter-spacing:.18em;margin-top:2px}
button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#252525;color:#fff;font-weight:700}button:active{transform:scale(.98)}
.primary{background:#e31b23}.green{background:#16834a}.danger{background:#7b2025}
main{max-width:1200px;margin:auto;padding:12px 12px 110px;display:grid;grid-template-columns:minmax(290px,390px) 1fr;gap:14px}
.panel{background:#191919;border:1px solid #303030;border-radius:16px;padding:14px}.panel h2{font-size:14px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#101010;border:1px solid #383838;color:#fff;border-radius:9px;padding:10px}.field textarea{min-height:90px;resize:vertical}
.previewWrap{display:flex;justify-content:center;align-items:flex-start;min-height:500px}.card{width:min(100%,430px);aspect-ratio:4/5;background:#111;position:relative;overflow:hidden;box-shadow:0 12px 45px #000;border-radius:4px;color:#fff}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.05));display:none}.content{position:absolute;inset:0;padding:8% 7%;display:flex;flex-direction:column;justify-content:flex-end}.top{position:absolute;top:7%;left:7%;font-size:12px;font-weight:900;letter-spacing:.12em}.badge{display:inline-block;padding:5px 8px;background:#e31b23;font-size:11px;font-weight:900;letter-spacing:.08em;margin-bottom:12px}.title{font-size:clamp(27px,6vw,48px);font-weight:950;line-height:1.04;letter-spacing:-.04em;white-space:pre-wrap;word-break:keep-all}.body{font-size:15px;line-height:1.5;margin-top:14px;white-space:pre-wrap;word-break:keep-all;color:#ddd}.source{margin-top:18px;font-size:10px;color:#aaa}.brand{position:absolute;right:7%;bottom:5%;font-size:10px;font-weight:900;letter-spacing:.14em}.time{position:absolute;right:7%;top:7%;font-size:10px;color:#aaa}.imageControls{display:none}.card.hasImage img,.card.hasImage .shade{display:block}.card.hasImage .content{z-index:2}.card.hasImage .top,.card.hasImage .time,.card.hasImage .brand{z-index:3}.theme-black{background:#050505}.theme-white{background:#f2f2f2;color:#111}.theme-white .body{color:#333}.theme-white .source,.theme-white .time{color:#666}.theme-live .badge{background:#111;border:1px solid #fff}.theme-update .badge{background:#f0b400;color:#111}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#151515;border-top:1px solid #333;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center}.bottom button{flex:1;max-width:180px}
.cards{display:flex;gap:7px;overflow:auto;margin-top:12px;padding-bottom:3px}.thumb{min-width:72px;height:90px;border:1px solid #444;border-radius:8px;overflow:hidden;background:#222;position:relative;cursor:pointer}.thumb.active{border:2px solid #e31b23}.thumb canvas{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;bottom:3px;left:4px;font-size:9px;background:#000b;padding:2px 4px}
.note{font-size:11px;color:#888;line-height:1.45;margin-top:8px}.hidden{display:none!important}
@media(max-width:850px){main{grid-template-columns:1fr}.previewPanel{order:-1}.previewWrap{min-height:auto}.card{width:min(82vw,430px)}header{position:relative}}
</style>
</head>
<body>
<header><div class="logo">WEST150<small>BREAKING STUDIO</small></div><button onclick="newCard()">＋ 카드</button></header>

<main>
<section class="panel">
<h2>① 뉴스 입력</h2>
<div class="field"><label>템플릿</label><select id="template" onchange="applyTemplate()">
<option value="breaking">BREAKING</option><option value="justin">JUST IN</option><option value="live">LIVE</option><option value="update">UPDATE</option><option value="flash">FLASH</option>
</select></div>
<div class="field"><label>제목</label><textarea id="title" placeholder="속보 제목을 입력하세요"></textarea></div>
<div class="field"><label>본문 / 요약</label><textarea id="body" placeholder="핵심 내용을 짧게 입력하세요"></textarea></div>
<div class="field"><label>출처</label><input id="source" placeholder="예: Reuters"></div>
<div class="field"><label>시간</label><input id="time" placeholder="자동 입력" readonly></div>
<div class="field"><label>사진</label><input id="photo" type="file" accept="image/*" capture="environment"></div>
<div class="row"><button class="primary" onclick="setNow()">현재 시간</button><button onclick="removePhoto()">사진 삭제</button></div>
<div class="note">아이폰에서는 사진 선택 후 손가락으로 확대/이동하는 기능을 다음 단계에서 추가할 수 있도록 구조를 단순하게 유지했습니다.</div>
<hr style="border:0;border-top:1px solid #333;margin:16px 0">
<h2>② 카드 관리</h2>
<div class="row"><button onclick="duplicateCard()">⧉ 복제</button><button onclick="deleteCard()" class="danger">삭제</button><button onclick="saveProject()">프로젝트 저장</button></div>
<div id="cards" class="cards"></div>
</section>

<section class="panel previewPanel">
<h2>③ 미리보기 · 1080 × 1350</h2>
<div class="previewWrap">
<div id="card" class="card">
<img id="img"><div class="shade"></div>
<div class="top" id="top">WEST150 DAILY</div><div class="time" id="ptime"></div>
<div class="content"><div class="badge" id="badge">BREAKING</div><div class="title" id="ptitle"></div><div class="body" id="pbody"></div><div class="source" id="psource"></div></div>
<div class="brand">WEST150 DAILY</div>
</div></div>
<p class="note">저장은 PNG로 생성됩니다. 아이폰에서는 먼저 공유 메뉴를 열어 사진 앱 저장 또는 원하는 앱으로 바로 보낼 수 있습니다.</p>
</section>
</main>

<div class="bottom">
<button onclick="previewAll()">전체 미리보기</button>
<button class="green" onclick="savePNG()">📲 저장 / 공유</button>
</div>

<script>
const $=id=>document.getElementById(id);
let cards=[blankCard()], idx=0;

function blankCard(){return {template:'breaking',title:'',body:'',source:'',time:'',photo:null}}
function current(){return cards[idx]}
function loadForm(){
 let c=current(); $('template').value=c.template;$('title').value=c.title;$('body').value=c.body;$('source').value=c.source;$('time').value=c.time;
 render();
}
function sync(){
 let c=current();c.template=$('template').value;c.title=$('title').value;c.body=$('body').value;c.source=$('source').value;c.time=$('time').value;renderThumbs();
}
['title','body','source'].forEach(id=>$(id).addEventListener('input',sync));
$('template').addEventListener('change',sync);
function applyTemplate(){sync()}
function setNow(){ $('time').value=new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date())+' KST';sync() }
$('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{current().photo=r.result;render()};r.readAsDataURL(f)});
function removePhoto(){current().photo=null;$('photo').value='';render()}
function render(){
 let c=current(), card=$('card'); card.className='card '+(c.photo?'hasImage ':'')+'theme-'+c.template;
 $('title').value=c.title;$('body').value=c.body;$('source').value=c.source;$('time').value=c.time;
 $('ptitle').textContent=c.title;$('pbody').textContent=c.body;$('psource').textContent=c.source?('SOURCE · '+c.source):'';
 $('ptime').textContent=c.time;$('badge').textContent=c.template==='justin'?'JUST IN':c.template==='live'?'LIVE':c.template==='update'?'UPDATE':c.template==='flash'?'FLASH':'BREAKING';
 $('img').src=c.photo||''; renderThumbs();
}
function renderThumbs(){
 let wrap=$('cards');wrap.innerHTML='';
 cards.forEach((c,i)=>{let d=document.createElement('div');d.className='thumb '+(i===idx?'active':'');let cv=document.createElement('canvas');cv.width=216;cv.height=270;let x=cv.getContext('2d');x.fillStyle=c.template==='update'?'#f0b400':c.template==='live'?'#111':c.template==='justin'?'#222':'#e31b23';x.fillRect(0,0,216,270);x.fillStyle='#fff';x.font='bold 16px Arial';x.fillText((c.template==='live'?'LIVE':c.template==='update'?'UPDATE':c.template==='justin'?'JUST IN':'BREAKING'),12,30);x.fillStyle='#fff';x.font='bold 18px Arial';let t=(c.title||'새 카드').slice(0,35);x.fillText(t,12,80,190);d.appendChild(cv);let s=document.createElement('span');s.textContent='CARD '+(i+1);d.appendChild(s);d.onclick=()=>{idx=i;loadForm()};wrap.appendChild(d)});
}
function newCard(){cards.push(blankCard());idx=cards.length-1;loadForm()}
function duplicateCard(){cards.splice(idx+1,0,JSON.parse(JSON.stringify(current())));idx++;loadForm()}
function deleteCard(){if(cards.length===1){cards[0]=blankCard();idx=0}else{cards.splice(idx,1);idx=Math.max(0,idx-1)}loadForm()}
function saveProject(){localStorage.setItem('west150_breaking_project',JSON.stringify(cards));alert('프로젝트를 이 기기에 저장했습니다.')}
function loadProject(){try{let x=JSON.parse(localStorage.getItem('west150_breaking_project'));if(x?.length){cards=x;idx=0;loadForm()}}catch(e){}}
async function canvasFor(c){
 const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const x=cv.getContext('2d');
 x.fillStyle=c.template==='update'?'#f0b400':c.template==='live'?'#111':c.template==='justin'?'#222':'#111';x.fillRect(0,0,1080,1350);
 if(c.photo){await new Promise(res=>{let im=new Image();im.onload=()=>{let scale=Math.max(1080/im.width,1350/im.height),w=im.width*scale,h=im.height*scale;x.drawImage(im,(1080-w)/2,(1350-h)/2,w,h);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,1080,1350);res()};im.src=c.photo})}
 x.fillStyle='#e31b23';if(c.template==='update')x.fillStyle='#f0b400';x.fillRect(76,180,160,48);
 x.fillStyle=c.template==='update'?'#111':'#fff';x.font='900 25px Arial';x.fillText(c.template.toUpperCase(),92,213);
 x.fillStyle='#fff';x.font='900 68px Arial';wrapText(x,c.title||'BREAKING NEWS',76,310,930,78,5);
 x.fillStyle='#ddd';x.font='400 28px Arial';wrapText(x,c.body||'',76,760,900,42,7);
 x.fillStyle='#999';x.font='18px Arial';if(c.source)x.fillText('SOURCE · '+c.source,76,1190);
 if(c.time)x.fillText(c.time,76,1230);x.fillStyle='#fff';x.font='900 18px Arial';x.fillText('WEST150 DAILY',900,1280);
 return cv
}
function wrapText(ctx,text,x,y,maxWidth,lineH,maxLines){let words=(text||'').split(/\s+/),line='',n=0;for(let w of words){let test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineH;line=w;if(++n>=maxLines-1)break}else line=test}if(n<maxLines)ctx.fillText(line,x,y)}
async function savePNG(){
 let cv=await canvasFor(current());cv.toBlob(async blob=>{
  let file=new File([blob],'west150-breaking-card.png',{type:'image/png'});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
   try{await navigator.share({title:'WEST150 Breaking',files:[file]});return}catch(e){}
  }
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='west150-breaking-card.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
 },'image/png')
}
async function previewAll(){let w=window.open('','_blank');if(!w){alert('팝업을 허용해주세요.');return}w.document.write('<title>WEST150 Preview</title><body style="background:#111;margin:0;text-align:center">');for(let c of cards){let cv=await canvasFor(c);w.document.body.appendChild(cv);w.document.body.appendChild(document.createElement('hr'))}w.document.close()}
loadProject();loadForm();
</script>
</body>
</html>
