<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1510">
<title>저널</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="../libs/html2canvas.min.js"></script>
<style>
:root{
  --bg:#1a1510;--panel:#241e18;--ink:#f3efe6;--muted:#9a8f80;--line:#3d342c;
  --cream:#f4f1e6;--cream2:#ebe6d6;--rule:#d5cfc0;--brown:#3d3428;--band:#1a1510;
  --gold:#c4a574;--serif:"Noto Serif KR","Song Myung",Georgia,serif;
  --sans:"Pretendard","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Sans KR",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased
}

button,input,textarea,select{
  font:inherit;
  color:inherit;
  border:0;
  background:none
}

button{cursor:pointer}

#app{
  max-width:720px;
  margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) 18px max(36px,env(safe-area-inset-bottom))
}

.view{display:none}
.view.active{display:block}

.mast{
  background:linear-gradient(180deg,#2a221c,#1f1914);
  border:1px solid var(--line);
  border-radius:2px 10px 10px 2px;
  padding:22px 20px;
  margin-bottom:16px;
  box-shadow:6px 0 0 var(--band),0 12px 32px rgba(0,0,0,.35);
}

.kicker{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:10px
}

h1{
  font-family:var(--serif);
  font-size:1.9rem;
  font-weight:700
}

.sub{
  margin-top:8px;
  font-size:13px;
  color:var(--muted)
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
  align-items:center
}

.search{
  flex:1;
  min-width:120px;
  background:#120e0c;
  border:1px solid var(--line);
  padding:10px 12px;
  border-radius:2px;
  font-size:13px
}

.btn{
  padding:10px 14px;
  font-size:12px;
  font-weight:600;
  border:1px solid var(--line);
  border-radius:2px;
  color:var(--ink);
  background:#120e0c
}

.btn:hover{
  border-color:var(--gold);
  color:var(--gold)
}

.btn.primary{
  background:var(--gold);
  border-color:var(--gold);
  color:#1a1408
}

.btn.ghost{
  background:transparent;
  border-color:transparent;
  color:var(--muted)
}

.btn.danger{
  color:#e08b83;
  border-color:#5a302c;
  background:transparent
}

.lbl{
  display:block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin:12px 0 6px
}

.field,
select.field{
  width:100%;
  background:#120e0c;
  border:1px solid var(--line);
  padding:10px 12px;
  border-radius:2px;
  font-size:13px;
  color:var(--ink);
  color-scheme:dark
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

@media(max-width:560px){
  .row2{grid-template-columns:1fr}
}

.sec{
  display:flex;
  justify-content:space-between;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin:8px 0 12px
}

.sec b{
  color:var(--gold);
  font-weight:600
}

.entry{
  display:grid;
  grid-template-columns:72px 1fr;
  gap:12px;
  padding:14px;
  margin-bottom:8px;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--gold);
  cursor:pointer
}

.entry .d{
  font-family:var(--mono);
  font-size:10px;
  color:var(--gold);
  line-height:1.4
}

.entry .t{
  font-family:var(--serif);
  font-weight:700;
  font-size:1.05rem;
  margin-bottom:4px
}

.entry .x{
  font-size:12px;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}

.empty{
  padding:40px;
  text-align:center;
  color:var(--muted);
  font-family:var(--serif);
  font-style:italic
}

.bar{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.bar .l,
.bar .r{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.fmt{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px
}

.fmt button{
  padding:7px 11px;
  border:1px solid var(--line);
  font-size:12px;
  background:#120e0c;
  border-radius:2px
}

.hl{
  display:flex;
  gap:6px;
  align-items:center;
  margin-bottom:8px
}

.hl span{
  font-size:11px;
  color:var(--muted)
}

.sw{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer
}

.sw.on{border-color:#fff}

.cedit{
  min-height:160px;
  padding:12px;
  background:#120e0c;
  border:1px solid var(--line);
  border-radius:2px;
  line-height:1.7;
  outline:none;
  white-space:pre-wrap;
  word-break:keep-all
}

.cedit:empty:before{
  content:attr(data-ph);
  color:#5a5048
}

.cedit mark{
  padding:0 .1em
}

.tpls{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:6px;
  margin:10px 0
}

.chip{
  border:1px solid var(--line);
  padding:10px 6px;
  font-size:11px;
  text-align:center;
  cursor:pointer;
  background:#120e0c;
  border-radius:2px;
  color:var(--muted)
}

.chip.on{
  border-color:var(--gold);
  color:var(--gold)
}

.chip small{
  display:block;
  margin-top:3px;
  font-size:9px;
  opacity:.7
}

.cap{
  display:flex;
  justify-content:center;
  padding:12px 0 24px
}

.frame{
  width:100%;
  max-width:520px
}

/* journal templates */

.sheet{
  position:relative;
  overflow:hidden;
  color:#1a1510;
  border:1px solid #3d3428;
}

.sheet .inner{
  position:relative;
  padding:28px 24px;
  min-height:360px;
}

.sheet .sm{
  display:flex;
  justify-content:space-between;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:14px;
}

.sheet .tt{
  font-family:var(--serif);
  font-weight:700;
  font-size:1.45rem;
  line-height:1.25;
  margin-bottom:12px;
}

.sheet .bd{
  font-family:var(--serif);
  font-size:1rem;
  line-height:28px;
  min-height:200px;
  white-space:pre-wrap;
  word-break:keep-all;
}

.sheet .ft{
  margin-top:16px;
  font-family:var(--mono);
  font-size:10px;
  display:flex;
  justify-content:space-between;
  text-transform:uppercase;
}

.sheet mark{
  padding:0 .1em
}

/* 01. Moleskine */

.tpl-moleskine{
  background:var(--cream);
  border-radius:2px 8px 8px 2px;
  box-shadow:5px 0 0 #120e0c;
}

.tpl-moleskine .inner{
  background-color:var(--cream);
  background-image:
    linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--rule) 27px,
      var(--rule) 28px
    );
  background-size:100% 28px;
  background-repeat:repeat-y;
}

.tpl-moleskine .sm,
.tpl-moleskine .ft{
  color:#6b5c45;
}

/* 02. Regal */

.tpl-regal{
  background:#fffdf7;
  border:1px solid #c8c0ae;
  box-shadow:5px 0 0 #d7cfbe;
}

.tpl-regal:before{
  content:"";
  position:absolute;
  left:52px;
  top:0;
  bottom:0;
  width:1px;
  background:#d7a5a5;
}

.tpl-regal .inner{
  padding-left:76px;
  background-color:#fffdf7;
  background-image:
    linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      #d9d4c9 27px,
      #d9d4c9 28px
    );
  background-size:100% 28px;
  background-repeat:repeat-y;
}

.tpl-regal .sm,
.tpl-regal .ft{
  color:#766d5d;
}

/* 03. Classic ruled */

.tpl-ruled{
  background:#faf9f3;
  border:1px solid #bdb7aa;
  box-shadow:4px 4px 0 #e2ddd0;
}

.tpl-ruled .inner{
  background-color:#faf9f3;
  background-image:
    linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      #cfd3d7 27px,
      #cfd3d7 28px
    );
  background-size:100% 28px;
  background-repeat:repeat-y;
}

.tpl-ruled .sm,
.tpl-ruled .ft{
  color:#77736b;
}

/* 04. Plain cream */

.tpl-plain{
  background:#f3ead8;
  border:1px solid #c9b99d;
  box-shadow:4px 5px 0 #d8ccb7;
}

.tpl-plain .inner{
  background:#f3ead8;
}

.tpl-plain .sm,
.tpl-plain .ft{
  color:#806d52;
}

/* 05. Cornell */

.tpl-cornell{
  background:#fbfaf4;
  border:1px solid #aaa38f;
  box-shadow:4px 4px 0 #ddd7c8;
}

.tpl-cornell .inner{
  padding-left:92px;
  background:
    linear-gradient(
      to right,
      transparent 0,
      transparent 67px,
      #c7bfae 67px,
      #c7bfae 68px,
      transparent 68px,
      transparent calc(100% - 1px),
      #c7bfae calc(100% - 1px)
    ),
    linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      #d7d3c8 27px,
      #d7d3c8 28px
    );
  background-size:100% 100%,100% 28px;
  background-repeat:no-repeat,repeat-y;
}

.tpl-cornell .ft{
  color:#736d60;
}

/* 06. Quadrant */

.tpl-grid{
  background:#f8f7f1;
  border:1px solid #bbb7ad;
  box-shadow:4px 4px 0 #dedbd2;
}

.tpl-grid .inner{
  background-color:#f8f7f1;
  background-image:
    linear-gradient(#d9d9d2 1px,transparent 1px),
    linear-gradient(90deg,#d9d9d2 1px,transparent 1px);
  background-size:20px 20px;
}

.tpl-grid .sm,
.tpl-grid .ft{
  color:#77756d;
}

/* 07. Vintage diary */

.tpl-vintage{
  background:#eadfc9;
  border:1px solid #a98e69;
  box-shadow:6px 6px 0 #d0bfa0;
}

.tpl-vintage .inner{
  background:
    linear-gradient(
      rgba(255,255,255,.08),
      rgba(255,255,255,.08)
    ),
    #eadfc9;
  padding:30px 28px;
}

.tpl-vintage .tt{
  font-family:"Song Myung",var(--serif);
  letter-spacing:.01em;
}

.tpl-vintage .sm,
.tpl-vintage .ft{
  color:#765b3d;
}

/* 08. Library card */

.tpl-library{
  background:#e9dfc6;
  border:1px solid #a08d67;
  box-shadow:4px 4px 0 #cfc09f;
}

.tpl-library .inner{
  min-height:360px;
  background:
    linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      rgba(118,101,72,.24) 39px,
      rgba(118,101,72,.24) 40px
    );
  background-size:100% 40px;
  background-repeat:repeat-y;
}

.tpl-library .tt{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:1.25rem;
}

.tpl-library .sm,
.tpl-library .ft{
  color:#695c46;
}

/* 09. Black note */

.tpl-black{
  background:#171615;
  color:#f0eadc;
  border:1px solid #37332d;
  box-shadow:5px 5px 0 #090807;
}

.tpl-black .inner{
  background:#171615;
}

.tpl-black .sm,
.tpl-black .ft{
  color:#a99f8c;
}

.tpl-black .tt{
  color:#f2ebdd;
}

.tpl-black .bd{
  color:#e5dece;
}

.tpl-black mark{
  background:rgba(228,190,92,.55);
  color:#fff;
}

/* 10. Typewriter */

.tpl-typewriter{
  background:#f4f0e5;
  border:1px solid #bdb7a9;
  box-shadow:4px 4px 0 #ddd8cb;
}

.tpl-typewriter .inner{
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(0,0,0,.025) 0,
      transparent 30%
    ),
    #f4f0e5;
}

.tpl-typewriter .tt,
.tpl-typewriter .bd{
  font-family:"IBM Plex Sans KR",var(--mono);
}

.tpl-typewriter .tt{
  font-size:1.25rem;
  letter-spacing:.03em;
}

.tpl-typewriter .sm,
.tpl-typewriter .ft{
  color:#716d65;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(8px);
  background:var(--cream);
  color:#1a1510;
  font-size:12px;
  font-weight:700;
  padding:11px 16px;
  border-radius:999px;
  opacity:0;
  transition:.2s;
  z-index:50;
  pointer-events:none
}

.toast.on{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
</style>
</head>

<body>

<div id="app">

  <section id="view-home" class="view active">

    <div class="mast">

      <div class="kicker">Moleskine Journal</div>
      <h1>저널</h1>
      <p class="sub">오프라인 · 글꼴 · 강조 · PNG</p>

      <div class="toolbar">

        <input
          class="search"
          id="search"
          type="search"
          placeholder="검색…"
        >

        <button type="button" class="btn" id="btnBackup">
          JSON 내보내기
        </button>

        <button type="button" class="btn" id="btnImport">
          가져오기
        </button>

        <input
          type="file"
          id="importFile"
          accept="application/json,.json"
          hidden
        >

        <button type="button" class="btn primary" id="btnNew">
          새 글
        </button>

      </div>

    </div>

    <div class="sec">
      <span>목록</span>
      <b id="count">00</b>
    </div>

    <div id="list"></div>

    <div class="empty" id="empty" hidden>
      아직 글이 없습니다.
    </div>

  </section>


  <section id="view-read" class="view">

    <div class="bar">

      <div class="l">
        <button type="button" class="btn ghost" id="btnBackRead">
          ← 목록
        </button>
      </div>

      <div class="r">

        <button type="button" class="btn" id="btnPng">
          PNG
        </button>

        <button type="button" class="btn" id="btnEdit">
          편집
        </button>

        <button type="button" class="btn danger" id="btnDelete">
          삭제
        </button>

      </div>

    </div>

    <div class="cap">
      <div class="frame" id="readFrame"></div>
    </div>

  </section>


  <section id="view-edit" class="view">

    <div class="bar">

      <div class="l">
        <button type="button" class="btn ghost" id="btnBackEdit">
          ← 취소
        </button>
      </div>

      <div class="r">

        <button type="button" class="btn" id="btnPreviewPng">
          미리보기 PNG
        </button>

        <button type="button" class="btn primary" id="btnSave">
          저장
        </button>

      </div>

    </div>


    <label class="lbl">날짜</label>

    <input
      class="field"
      type="date"
      id="editDate"
      style="max-width:200px"
    >


    <label class="lbl">제목</label>

    <input
      class="field"
      type="text"
      id="editTitle"
      maxlength="120"
      placeholder="제목"
    >


    <div class="row2">

      <div>
        <label class="lbl">제목 글꼴</label>
        <select class="field" id="editTitleFont"></select>
      </div>

      <div>
        <label class="lbl">본문 글꼴</label>
        <select class="field" id="editBodyFont"></select>
      </div>

    </div>


    <label class="lbl">본문</label>

    <div class="fmt">

      <button type="button" id="fmtH">
        강조
      </button>

      <button type="button" id="fmtU">
        밑줄
      </button>

      <button type="button" id="fmtC">
        지우기
      </button>

    </div>


    <div class="hl">

      <span>강조색</span>

      <button
        type="button"
        class="sw on"
        data-c="#e8c98a"
        style="background:#e8c98a"
      ></button>

      <button
        type="button"
        class="sw"
        data-c="#f5a6b0"
        style="background:#f5a6b0"
      ></button>

      <button
        type="button"
        class="sw"
        data-c="#a8d4a0"
        style="background:#a8d4a0"
      ></button>

      <button
        type="button"
        class="sw"
        data-c="#9ec5e8"
        style="background:#9ec5e8"
      ></button>

    </div>


    <div
      class="cedit"
      id="editBody"
      contenteditable="true"
      data-ph="본문을 입력하세요…"
    ></div>


    <label class="lbl">태그</label>

    <input
      class="field"
      type="text"
      id="editTags"
      placeholder="쉼표로 구분"
    >


    <label class="lbl">오른쪽 라벨 (예: № 01)</label>

    <input
      class="field"
      type="text"
      id="editLabelRight"
      maxlength="40"
      placeholder="비우면 자동 번호"
    >


    <label class="lbl">목록 번호</label>

    <input
      class="field"
      type="text"
      id="editIndexCode"
      maxlength="20"
      placeholder="01"
      style="max-width:120px"
    >


    <label class="lbl">템플릿</label>

    <div class="tpls" id="templateList"></div>


    <div class="sec" style="margin-top:18px">

      <span>미리보기</span>

      <b id="previewTemplateName">몰스킨</b>

    </div>


    <div class="cap">
      <div class="frame" id="editPreview"></div>
    </div>

  </section>

</div>


<div class="toast" id="toast"></div>


<script>
(function(){

  const KEY='west150_journal_moleskine_v1';

  const FONTS=[
    {
      id:'noto-serif',
      label:'Noto Serif KR',
      css:'"Noto Serif KR",Georgia,serif'
    },
    {
      id:'song-myung',
      label:'Song Myung',
      css:'"Song Myung",serif'
    },
    {
      id:'pretendard',
      label:'Pretendard',
      css:'"Pretendard",sans-serif'
    },
    {

      css:'"Noto Sans KR",sans-serif'
    },
    {
      id:'ibm-plex',

    },
    {
      id:'nanum-myeongjo',
      label:'Nanum Myeongjo',
      css:'"Nanum Myeongjo",serif'
    }
  ];

  /* 템플릿 10종 */
  const TEMPLATES=[
    {
      id:'moleskine',
      label:'몰스킨',
      desc:'클래식 노트'
    },
    {
      id:'regal',

    },
    {
      id:'ruled',
      label:'줄노트',
      desc:'클래식 라인'
    },
    {
      id:'plain',
      label:'무지 크림',
      desc:'깨끗한 페이지'
    },
    {
      id:'cornell',
      label:'코넬',
      desc:'정리형 노트'
    },
    {
      id:'grid',
      label:'쿼드레인',
      desc:'격자 노트'
    },
    {
      id:'vintage',
      label:'빈티지',
      desc:'다이어리 스타일'
    },
    {
      id:'library',
      label:'라이브러리',
      desc:'도서관 카드'
    },
    {
      id:'black',
      label:'블랙 노트',

    },
    {

      label:'타이프라이터',

    }
  ];

  let entries=[];
  let currentId=null;
  let filter='';
  let hlColor='#e8c98a';

  let selectedTemplate='moleskine';


  const $=id=>document.getElementById(id);


  function uid(){
    return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)
  }


  function todayISO(){
    const d=new Date();

    return d.getFullYear()+'-'+
      String(d.getMonth()+1).padStart(2,'0')+'-'+
      String(d.getDate()).padStart(2,'0')
  }


  function toast(m){
    const el=$('toast');

    el.textContent=m;
    el.classList.add('on');

    clearTimeout(toast._t);

    toast._t=setTimeout(
      ()=>el.classList.remove('on'),
      1800
    )
  }


  function show(v){
    document
      .querySelectorAll('.view')
      .forEach(x=>x.classList.remove('active'));

    $('view-'+v).classList.add('active');

    window.scrollTo(0,0)
  }


  function load(){

    try{

      const r=localStorage.getItem(KEY);

      if(r){

        const d=JSON.parse(r);

        entries=Array.isArray(d.entries)
          ?d.entries
          :[]

      }

    }catch(e){

      entries=[]

    }

  }


  function saveStore(){

    try{

      localStorage.setItem(
        KEY,
        JSON.stringify({
          entries,
          v:1
        })
      )

    }catch(e){

      toast('저장 공간 부족')

    }

  }


  function fontCss(id){

    const f=FONTS.find(x=>x.id===id);

    return f
      ?f.css
      :FONTS[0].css

  }


  function esc(s){

    return String(s||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')

  }


  function plain(html){

    const d=document.createElement('div');

    d.innerHTML=html||'';

    return (d.textContent||'').trim()

  }


  function sanitize(html){

    const d=document.createElement('div');

    d.innerHTML=html||'';

    d.querySelectorAll('script,style,iframe')
      .forEach(n=>n.remove());

    const allow=[
      'mark',
      'u',
      'b',
      'i',
      'strong',
      'em',
      'br',
      'div',
      'p',
      'span'
    ];

    const walk=n=>{

      if(n.nodeType!==1)return;

      const t=n.tagName.toLowerCase();

      if(!allow.includes(t)){

        const p=n.parentNode;

        while(n.firstChild)
          p.insertBefore(n.firstChild,n);

        p.removeChild(n);

        return

      }

      [...n.attributes].forEach(a=>{

        if(a.name!=='style'&&a.name!=='class')
          n.removeAttribute(a.name)

      });

      if(t!=='mark'&&n.hasAttribute('style'))
        n.removeAttribute('style');

      [...n.children].forEach(walk)

    };

    [...d.children].forEach(walk);

    return d.innerHTML;

  }


  function fmtDate(iso){

    if(!iso)return '—';

    const p=iso.split('-');

    if(p.length!==3)return iso;

    return p[0]+'.'+p[1]+'.'+p[2]

  }


  function entryNo(e){

    const sorted=[
      ...entries
    ].sort(
      (a,b)=>
        (a.createdAt||'').localeCompare(b.createdAt||'')
    );

    const i=sorted.findIndex(
      x=>x.id===e.id
    );

    return i>=0
      ?i+1
      :entries.length

  }


  function sheetHTML(e){

    const left=fmtDate(e.date);

    const right=
      e.labelRight||
      ('№ '+String(entryNo(e)).padStart(3,'0'));

    const tf=
      'font-family:'+fontCss(
        e.titleFont||'noto-serif'
      );

    const bf=
      'font-family:'+fontCss(
        e.bodyFont||'noto-serif'
      );

    const body=
      e.bodyHtml||
      esc(e.body||'');

    const tags=
      (e.tags&&e.tags.length)
        ?e.tags.join(' · ')
        :'';

    const tpl=
      e.template||
      'moleskine';

    return `
      <div class="sheet tpl-${tpl}">
        <div class="inner">

          <div class="sm">
            <span>${esc(left)}</span>
            <span>${esc(right)}</span>
          </div>

          <div class="tt" style="${tf}">
            ${esc(e.title||'제목 없음')}
          </div>

          <div class="bd" style="${bf}">
            ${body}
          </div>

          <div class="ft">
            <span>${esc(tags)}</span>
            <span>${esc(
              e.indexCode||
              String(entryNo(e)).padStart(2,'0')
            )}</span>
          </div>

        </div>
      </div>
    `;

  }


  function fillFonts(){

    const opts=
      FONTS
        .map(
          f=>
            `<option value="${f.id}">${f.label}</option>`
        )
        .join('');

    $('editTitleFont').innerHTML=opts;
    $('editBodyFont').innerHTML=opts;

  }


  function fillTemplates(){

    const box=$('templateList');

    if(!box)return;

    box.innerHTML=
      TEMPLATES
        .map(t=>`
          <button
            type="button"
            class="chip ${t.id===selectedTemplate?'on':''}"
            data-template="${t.id}"
          >
            ${t.label}
            <small>${t.desc}</small>
          </button>
        `)
        .join('');

    box
      .querySelectorAll('[data-template]')
      .forEach(btn=>{

        btn.onclick=()=>{

          selectedTemplate=
            btn.dataset.template;

          box
            .querySelectorAll('.chip')
            .forEach(x=>{
              x.classList.toggle(
                'on',
                x===btn
              );
            });

          const info=
            TEMPLATES.find(
              t=>t.id===selectedTemplate
            );

          $('previewTemplateName').textContent=
            info
              ?info.label
              :'몰스킨';

          updatePreview();

        };

      });

  }


  function renderList(){

    const q=
      filter.trim().toLowerCase();

    let list=
      [...entries]
        .sort(
          (a,b)=>
            (b.date||'').localeCompare(a.date||'')||
            (b.updatedAt||'').localeCompare(b.updatedAt||'')
        );

    if(q){

      list=
        list.filter(
          e=>
            (e.title||'').toLowerCase().includes(q)||
            plain(e.bodyHtml||e.body)
              .toLowerCase()
              .includes(q)||
            (e.tags||[])
              .join(' ')
              .toLowerCase()
              .includes(q)
        );

    }

    $('count').textContent=
      String(entries.length).padStart(2,'0');

    const box=$('list');
    const empty=$('empty');

    if(!list.length){

      box.innerHTML='';

      empty.hidden=false;

      return

    }

    empty.hidden=true;

    box.innerHTML=
      list
        .map(e=>`
          <article
            class="entry"
            data-id="${e.id}"
          >
            <div class="d"></div>

            <div>
              <div class="t"></div>
              <div class="x"></div>
            </div>

          </article>
        `)
        .join('');

    list.forEach((e,i)=>{

      const el=box.children[i];

      el.querySelector('.d').textContent=
        e.indexCode||
        fmtDate(e.date);

      el.querySelector('.t').textContent=
        e.title||
        '제목 없음';

      el.querySelector('.x').textContent=
        plain(e.bodyHtml||e.body)
          .slice(0,120)||
        '—';

      el.onclick=
        ()=>openRead(e.id);

    });

  }


  function openRead(id){

    currentId=id;

    const e=
      entries.find(
        x=>x.id===id
      );

    if(!e)return;

    $('readFrame').innerHTML=
      sheetHTML(e);

    show('read');

  }


  function openEdit(id){

    currentId=id||null;

    fillFonts();

    if(id){

      const e=
        entries.find(
          x=>x.id===id
        );

      if(!e)return;

      $('editDate').value=
        e.date||
        todayISO();

      $('editTitle').value=
        e.title||
        '';

      $('editBody').innerHTML=
        e.bodyHtml||
        esc(e.body||'');

      $('editTags').value=
        (e.tags||[]).join(', ');

      $('editLabelRight').value=
        e.labelRight||
        '';

      $('editIndexCode').value=
        e.indexCode||
        '';

      $('editTitleFont').value=
        e.titleFont||
        'noto-serif';

      $('editBodyFont').value=
        e.bodyFont||
        'noto-serif';

      selectedTemplate=
        e.template||
        'moleskine';

    }else{

      $('editDate').value=
        todayISO();

      $('editTitle').value=
        '';

      $('editBody').innerHTML=
        '';

      $('editTags').value=
        '';

      $('editLabelRight').value=
        '';

      $('editIndexCode').value=
        '';

      $('editTitleFont').value=
        'noto-serif';

      $('editBodyFont').value=
        'noto-serif';

      selectedTemplate=
        'moleskine';

    }

    fillTemplates();

    const info=
      TEMPLATES.find(
        t=>t.id===selectedTemplate
      );

    $('previewTemplateName').textContent=
      info
        ?info.label
        :'몰스킨';

    updatePreview();

    show('edit');

  }


  function draft(){

    return {

      date:
        $('editDate').value||
        todayISO(),

      title:
        $('editTitle').value.trim()||
        '제목 없음',

      bodyHtml:
        sanitize(
          $('editBody').innerHTML
        ),

      body:
        plain(
          $('editBody').innerHTML
        ),

      tags:
        ($('editTags').value||'')
          .split(',')
          .map(t=>t.trim())
          .filter(Boolean)
          .slice(0,12),

      labelRight:
        $('editLabelRight').value.trim(),

      indexCode:
        $('editIndexCode').value.trim(),

      titleFont:
        $('editTitleFont').value,

      bodyFont:
        $('editBodyFont').value,

      template:
        selectedTemplate,

      id:
        currentId||
        'draft',

      createdAt:
        new Date().toISOString()

    };

  }


  function updatePreview(){

    $('editPreview').innerHTML=
      sheetHTML(
        draft()
      );

  }


  function saveEntry(){

    const d=draft();

    if(!d.title&&!d.body){

      toast(
        '제목 또는 본문이 필요합니다'
      );

      return

    }

    const now=
      new Date().toISOString();

    if(currentId){

      const e=
        entries.find(
          x=>x.id===currentId
        );

      if(!e)return;

      Object.assign(
        e,
        {
          ...d,
          id:currentId,
          updatedAt:now
        }
      );

    }else{

      const e={
        ...d,
        id:uid(),
        createdAt:now,
        updatedAt:now
      };

      entries.push(e);

      currentId=e.id;

    }

    saveStore();

    toast('저장됨');

    openRead(currentId);

  }


  function deleteEntry(){

    if(
      !currentId||
      !confirm('이 글을 삭제할까요?')
    )return;

    entries=
      entries.filter(
        e=>e.id!==currentId
      );

    currentId=null;

    saveStore();

    toast('삭제됨');

    renderList();

    show('home');

  }


  function highlight(){

    const el=
      $('editBody');

    const sel=
      window.getSelection();

    if(
      !sel||
      !sel.rangeCount||
      sel.isCollapsed
    ){

      toast('글자를 선택하세요');

      return

    }

    const range=
      sel.getRangeAt(0);

    if(
      !el.contains(
        range.commonAncestorContainer
      )
    ){

      toast(
        '본문에서 선택하세요'
      );

      return

    }

    try{

      const m=
        document.createElement('mark');

      m.style.background=
        hlColor;

      range.surroundContents(m);

      sel.removeAllRanges();

    }catch(e){

      try{

        document.execCommand(
          'hiliteColor',
          false,
          hlColor
        );

      }catch(e2){}

    }

    updatePreview();

  }


  async function savePng(frame,name){

    if(
      typeof html2canvas==='undefined'
    ){

      toast(
        'html2canvas 없음'
      );

      return

    }

    toast(
      '이미지 생성 중…'
    );

    try{

      const target=
        frame.firstElementChild||
        frame;

      await document.fonts.ready;

      const canvas=
        await html2canvas(
          target,
          {
            backgroundColor:'#f4f1e6',
            scale:2,
            useCORS:true,
            logging:false,
            allowTaint:false,
            imageTimeout:0
          }
        );

      const a=
        document.createElement('a');

      a.download=
        (name||'journal')
          .replace(/[\\/:*?"<>|]/g,'_')
          .slice(0,40)+
        '.png';

      a.href=
        canvas.toDataURL(
          'image/png'
        );

      document.body.appendChild(a);

      a.click();

      a.remove();

      toast(
        'PNG 저장됨'
      );

    }catch(e){

      toast(
        'PNG 실패'
      );

    }

  }


  function seed(){

    if(entries.length)return;

    entries.push({

      id:uid(),

      date:todayISO(),

      title:'첫 페이지',

      body:'천천히 적습니다.',

      bodyHtml:
        '천천히 적습니다.<br><br><mark style="background:#e8c98a">내일 다시 읽기.</mark>',

      tags:['시작'],

      titleFont:'noto-serif',

      bodyFont:'noto-serif',

      template:'moleskine',

      labelRight:'№ 001',

      indexCode:'01',

      createdAt:
        new Date().toISOString(),

      updatedAt:
        new Date().toISOString()

    });

    saveStore();

  }


  $('btnNew').onclick=
    ()=>openEdit(null);


  $('btnBackRead').onclick=
    ()=>{
      renderList();
      show('home');
    };


  $('btnBackEdit').onclick=
    ()=>{
      if(currentId)
        openRead(currentId);
      else{
        renderList();
        show('home');
      }
    };


  $('btnEdit').onclick=
    ()=>openEdit(currentId);


  $('btnSave').onclick=
    saveEntry;


  $('btnDelete').onclick=
    deleteEntry;


  $('btnPng').onclick=
    ()=>{
      const e=
        entries.find(
          x=>x.id===currentId
        );

      savePng(
        $('readFrame'),
        (e&&e.title)||
        'journal'
      )
    };


  $('btnPreviewPng').onclick=
    ()=>{
      savePng(
        $('editPreview'),
        'preview'
      )
    };


  $('fmtH').onclick=
    highlight;


  $('fmtU').onclick=
    ()=>{
      $('editBody').focus();

      document.execCommand(
        'underline'
      );

      updatePreview()
    };


  $('fmtC').onclick=
    ()=>{
      $('editBody').focus();

      document.execCommand(
        'removeFormat'
      );

      $('editBody')
        .querySelectorAll('mark')
        .forEach(m=>{

          const p=m.parentNode;

          while(m.firstChild)
            p.insertBefore(
              m.firstChild,
              m
            );

          p.removeChild(m);

        });

      updatePreview()
    };


  document
    .querySelectorAll('.sw')
    .forEach(
      s=>
        s.onclick=
          ()=>{
            hlColor=
              s.dataset.c;

            document
              .querySelectorAll('.sw')
              .forEach(
                x=>
                  x.classList.toggle(
                    'on',
                    x===s
                  )
              )
          }
    );


  [
    'editTitle',
    'editTags',
    'editDate',
    'editLabelRight',
    'editIndexCode',
    'editTitleFont',
    'editBodyFont'
  ]
  .forEach(id=>{

    $(id).addEventListener(
      'input',
      updatePreview
    );

    $(id).addEventListener(
      'change',
      updatePreview
    );

  });


  $('editBody')
    .addEventListener(
      'input',
      updatePreview
    );


  $('search').oninput=
    e=>{
      filter=
        e.target.value||
        '';

      renderList()
    };


  $('btnBackup').onclick=
    ()=>{

      const a=
        document.createElement('a');

      a.href=
        URL.createObjectURL(
          new Blob(
            [
              JSON.stringify(
                {entries},
                null,
                2
              )
            ],
            {
              type:'application/json'
            }
          )
        );

      a.download=
        'journal-'+
        todayISO()+
        '.json';

      document.body.appendChild(a);

      a.click();

      a.remove();

      toast('내보냄')

    };


  $('btnImport').onclick=
    ()=>$('importFile').click();


  $('importFile').onchange=
    e=>{

      const f=
        e.target.files&&
        e.target.files[0];

      if(!f)return;

      const r=
        new FileReader();

      r.onload=
        ()=>{
          try{

            const d=
              JSON.parse(
                r.result
              );

            const list=
              Array.isArray(d.entries)
                ?d.entries
                :(Array.isArray(d)
                    ?d
                    :null);

            if(!list)
              throw 0;

            if(
              entries.length&&
              !confirm(
                '모든 글을 바꿀까요?'
              )
            )
              return;

            entries=list;

            saveStore();

            renderList();

            show('home');

            toast(
              '가져옴 '+entries.length
            );

          }catch(err){

            toast(
              '잘못된 JSON'
            );

          }

        };

      r.readAsText(f);

      e.target.value='';

    };


  load();
  seed();
  fillFonts();
  fillTemplates();
  renderList();

})();
</script>

</body>
</html>
