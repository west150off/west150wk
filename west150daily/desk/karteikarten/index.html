<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1612">
<title>Karteikasten</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="../libs/html2canvas.min.js"></script>
<style>
:root{
  --bg:#1a1612;
  --bg2:#221e19;
  --panel:#2a241e;
  --panel2:#332c24;
  --ink:#f3ece1;
  --muted:#9a8f80;
  --line:#3d342c;
  --line2:#4a4036;
  --gold:#c4a574;
  --rot:#a33b32;
  --grun:#4a5c45;
  --holz:#6b5344;
  --papier:#f2ead8;
  --serif:"Noto Serif KR","Song Myung",Georgia,"Times New Roman",serif;
  --sans:"Pretendard","Noto Sans KR",-apple-system,sans-serif;
  --mono:"IBM Plex Sans KR",ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;background:
    radial-gradient(ellipse 120% 80% at 50% -20%,#2c241c 0%,transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

#app{min-height:100%;max-width:960px;margin:0 auto;padding:calc(22px + var(--safe-t)) 20px calc(40px + var(--safe-b))}
.view{display:none}.view.active{display:block}

.masthead{
  position:relative;
  border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  padding:28px 24px 22px;
  margin-bottom:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
.masthead::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--rot),var(--gold));
}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;padding-left:8px;
}
.masthead h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(2rem,5.5vw,2.75rem);
  letter-spacing:-.02em;line-height:1.05;padding-left:8px;
}
.masthead h1 em{font-style:italic;font-weight:500;color:var(--muted);font-size:.42em;display:block;margin-top:8px;letter-spacing:.18em;text-transform:uppercase}
.sub{margin-top:12px;font-size:13px;color:var(--muted);padding-left:8px;line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-left:8px;align-items:center}
.search{
  flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line2);
  padding:11px 14px;font-size:13px;border-radius:1px;
}
.btn{
  padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:1px;color:var(--ink);background:var(--bg2);
  white-space:nowrap;transition:.15s;
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--rot);border-color:var(--rot);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:#e08b83;border-color:#5a302c;background:transparent}

.field,select.field{
  width:100%;background:var(--bg);border:1px solid var(--line2);
  padding:11px 12px;font-size:13px;border-radius:1px;color:var(--ink);color-scheme:dark;
}
label.lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

.crumb{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;line-height:1.7;
  padding-bottom:12px;border-bottom:1px solid var(--line);
}
.crumb button{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:10px}
.crumb span{margin:0 8px;opacity:.4}

.sec-label{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:8px 0 16px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);
}
.sec-label b{color:var(--gold);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{
  position:relative;cursor:pointer;min-height:140px;
  background:
    linear-gradient(145deg,#3a3028 0%,#2a221c 40%,#241e18 100%);
  border:1px solid #4a3c32;
  border-radius:2px 2px 3px 3px;
  padding:18px 16px 16px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 8px 20px rgba(0,0,0,.35);
  transition:transform .15s, border-color .15s;
}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile::after{
  content:"";position:absolute;left:12px;right:12px;bottom:0;height:4px;
  background:linear-gradient(90deg,transparent,#5a4a3c,transparent);opacity:.5;
}
.tile .metal{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  width:36px;height:8px;border-radius:2px;
  background:linear-gradient(180deg,#8a7a68,#5a4e42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.tile .tab{
  position:absolute;top:-1px;right:16px;
  background:var(--rot);color:#fff;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;
  padding:5px 10px 6px;border-radius:0 0 3px 3px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.tile.tab-grun .tab{background:var(--grun)}
.tile.tab-gold .tab{background:var(--gold);color:#1a1408}
.tile.tab-holz .tab{background:var(--holz);color:#f3ece1}
.tile h3{
  font-family:var(--serif);font-size:1.2rem;font-weight:700;
  margin:6px 0 10px;line-height:1.25;padding-right:36px;letter-spacing:-.01em;
}
.tile .stat{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);line-height:1.55;
}

.tile.box{
  background:linear-gradient(160deg,#e8dcc8 0%,#d4c4a8 100%);
  border:1px solid #b8a888;color:#1a1612;
  box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.25);
}
.tile.box h3{color:#1a1612}
.tile.box .stat{color:#5a4e42}
.tile.box .tab{top:auto;bottom:-1px;right:12px;border-radius:3px 3px 0 0}
.tile.box .metal{display:none}
.tile.box .thickness{
  position:absolute;right:-5px;top:8px;bottom:8px;width:5px;
  background:linear-gradient(90deg,#c4b090,#a89070);
  border-radius:0 2px 2px 0;
}

.card-row{
  display:grid;grid-template-columns:64px 1fr auto;gap:14px;
  padding:16px 14px;margin-bottom:8px;align-items:start;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rot);
  transition:border-color .15s;
}
.card-row:hover{border-color:var(--line2);border-left-color:var(--gold)}
.card-row .idx{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);
  padding-top:2px;
}
.card-row .ct{font-family:var(--serif);font-size:1.08rem;font-weight:600;line-height:1.3;margin-bottom:4px}
.card-row .ex{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-row .side{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}

.page-bar{
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;
  margin-bottom:18px;
}
.page-bar h2{font-family:var(--serif);font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.page-bar .left,.page-bar .right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.flip-bar{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line)}
.flip-bar button{
  flex:1;padding:12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);background:var(--bg2);border-right:1px solid var(--line);
}
.flip-bar button:last-child{border-right:0}
.flip-bar button.active{background:var(--rot);color:#fff}

.fmt-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fmt-bar button{
  padding:8px 12px;border:1px solid var(--line2);font-size:11px;font-weight:600;
  color:var(--ink);background:var(--panel);border-radius:1px;
}
.fmt-bar button:hover{border-color:var(--gold);color:var(--gold)}
.hl-colors{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.hl-colors span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.hl-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.hl-swatch.active{border-color:#fff;box-shadow:0 0 0 1px #000}

.cedit{
  min-height:130px;padding:14px;background:var(--bg);border:1px solid var(--line2);
  border-radius:1px;line-height:1.65;outline:none;white-space:pre-wrap;word-break:keep-all;margin-bottom:12px;
}
.cedit:empty:before{content:attr(data-ph);color:#5a5048}
.cedit mark{color:inherit;padding:0 .12em}
.cedit u{text-underline-offset:3px}

.preview-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin:20px 0 12px;display:flex;justify-content:space-between;
  padding-top:16px;border-top:1px solid var(--line);
}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:16px}
.tpl-chip{
  border:1px solid var(--line);padding:12px 8px;font-size:11px;font-weight:600;
  text-align:center;cursor:pointer;border-radius:1px;color:var(--muted);background:var(--panel);
}
.tpl-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(196,165,116,.08)}
.tpl-chip small{display:block;margin-top:4px;font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.capture-wrap{display:flex;justify-content:center;padding-bottom:28px}
.sheet-frame{width:100%;max-width:440px}

.kcard{aspect-ratio:148/105;width:100%;max-width:440px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.kcard .face-tag{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.kcard .body{flex:1;padding:30px 26px 18px;overflow:hidden;word-break:keep-all}
.kcard .foot{padding:8px 16px 12px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;opacity:.7}

/* ===== 줄노트 (html2canvas 대응: 실제 줄 요소 사용) ===== */
.tpl-ruled{
  background:#f4f0e4;
  color:#1a1612;
  border:1px solid #3d3428;
  box-shadow:4px 4px 0 #2a2018;
}
.tpl-ruled .body{
  position:relative;
  line-height:28px;
  font-size:15px;
}
.tpl-ruled .ruled-lines{
  position:absolute;
  left:0; right:0; top:0; bottom:0;
  pointer-events:none;
  z-index:0;
}
.tpl-ruled .ruled-line{
  position:absolute;
  left:0; right:0;
  height:1px;
  background:#d8d0c0;
}
.tpl-ruled .body-content{
  position:relative;
  z-index:1;
}
.tpl-ruled mark{background:rgba(196,165,116,.55)}

.tpl-blank{background:#faf6ec;color:#1a1612;border:1px solid #cfc6b0}
.tpl-blank .body{font-size:15px;line-height:1.65}

.tpl-academic{background:#f7f2e6;color:#1a1612;border:1px solid #cfc6b0}
.tpl-academic .body{border-left:3px solid var(--rot);padding-left:18px;margin:20px 16px 12px 20px;font-size:15px;line-height:1.7}

.tpl-schule{
  background:#e8f0e4;color:#1a1612;border:2px solid #4a5c45;
  box-shadow:inset 0 0 0 4px #e8f0e4, inset 0 0 0 5px #4a5c45;
}
.tpl-schule .body{font-size:15px;line-height:1.65;padding-top:36px}
.tpl-schule .ribbon{
  position:absolute;top:0;left:0;right:0;height:22px;background:#4a5c45;color:#e8f0e4;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;padding:0 14px;
}

.tpl-holz{
  background:#f0e6d4;color:#1a1612;
  border:6px solid #6b5344;
  box-shadow:inset 0 0 0 1px #8a7060;
}
.tpl-holz .body{font-size:15px;line-height:1.65}

.tpl-bibliothek{
  background:#f5f0e4;color:#1a1612;border:1px solid #b0a888;
}
.tpl-bibliothek .catalog{
  border-bottom:2px solid #1a1612;margin:0 0 12px;padding:0 0 8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;justify-content:space-between;
}
.tpl-bibliothek .body{font-size:15px;line-height:1.65;padding-top:12px}

.tpl-night{background:linear-gradient(160deg,#1c1e28,#12141c);color:#e8ecf2;border:1px solid #2a3040}
.tpl-night .body{font-size:15px;line-height:1.65;color:#c5ccd8}
.tpl-night mark{background:rgba(106,159,212,.35)}
.tpl-night .foot{border-top:1px solid #2a3548}

.tpl-index{background:#f3eee2;color:#1a1612;border:1px solid #b0a890}
.tpl-index .stamp{
  position:absolute;top:14px;left:16px;border:1.5px solid var(--rot);color:var(--rot);
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;transform:rotate(-4deg);
}
.tpl-index .body{font-size:15px;line-height:1.65;padding-top:40px}

.tpl-notiz{
  background:#fff6b8;color:#1a1612;border:1px solid #d4c46a;
  box-shadow:2px 3px 0 rgba(0,0,0,.12);
}
.tpl-notiz .body{font-size:15px;line-height:1.6;padding-top:24px}
.tpl-notiz .pin{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;background:#a33b32;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}

.tpl-darkpaper{background:#1f1b17;color:#f0ebe0;border:1px solid #3a342c}
.tpl-darkpaper .body{font-size:15px;line-height:1.65}
.tpl-darkpaper .foot{border-top:1px solid #2a2620}

.empty{padding:48px 16px;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%) translateY(8px);background:var(--ink);color:#1a1612;font-size:12px;font-weight:700;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:4px 4px 0 0;padding:22px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:1.2rem;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <section id="view-drawers" class="view active">
    <header class="masthead">
      <div class="kicker">카타이카스텐</div>
      <h1>서랍</h1>
      <p class="sub">인덱스 카드 · 박스 · 카드 · 오프라인 보관함</p>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="검색…">
        <button type="button" class="btn" id="btnBackup">내보내기</button>
        <button type="button" class="btn" id="btnImport">가져오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button type="button" class="btn primary" id="btnNewDrawer">+ 서랍</button>
      </div>
    </header>
    <div class="sec-label"><span>카드함</span><b id="drawerCount">00</b></div>
    <div class="grid" id="drawerGrid"></div>
    <div class="empty" id="drawerEmpty" hidden>서랍이 없습니다.<br>첫 서랍을 만들어 보세요.</div>
  </section>

  <section id="view-boxes" class="view">
    <div class="crumb"><button type="button" id="toDrawers">서랍</button><span>/</span><span id="crumbDrawer">—</span></div>
    <div class="page-bar">
      <div class="left"><h2 id="boxTitle">—</h2></div>
      <div class="right">
        <button type="button" class="btn" id="btnEditDrawer">이름 변경</button>
        <button type="button" class="btn danger" id="btnDelDrawer">삭제</button>
        <button type="button" class="btn primary" id="btnNewBox">+ 박스</button>
      </div>
    </div>
    <div class="sec-label"><span>박스</span><b id="boxCount">00</b></div>
    <div class="grid" id="boxGrid"></div>
    <div class="empty" id="boxEmpty" hidden>이 서랍에 박스가 없습니다.</div>
  </section>

  <section id="view-cards" class="view">
    <div class="crumb">
      <button type="button" id="toDrawers2">서랍</button><span>/</span>
      <button type="button" id="toBoxes">박스</button><span>/</span>
      <span id="crumbBox">—</span>
    </div>
    <div class="page-bar">
      <div class="left"><h2 id="cardsTitle">—</h2></div>
      <div class="right">
        <button type="button" class="btn" id="btnEditBox">이름 변경</button>
        <button type="button" class="btn danger" id="btnDelBox">삭제</button>
        <button type="button" class="btn primary" id="btnNewCard">+ 카드</button>
      </div>
    </div>
    <div class="sec-label"><span>카드</span><b id="cardCount">00</b></div>
    <div id="cardList"></div>
    <div class="empty" id="cardEmpty" hidden>이 박스에 카드가 없습니다.</div>
  </section>

  <section id="view-edit" class="view">
    <div class="page-bar">
      <div class="left"><button type="button" class="btn ghost" id="btnBackCards">← 박스</button></div>
      <div class="right">
        <button type="button" class="btn" id="btnPng">PNG</button>
        <button type="button" class="btn primary" id="btnSaveCard">저장</button>
        <button type="button" class="btn danger" id="btnDelCard">삭제</button>
      </div>
    </div>
    <div class="flip-bar">
      <button type="button" class="active" id="btnFront">앞면</button>
      <button type="button" id="btnBack">뒷면</button>
    </div>
    <div class="row2" style="margin-bottom:12px">
      <div><label class="lbl">글꼴</label><select class="field" id="cardFont"></select></div>
      <div><label class="lbl">템플릿</label><select class="field" id="cardTpl"></select></div>
    </div>
    <div class="fmt-bar">
      <button type="button" id="fmtH">강조</button>
      <button type="button" id="fmtU">밑줄</button>
      <button type="button" id="fmtC">서식 지우기</button>
    </div>
    <div class="hl-colors">
      <span>색</span>
      <button type="button" class="hl-swatch active" data-c="#e8c98a" style="background:#e8c98a"></button>
      <button type="button" class="hl-swatch" data-c="#f5a6b0" style="background:#f5a6b0"></button>
      <button type="button" class="hl-swatch" data-c="#a8d4a0" style="background:#a8d4a0"></button>
      <button type="button" class="hl-swatch" data-c="#9ec5e8" style="background:#9ec5e8"></button>
      <button type="button" class="hl-swatch" data-c="#d4b8f0" style="background:#d4b8f0"></button>
    </div>
    <div class="cedit" id="faceEditor" contenteditable="true" data-ph="이 면에 내용을 입력하세요…"></div>
    <label class="lbl">번호 / 코드</label>
    <input class="field" id="cardCode" placeholder="예: 01, A-3" maxlength="20" style="max-width:200px;margin-bottom:8px">
    <div class="preview-label"><span>카드 미리보기</span><span id="faceLabel">앞면</span></div>
    <div class="tpl-grid" id="tplGrid"></div>
    <div class="capture-wrap"><div class="sheet-frame" id="previewFrame"></div></div>
  </section>
</div>

<div class="modal-bg" id="nameModal">
  <div class="modal">
    <h3 id="nameTitle">Name</h3>
    <input class="field" id="nameInput" placeholder="Name" maxlength="60">
    <div class="modal-actions">
      <button type="button" class="btn" id="nameCancel">취소</button>
      <button type="button" class="btn primary" id="nameSave">확인</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY='west150_kartei_v2';
  const TEMPLATES=[
    {id:'ruled',name:'줄노트',desc:'Ruled'},
    {id:'blank',name:'무지',desc:'Plain'},
    {id:'academic',name:'학술',desc:'Margin'},
    {id:'schule',name:'학교',desc:'Green'},
    {id:'holz',name:'나무함',desc:'Wood'},
    {id:'bibliothek',name:'도서관',desc:'Catalog'},
    {id:'night',name:'나이트',desc:'Dark'},
    {id:'index',name:'인덱스',desc:'Stamp'},
    {id:'notiz',name:'메모',desc:'Yellow'},
    {id:'darkpaper',name:'다크',desc:'Ink'},
  ];
  const FONTS=[
    {id:'noto-serif',label:'Noto Serif KR',css:'"Noto Serif KR",Georgia,serif'},
    {id:'song-myung',label:'Song Myung',css:'"Song Myung",Georgia,serif'},
    {id:'pretendard',label:'Pretendard',css:'"Pretendard",sans-serif'},
    {id:'noto-sans',label:'Noto Sans KR',css:'"Noto Sans KR",sans-serif'},
    {id:'ibm-plex',label:'IBM Plex Sans KR',css:'"IBM Plex Sans KR",sans-serif'},
    {id:'nanum-myeongjo',label:'Nanum Myeongjo',css:'"Nanum Myeongjo",serif'},
    {id:'black-han',label:'Black Han Sans',css:'"Black Han Sans",sans-serif'},
    {id:'ridibatang',label:'RIDI Batang',css:'"RIDIBatang",serif'},
  ];
  const TAB_COLORS=['','tab-grun','tab-gold','tab-holz'];

  let data={drawers:[]};
  let drawerId=null, boxId=null, cardId=null;
  let face='front', hlColor='#e8c98a', nameMode=null, filter='';

  const $=id=>document.getElementById(id);
  function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}
  function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('view-'+v).classList.add('active');window.scrollTo(0,0)}
  function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.drawers)) data=d}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('저장 공간 부족')}}
  function fontCss(id){const f=FONTS.find(x=>x.id===id);return f?f.css:FONTS[0].css}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function plain(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim()}
  function sanitize(html){
    const d=document.createElement('div');d.innerHTML=html||'';
    d.querySelectorAll('script,style,iframe').forEach(n=>n.remove());
    const allow=['mark','u','b','i','strong','em','br','div','p','span'];
    const walk=n=>{if(n.nodeType!==1)return;const t=n.tagName.toLowerCase();
      if(!allow.includes(t)){const p=n.parentNode;while(n.firstChild)p.insertBefore(n.firstChild,n);p.removeChild(n);return}
      [...n.attributes].forEach(a=>{if(a.name!=='style'&&a.name!=='class')n.removeAttribute(a.name)});
      if(t!=='mark'&&n.hasAttribute('style')) n.removeAttribute('style');
      [...n.children].forEach(walk)};
    [...d.children].forEach(walk);return d.innerHTML;
  }
  function getDrawer(){return data.drawers.find(d=>d.id===drawerId)}
  function getBox(){const d=getDrawer();return d&&(d.boxes||[]).find(b=>b.id===boxId)}
  function getCard(){const b=getBox();return b&&(b.cards||[]).find(c=>c.id===cardId)}
  function countCards(box){return (box.cards||[]).length}
  function countBoxCards(drawer){return (drawer.boxes||[]).reduce((n,b)=>n+countCards(b),0)}

  function renderDrawers(){
    let list=data.drawers;
    $('drawerCount').textContent=String(list.length).padStart(2,'0');
    const grid=$('drawerGrid');const empty=$('drawerEmpty');
    if(!list.length){grid.innerHTML='';empty.hidden=false;return}
    empty.hidden=true;
    const q=filter.trim().toLowerCase();
    if(q){
      list=list.filter(d=>d.name.toLowerCase().includes(q)||(d.boxes||[]).some(b=>
        b.name.toLowerCase().includes(q)||(b.cards||[]).some(c=>plain(c.frontHtml||c.front).toLowerCase().includes(q)||plain(c.backHtml||c.back).toLowerCase().includes(q))
      ));
    }
    grid.innerHTML=list.map((d,i)=>`
      <div class="tile ${TAB_COLORS[i%TAB_COLORS.length]}" data-id="${d.id}">
        <div class="tab">${String.fromCharCode(65+(i%26))}</div>
        <h3></h3>
        <div class="stat"></div>
        <div class="metal"></div>
      </div>`).join('');
    list.forEach((d,i)=>{
      const el=grid.children[i];
      el.querySelector('h3').textContent=d.name||'서랍';
      el.querySelector('.stat').innerHTML=(d.boxes||[]).length+'개 박스<br>'+countBoxCards(d)+'장';
      el.onclick=()=>{drawerId=d.id;renderBoxes();show('boxes')};
    });
  }

  function renderBoxes(){
    const d=getDrawer();if(!d){show('drawers');return}
    $('crumbDrawer').textContent=d.name||'서랍';
    $('boxTitle').textContent=d.name||'서랍';
    const boxes=d.boxes||[];
    $('boxCount').textContent=String(boxes.length).padStart(2,'0');
    const grid=$('boxGrid');const empty=$('boxEmpty');
    if(!boxes.length){grid.innerHTML='';empty.hidden=false;return}
    empty.hidden=true;
    grid.innerHTML=boxes.map((b,i)=>`
      <div class="tile box" data-id="${b.id}">
        <div class="tab">${String(i+1).padStart(2,'0')}</div>
        <div class="thickness"></div>
        <h3></h3>
        <div class="stat"></div>
      </div>`).join('');
    boxes.forEach((b,i)=>{
      const el=grid.children[i];
      el.querySelector('h3').textContent=b.name||'박스';
      const n=countCards(b);
      el.querySelector('.stat').textContent=n+'장';
      el.onclick=()=>{boxId=b.id;renderCards();show('cards')};
    });
  }

  function renderCards(){
    const d=getDrawer();const b=getBox();
    if(!d||!b){show('drawers');return}
    $('crumbBox').textContent=b.name||'박스';
    $('cardsTitle').textContent=b.name||'박스';
    const cards=b.cards||[];
    $('cardCount').textContent=String(cards.length).padStart(2,'0');
    const list=$('cardList');const empty=$('cardEmpty');
    if(!cards.length){list.innerHTML='';empty.hidden=false;return}
    empty.hidden=true;
    list.innerHTML=cards.map(c=>`
      <article class="card-row" data-id="${c.id}">
        <div class="idx"></div>
        <div><div class="ct"></div><div class="ex"></div></div>
        <div class="side"></div>
      </article>`).join('');
    cards.forEach((c,i)=>{
      const el=list.children[i];
      el.querySelector('.idx').textContent=c.code||String(i+1).padStart(2,'0');
      el.querySelector('.ct').textContent=plain(c.frontHtml||c.front)||'제목 없음';
      el.querySelector('.ex').textContent=plain(c.backHtml||c.back)||'—';
      const tn=(TEMPLATES.find(t=>t.id===c.template)||TEMPLATES[0]).name;
      el.querySelector('.side').textContent=tn;
      el.onclick=()=>openCard(c.id);
    });
  }

  function fillSelects(){
    $('cardFont').innerHTML=FONTS.map(f=>`<option value="${f.id}">${f.label}</option>`).join('');
    $('cardTpl').innerHTML=TEMPLATES.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  }

  function renderTplGrid(active){
    const g=$('tplGrid');
    g.innerHTML=TEMPLATES.map(t=>`<button type="button" class="tpl-chip${t.id===active?' active':''}" data-tpl="${t.id}">${t.name}<small>${t.desc}</small></button>`).join('');
    g.querySelectorAll('.tpl-chip').forEach(btn=>{
      btn.onclick=()=>{
        $('cardTpl').value=btn.dataset.tpl;
        g.querySelectorAll('.tpl-chip').forEach(b=>b.classList.toggle('active',b.dataset.tpl===btn.dataset.tpl));
        updatePreview();
      };
    });
  }

  function openCard(id){
    cardId=id;face='front';
    const c=getCard();if(!c) return;
    fillSelects();
    $('cardFont').value=c.font||'noto-serif';
    $('cardTpl').value=c.template||'ruled';
    $('cardCode').value=c.code||'';
    $('btnFront').classList.add('active');$('btnBack').classList.remove('active');
    $('faceLabel').textContent='앞면';
    $('faceEditor').innerHTML=c.frontHtml||esc(c.front||'');
    renderTplGrid(c.template||'ruled');
    updatePreview();
    show('edit');
  }

  function currentFaceHtml(){return sanitize($('faceEditor').innerHTML)}
  function flushFace(){
    const c=getCard();if(!c) return;
    const html=currentFaceHtml();
    if(face==='front'){c.frontHtml=html;c.front=plain(html)}
    else{c.backHtml=html;c.back=plain(html)}
    c.font=$('cardFont').value;c.template=$('cardTpl').value;c.code=$('cardCode').value.trim();
    c.updatedAt=new Date().toISOString();
  }

  function renderCardHTML(c, which){
    const tpl=c.template||'ruled';
    const html=which==='back'?(c.backHtml||esc(c.back||'')):(c.frontHtml||esc(c.front||''));
    const ff='font-family:'+fontCss(c.font||'noto-serif')+';';
    const box=getBox();const d=getDrawer();
    const footL=esc((d&&d.name)||'')+(box?' · '+esc(box.name):'');
    const footR=esc(c.code||'');
    const side=which==='back'?'뒷면':'앞면';

    // 줄노트: html2canvas가 안정적으로 캡처하도록 실제 줄 요소 사용
    if(tpl==='ruled'){
      let lines='';
      for(let i=1;i<=14;i++){
        lines+=`<div class="ruled-line" style="top:${i*28}px"></div>`;
      }
      return `<div class="kcard tpl-ruled">
        <div class="face-tag">${side}</div>
        <div class="body" style="${ff}">
          <div class="ruled-lines">${lines}</div>
          <div class="body-content">${html||'&nbsp;'}</div>
        </div>
        <div class="foot"><span>${footL}</span><span>${footR}</span></div>
      </div>`;
    }

    if(tpl==='schule') return `<div class="kcard tpl-schule"><div class="ribbon">학교 · 카드</div><div class="face-tag">${side}</div><div class="body" style="${ff}">${html||'&nbsp;'}</div><div class="foot"><span>${footL}</span><span>${footR}</span></div></div>`;
    if(tpl==='bibliothek') return `<div class="kcard tpl-bibliothek"><div class="body" style="${ff}"><div class="catalog"><span>목록</span><span>${footR||'—'}</span></div>${html||'&nbsp;'}</div><div class="foot"><span>${footL}</span><span>${side}</span></div></div>`;
    if(tpl==='index') return `<div class="kcard tpl-index"><div class="stamp">Karte</div><div class="face-tag">${side}</div><div class="body" style="${ff}">${html||'&nbsp;'}</div><div class="foot"><span>${footL}</span><span>${footR}</span></div></div>`;
    if(tpl==='notiz') return `<div class="kcard tpl-notiz"><div class="pin"></div><div class="face-tag">${side}</div><div class="body" style="${ff}">${html||'&nbsp;'}</div><div class="foot"><span>${footL}</span><span>${footR}</span></div></div>`;
    return `<div class="kcard tpl-${tpl}"><div class="face-tag">${side}</div><div class="body" style="${ff}">${html||'&nbsp;'}</div><div class="foot"><span>${footL}</span><span>${footR}</span></div></div>`;
  }

  function updatePreview(){
    const c=getCard();if(!c) return;
    const tmp={...c};
    const html=currentFaceHtml();
    if(face==='front') tmp.frontHtml=html; else tmp.backHtml=html;
    tmp.font=$('cardFont').value;tmp.template=$('cardTpl').value;tmp.code=$('cardCode').value.trim();
    $('previewFrame').innerHTML=renderCardHTML(tmp, face);
    renderTplGrid(tmp.template);
  }

  function switchFace(next){
    flushFace();face=next;
    const c=getCard();if(!c) return;
    $('btnFront').classList.toggle('active',face==='front');
    $('btnBack').classList.toggle('active',face==='back');
    $('faceLabel').textContent=face==='front'?'앞면':'뒷면';
    $('faceEditor').innerHTML=face==='front'?(c.frontHtml||esc(c.front||'')):(c.backHtml||esc(c.back||''));
    updatePreview();
  }

  function highlight(){
    const el=$('faceEditor');
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount||sel.isCollapsed){toast('글자를 선택하세요');return}
    const range=sel.getRangeAt(0);
    if(!el.contains(range.commonAncestorContainer)){toast('입력란에서 선택하세요');return}
    try{const mark=document.createElement('mark');mark.style.background=hlColor;range.surroundContents(mark);sel.removeAllRanges()}
    catch(e){try{document.execCommand('hiliteColor',false,hlColor)}catch(e2){}}
    updatePreview();
  }
  function underline(){
    $('faceEditor').focus();
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed){toast('글자를 선택하세요');return}
    document.execCommand('underline',false,null);updatePreview();
  }
  function clearFmt(){
    $('faceEditor').focus();document.execCommand('removeFormat',false,null);
    $('faceEditor').querySelectorAll('mark').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m)});
    updatePreview();
  }

  function openNameModal(mode, preset){
    nameMode=mode;
    const titles={newDrawer:'새 서랍',editDrawer:'서랍 이름 변경',newBox:'새 박스',editBox:'박스 이름 변경'};
    $('nameTitle').textContent=titles[mode]||'Name';
    $('nameInput').value=preset||'';
    $('nameModal').classList.add('show');
    setTimeout(()=>$('nameInput').focus(),80);
  }

  function newCard(){
    const b=getBox();if(!b) return;
    if(!b.cards) b.cards=[];
    const c={id:uid('c'),front:'',back:'',frontHtml:'',backHtml:'',font:'noto-serif',template:'ruled',
      code:String(b.cards.length+1).padStart(2,'0'),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    b.cards.push(c);save();openCard(c.id);
  }

  async function exportPng(){
    flushFace();save();
    const c=getCard();if(!c) return;
    if(typeof html2canvas==='undefined'){toast('html2canvas 없음');return}
    toast('이미지 생성 중…');
    try{
      updatePreview();
      const target=$('previewFrame').firstElementChild;
      await document.fonts.ready;
      const canvas=await html2canvas(target,{backgroundColor:'#f4f1e6',scale:2,useCORS:true,logging:false,allowTaint:false,imageTimeout:0});
      const a=document.createElement('a');
      const side=face==='front'?'vorder':'rueck';
      a.download=((plain(c.frontHtml||c.front)||'karte')+'-'+side).replace(/[\\/:*?"<>|]/g,'_').slice(0,40)+'.png';
      a.href=canvas.toDataURL('image/png');
      document.body.appendChild(a);a.click();a.remove();toast('PNG 저장됨');
    }catch(e){toast('PNG 실패')}
  }

  $('btnNewDrawer').onclick=()=>openNameModal('newDrawer','');
  $('btnEditDrawer').onclick=()=>{const d=getDrawer();if(d) openNameModal('editDrawer',d.name)};
  $('btnNewBox').onclick=()=>openNameModal('newBox','');
  $('btnEditBox').onclick=()=>{const b=getBox();if(b) openNameModal('editBox',b.name)};
  $('nameCancel').onclick=()=>$('nameModal').classList.remove('show');
  $('nameModal').onclick=e=>{if(e.target===$('nameModal'))$('nameModal').classList.remove('show')};
  $('nameSave').onclick=()=>{
    const name=$('nameInput').value.trim()||'Unbenannt';
    if(nameMode==='newDrawer'){data.drawers.push({id:uid('d'),name,boxes:[],createdAt:new Date().toISOString()});save();renderDrawers()}
    else if(nameMode==='editDrawer'){const d=getDrawer();if(d){d.name=name;save();renderBoxes()}}
    else if(nameMode==='newBox'){const d=getDrawer();if(!d) return;if(!d.boxes)d.boxes=[];d.boxes.push({id:uid('b'),name,cards:[],createdAt:new Date().toISOString()});save();renderBoxes()}
    else if(nameMode==='editBox'){const b=getBox();if(b){b.name=name;save();renderCards()}}
    $('nameModal').classList.remove('show');toast('저장됨');
  };
  $('btnDelDrawer').onclick=()=>{if(!drawerId||!confirm('이 서랍과 안의 박스·카드를 모두 삭제할까요?'))return;data.drawers=data.drawers.filter(d=>d.id!==drawerId);drawerId=null;save();renderDrawers();show('drawers');toast('삭제됨')};
  $('btnDelBox').onclick=()=>{const d=getDrawer();if(!d||!boxId||!confirm('이 박스와 카드를 삭제할까요?'))return;d.boxes=(d.boxes||[]).filter(b=>b.id!==boxId);boxId=null;save();renderBoxes();show('boxes');toast('삭제됨')};
  $('btnDelCard').onclick=()=>{const b=getBox();if(!b||!cardId||!confirm('이 카드를 삭제할까요?'))return;b.cards=(b.cards||[]).filter(c=>c.id!==cardId);cardId=null;save();renderCards();show('cards');toast('삭제됨')};
  $('btnNewCard').onclick=newCard;
  $('btnSaveCard').onclick=()=>{flushFace();save();toast('저장됨');updatePreview()};
  $('btnPng').onclick=exportPng;
  $('btnFront').onclick=()=>switchFace('front');
  $('btnBack').onclick=()=>switchFace('back');
  $('fmtH').onclick=highlight;$('fmtU').onclick=underline;$('fmtC').onclick=clearFmt;
  $('faceEditor').addEventListener('input',updatePreview);
  $('cardFont').onchange=updatePreview;
  $('cardTpl').onchange=()=>{renderTplGrid($('cardTpl').value);updatePreview()};
  $('cardCode').oninput=updatePreview;
  document.querySelectorAll('.hl-swatch').forEach(s=>{s.onclick=()=>{hlColor=s.dataset.c;document.querySelectorAll('.hl-swatch').forEach(x=>x.classList.toggle('active',x===s))}});
  $('toDrawers').onclick=$('toDrawers2').onclick=()=>{renderDrawers();show('drawers')};
  $('toBoxes').onclick=()=>{renderBoxes();show('boxes')};
  $('btnBackCards').onclick=()=>{flushFace();save();renderCards();show('cards')};
  $('search').oninput=e=>{filter=e.target.value||'';renderDrawers()};
  $('btnBackup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='karteikasten-backup.json';document.body.appendChild(a);a.click();a.remove();toast('내보냄')};
  $('btnImport').onclick=()=>$('importFile').click();
  $('importFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.drawers))throw 0;if(data.drawers.length&&!confirm('모든 데이터를 바꿀까요?'))return;data=d;save();renderDrawers();show('drawers');toast('가져옴')}catch(err){toast('잘못된 JSON')}};r.readAsText(f);e.target.value=''};

  function seed(){
    if(data.drawers.length) return;
    data.drawers=[{
      id:uid('d'),name:'Deutsch',
      boxes:[{
        id:uid('b'),name:'Verben',
        cards:[{
          id:uid('c'),code:'01',font:'noto-serif',template:'schule',
          front:'gehen',frontHtml:'<b>gehen</b>',
          back:'to go · ging · gegangen',
          backHtml:'to go · <mark style="background:#e8c98a">ging</mark> · gegangen',
          createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
        }]
      }],
      createdAt:new Date().toISOString()
    }];
    save();
  }

  load();seed();fillSelects();renderDrawers();
})();
</script>
</body>
</html>
