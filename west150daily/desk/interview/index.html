<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1510">
<title>인터뷰</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="../libs/html2canvas.min.js"></script>
<style>
:root{
  --bg:#1a1510;--panel:#241e18;--ink:#f3efe6;--muted:#9a8f80;--line:#3d342c;
  --cream:#f4f1e6;--rule:#d5cfc0;--brown:#3d3428;--gold:#c4a574;
  --serif:"Noto Serif KR","Song Myung",Georgia,serif;
  --sans:"Pretendard","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Sans KR",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px max(36px,env(safe-area-inset-bottom))}
.view{display:none}.view.active{display:block}
.mast{
  background:linear-gradient(180deg,#2a221c,#1f1914);border:1px solid var(--line);
  border-radius:2px 10px 10px 2px;padding:22px 20px;margin-bottom:16px;
  box-shadow:6px 0 0 #120e0c,0 12px 32px rgba(0,0,0,.35);
}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:var(--serif);font-size:1.9rem;font-weight:700}
.sub{margin-top:8px;font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.search{flex:1;min-width:120px;background:#120e0c;border:1px solid var(--line);padding:10px 12px;border-radius:2px;font-size:13px}
.btn{padding:10px 14px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:2px;color:var(--ink);background:#120e0c}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1408}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:#e08b83;border-color:#5a302c;background:transparent}
.lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.field,select.field{width:100%;background:#120e0c;border:1px solid var(--line);padding:10px 12px;border-radius:2px;font-size:13px;color:var(--ink);color-scheme:dark}
textarea.field{min-height:72px;line-height:1.5;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.sec{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:8px 0 12px}
.sec b{color:var(--gold)}
.row{padding:14px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);cursor:pointer}
.row .who{font-family:var(--serif);font-weight:700;font-size:1.1rem;margin-bottom:4px}
.row .meta{font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .l,.bar .r{display:flex;gap:6px;flex-wrap:wrap}
.block{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:10px}
.block .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.block .num{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.block .ops button{padding:5px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted);margin-left:3px}
.ql{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:8px 0 4px}
.al{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#6a9fd4;margin:10px 0 4px}
.fmt{display:flex;gap:4px;margin-bottom:4px}
.fmt button{padding:5px 9px;border:1px solid var(--line);font-size:11px;background:#120e0c}
.cedit{min-height:48px;padding:10px;background:#120e0c;border:1px solid var(--line);border-radius:2px;line-height:1.55;outline:none;white-space:pre-wrap;word-break:keep-all}
.cedit.a{min-height:80px;color:#ddd6c8}
.cedit:empty:before{content:attr(data-ph);color:#5a5048}
.cedit mark{padding:0 .1em}
.fontbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.cap{display:flex;justify-content:center;padding:12px 0 24px}
.frame{width:100%;max-width:520px}
.sheet{background:var(--cream);color:#1a1510;border:1px solid var(--brown);border-radius:2px 8px 8px 2px;box-shadow:5px 0 0 #120e0c}
.sheet .inner{padding:26px 22px;min-height:320px;background-image:repeating-linear-gradient(to bottom,var(--cream) 0,var(--cream) 27px,var(--rule) 27px,var(--rule) 28px);background-size:100% 28px}
.sheet .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b5c45;margin-bottom:8px}
.sheet .who{font-family:var(--serif);font-weight:700;font-size:1.4rem;margin-bottom:6px}
.sheet .meta{font-size:12px;color:#6b5c45;margin-bottom:16px}
.sheet .iq{font-family:var(--serif);font-weight:700;font-size:1rem;line-height:28px;margin:12px 0 4px}
.sheet .ia{font-size:14px;line-height:28px;white-space:pre-wrap;word-break:keep-all}
.sheet mark{background:rgba(196,165,116,.5)}

/* ===== 인터뷰 템플릿 10종 ===== */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:10px 0 14px}
.tpl-chip{border:1px solid var(--line);padding:10px 6px;font-size:11px;text-align:center;cursor:pointer;background:#120e0c;border-radius:2px;color:var(--muted)}
.tpl-chip.active{border-color:var(--gold);color:var(--gold)}
.tpl-chip small{display:block;margin-top:3px;font-size:9px;opacity:.7}

.sheet.tpl-moleskine{background:var(--cream);color:#1a1510;border:1px solid var(--brown);border-radius:2px 8px 8px 2px;box-shadow:5px 0 0 #120e0c}
.sheet.tpl-moleskine .inner{background-color:var(--cream);background-image:linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);background-size:100% 28px;background-repeat:repeat-y}

.sheet.tpl-regal{background:#fffdf7;color:#1a1510;border:1px solid #c8c0ae;box-shadow:5px 0 0 #d7cfbe}
.sheet.tpl-regal .inner{padding-left:76px;background-color:#fffdf7;background-image:linear-gradient(to bottom,transparent 0,transparent 27px,#d9d4c9 27px,#d9d4c9 28px);background-size:100% 28px;background-repeat:repeat-y}
.sheet.tpl-regal:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;background:#d7a5a5}

.sheet.tpl-ruled{background:#faf9f3;color:#1a1510;border:1px solid #bdb7aa;box-shadow:4px 4px 0 #e2ddd0}
.sheet.tpl-ruled .inner{background-color:#faf9f3;background-image:linear-gradient(to bottom,transparent 0,transparent 27px,#cfd3d7 27px,#cfd3d7 28px);background-size:100% 28px;background-repeat:repeat-y}

.sheet.tpl-plain{background:#f3ead8;color:#1a1510;border:1px solid #c9b99d;box-shadow:4px 5px 0 #d8ccb7}
.sheet.tpl-plain .inner{background:#f3ead8}

.sheet.tpl-cornell{background:#fbfaf4;color:#1a1510;border:1px solid #aaa38f;box-shadow:4px 4px 0 #ddd7c8}
.sheet.tpl-cornell .inner{padding-left:92px;background-image:linear-gradient(to right,transparent 0,transparent 67px,#c7bfae 67px,#c7bfae 68px,transparent 68px,transparent calc(100% - 1px),#c7bfae calc(100% - 1px)),linear-gradient(to bottom,transparent 0,transparent 27px,#d7d3c8 27px,#d7d3c8 28px);background-size:100% 100%,100% 28px;background-repeat:no-repeat,repeat-y}

.sheet.tpl-grid{background:#f8f7f1;color:#1a1510;border:1px solid #bbb7ad;box-shadow:4px 4px 0 #dedbd2}
.sheet.tpl-grid .inner{background-color:#f8f7f1;background-image:linear-gradient(#d9d9d2 1px,transparent 1px),linear-gradient(90deg,#d9d9d2 1px,transparent 1px);background-size:20px 20px}

.sheet.tpl-vintage{background:#eadfc9;color:#1a1510;border:1px solid #a98e69;box-shadow:6px 6px 0 #d0bfa0}
.sheet.tpl-vintage .inner{background:#eadfc9;padding:30px 28px}
.sheet.tpl-vintage .tt,.sheet.tpl-vintage .who{font-family:"Song Myung",var(--serif)}

.sheet.tpl-library{background:#e9dfc6;color:#1a1510;border:1px solid #a08d67;box-shadow:4px 4px 0 #cfc09f}
.sheet.tpl-library .inner{background-image:linear-gradient(to bottom,transparent 0,transparent 39px,rgba(118,101,72,.24) 39px,rgba(118,101,72,.24) 40px);background-size:100% 40px;background-repeat:repeat-y}
.sheet.tpl-library .who{font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase}

.sheet.tpl-black{background:#171615;color:#f0eadc;border:1px solid #37332d;box-shadow:5px 5px 0 #090807}
.sheet.tpl-black .inner{background:#171615}
.sheet.tpl-black .k,.sheet.tpl-black .meta{color:#a99f8c}
.sheet.tpl-black .who,.sheet.tpl-black .iq{color:#f2ebdd}
.sheet.tpl-black .ia{color:#e5dece}
.sheet.tpl-black mark{background:rgba(228,190,92,.55);color:#fff}

.sheet.tpl-typewriter{background:#f4f0e5;color:#1a1510;border:1px solid #bdb7a9;box-shadow:4px 4px 0 #ddd8cb}
.sheet.tpl-typewriter .inner{background:#f4f0e5}
.sheet.tpl-typewriter .who,.sheet.tpl-typewriter .iq,.sheet.tpl-typewriter .ia{font-family:var(--mono)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--cream);color:#1a1510;font-size:12px;font-weight:700;padding:11px 16px;border-radius:999px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#241e18;border:1px solid var(--line);border-radius:8px 8px 0 0;padding:20px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:1.15rem;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <section id="view-home" class="view active">
    <div class="mast">
      <div class="kicker">Moleskine Interview</div>
      <h1>인터뷰</h1>
      <p class="sub">질문·답변 · 글꼴 · 강조 · PNG</p>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="검색…">
        <button type="button" class="btn" id="btnBackup">JSON 내보내기</button>
        <button type="button" class="btn" id="btnImport">가져오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button type="button" class="btn primary" id="btnNew">새 세션</button>
      </div>
    </div>
    <div class="sec"><span>보관함</span><b id="count">00</b></div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden>세션이 없습니다.</div>
  </section>

  <section id="view-desk" class="view">
    <div class="bar">
      <div class="l"><button type="button" class="btn ghost" id="btnHome">← 목록</button></div>
      <div class="r">
        <button type="button" class="btn" id="btnMeta">세션 정보</button>
        <button type="button" class="btn" id="btnCopy">복사</button>
        <button type="button" class="btn" id="btnTxt">TXT</button>
        <button type="button" class="btn" id="btnPng">PNG</button>
        <button type="button" class="btn danger" id="btnDel">삭제</button>
      </div>
    </div>
    <h2 id="deskTitle" style="font-family:var(--serif);font-size:1.4rem;margin-bottom:6px">—</h2>
    <div id="deskMeta" style="font-size:12px;color:var(--muted);margin-bottom:14px"></div>
    <div class="fontbar">
      <div><label class="lbl" style="margin-top:0">질문 글꼴</label><select class="field" id="fontQ"></select></div>
      <div><label class="lbl" style="margin-top:0">답변 글꼴</label><select class="field" id="fontA"></select></div>
    </div>
    <label class="lbl">템플릿</label>
    <div class="tpls" id="templateList"></div>
    <div id="blocks"></div>
    <div style="margin:12px 0 20px"><button type="button" class="btn primary" id="btnAdd">+ 질문·답변</button></div>
    <div class="sec"><span>미리보기</span><b id="previewTemplateName">몰스킨</b></div>
    <div class="cap"><div class="frame" id="preview"></div></div>
  </section>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>세션 정보</h3>
    <label class="lbl">대상</label>
    <input class="field" id="mWho" placeholder="이름">
    <label class="lbl">주제</label>
    <input class="field" id="mTopic" placeholder="주제">
    <div class="row2">
      <div><label class="lbl">날짜</label><input class="field" type="date" id="mDate"></div>
      <div><label class="lbl">장소</label><input class="field" id="mPlace" placeholder="선택"></div>
    </div>
    <label class="lbl">메모</label>
    <textarea class="field" id="mNotes" placeholder="세션 메모"></textarea>
    <div class="modal-actions">
      <button type="button" class="btn" id="mCancel">취소</button>
      <button type="button" class="btn primary" id="mSave">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const KEY='west150_interview_moleskine_v1';
  const FONTS=[
    {id:'noto-serif',label:'Noto Serif KR',css:'"Noto Serif KR",Georgia,serif'},
    {id:'song-myung',label:'Song Myung',css:'"Song Myung",serif'},
    {id:'pretendard',label:'Pretendard',css:'"Pretendard",sans-serif'},
    {id:'noto-sans',label:'Noto Sans KR',css:'"Noto Sans KR",sans-serif'},
    {id:'ibm-plex',label:'IBM Plex Sans KR',css:'"IBM Plex Sans KR",sans-serif'},
    {id:'nanum-myeongjo',label:'Nanum Myeongjo',css:'"Nanum Myeongjo",serif'},
  ];
  let sessions=[], currentId=null, filter='', hlColor='#e8c98a';
  const TEMPLATES=[
    {id:'moleskine',name:'몰스킨',desc:'클래식 노트'},
    {id:'regal',name:'리갈',desc:'세로 레드라인'},
    {id:'ruled',name:'줄노트',desc:'클래식 라인'},
    {id:'plain',name:'무지 크림',desc:'깨끗한 페이지'},
    {id:'cornell',name:'코넬',desc:'정리형 노트'},
    {id:'grid',name:'쿼드레인',desc:'격자 노트'},
    {id:'vintage',name:'빈티지',desc:'다이어리 스타일'},
    {id:'library',name:'라이브러리',desc:'도서관 카드'},
    {id:'black',name:'블랙 노트',desc:'다크 에디션'},
    {id:'typewriter',name:'타이프라이터',desc:'타이포 감성'}
  ];
  let selectedTemplate='moleskine';

  const $=id=>document.getElementById(id);
  function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function bid(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800)}
  function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('view-'+v).classList.add('active');window.scrollTo(0,0)}
  function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);sessions=Array.isArray(d.sessions)?d.sessions:[]}}catch(e){sessions=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({sessions,v:1}))}catch(e){toast('저장 공간 부족')}}
  function cur(){return sessions.find(s=>s.id===currentId)}
  function fontCss(id){const f=FONTS.find(x=>x.id===id);return f?f.css:FONTS[0].css}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function plain(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim()}
  function sanitize(html){
    const d=document.createElement('div');d.innerHTML=html||'';
    d.querySelectorAll('script,style,iframe').forEach(n=>n.remove());
    const allow=['mark','u','b','i','strong','em','br','div','p','span'];
    const walk=n=>{if(n.nodeType!==1)return;const t=n.tagName.toLowerCase();
      if(!allow.includes(t)){const p=n.parentNode;while(n.firstChild)p.insertBefore(n.firstChild,n);p.removeChild(n);return}
      [...n.attributes].forEach(a=>{if(a.name!=='style'&&a.name!=='class')n.removeAttribute(a.name)});
      if(t!=='mark'&&n.hasAttribute('style'))n.removeAttribute('style');
      [...n.children].forEach(walk)};
    [...d.children].forEach(walk);return d.innerHTML;
  }
  function fmtDate(iso){if(!iso)return '—';const p=iso.split('-');return p.length===3?p[0]+'.'+p[1]+'.'+p[2]:iso}
  function fillFonts(){
    const o=FONTS.map(f=>`<option value="${f.id}">${f.label}</option>`).join('');
    $('fontQ').innerHTML=o;$('fontA').innerHTML=o;
  }
  function fillTemplates(){
    const box=$('templateList');
    if(!box)return;
    box.innerHTML=TEMPLATES.map(t=>`<button type="button" class="tpl-chip${t.id===selectedTemplate?' active':''}" data-tpl="${t.id}">${t.name}<small>${t.desc}</small></button>`).join('');
    box.querySelectorAll('.tpl-chip').forEach(btn=>{
      btn.onclick=()=>{
        selectedTemplate=btn.dataset.tpl;
        box.querySelectorAll('.tpl-chip').forEach(b=>b.classList.toggle('active',b.dataset.tpl===selectedTemplate));
        const info=TEMPLATES.find(t=>t.id===selectedTemplate);
        $('previewTemplateName').textContent=info?info.name:'몰스킨';
        const s=cur();
        if(s){s.template=selectedTemplate;s.updatedAt=new Date().toISOString();save()}
        updatePreview();
      };
    });
  }
  function renderList(){
    const q=filter.trim().toLowerCase();
    let list=[...sessions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));
    if(q) list=list.filter(s=>[s.who,s.topic,s.place,s.notes].concat((s.blocks||[]).flatMap(b=>[plain(b.qHtml||b.q),plain(b.aHtml||b.a)])).join(' ').toLowerCase().includes(q));
    $('count').textContent=String(sessions.length).padStart(2,'0');
    const box=$('list');const empty=$('empty');
    if(!list.length){box.innerHTML='';empty.hidden=false;return}
    empty.hidden=true;
    box.innerHTML=list.map(s=>`<article class="row" data-id="${s.id}"><div class="who"></div><div class="meta"></div></article>`).join('');
    list.forEach((s,i)=>{
      const el=box.children[i];
      el.querySelector('.who').textContent=s.who||'제목 없는 세션';
      el.querySelector('.meta').textContent=[fmtDate(s.date),s.topic,(s.blocks||[]).length+'개 블록'].filter(Boolean).join(' · ');
      el.onclick=()=>openDesk(s.id);
    });
  }
  function openDesk(id){
    currentId=id;const s=cur();if(!s)return;
    fillFonts();
    selectedTemplate=s.template||'moleskine';
    $('fontQ').value=s.fontQ||'noto-serif';
    $('fontA').value=s.fontA||'pretendard';
    fillTemplates();
    renderDesk();show('desk');
  }
  function renderDesk(){
    const s=cur();if(!s)return;
    $('deskTitle').textContent=s.who||'제목 없는 세션';
    $('deskMeta').textContent=[fmtDate(s.date),s.topic,s.place,s.notes].filter(Boolean).join(' · ');
    const box=$('blocks');
    const blocks=s.blocks||[];
    if(!blocks.length){box.innerHTML='<div class="empty">질문·답변을 추가하세요.</div>'}
    else{
      box.innerHTML=blocks.map((b,i)=>`
        <div class="block" data-id="${b.id}">
          <div class="top">
            <span class="num">Q${String(i+1).padStart(2,'0')}</span>
            <div class="ops">
              <button type="button" data-act="up">↑</button>
              <button type="button" data-act="down">↓</button>
              <button type="button" data-act="del">✕</button>
            </div>
          </div>
          <div class="ql">질문</div>
          <div class="fmt">
            <button type="button" data-fmt="h" data-t="q">강조</button>
            <button type="button" data-fmt="u" data-t="q">밑줄</button>
            <button type="button" data-fmt="c" data-t="q">지우기</button>
          </div>
          <div class="cedit q" contenteditable="true" data-ph="질문…"></div>
          <div class="al">답변</div>
          <div class="fmt">
            <button type="button" data-fmt="h" data-t="a">강조</button>
            <button type="button" data-fmt="u" data-t="a">밑줄</button>
            <button type="button" data-fmt="c" data-t="a">지우기</button>
          </div>
          <div class="cedit a" contenteditable="true" data-ph="답변…"></div>
        </div>`).join('');
      blocks.forEach((b,i)=>{
        const el=box.children[i];
        const qEl=el.querySelector('.cedit.q');const aEl=el.querySelector('.cedit.a');
        qEl.innerHTML=b.qHtml||esc(b.q||'');aEl.innerHTML=b.aHtml||esc(b.a||'');
        const persist=()=>{
          b.qHtml=sanitize(qEl.innerHTML);b.aHtml=sanitize(aEl.innerHTML);
          b.q=plain(qEl.innerHTML);b.a=plain(aEl.innerHTML);
          s.updatedAt=new Date().toISOString();save();updatePreview();
        };
        qEl.addEventListener('input',persist);aEl.addEventListener('input',persist);
        el.querySelectorAll('[data-fmt]').forEach(btn=>{
          btn.onclick=ev=>{
            ev.preventDefault();
            const target=btn.dataset.t==='q'?qEl:aEl;
            if(btn.dataset.fmt==='h'){
              const sel=window.getSelection();
              if(!sel||!sel.rangeCount||sel.isCollapsed){toast('글자를 선택하세요');return}
              const range=sel.getRangeAt(0);
              if(!target.contains(range.commonAncestorContainer)){toast('해당 칸에서 선택하세요');return}
              try{const m=document.createElement('mark');m.style.background=hlColor;range.surroundContents(m);sel.removeAllRanges()}
              catch(e){try{document.execCommand('hiliteColor',false,hlColor)}catch(e2){}}
            }else if(btn.dataset.fmt==='u'){target.focus();document.execCommand('underline')}
            else{target.focus();document.execCommand('removeFormat');target.querySelectorAll('mark').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m)})}
            persist();
          };
        });
        el.querySelectorAll('.ops button').forEach(btn=>{
          btn.onclick=ev=>{
            ev.stopPropagation();
            blocks.forEach((bb,ii)=>{
              const ee=box.children[ii];
              bb.qHtml=sanitize(ee.querySelector('.cedit.q').innerHTML);
              bb.aHtml=sanitize(ee.querySelector('.cedit.a').innerHTML);
              bb.q=plain(bb.qHtml);bb.a=plain(bb.aHtml);
            });
            const act=btn.dataset.act;const idx=s.blocks.findIndex(x=>x.id===b.id);
            if(act==='del'){if(!confirm('이 블록을 삭제할까요?'))return;s.blocks.splice(idx,1)}
            else if(act==='up'&&idx>0){[s.blocks[idx-1],s.blocks[idx]]=[s.blocks[idx],s.blocks[idx-1]]}
            else if(act==='down'&&idx<s.blocks.length-1){[s.blocks[idx+1],s.blocks[idx]]=[s.blocks[idx],s.blocks[idx+1]]}
            s.updatedAt=new Date().toISOString();save();renderDesk();
          };
        });
      });
    }
    updatePreview();
  }
  function renderSheet(s){
    const qf='font-family:'+fontCss(s.fontQ||'noto-serif');
    const af='font-family:'+fontCss(s.fontA||'pretendard');
    const items=(s.blocks||[]).map((b,i)=>`<div class="iq" style="${qf}">Q${String(i+1).padStart(2,'0')} · ${b.qHtml||esc(b.q||'')}</div><div class="ia" style="${af}">${b.aHtml||esc(b.a||'')}</div>`).join('');
    const tpl=s.template||'moleskine';
    return `<div class="sheet tpl-${tpl}"><div class="inner">
      <div class="k">인터뷰</div>
      <div class="who" style="${qf}">${esc(s.who||'제목 없음')}</div>
      <div class="meta">${esc([fmtDate(s.date),s.topic,s.place].filter(Boolean).join(' · '))}</div>
      ${items}
    </div></div>`;
  }
  function updatePreview(){const s=cur();if(s)$('preview').innerHTML=renderSheet(s)}
  function newSession(){
    const s={id:uid(),who:'',topic:'',date:today(),place:'',notes:'',fontQ:'noto-serif',fontA:'pretendard',
      blocks:[{id:bid(),q:'',a:'',qHtml:'',aHtml:''}],template:'moleskine',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    sessions.unshift(s);save();currentId=s.id;openMeta(true);renderDesk();show('desk');
  }
  function openMeta(isNew){
    const s=cur();if(!s)return;
    $('mWho').value=s.who||'';$('mTopic').value=s.topic||'';
    $('mDate').value=s.date||today();$('mPlace').value=s.place||'';$('mNotes').value=s.notes||'';
    $('modal').classList.add('on');if(isNew)setTimeout(()=>$('mWho').focus(),80);
  }
  function buildText(s){
    const lines=['인터뷰',(s.who||'제목 없음')+(s.topic?' — '+s.topic:''),[s.date,s.place].filter(Boolean).join(' · ')];
    if(s.notes)lines.push(s.notes);lines.push('');
    (s.blocks||[]).forEach((b,i)=>{lines.push('Q'+String(i+1).padStart(2,'0'));lines.push(plain(b.qHtml||b.q)||'(질문 없음)');lines.push('');lines.push('A');lines.push(plain(b.aHtml||b.a)||'(답변 없음)');lines.push('','---','')});
    return lines.join('\n');
  }
  async function exportPng(){
    const s=cur();if(!s)return;
    if(typeof html2canvas==='undefined'){toast('html2canvas 없음');return}
    toast('이미지 생성 중…');
    try{
      const target=$('preview').firstElementChild;if(!target){toast('미리보기가 없습니다');return}
      await document.fonts.ready;
      const canvas=await html2canvas(target,{backgroundColor:'#f4f1e6',scale:2,useCORS:true,logging:false,allowTaint:false,imageTimeout:0});
      const a=document.createElement('a');
      a.download=((s.who||'interview')+'-'+(s.date||'')).replace(/[\\/:*?"<>|]/g,'_').slice(0,50)+'.png';
      a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();toast('PNG 저장됨');
    }catch(e){toast('PNG 실패')}
  }
  function seed(){
    if(sessions.length)return;
    sessions.push({id:uid(),who:'샘플',topic:'기록',date:today(),place:'',notes:'',fontQ:'noto-serif',fontA:'pretendard',
      blocks:[{id:bid(),q:'시작할까요?',a:'네, 천천히 하죠.',qHtml:'시작할까요?',aHtml:'네, <mark style="background:#e8c98a">천천히</mark> 하죠.'}],template:'moleskine',
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    save();
  }
  $('btnNew').onclick=newSession;
  $('btnHome').onclick=()=>{renderList();show('home')};
  $('btnMeta').onclick=()=>openMeta(false);
  $('mCancel').onclick=()=>$('modal').classList.remove('on');
  $('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};
  $('mSave').onclick=()=>{const s=cur();if(!s)return;s.who=$('mWho').value.trim();s.topic=$('mTopic').value.trim();s.date=$('mDate').value||today();s.place=$('mPlace').value.trim();s.notes=$('mNotes').value.trim();s.updatedAt=new Date().toISOString();save();$('modal').classList.remove('on');renderDesk();toast('저장됨')};
  $('btnAdd').onclick=()=>{const s=cur();if(!s)return;s.blocks.push({id:bid(),q:'',a:'',qHtml:'',aHtml:''});s.updatedAt=new Date().toISOString();save();renderDesk()};
  $('btnDel').onclick=()=>{if(!currentId||!confirm('이 세션을 삭제할까요?'))return;sessions=sessions.filter(s=>s.id!==currentId);currentId=null;save();renderList();show('home');toast('삭제됨')};
  $('btnCopy').onclick=async()=>{const s=cur();if(!s)return;const t=buildText(s);try{await navigator.clipboard.writeText(t);toast('복사됨')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사됨')}};
  $('btnTxt').onclick=()=>{const s=cur();if(!s)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildText(s)],{type:'text/plain;charset=utf-8'}));a.download=((s.who||'interview')+'.txt').replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove();toast('TXT 저장됨')};
  $('btnPng').onclick=exportPng;
  $('fontQ').onchange=()=>{const s=cur();if(!s)return;s.fontQ=$('fontQ').value;s.updatedAt=new Date().toISOString();save();updatePreview()};
  $('fontA').onchange=()=>{const s=cur();if(!s)return;s.fontA=$('fontA').value;s.updatedAt=new Date().toISOString();save();updatePreview()};
  $('search').oninput=e=>{filter=e.target.value||'';renderList()};
  $('btnBackup').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({sessions},null,2)],{type:'application/json'}));a.download='interviews-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('내보냄')};
  $('btnImport').onclick=()=>$('importFile').click();
  $('importFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const list=Array.isArray(d.sessions)?d.sessions:(Array.isArray(d)?d:null);if(!list)throw 0;if(sessions.length&&!confirm('모든 세션을 바꿀까요?'))return;sessions=list;save();renderList();show('home');toast('가져옴 '+sessions.length)}catch(err){toast('잘못된 JSON')}};r.readAsText(f);e.target.value=''};
  load();seed();fillTemplates();renderList();
})();
</script>
</body>
