<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>스레드 & 인스타 카드뉴스 스튜디오 (NewsCard Studio) — Offline</title>
<meta name="description" content="아이폰 사파리 모바일 웹에 완벽 최적화된 스레드/인스타그램 전용 10종 외신 스타일 카드뉴스 제작 웹 앱 (오프라인 단일 HTML)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f2f2f7" />

/* Local fonts — Pretendard + RIDIBatang (offline) */
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('fonts/Pretendard-Regular.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url('fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;font-display:swap;src:url('fonts/Pretendard-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('fonts/Pretendard-Bold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:800;font-display:swap;src:url('fonts/Pretendard-ExtraBold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:900;font-display:swap;src:url('fonts/Pretendard-Black.woff2') format('woff2')}
@font-face{font-family:'RIDIBatang';font-weight:400;font-display:swap;src:url('fonts/RIDIBatang.woff') format('woff')}
@font-face{font-family:'RIDIBatang';font-weight:500;font-display:swap;src:url('fonts/RIDIBatang.woff') format('woff')}
@font-face{font-family:'RIDIBatang';font-weight:700;font-display:swap;src:url('fonts/RIDIBatang.woff') format('woff')}

.font-pretendard, .font-spoqa {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif !important;
}
.font-ridi, .font-myeongjo {
  font-family: 'RIDIBatang', "Apple Myungjo", "Nanum Myeongjo", "Noto Serif KR", Georgia, serif !important;
}
.font-cinzel {
  font-family: 'RIDIBatang', "Times New Roman", "Noto Serif KR", Georgia, serif !important;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.font-montserrat {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  font-weight: 700;
}
body, .font-pretendard {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
