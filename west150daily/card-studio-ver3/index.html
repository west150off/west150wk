// ==== src/utils/autoLayout.js ====

function calculateAutoLayout(slide, aspectRatio = '4:5', config) {
    const isAutoEnabled = config?.enabled ?? slide.autoLayout?.enabled ?? true;
    const mode = config?.mode ?? slide.autoLayout?.mode ?? 'smart';
    // 1. Calculate Content Volume Metrics
    const titleText = slide.title || '';
    const titleChars = titleText.length;
    const titleLines = (titleText.match(/\n/g) || []).length + 1;
    const subtitleChars = (slide.subtitle || '').length;
    const bodyChars = (slide.bodyText || '').length;
    const bullets = slide.bulletPoints || [];
    const bulletCount = bullets.length;
    const bulletsChars = bullets.reduce((sum, b) => sum + b.length, 0);
    const highlightChars = slide.showHighlightBox ? ((slide.highlightBoxText || '').length + (slide.highlightBoxLabel || '').length) : 0;
    // Template specific chars
    const statChars = (slide.statValue || '').length + (slide.statLabel || '').length + (slide.statComparison || '').length;
    const quoteChars = (slide.quoteSpeaker || '').length + (slide.quoteSpeakerRole || '').length;
    const factCheckChars = (slide.factCheckClaim || '').length + (slide.factCheckVerdict || '').length + ((slide.factCheckEvidence || []).join('').length);
    const versusChars = (slide.versusLeftContent || '').length + (slide.versusRightContent || '').length;
    // Image / Fact Check additions
    const hasImage = Boolean(slide.featuredImageUrl);
    const imageChars = hasImage ? 60 : 0;
    const fcBadgeChars = slide.factCheckVerification?.enabled ? 30 : 0;
    const srcChars = slide.sourceCitation?.enabled ? 30 : 0;
    const totalChars = titleChars +
        subtitleChars +
        bodyChars +
        bulletsChars +
        highlightChars +
        statChars +
        quoteChars +
        factCheckChars +
        versusChars +
        imageChars +
        fcBadgeChars +
        srcChars;
    // Aspect ratio height weight (9:16 has ~40% more vertical space than 1:1)
    let verticalBudgetMultiplier = 1.0; // for 4:5
    if (aspectRatio === '9:16')
        verticalBudgetMultiplier = 1.4;
    if (aspectRatio === '1:1')
        verticalBudgetMultiplier = 0.8;
    if (aspectRatio === '16:9')
        verticalBudgetMultiplier = 0.72;
    // Effective visual load score
    const structuralItemCount = (titleLines > 1 ? titleLines * 24 : titleChars * 0.7) +
        (subtitleChars > 0 ? 25 + subtitleChars * 0.4 : 0) +
        (bulletCount * 30 + bulletsChars * 0.5) +
        (highlightChars > 0 ? 45 + highlightChars * 0.4 : 0) +
        (hasImage ? 60 : 0) +
        (slide.type === 'stat' ? 80 : 0) +
        (slide.type === 'quote' ? 60 : 0) +
        (slide.type === 'factcheck' ? 70 : 0) +
        (slide.type === 'versus' ? 80 : 0) +
        (bodyChars * 0.4);
    const visualLoad = structuralItemCount / verticalBudgetMultiplier;
    // Determine Density Tier
    let density = 'balanced';
    if (mode === 'spacious') {
        density = 'spacious';
    }
    else if (mode === 'compact') {
        density = 'compact';
    }
    else if (mode === 'custom') {
        density = 'balanced';
    }
    else {
        // Smart Auto Calculation
        if (visualLoad < 95) {
            density = 'spacious';
        }
        else if (visualLoad < 185) {
            density = 'balanced';
        }
        else if (visualLoad < 275) {
            density = 'compact';
        }
        else {
            density = 'ultra-dense';
        }
    }
    // Calculate Fit Score (100% is mathematically ideal balance)
    let fitScore = 100;
    if (visualLoad > 320) {
        fitScore = Math.max(70, Math.round(100 - (visualLoad - 320) * 0.25));
    }
    else if (visualLoad < 60 && aspectRatio !== '16:9') {
        fitScore = 95;
    }
    let fitStatus = '최적 균형';
    if (density === 'spacious')
        fitStatus = '여유로운 여백 (Spacious)';
    if (density === 'balanced')
        fitStatus = '표준 균형 (Balanced)';
    if (density === 'compact')
        fitStatus = '밀도 압축 (Compact)';
    if (density === 'ultra-dense')
        fitStatus = '고밀도 정렬 (Ultra-Dense)';
    // Calculate dynamic typography and spacing classes
    let titleClass = 'text-xl sm:text-2xl md:text-3xl font-bold leading-snug tracking-tight';
    let subtitleClass = 'text-xs sm:text-sm font-medium opacity-80 leading-relaxed';
    let bodyClass = 'text-xs sm:text-sm opacity-80 leading-relaxed';
    let bulletClass = 'text-xs sm:text-sm md:text-[15px] leading-relaxed';
    let bulletGapClass = 'space-y-2 sm:space-y-2.5';
    let containerGapClass = 'space-y-3.5 sm:space-y-4';
    let cardPaddingClass = 'p-6 sm:p-8 md:p-10';
    let headerMarginClass = 'mb-3 sm:mb-4 pb-2.5 sm:pb-3';
    let footerPaddingClass = 'pt-2.5 sm:pt-3.5';
    let highlightBoxPaddingClass = 'p-3.5 sm:p-4';
    let highlightBoxTextClass = 'text-xs sm:text-sm';
    let statValueClass = 'text-4xl sm:text-5xl md:text-6xl font-black tracking-tight';
    let quoteTextClass = 'text-lg sm:text-xl md:text-2xl font-bold leading-relaxed';
    let versusContentClass = 'text-[11px] sm:text-xs leading-relaxed';
    // Apply Density Configurations
    if (density === 'spacious') {
        if (slide.type === 'cover') {
            titleClass = 'text-2xl sm:text-3xl md:text-[38px] font-black leading-[1.12] tracking-tight uppercase';
            subtitleClass = 'text-sm sm:text-base md:text-lg font-serif italic opacity-85 leading-relaxed max-w-xl';
            bodyClass = 'text-sm opacity-80 leading-relaxed pt-2 border-l-2 pl-3.5';
        }
        else {
            titleClass = 'text-xl sm:text-2xl md:text-3xl font-extrabold leading-[1.20] tracking-tight';
            subtitleClass = 'text-sm font-serif italic opacity-85 leading-relaxed';
            bodyClass = 'text-sm opacity-85 leading-relaxed';
            bulletClass = 'text-sm leading-relaxed';
            bulletGapClass = 'space-y-2.5 sm:space-y-3 my-2.5';
            containerGapClass = 'space-y-4 sm:space-y-5';
            cardPaddingClass = aspectRatio === '9:16' ? 'p-7 sm:p-9' : 'p-6 sm:p-8';
            highlightBoxPaddingClass = 'p-4';
            highlightBoxTextClass = 'text-xs sm:text-sm';
            statValueClass = 'text-4xl sm:text-5xl md:text-6xl font-black tracking-tight';
            quoteTextClass = 'text-lg sm:text-xl md:text-2xl font-bold leading-relaxed';
            versusContentClass = 'text-xs leading-relaxed';
        }
    }
    else if (density === 'balanced') {
        if (slide.type === 'cover') {
            titleClass = 'text-xl sm:text-2xl md:text-3xl font-black leading-[1.15] tracking-tight uppercase';
            subtitleClass = 'text-xs sm:text-sm font-serif italic opacity-85 leading-relaxed max-w-lg';
            bodyClass = 'text-xs sm:text-sm opacity-80 leading-relaxed pt-2 border-l-2 pl-3';
        }
        else {
            titleClass = 'text-lg sm:text-xl md:text-2xl font-bold leading-snug tracking-tight';
            subtitleClass = 'text-xs sm:text-sm font-medium opacity-80 leading-relaxed';
            bodyClass = 'text-xs sm:text-sm opacity-80 leading-relaxed';
            bulletClass = 'text-xs sm:text-sm leading-relaxed';
            bulletGapClass = 'space-y-2 my-2';
            containerGapClass = 'space-y-3 sm:space-y-3.5';
            cardPaddingClass = 'p-5 sm:p-7';
            highlightBoxPaddingClass = 'p-3 sm:p-3.5';
            highlightBoxTextClass = 'text-xs';
            statValueClass = 'text-3xl sm:text-4xl md:text-5xl font-black tracking-tight';
            quoteTextClass = 'text-base sm:text-lg font-bold leading-relaxed';
            versusContentClass = 'text-[11px] sm:text-xs leading-relaxed';
        }
    }
    else if (density === 'compact') {
        if (slide.type === 'cover') {
            titleClass = 'text-lg sm:text-xl md:text-2xl font-extrabold leading-[1.18] tracking-tight uppercase';
            subtitleClass = 'text-xs opacity-80 leading-snug max-w-md';
            bodyClass = 'text-xs opacity-75 leading-normal pt-1.5 border-l-2 pl-2.5';
        }
        else {
            titleClass = 'text-base sm:text-lg md:text-xl font-bold leading-snug tracking-tight';
            subtitleClass = 'text-[11px] sm:text-xs font-medium opacity-75 leading-normal';
            bodyClass = 'text-[11px] sm:text-xs opacity-80 leading-normal';
            bulletClass = 'text-[11px] sm:text-xs leading-snug';
            bulletGapClass = 'space-y-1.5 my-1.5';
            containerGapClass = 'space-y-2.5';
            cardPaddingClass = 'p-4 sm:p-5';
            headerMarginClass = 'mb-2 pb-2';
            footerPaddingClass = 'pt-2';
            highlightBoxPaddingClass = 'p-2.5 sm:p-3';
            highlightBoxTextClass = 'text-[11px]';
            statValueClass = 'text-2xl sm:text-3xl font-black tracking-tight';
            quoteTextClass = 'text-sm sm:text-base font-bold leading-normal';
            versusContentClass = 'text-[10px] sm:text-[11px] leading-snug';
        }
    }
    else if (density === 'ultra-dense') {
        titleClass = 'text-sm sm:text-base font-bold leading-tight tracking-tight';
        subtitleClass = 'text-[10px] opacity-75 leading-tight';
        bodyClass = 'text-[10px] opacity-80 leading-tight';
        bulletClass = 'text-[10px] leading-tight';
        bulletGapClass = 'space-y-1 my-1';
        containerGapClass = 'space-y-2';
        cardPaddingClass = 'p-3.5 sm:p-4';
        headerMarginClass = 'mb-1.5 pb-1.5';
        footerPaddingClass = 'pt-1.5';
        highlightBoxPaddingClass = 'p-2';
        highlightBoxTextClass = 'text-[10px]';
        statValueClass = 'text-xl sm:text-2xl font-black tracking-tight';
        quoteTextClass = 'text-xs sm:text-sm font-bold leading-tight';
        versusContentClass = 'text-[9px] leading-tight';
    }
    if (!isAutoEnabled) {
        return {
            density: 'balanced',
            totalChars,
            fitScore: 100,
            fitStatus: '기본 여백',
            cardPaddingClass: 'p-6 sm:p-8',
            containerGapClass: 'space-y-3.5 sm:space-y-4',
            headerMarginClass: 'mb-3 sm:mb-4 pb-2.5 sm:pb-3',
            footerPaddingClass: 'pt-2.5 sm:pt-3',
            titleClass: 'text-lg sm:text-xl md:text-2xl font-bold leading-snug tracking-tight',
            subtitleClass: 'text-xs sm:text-sm font-medium opacity-80 leading-relaxed font-serif italic',
            bodyClass: 'text-xs sm:text-sm opacity-80 leading-relaxed',
            bulletClass: 'text-xs sm:text-sm leading-relaxed',
            bulletGapClass: 'space-y-2 my-2',
            highlightBoxPaddingClass: 'p-3 sm:p-4',
            highlightBoxTextClass: 'text-xs sm:text-sm',
            statValueClass: 'text-3xl sm:text-4xl md:text-5xl font-black tracking-tight',
            quoteTextClass: 'text-base sm:text-lg font-bold leading-relaxed',
            versusContentClass: 'text-[11px] sm:text-xs leading-relaxed',
        };
    }
    return {
        density,
        totalChars,
        fitScore,
        fitStatus,
        cardPaddingClass,
        containerGapClass,
        headerMarginClass,
        footerPaddingClass,
        titleClass,
        subtitleClass,
        bodyClass,
        bulletClass,
        bulletGapClass,
        highlightBoxPaddingClass,
        highlightBoxTextClass,
        statValueClass,
        quoteTextClass,
        versusContentClass,
    };
}

// ==== src/utils/fontScale.js ====
// Per-slide manual font size scaling (title / subtitle / body).
// Tailwind's text-* utility classes already provide a responsive size for the
// current density tier; here we read the largest size token in that class
// string as the "base" px value and scale it by the user's chosen percentage.
// The resulting fontSize is applied as an inline style, which only overrides
// the font-size declaration (weight/leading/tracking/opacity classes remain).
const TW_FONT_SIZE_PX = {
    'xs': 12, 'sm': 14, 'base': 16, 'lg': 18, 'xl': 20,
    '2xl': 24, '3xl': 30, '4xl': 36, '5xl': 48, '6xl': 60,
};
function extractBaseFontSizePx(classString) {
    if (!classString)
        return 16;
    let maxPx = 0;
    classString.split(/\s+/).forEach((token) => {
        const m = token.match(/^(?:sm:|md:|lg:)?text-(\[[^\]]+\]|[a-z0-9]+)$/);
        if (!m)
            return;
        let key = m[1];
        if (key.startsWith('[') && key.endsWith(']')) {
            key = key.slice(1, -1);
        }
        let px;
        if (key.endsWith('px'))
            px = parseFloat(key);
        else if (TW_FONT_SIZE_PX[key] !== undefined)
            px = TW_FONT_SIZE_PX[key];
        if (px && px > maxPx)
            maxPx = px;
    });
    return maxPx || 16;
}
const DEFAULT_FONT_SCALE = { title: 100, subtitle: 100, body: 100 };
function getFontScaleStyle(classString, scalePercent) {
    if (!scalePercent || scalePercent === 100)
        return undefined;
    const basePx = extractBaseFontSizePx(classString);
    return { fontSize: `${Math.round(basePx * (scalePercent / 100) * 10) / 10}px` };
}

// ==== src/utils/canvasExporter.js ====

// Fast safety timeout helper
function withTimeout(promise, ms = 2000, fallbackValue) {
    let timer;
    const timeoutPromise = new Promise((resolve) => {
        timer = setTimeout(() => resolve(fallbackValue), ms);
    });
    return Promise.race([
        promise.then((res) => {
            clearTimeout(timer);
            return res;
        }),
        timeoutPromise,
    ]);
}
/**
 * Waits until every <img> inside the element has actually finished loading
 * (and decoded) before we let a capture library measure/paint the element.
 * This is the #1 cause of "photo area collapses and the text below jumps up"
 * exports: the capture fires while an image's natural size is still 0x0,
 * so the layout used for the screenshot doesn't match the on-screen preview.
 */
function waitForImagesToLoad(element, timeoutMs = 4000) {
    if (!element)
        return Promise.resolve();
    const imgs = Array.from(element.querySelectorAll('img'));
    if (imgs.length === 0)
        return Promise.resolve();
    const perImage = imgs.map((img) => {
        if (img.complete && img.naturalWidth > 0) {
            // Still run decode() when available so the browser has fully
            // decoded pixel data, not just fetched bytes.
            return (img.decode ? img.decode().catch(() => {}) : Promise.resolve());
        }
        return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener('load', done, { once: true });
            img.addEventListener('error', done, { once: true });
        }).then(() => (img.decode ? img.decode().catch(() => {}) : undefined));
    });
    return withTimeout(Promise.all(perImage), timeoutMs, null);
}
/**
 * Ultra-fast high-reliability PNG blob exporter:
 * 0. Waits for all images to finish loading/decoding so captured layout
 *    matches the live preview exactly.
 * 1. Tries html-to-image with fontEmbedCSS: '' (prevents font freeze completely)
 * 2. Rapid html2canvas fallback with fast render settings
 * 3. Never hangs or stalls the UI
 */
async function exportSlideToPngBlob(element, scale = 2) {
    if (!element)
        return null;
    // 0. Make sure images are fully loaded/decoded first, and lock the
    // element's rendered pixel size explicitly so aspect-ratio based
    // sizing (Tailwind's aspect-[4/5] etc.) can't be re-measured
    // differently by the capture library than what's on screen.
    await waitForImagesToLoad(element);
    const rect = element.getBoundingClientRect();
    const explicitWidth = Math.round(rect.width);
    const explicitHeight = Math.round(rect.height);
    // 1. Try html-to-image without font embedding overhead (Takes < 100ms)
    try {
        const htmlToImagePromise = toBlob(element, {
            quality: 0.98,
            pixelRatio: scale,
            width: explicitWidth,
            height: explicitHeight,
            cacheBust: false,
            skipAutoScale: false,
            fontEmbedCSS: '', // CRITICAL: disables blocking network font scanning
            filter: (node) => {
                if (node instanceof HTMLElement && node.classList.contains('no-export')) {
                    return false;
                }
                return true;
            },
        });
        const blob = await withTimeout(htmlToImagePromise, 3000, null);
        if (blob && blob.size > 200) {
            return blob;
        }
    }
    catch (err) {
        console.warn('html-to-image fast export failed, trying html2canvas fallback:', err);
    }
    // 2. High-speed html2canvas fallback
    try {
        const html2canvasPromise = (async () => {
            const canvas = await html2canvas(element, {
                scale: scale,
                width: explicitWidth,
                height: explicitHeight,
                windowWidth: explicitWidth,
                windowHeight: explicitHeight,
                useCORS: true,
                allowTaint: true,
                backgroundColor: null,
                logging: false,
                imageTimeout: 4000,
                ignoreElements: (node) => {
                    return node.classList?.contains('no-export');
                },
            });
            return new Promise((resolve) => {
                canvas.toBlob((b) => resolve(b), 'image/png', 0.98);
            });
        })();
        const canvasBlob = await withTimeout(html2canvasPromise, 4000, null);
        if (canvasBlob && canvasBlob.size > 200) {
            return canvasBlob;
        }
    }
    catch (err) {
        console.error('html2canvas export fallback failed:', err);
    }
    // 3. Last-resort direct toPng fallback
    try {
        const dataUrl = await withTimeout(toPng(element, { quality: 0.95, pixelRatio: 1, width: explicitWidth, height: explicitHeight, fontEmbedCSS: '' }), 2000, null);
        if (dataUrl) {
            const res = await fetch(dataUrl);
            return await res.blob();
        }
    }
    catch (e) {
        console.error('All PNG export methods failed:', e);
    }
    return null;
}
async function downloadSlideAsPng(element, filename = 'card-slide.png', scale = 2) {
    try {
        const blob = await exportSlideToPngBlob(element, scale);
        if (!blob) {
            throw new Error('이미지 렌더링에 실패했습니다. 다시 시도해주세요.');
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        setTimeout(() => {
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }, 400);
        return true;
    }
    catch (err) {
        console.error('Error downloading PNG:', err);
        return false;
    }
}
async function copySlideToClipboard(element, scale = 2) {
    try {
        const blob = await exportSlideToPngBlob(element, scale);
        if (!blob)
            return false;
        if (!navigator.clipboard || !window.ClipboardItem) {
            throw new Error('클립보드 복사를 지원하지 않는 브라우저 환경입니다.');
        }
        const item = new ClipboardItem({ 'image/png': blob });
        await navigator.clipboard.write([item]);
        return true;
    }
    catch (err) {
        console.error('Failed to copy to clipboard:', err);
        return false;
    }
}
function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }, 400);
}

                \${renderInlineHtml(slide.highlightBoxText, accent)}

      } else if (slide.type === 'quote') {
