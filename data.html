<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WEST150 DATA STUDIO — WORKING FINAL FIXED</title>
<style>
:root{--bg:#090b0c;--panel:#101315;--line:#2b3033;--muted:#949a9c;--text:#f0eee8;--accent:#c9362c;--paper:#f1ede4;--ink:#171816}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-rows:60px 1fr}
.top{display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0e10}
.brand{font-weight:900;font-size:20px;white-space:nowrap}.brand span{font-size:11px;font-weight:600;letter-spacing:.15em;color:#b8b8b1;margin-left:8px}
.tabs{display:flex;height:100%;gap:18px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#909597;font-size:10px;letter-spacing:.08em}.tabs button.active{color:#fff;border-color:var(--accent)}
.actions{margin-left:auto;display:flex;gap:7px}.actions button,.smallbtn{border:1px solid #343a3d;background:#14181a;color:#e8e7e2;border-radius:6px;padding:9px 11px;font-size:10px}.primary{border-color:var(--accent)!important}
.workspace{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;min-height:0}
.sidebar{padding:16px;border-right:1px solid var(--line);background:#0d1012;overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}
.labelTitle{font-size:10px;font-weight:900;letter-spacing:.13em;margin:5px 4px 13px}
.templates{display:grid;gap:7px}.template{display:grid;grid-template-columns:88px 1fr;gap:9px;padding:5px;background:#111518;border:1px solid transparent;border-radius:7px;color:#ddd;text-align:left}.template.active{border-color:#d6d4cd}.template:hover{background:#151a1d}
.thumb{height:58px;border:1px solid #343a3d;background:#191e20;position:relative;overflow:hidden}.thumb b{position:absolute;left:7px;bottom:6px;font-size:15px}.thumb span{position:absolute;left:7px;top:7px;font-size:7px;color:#aaa}.tname{display:flex;flex-direction:column;justify-content:center}.tname b{font-size:10px}.tname small{font-size:8px;color:#8c9294;margin-top:5px}
.center{padding:20px;min-width:0;overflow:auto;background:#090c0e}.stage{width:min(100%,820px);margin:auto}.card{width:100%;aspect-ratio:4/5;background:var(--paper);color:var(--ink);padding:5.2%;box-shadow:0 25px 80px #0008;overflow:hidden;display:flex;flex-direction:column;gap:14px;position:relative}.card.dark{background:#181b1b;color:#f1eee6}
.cardHeader{display:flex;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:.11em}.kicker{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.15em}.headline{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;letter-spacing:-.055em;font-size:clamp(35px,6vw,74px);line-height:.93;overflow-wrap:anywhere}.dek{font-size:13px;line-height:1.5;color:#696b67;max-width:76%}.dark .dek{color:#bbb9b1}.metric{font-family:Georgia,serif;font-size:clamp(70px,14vw,150px);line-height:.82;letter-spacing:-.08em}.metricLabel{font-size:10px;letter-spacing:.1em;color:#777}
.chart{flex:1;min-height:100px;display:grid;align-items:end;gap:8px}.bar{height:var(--h);background:var(--accent);border-radius:2px 2px 0 0}.chart.bars{grid-template-columns:repeat(6,1fr)}.lineChart{height:100%;min-height:150px;border-bottom:1px solid #bbb;position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 24%,#d7d2c8 25%)}.lineChart svg{position:absolute;inset:0;width:100%;height:100%}.lineChart path{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke}.lineChart circle{fill:var(--accent)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#bdb7ac;flex:1;min-height:180px}.compare>div{background:var(--paper);padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.dark .compare>div{background:#202323}.compare strong{font-family:Georgia,serif;font-size:clamp(48px,9vw,95px);letter-spacing:-.08em}.compare span{font-size:10px;letter-spacing:.1em;color:#777}.photoData{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;flex:1;min-height:220px}.photoBox{background:linear-gradient(145deg,#6d7474,#252a2b 55%,#101314);min-height:100%}.dataStack{display:grid;grid-template-rows:1fr auto;gap:12px}.ranking{display:grid;gap:0;border-top:1px solid #bdb7ac}.rank{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid #c9c2b7;align-items:center}.rank b{font-family:Georgia,serif;font-size:24px;color:var(--accent)}.rank span{font-size:11px}.rank em{font-style:normal;font-weight:900;font-size:12px}
.footer{display:flex;justify-content:space-between;font-size:8px;color:#777;margin-top:auto}
.form{margin-bottom:18px}.form h3{font-size:10px;letter-spacing:.12em;margin:3px 0 10px}.field{display:block;font-size:8px;color:#94999b;margin:9px 0 4px}.input,.textarea{width:100%;border:1px solid #343a3d;background:#14181a;color:#e9e8e3;border-radius:5px;padding:9px;font-size:11px}.textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{border:1px solid #343a3d;background:#14181a;color:#aaa;padding:9px 6px;font-size:9px}.choice.active{border-color:var(--accent);color:#fff}.colors{display:flex;gap:8px}.color{width:28px;height:28px;border-radius:50%;border:1px solid #555}.color.active{outline:2px solid #eee;outline-offset:2px}
.status{font-size:9px;color:#7e8587;margin:10px 2px}
@media(max-width:1050px){.workspace{grid-template-columns:220px minmax(0,1fr)}.right{display:none}.template{grid-template-columns:1fr}.tname{display:none}}
@media(max-width:700px){.app{grid-template-rows:54px 1fr}.top{padding:0 10px}.brand{font-size:16px}.brand span{display:none}.tabs{gap:10px}.tabs button{font-size:8px}.actions button:not(.primary){display:none}.workspace{grid-template-columns:1fr}.sidebar{display:none}.center{padding:8px}.card{padding:5%}.headline{font-size:42px}.dek{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">WEST150 <span>DATA STUDIO</span></div>
<div class="tabs"><button class="active">TEMPLATE</button><button>DATA</button><button>STYLE</button></div>
<div class="actions"><button id="saveJson">SAVE JSON</button><button id="loadJson">LOAD JSON</button><button class="primary" id="exportPng">EXPORT PNG</button><input id="jsonFile" type="file" accept="application/json" hidden></div>
</header>
<div class="workspace">
<aside class="sidebar">
<div class="labelTitle">DATA LAYOUTS</div>
<div class="templates" id="templates">
<button class="template active" data-template="big"><div class="thumb"><span>01</span><b>72%</b></div><div class="tname"><b>BIG NUMBER</b><small>핵심 수치</small></div></button>
<button class="template" data-template="photo"><div class="thumb"><span>02</span><b>DATA</b></div><div class="tname"><b>PHOTO + DATA</b><small>비주얼 + 수치</small></div></button>
<button class="template" data-template="compare"><div class="thumb"><span>03</span><b>52 / 48</b></div><div class="tname"><b>COMPARE SPLIT</b><small>양쪽 비교</small></div></button>
<button class="template" data-template="bar"><div class="thumb"><span>04</span><b>▂▄▆█</b></div><div class="tname"><b>MINIMAL BAR</b><small>막대 그래프</small></div></button>
<button class="template" data-template="line"><div class="thumb"><span>05</span><b>╱╲╱</b></div><div class="tname"><b>LINE EDITORIAL</b><small>추세 그래프</small></div></button>
<button class="template" data-template="ranking"><div class="thumb"><span>06</span><b>01</b></div><div class="tname"><b>RANKING</b><small>순위 데이터</small></div></button>
</div>
</aside>

<main class="center"><div class="stage"><article class="card" id="card"></article></div></main>

<aside class="sidebar right">
<div class="form"><h3>CONTENT</h3>
<label class="field">KICKER</label><input class="input" id="kicker">
<label class="field">HEADLINE</label><textarea class="textarea" id="headline"></textarea>
<label class="field">DESCRIPTION</label><textarea class="textarea" id="description"></textarea>
</div>
<div class="form"><h3>DATA</h3>
<div class="grid2"><div><label class="field">MAIN VALUE</label><input class="input" id="value"></div><div><label class="field">UNIT</label><input class="input" id="unit"></div></div>
<label class="field">SERIES (쉼표로 구분, 6개)</label><input class="input" id="series">
<label class="field">LABELS (쉼표로 구분)</label><input class="input" id="labels">
</div>
<div class="form"><h3>STYLE</h3>
<div class="grid2" id="background"><button class="choice active" data-bg="paper">PAPER</button><button class="choice" data-bg="dark">DARK</button></div>
<label class="field">ACCENT</label><div class="colors" id="colors"><button class="color active" data-color="#c9362c" style="background:#c9362c"></button><button class="color" data-color="#b8873c" style="background:#b8873c"></button><button class="color" data-color="#367b75" style="background:#367b75"></button><button class="color" data-color="#6c5b8e" style="background:#6c5b8e"></button></div>
</div>
<div class="status" id="status">자동 저장 활성화됨</div>
</aside>
</div>
</div>

<script>
const KEY = 'west150_data_studio_fixed_v1';
const defaults = {
  template: 'big',
  kicker: 'DATA REPORT',
  headline: 'THE NUMBER BEHIND THE STORY',
  description: 'A clear editorial view of the numbers, trends and changes shaping the story.',
  value: '72',
  unit: '%',
  series: '32,48,56,44,68,72',
  labels: 'JAN,FEB,MAR,APR,MAY,JUN',
  bg: 'paper',
  accent: '#c9362c'
};
let state = { ...defaults };
try {
  state = { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || '{}') };
} catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const nums = () => {
  const arr = state.series.split(',').map(x => Math.max(0, Number(x.trim()) || 0)).slice(0, 6);
  while (arr.length < 6) arr.push(0);
  return arr;
};
const labs = () => {
  const arr = state.labels.split(',').map(x => x.trim()).filter(Boolean).slice(0, 6);
  while (arr.length < 6) arr.push('ITEM ' + (arr.length + 1));
  return arr;
};

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  $('status').textContent = '자동 저장됨 · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function header() {
  return `<div class="cardHeader"><span>WEST150 DATA</span><span>${state.template.toUpperCase()} / 01</span></div>`;
}

function common() {
  return `<div class="kicker">${esc(state.kicker)}</div><div class="headline">${esc(state.headline)}</div><div class="dek">${esc(state.description)}</div>`;
}

function bars() {
  const n = nums();
  const m = Math.max(...n, 1);
  return `<div class="chart bars">${n.map(v => `<div class="bar" style="--h:${Math.max(5, (v / m) * 100)}%"></div>`).join('')}</div>`;
}

function line() {
  const n = nums();
  const m = Math.max(...n, 1);
  const w = 100, h = 80;
  const pts = n.map((v, i) => {
    const x = i * (w / Math.max(1, n.length - 1));
    const y = h - (v / m * h * 0.88) - 4;
    return `${x},${y}`;
  });
  const pathD = 'M ' + pts.join(' L ');
  const circles = pts.map(p => {
    const [a, b] = p.split(',');
    return `<circle cx="${a}" cy="${b}" r="1.8"></circle>`;
  }).join('');
  return `<div class="lineChart"><svg viewBox="0 0 100 80" preserveAspectRatio="none"><path d="${pathD}"></path>${circles}</svg></div>`;
}

function ranking() {
  const n = nums();
  const l = labs();
  return `<div class="ranking">${n.map((v, i) => {
    const rank = String(i + 1).padStart(2, '0');
    return `<div class="rank"><b>${rank}</b><span>${esc(l[i] || 'ITEM ' + (i + 1))}</span><em>${v}${esc(state.unit)}</em></div>`;
  }).join('')}</div>`;
}

function render() {
  document.documentElement.style.setProperty('--accent', state.accent);
  const card = $('card');
  card.className = 'card ' + (state.bg === 'dark' ? 'dark' : '');

  const metric = `<div><div class="metric">${esc(state.value)}<small style="font-size:.32em;letter-spacing:0">${esc(state.unit)}</small></div><div class="metricLabel">LATEST VALUE</div></div>`;

  let html = header();

  if (state.template === 'big') {
    html += common() + metric + bars();
  } else if (state.template === 'photo') {
    html += `<div class="photoData"><div class="photoBox"></div><div class="dataStack">${metric}${bars()}</div></div>` + common();
  } else if (state.template === 'compare') {
    const n = nums();
    const l = labs();
    html += `<div class="kicker">${esc(state.kicker)}</div>
             <div class="headline">${esc(state.headline)}</div>
             <div class="compare">
               <div><strong>${n[0] || 0}${esc(state.unit)}</strong><span>${esc(l[0] || 'OPTION A')}</span></div>
               <div><strong>${n[1] || 0}${esc(state.unit)}</strong><span>${esc(l[1] || 'OPTION B')}</span></div>
             </div>
             <div class="dek">${esc(state.description)}</div>`;
  } else if (state.template === 'bar') {
    html += common() + metric + bars();
  } else if (state.template === 'line') {
    html += common() + metric + line();
  } else if (state.template === 'ranking') {
    html += `<div class="kicker">${esc(state.kicker)}</div>
             <div class="headline">${esc(state.headline)}</div>
             ${ranking()}
             <div class="dek">${esc(state.description)}</div>`;
  }

  html += `<div class="footer"><span>WEST150 DATA STUDIO</span><span>2026</span></div>`;
  card.innerHTML = html;

  document.querySelectorAll('.template').forEach(b => b.classList.toggle('active', b.dataset.template === state.template));
  document.querySelectorAll('#background .choice').forEach(b => b.classList.toggle('active', b.dataset.bg === state.bg));
  document.querySelectorAll('#colors .color').forEach(b => b.classList.toggle('active', b.dataset.color === state.accent));
}

['kicker', 'headline', 'description', 'value', 'unit', 'series', 'labels'].forEach(id => {
  const el = $(id);
  el.value = state[id];
  el.addEventListener('input', () => {
    state[id] = el.value;
    render();
    save();
  });
});

document.querySelectorAll('.template').forEach(b => {
  b.addEventListener('click', () => {
    state.template = b.dataset.template;
    render();
    save();
  });
});

document.querySelectorAll('#background .choice').forEach(b => {
  b.addEventListener('click', () => {
    state.bg = b.dataset.bg;
    render();
    save();
  });
});

document.querySelectorAll('#colors .color').forEach(b => {
  b.addEventListener('click', () => {
    state.accent = b.dataset.color;
    render();
    save();
  });
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}

$('saveJson').onclick = () => download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), 'west150-data-project.json');
$('loadJson').onclick = () => $('jsonFile').click();
$('jsonFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      state = { ...defaults, ...JSON.parse(r.result) };
      ['kicker', 'headline', 'description', 'value', 'unit', 'series', 'labels'].forEach(id => $(id).value = state[id]);
      render();
      save();
    } catch (err) {
      alert('올바른 프로젝트 JSON 파일이 아닙니다.');
    }
  };
  r.readAsText(f);
};

function exportCanvas() {
  const W = 1200, H = 1500;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const x = c.getContext('2d');

  const dark = state.bg === 'dark';
  const bg = dark ? '#181b1b' : '#f1ede4';
  const ink = dark ? '#f1eee6' : '#171816';
  const muted = dark ? '#b9b7b0' : '#686a66';

  x.fillStyle = bg;
  x.fillRect(0, 0, W, H);

  // Header
  x.fillStyle = ink;
  x.font = '900 24px Arial';
  x.fillText('WEST150 DATA', 65, 65);
  x.textAlign = 'right';
  x.fillText(state.template.toUpperCase() + ' / 01', 1135, 65);
  x.textAlign = 'left';

  // Kicker
  x.fillStyle = state.accent;
  x.font = '900 20px Arial';
  x.fillText(state.kicker, 65, 150);

  const wrap = (text, max, font, y, line, color) => {
    x.font = font;
    x.fillStyle = color;
    x.textBaseline = 'top';
    let words = String(text).split(/\s+/);
    let row = '';
    let yy = y;
    for (const w of words) {
      const t = row ? row + ' ' + w : w;
      if (x.measureText(t).width > max && row) {
        x.fillText(row, 65, yy);
        yy += line;
        row = w;
      } else {
        row = t;
      }
    }
    if (row) {
      x.fillText(row, 65, yy);
      yy += line;
    }
    return yy;
  };

  let y = 190;
  y = wrap(state.headline, 1050, '70px Georgia', y, 76, ink) + 25;
  x.font = '28px Arial';
  x.fillStyle = muted;
  y = wrap(state.description, 850, '28px Arial', y, 40, muted) + 30;

  const n = nums();
  const m = Math.max(...n, 1);
  const l = labs();

  if (state.template === 'compare') {
    for (let i = 0; i < 2; i++) {
      x.fillStyle = i ? (dark ? '#262b2b' : '#e4ded2') : (dark ? '#222626' : '#d6cfc2');
      x.fillRect(65 + i * 535, y, 525, 500);
      x.fillStyle = ink;
      x.font = '120px Georgia';
      x.fillText((n[i] || 0) + state.unit, 95 + i * 535, y + 330);
      x.font = '20px Arial';
      x.fillText((l[i] || 'OPTION ' + (i + 1)).toUpperCase(), 95 + i * 535, y + 380);
    }
  } else if (state.template === 'ranking') {
    n.forEach((v, i) => {
      x.strokeStyle = dark ? '#555' : '#c8c0b5';
      x.beginPath();
      x.moveTo(65, y + i * 105);
      x.lineTo(1135, y + i * 105);
      x.stroke();

      x.fillStyle = state.accent;
      x.font = '42px Georgia';
      x.fillText(String(i + 1).padStart(2, '0'), 65, y + 65 + i * 105);

      x.fillStyle = ink;
      x.font = '28px Arial';
      x.fillText(l[i] || 'ITEM ' + (i + 1), 150, y + 62 + i * 105);

      x.textAlign = 'right';
      x.fillText(v + state.unit, 1135, y + 62 + i * 105);
      x.textAlign = 'left';
    });
  } else if (state.template === 'line') {
    // Line chart
    x.strokeStyle = state.accent;
    x.lineWidth = 8;
    x.beginPath();
    n.forEach((v, i) => {
      const px = 65 + i * (1070 / Math.max(1, n.length - 1));
      const py = y + 430 - (v / m * 350);
      if (i === 0) x.moveTo(px, py);
      else x.lineTo(px, py);
    });
    x.stroke();

    // Points
    n.forEach((v, i) => {
      const px = 65 + i * (1070 / Math.max(1, n.length - 1));
      const py = y + 430 - (v / m * 350);
      x.fillStyle = state.accent;
      x.beginPath();
      x.arc(px, py, 10, 0, Math.PI * 2);
      x.fill();
    });
  } else if (state.template === 'photo') {
    // Photo box (left)
    const grad = x.createLinearGradient(65, y, 65 + 520, y + 500);
    grad.addColorStop(0, '#6d7474');
    grad.addColorStop(0.55, '#252a2b');
    grad.addColorStop(1, '#101314');
    x.fillStyle = grad;
    x.fillRect(65, y, 520, 500);

    // Metric (right)
    x.fillStyle = ink;
    x.font = '100px Georgia';
    x.fillText(state.value + state.unit, 620, y + 180);

    x.font = '18px Arial';
    x.fillStyle = muted;
    x.fillText('LATEST VALUE', 620, y + 220);

    // Mini bars
    const base = y + 480;
    const bw = 55;
    n.forEach((v, i) => {
      const h = (v / m) * 200;
      x.fillStyle = state.accent;
      x.fillRect(620 + i * (bw + 12), base - h, bw, h);
    });
  } else {
    // big / bar 공통
    x.font = '180px Georgia';
    x.fillStyle = ink;
    x.fillText(state.value + state.unit, 65, y + 170);

    const base = y + 500;
    const bw = 140;
    n.forEach((v, i) => {
      const h = (v / m) * 380;
      x.fillStyle = state.accent;
      x.fillRect(65 + i * (bw + 35), base - h, bw, h);
    });
  }

  // Footer
  x.fillStyle = muted;
  x.font = '18px Arial';
  x.fillText('WEST150 DATA STUDIO', 65, 1440);
  x.textAlign = 'right';
  x.fillText('2026', 1135, 1440);
  x.textAlign = 'left';

  return c;
}

$('exportPng').onclick = async () => {
  const canvas = exportCanvas();
  canvas.toBlob(async blob => {
    const file = new File([blob], 'west150-data.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'WEST150 DATA' });
        return;
      } catch (e) {}
    }
    download(blob, 'west150-data.png');
  }, 'image/png');
};

render();
save();
</script>
</body>
</html>
