<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너와 데스크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ============================================================
   너와 데스크 — 토큰
   ============================================================ */
:root{
  --ink:#241f18;
  --ink-soft:#5b5344;
  --paper:#faf6ec;
  --paper-cream:#f2e9d2;
  --desk-1:#232019;
  --desk-2:#2c2820;
  --desk-grid:rgba(255,255,255,.035);
  --brass:#b6905b;
  --brass-dim:#8a6f4c;
  --line:#e3dcc7;
  --line-dark:#463f31;
  --panel:#f8f5ec;
  --panel-2:#f1ead8;
  --danger:#a5503c;
  --ok:#5c7a52;
  --shadow-soft:0 8px 24px rgba(20,16,8,.28);
  --shadow-deep:0 20px 60px rgba(10,8,4,.5);
  --radius:4px;
  --font-ui:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:'RIDIBatang','Noto Serif KR',Georgia,serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:var(--desk-1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:rgba(182,144,91,.35);}
.hidden{display:none !important;}
[contenteditable]{user-select:text;outline:none;}

/* ============================================================ layout shell */
#app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* titlebar */
#titlebar{
  height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1d1a15,#171410);
  color:var(--brass);font-size:12px;letter-spacing:.14em;font-weight:600;
  border-bottom:1px solid #100e0b;
}

/* menubar */
#menubar{
  height:34px;flex:none;display:flex;align-items:stretch;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:0 8px;position:relative;z-index:60;
}
.menu-item{
  position:relative;display:flex;align-items:center;padding:0 11px;
  font-size:12.5px;color:var(--ink-soft);cursor:default;
}
.menu-item:hover,.menu-item.open{background:var(--panel-2);color:var(--ink);}
.menu-dropdown{
  position:absolute;top:34px;left:0;min-width:190px;background:var(--panel);
  border:1px solid var(--line);border-radius:0 0 6px 6px;box-shadow:var(--shadow-soft);
  padding:5px;display:none;
}
.menu-item.open .menu-dropdown{display:block;}
.dd-item{
  padding:7px 10px;font-size:12.5px;border-radius:3px;display:flex;justify-content:space-between;gap:14px;color:var(--ink);
}
.dd-item:hover{background:var(--brass);color:#fff;}
.dd-item .kbd{color:var(--ink-soft);font-size:11px;}
.dd-item:hover .kbd{color:#fff;}
.dd-sep{height:1px;background:var(--line);margin:5px 2px;}
.dd-sub{position:relative;}
.dd-sub>.menu-dropdown{top:-6px;left:100%;}
.dd-sub:hover>.menu-dropdown{display:block;}
#menubar-spacer{flex:1;}
#save-status{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);padding:0 6px;
}
#save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
#save-status.saving .dot{background:#b6905b;}
#save-status.failed .dot{background:var(--danger);}

/* project title bar */
#project-title-bar{
  height:30px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);
}
#project-title-text{font-weight:600;color:var(--ink);cursor:text;}
#project-type-badge{font-size:10.5px;padding:2px 7px;border:1px solid var(--brass-dim);border-radius:20px;color:var(--brass-dim);}

/* write toolbar */
#write-toolbar{
  flex:none;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:4px;padding:6px 10px;flex-wrap:wrap;
}
.tb-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line);}
.tb-group:last-child{border-right:none;}
.tb-btn{
  min-width:26px;height:26px;padding:0 6px;border:1px solid transparent;border-radius:3px;background:transparent;
  color:var(--ink);font-size:12.5px;display:flex;align-items:center;justify-content:center;
}
.tb-btn:hover{background:var(--panel-2);border-color:var(--line);}
.tb-btn.active{background:var(--brass);color:#fff;}
.tb-select{
  height:26px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:12px;padding:0 4px;color:var(--ink);
}
.tb-color{width:24px;height:24px;border:1px solid var(--line);border-radius:3px;padding:0;background:#fff;}

/* main split */
#main{flex:1;display:flex;min-height:0;position:relative;}

/* sidebars */
#left-sidebar,#material-panel{
  width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px;font-size:12.5px;
}
#material-panel{border-right:none;border-left:1px solid var(--line);}
.side-title{font-size:11px;letter-spacing:.08em;color:var(--brass-dim);text-transform:uppercase;margin:12px 2px 6px;font-weight:700;}
.side-title:first-child{margin-top:2px;}
.side-row{
  padding:7px 8px;border-radius:4px;margin-bottom:3px;color:var(--ink);display:flex;align-items:center;gap:7px;
  border:1px solid transparent;
}
.side-row:hover{background:var(--panel-2);border-color:var(--line);}
.side-row .ico{opacity:.7;font-size:12px;}
.side-empty{color:var(--ink-soft);font-size:11.5px;padding:6px 8px;font-style:italic;}
.side-add-btn{
  width:100%;margin-top:4px;padding:7px;border:1px dashed var(--line-dark);border-radius:4px;background:transparent;
  color:var(--ink-soft);font-size:12px;
}
.side-add-btn:hover{border-color:var(--brass);color:var(--brass-dim);}

/* desk canvas */
#desk-wrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--desk-grid) 1.2px, transparent 0) 0 0/26px 26px,
  linear-gradient(150deg,var(--desk-2),var(--desk-1) 65%);
}
#desk-canvas{position:absolute;inset:0;cursor:grab;}
#desk-canvas.panning{cursor:grabbing;}
#desk-canvas.connecting{cursor:crosshair;}
#desk-content{position:absolute;top:0;left:0;width:6000px;height:4500px;transform-origin:0 0;}
#connections-svg{position:absolute;top:0;left:0;width:6000px;height:4500px;pointer-events:none;overflow:visible;}
#connections-svg path{fill:none;stroke:var(--brass);stroke-width:1.6;stroke-dasharray:1 0;opacity:.65;}
#connections-svg path.temp{stroke-dasharray:4 4;opacity:.9;}

.desk-empty-hint{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:rgba(240,232,210,.35);
  pointer-events:none;width:340px;
}
.desk-empty-hint h3{font-family:var(--font-serif);font-weight:400;font-size:19px;margin:0 0 8px;color:rgba(240,232,210,.55);}
.desk-empty-hint p{font-size:12.5px;line-height:1.7;margin:0;}

/* desk objects */
.desk-object{
  position:absolute;user-select:none;
}
.obj-frame{
  width:100%;height:100%;position:relative;border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
}
.desk-object.selected .obj-frame{outline:2px solid var(--brass);outline-offset:2px;}
.obj-label{
  position:absolute;top:-19px;left:0;font-size:10px;color:rgba(240,232,210,.55);letter-spacing:.03em;
  white-space:nowrap;pointer-events:none;
}
.resize-handle{
  position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:var(--brass);border:2px solid #fff;
  border-radius:50%;cursor:nwse-resize;display:none;
}
.desk-object.selected .resize-handle{display:block;}
.rotate-handle{
  position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:9px;height:9px;background:#fff;
  border:2px solid var(--brass);border-radius:50%;cursor:grab;display:none;
}
.desk-object.selected .rotate-handle{display:block;}
.conn-dot{
  position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brass);border:2px solid #fff;
  display:none;cursor:crosshair;
}
.desk-object.selected .conn-dot,#desk-canvas.connecting .conn-dot{display:block;}
.conn-dot.n{top:-4px;left:calc(50% - 4px);}
.conn-dot.s{bottom:-4px;left:calc(50% - 4px);}
.conn-dot.e{right:-4px;top:calc(50% - 4px);}
.conn-dot.w{left:-4px;top:calc(50% - 4px);}

/* manuscript mini card */
.obj-manuscript .obj-frame{
  background:linear-gradient(160deg,#fffdf7,var(--paper));border:1px solid #e6dcc0;padding:14px 14px 10px;
  display:flex;flex-direction:column;
}
.obj-manuscript .ms-title{font-family:var(--font-serif);font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;}
.obj-manuscript .ms-preview{flex:1;font-size:10.5px;line-height:1.6;color:var(--ink-soft);overflow:hidden;}
.obj-manuscript .ms-foot{font-size:9.5px;color:var(--brass-dim);margin-top:6px;}
.obj-manuscript .obj-frame::before{content:"";position:absolute;left:4px;right:-4px;top:4px;bottom:-4px;background:var(--paper-cream);z-index:-1;border-radius:var(--radius);border:1px solid #e6dcc0;}

/* memo / note / postit / card */
.obj-memo .obj-frame,.obj-note .obj-frame{background:var(--panel);border:1px solid var(--line);padding:10px;}
.obj-memo .obj-frame{border-left:3px solid var(--brass);}
.obj-note .obj-frame{background:repeating-linear-gradient(var(--panel) 0 21px, var(--line) 21px 22px);}
.obj-postit .obj-frame{background:#f3d879;padding:12px;box-shadow:0 6px 16px rgba(0,0,0,.25);}
.obj-postit.tone-pink .obj-frame{background:#f0b6c2;}
.obj-postit.tone-blue .obj-frame{background:#a9cfe8;}
.obj-postit.tone-green .obj-frame{background:#b7d8a5;}
.obj-card .obj-frame{background:linear-gradient(160deg,#fff,var(--panel));border:1px solid var(--line);padding:12px;border-top:3px solid var(--brass);}
.obj-content{width:100%;height:100%;font-size:12.5px;line-height:1.6;overflow:auto;color:var(--ink);}
.obj-content:empty::before{content:attr(data-placeholder);color:var(--ink-soft);}

/* material / image / file */
.obj-material .obj-frame,.obj-file .obj-frame{background:var(--panel);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;}
.mat-kind{font-size:9.5px;letter-spacing:.08em;color:var(--brass-dim);text-transform:uppercase;}
.mat-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mat-body{flex:1;font-size:11px;color:var(--ink-soft);overflow:hidden;}
.obj-image .obj-frame{background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.obj-image img{width:100%;height:100%;object-fit:cover;display:block;}
.obj-image .img-empty{font-size:11px;color:var(--ink-soft);text-align:center;padding:8px;}

/* group */
.obj-group .obj-frame{background:rgba(246,240,222,.05);border:1.5px dashed rgba(240,232,210,.35);}
.obj-group .grp-label{position:absolute;top:6px;left:8px;font-size:10.5px;color:rgba(240,232,210,.55);}

/* zoom controls */
#zoom-controls{
  position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:2px;background:rgba(30,26,20,.85);
  border:1px solid var(--line-dark);border-radius:20px;padding:4px;z-index:10;
}
#zoom-controls button{width:26px;height:26px;border:none;background:transparent;color:var(--paper);border-radius:50%;font-size:14px;}
#zoom-controls button:hover{background:rgba(255,255,255,.12);}
#zoom-pct{color:var(--paper);font-size:11px;width:42px;text-align:center;}

/* toggles floating on desk edges */
.edge-toggle{
  position:absolute;top:50%;transform:translateY(-50%);width:16px;height:56px;background:rgba(30,26,20,.85);
  border:1px solid var(--line-dark);color:var(--brass);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:10;
}
#toggle-left{left:0;border-radius:0 6px 6px 0;}
#toggle-right{right:0;border-radius:6px 0 0 6px;}
.edge-toggle:hover{background:rgba(50,44,34,.9);}

/* context menu */
#context-menu{
  position:fixed;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow-deep);padding:5px;z-index:200;
}
.cm-item{padding:7px 10px;font-size:12.5px;border-radius:3px;color:var(--ink);display:flex;justify-content:space-between;}
.cm-item:hover{background:var(--brass);color:#fff;}
.cm-item.disabled{color:#bbb;pointer-events:none;}
.cm-sep{height:1px;background:var(--line);margin:5px 2px;}
.cm-label{padding:6px 10px 3px;font-size:10.5px;color:var(--brass-dim);letter-spacing:.06em;}
.cm-sub{position:relative;}
.cm-sub>.cm-flyout{display:none;position:absolute;top:-6px;left:100%;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-deep);padding:5px;}
.cm-sub:hover>.cm-flyout{display:block;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,12,8,.55);display:flex;align-items:center;justify-content:center;z-index:300;
}
.modal-box{
  background:var(--panel);border-radius:8px;box-shadow:var(--shadow-deep);width:460px;max-width:92vw;max-height:86vh;
  overflow-y:auto;padding:22px 24px;
}
.modal-box.wide{width:640px;}
.modal-title{font-family:var(--font-serif);font-size:18px;margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.btn{padding:8px 16px;border-radius:5px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);}
.btn:hover{background:var(--panel-2);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.btn.primary:hover{background:#3a3327;}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.type-opt{border:1.5px solid var(--line);border-radius:6px;padding:14px 12px;cursor:pointer;}
.type-opt:hover{border-color:var(--brass);}
.type-opt.selected{border-color:var(--brass);background:var(--panel-2);}
.type-opt .t-name{font-weight:700;font-size:13px;}
.type-opt .t-desc{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.field-row{margin-bottom:12px;}
.field-row label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
.field-row input[type=text],.field-row input[type=number],.field-row select,.field-row textarea{
  width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:4px;font-size:12.5px;background:#fff;color:var(--ink);
}
.field-row textarea{resize:vertical;min-height:64px;}
.field-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.trash-row,.tpl-row,.pick-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
.trash-row:last-child,.tpl-row:last-child,.pick-row:last-child{border-bottom:none;}
.trash-row .btns{display:flex;gap:6px;}
.trash-row .btns button,.pick-row button{padding:5px 10px;font-size:11.5px;border-radius:4px;border:1px solid var(--line);background:#fff;}
.pick-row{cursor:pointer;}
.pick-row:hover{background:var(--panel-2);}

/* manuscript editor overlay */
#ms-overlay{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;background:rgba(18,15,11,.72);backdrop-filter:blur(1.5px);}
#ms-window{
  margin:28px auto;width:min(880px,92vw);flex:1;background:#e9e2cd;border-radius:8px 8px 0 0;
  display:flex;flex-direction:column;box-shadow:var(--shadow-deep);overflow:hidden;
}
#ms-topbar{
  flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
#ms-topbar .back-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;}
#ms-topbar .back-btn:hover{background:var(--panel-2);}
#ms-title-input{border:none;background:transparent;font-family:var(--font-serif);font-size:16px;flex:1;min-width:0;}
#ms-title-input:focus{outline:1px dashed var(--brass);}
#ms-topbar .ms-meta{font-size:11px;color:var(--ink-soft);}
#ms-topbar .ms-actions{display:flex;gap:6px;}
#ms-topbar .ms-actions button{padding:6px 10px;font-size:11.5px;border-radius:4px;border:1px solid var(--line);background:#fff;}
#ms-topbar .ms-actions button:hover{background:var(--panel-2);}
#ms-pages-scroll{flex:1;overflow-y:auto;padding:36px 0 90px;display:flex;flex-direction:column;align-items:center;gap:26px;background:#d9d1b8;}
.page{
  background:var(--paper);position:relative;box-shadow:0 6px 22px rgba(0,0,0,.28);
}
.page.shadow-none{box-shadow:none;}
.page.shadow-strong{box-shadow:0 16px 40px rgba(0,0,0,.42);}
.page.bg-cream{background:var(--paper-cream);}
.page.bg-texture{background:var(--paper);background-image:radial-gradient(rgba(150,130,90,.05) 1px,transparent 0);background-size:5px 5px;}
.page-num{position:absolute;bottom:6mm;right:0;left:0;text-align:center;font-size:9px;color:#b3a98d;}
.page-content{width:100%;height:100%;overflow:hidden;font-size:14.5px;line-height:1.85;font-family:var(--font-serif);color:var(--ink);}
.page-content h2{font-size:1.5em;margin:0 0 .5em;font-weight:700;}
.page-content h3{font-size:1.2em;margin:0 0 .5em;font-weight:700;}
.page-content blockquote{border-left:3px solid var(--brass);margin:.6em 0;padding:.2em 0 .2em 14px;color:var(--ink-soft);font-style:italic;}
.page-content p{margin:0 0 .8em;}
.page-content ul,.page-content ol{margin:0 0 .8em;padding-left:1.4em;}
.checklist-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:.3em;}
.page-content .comment-mark{background:rgba(182,144,91,.22);border-bottom:1px dashed var(--brass);}
.page-content table{border-collapse:collapse;width:100%;margin:.6em 0;}
.page-content td{border:1px solid var(--line);padding:6px 8px;font-size:.92em;}
.mat-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:2px 10px 2px 8px;font-size:.78em;font-family:var(--font-ui);color:var(--brass-dim);}
.add-page-btn{
  width:min(880px,92vw);margin:0 auto;padding:12px;text-align:center;border:1.5px dashed rgba(255,255,255,.3);color:rgba(255,255,255,.6);
  border-radius:6px;font-size:12px;background:transparent;
}
.add-page-btn:hover{border-color:var(--brass);color:var(--brass);}

/* trash-can quick label */
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;}

/* toast for shortcuts help etc */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(30,26,20,.94);
  color:var(--paper);padding:9px 16px;border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:400;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:6px;}
#ms-pages-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);}
</style>
</head>
<body>
<div id="app">

  <div id="titlebar">너 와 데 스 크</div>

  <div id="menubar">
    <div id="menu-mount"></div>
    <div id="menubar-spacer"></div>
    <div id="save-status"><span class="dot"></span><span id="save-status-text">저장됨</span></div>
  </div>

  <div id="project-title-bar">
    <span id="project-title-text" title="클릭하여 이름 변경">이름 없는 프로젝트</span>
    <span id="project-type-badge">자유 프로젝트</span>
  </div>

  <div id="write-toolbar" class="hidden"></div>

  <div id="main">
    <div id="left-sidebar" class="hidden"></div>

    <div id="desk-wrap">
      <div id="toggle-left" class="edge-toggle" title="사이드바 열기 (⌘\\)">›</div>
      <div id="desk-canvas">
        <div class="desk-empty-hint" id="empty-hint">
          <h3>빈 데스크</h3>
          <p>이 위에서 우클릭해 원고, 메모, 자료 등을<br>자유롭게 펼쳐놓고 글을 시작하세요.</p>
        </div>
        <svg id="connections-svg"></svg>
        <div id="desk-content"></div>
      </div>
      <div id="zoom-controls">
        <button id="zoom-out">−</button>
        <span id="zoom-pct">100%</span>
        <button id="zoom-in">+</button>
        <button id="zoom-reset" title="화면에 맞추기">⤢</button>
      </div>
      <div id="toggle-right" class="edge-toggle" title="자료 패널 열기 (⌘⇧M)">‹</div>
    </div>

    <div id="material-panel" class="hidden"></div>
  </div>

  <div id="context-menu" class="hidden"></div>
  <div id="modal-root"></div>
  <div id="ms-overlay-root"></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* ==========================================================================================
   너와 데스크  —  app.js (single-file build)
   모듈: ProjectManager, StorageManager, HistoryManager, DeskManager, CanvasManager,
         DocumentManager(원고), TextEditor, MaterialManager, NoteManager, ConnectionManager,
         TemplateManager, TrashManager, MenuManager, ShortcutManager, ContextMenuManager, UI
   ========================================================================================== */

const STORAGE_KEY = "yeonwadesk.project.v1";
const TEMPLATE_KEY = "yeonwadesk.templates.v1";
const uid = (p)=> p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------------------------------------------------------- default data helpers */
const PAGE_SIZES_MM = {A4:[210,297],A5:[148,210],B5:[176,250],Letter:[216,279]};
const PROJECT_TYPES = [
  {id:'general',name:'일반 글',desc:'가볍게 쓰는 글'},
  {id:'book',name:'책',desc:'여러 장(챕터)으로 구성'},
  {id:'article',name:'기사',desc:'취재·기사 작성'},
  {id:'essay',name:'에세이',desc:'생각을 담는 글'},
  {id:'research',name:'연구',desc:'자료 중심 글쓰기'},
  {id:'free',name:'자유 프로젝트',desc:'형식에 얽매이지 않음'},
];
function typeName(id){ return (PROJECT_TYPES.find(t=>t.id===id)||{}).name || '자유 프로젝트'; }

function newManuscript(x,y,title){
  return {
    id:uid('obj'), type:'manuscript', x,y, w:230,h:160, rot:0, z:App.nextZ(),
    title: title||'제목 없는 원고',
    pageSettings:{ size:'A4', marginTop:20,marginBottom:20,marginLeft:22,marginRight:22, bg:'white', shadow:'soft', font:'RIDIBatang' },
    pages:[{id:uid('pg'), html:'<p>여기에 글을 시작하세요…</p>'}],
    createdAt:Date.now()
  };
}
function newMemo(x,y){ return {id:uid('obj'),type:'memo',x,y,w:180,h:130,rot:0,z:App.nextZ(),content:'',createdAt:Date.now()}; }
function newPostit(x,y){ const tones=['','tone-pink','tone-blue','tone-green']; return {id:uid('obj'),type:'postit',x,y,w:150,h:150,rot:(Math.random()*8-4),z:App.nextZ(),content:'',tone:tones[Math.floor(Math.random()*tones.length)],createdAt:Date.now()}; }
function newNote(x,y){ return {id:uid('obj'),type:'note',x,y,w:190,h:150,rot:0,z:App.nextZ(),content:'',createdAt:Date.now()}; }
function newCard(x,y){ return {id:uid('obj'),type:'card',x,y,w:200,h:130,rot:0,z:App.nextZ(),title:'카드',content:'',createdAt:Date.now()}; }
function newMaterial(x,y,kind,name,data){ return {id:uid('obj'),type:'material',x,y,w:190,h:120,rot:0,z:App.nextZ(),kind:kind||'text',name:name||'새 자료',data:data||'',createdAt:Date.now()}; }
function newImage(x,y,data){ return {id:uid('obj'),type:'image',x,y,w:200,h:150,rot:0,z:App.nextZ(),data:data||'',createdAt:Date.now()}; }
function newFile(x,y,name,data){ return {id:uid('obj'),type:'file',x,y,w:180,h:90,rot:0,z:App.nextZ(),name:name||'파일',data:data||'',createdAt:Date.now()}; }
function newGroup(x,y){ return {id:uid('obj'),type:'group',x,y,w:320,h:220,rot:0,z:0,label:'그룹',createdAt:Date.now()}; }

function emptyProject(name,typeId){
  return {
    id:uid('proj'), name:name||'이름 없는 프로젝트', type:typeId||'free', createdAt:Date.now(),
    desk:{ objects:{}, connections:[], camera:{x:0,y:0,zoom:1} },
    trash:[],
  };
}

/* ==========================================================================================
   App — 전역 상태 + 매니저
   ========================================================================================== */
const App = {
  project:null,
  selectedId:null,
  dirty:false,
  maxZ:1,
  nextZ(){ return ++this.maxZ; },

  init(){
    this.loadOrWelcome();
    MenuManager.build();
    UI.buildLeftSidebar();
    UI.buildMaterialPanel();
    UI.buildWriteToolbarShell();
    CanvasManager.init();
    ShortcutManager.init();
    ContextMenuManager.init();
    window.addEventListener('beforeunload',(e)=>{ if(App.dirty){ e.preventDefault(); e.returnValue=''; } });
  },

  loadOrWelcome(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{ this.project = JSON.parse(raw); this.maxZ = this._computeMaxZ(); this.afterProjectLoaded(); return; }
      catch(e){ /* fallthrough to welcome */ }
    }
    UI.showWelcome();
  },
  _computeMaxZ(){
    let m=1; const objs=this.project?.desk?.objects||{};
    Object.values(objs).forEach(o=>{ if(o.z>m) m=o.z; });
    return m;
  },
  afterProjectLoaded(){
    document.getElementById('project-title-text').textContent = this.project.name;
    document.getElementById('project-type-badge').textContent = typeName(this.project.type);
    DeskManager.renderAll();
    HistoryManager.reset();
  },

  createProject(name,typeId){
    this.project = emptyProject(name,typeId);
    this.maxZ=1;
    this.afterProjectLoaded();
    StorageManager.save(true);
    toast('새 프로젝트를 시작했습니다');
  },

  markDirty(){ this.dirty=true; StorageManager.scheduleSave(); },

  select(id){
    this.selectedId=id;
    document.querySelectorAll('.desk-object.selected').forEach(el=>el.classList.remove('selected'));
    if(id){ const el=document.querySelector('.desk-object[data-id="'+id+'"]'); if(el) el.classList.add('selected'); }
  },
  getObj(id){ return this.project.desk.objects[id]; }
};

/* ---------------------------------------------------------- StorageManager */
const StorageManager = {
  _t:null,
  scheduleSave(){
    this.setStatus('saving');
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.save(),700);
  },
  save(silent){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(App.project));
      App.dirty=false;
      this.setStatus('ok');
    }catch(e){ this.setStatus('failed'); }
  },
  setStatus(s){
    const el=document.getElementById('save-status'); const t=document.getElementById('save-status-text');
    el.classList.remove('saving','failed');
    if(s==='saving'){ el.classList.add('saving'); t.textContent='저장 중'; }
    else if(s==='failed'){ el.classList.add('failed'); t.textContent='저장 실패'; }
    else { t.textContent='저장됨'; }
  },
  exportJSON(){
    const blob=new Blob([JSON.stringify(App.project,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(App.project.name||'project')+'.ywd.json'; a.click();
  },
  importJSON(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        App.project=data; App.maxZ=App._computeMaxZ();
        App.afterProjectLoaded(); StorageManager.save(true);
        toast('프로젝트를 불러왔습니다');
      }catch(e){ toast('가져오기에 실패했습니다'); }
    };
    reader.readAsText(file);
  }
};

/* ---------------------------------------------------------- HistoryManager (undo/redo) */
const HistoryManager = {
  undoStack:[], redoStack:[], limit:60, _suspend:false,
  reset(){ this.undoStack=[]; this.redoStack=[]; },
  snapshot(){
    if(this._suspend || !App.project) return;
    this.undoStack.push(JSON.stringify(App.project.desk));
    if(this.undoStack.length>this.limit) this.undoStack.shift();
    this.redoStack=[];
  },
  undo(){
    if(!this.undoStack.length){ toast('되돌릴 작업이 없습니다'); return; }
    this.redoStack.push(JSON.stringify(App.project.desk));
    const prev=this.undoStack.pop();
    App.project.desk=JSON.parse(prev);
    App.select(null); DeskManager.renderAll(); App.markDirty();
  },
  redo(){
    if(!this.redoStack.length){ toast('다시 실행할 작업이 없습니다'); return; }
    this.undoStack.push(JSON.stringify(App.project.desk));
    const next=this.redoStack.pop();
    App.project.desk=JSON.parse(next);
    App.select(null); DeskManager.renderAll(); App.markDirty();
  }
};

/* ---------------------------------------------------------- CanvasManager (pan/zoom/snap) */
const CanvasManager = {
  el:null, content:null, svg:null, panning:false, panStart:null, camStart:null,
  connecting:false, connectFromId:null,
  init(){
    this.el=document.getElementById('desk-canvas');
    this.content=document.getElementById('desk-content');
    this.svg=document.getElementById('connections-svg');
    this.applyTransform();
    this.el.addEventListener('mousedown', e=>this.onMouseDown(e));
    window.addEventListener('mousemove', e=>this.onMouseMove(e));
    window.addEventListener('mouseup', e=>this.onMouseUp(e));
    this.el.addEventListener('wheel', e=>this.onWheel(e), {passive:false});
    document.getElementById('zoom-in').onclick=()=>this.zoomBy(1.15);
    document.getElementById('zoom-out').onclick=()=>this.zoomBy(1/1.15);
    document.getElementById('zoom-reset').onclick=()=>this.resetView();
    this.el.addEventListener('contextmenu', e=>{
      e.preventDefault();
      if(e.target===this.el || e.target===this.content || e.target.id==='empty-hint'){
        ContextMenuManager.openDeskMenu(e.clientX,e.clientY);
      }
    });
  },
  cam(){ return App.project.desk.camera; },
  applyTransform(){
    const c=this.cam();
    this.content.style.transform = `translate(${c.x}px,${c.y}px) scale(${c.zoom})`;
    this.svg.style.transform = this.content.style.transform;
    document.getElementById('zoom-pct').textContent = Math.round(c.zoom*100)+'%';
  },
  toWorld(clientX,clientY){
    const r=this.el.getBoundingClientRect(); const c=this.cam();
    return { x:(clientX-r.left-c.x)/c.zoom, y:(clientY-r.top-c.y)/c.zoom };
  },
  onMouseDown(e){
    if(e.target!==this.el && e.target!==this.content && e.target.id!=='empty-hint') return;
    if(e.button!==0) return;
    ContextMenuManager.close();
    App.select(null);
    this.panning=true; this.el.classList.add('panning');
    this.panStart={x:e.clientX,y:e.clientY}; this.camStart={...this.cam()};
  },
  onMouseMove(e){
    if(this.panning){
      const dx=e.clientX-this.panStart.x, dy=e.clientY-this.panStart.y;
      this.cam().x=this.camStart.x+dx; this.cam().y=this.camStart.y+dy;
      this.applyTransform();
    }
    if(this.connecting){ ConnectionManager.updateTempLine(e); }
  },
  onMouseUp(e){
    if(this.panning){ this.panning=false; this.el.classList.remove('panning'); }
  },
  onWheel(e){
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.08 : 1/1.08;
    this.zoomBy(factor, e.clientX, e.clientY);
  },
  zoomBy(factor, clientX, clientY){
    const c=this.cam(); const r=this.el.getBoundingClientRect();
    const cx = clientX!=null? clientX-r.left : r.width/2;
    const cy = clientY!=null? clientY-r.top : r.height/2;
    const wx=(cx-c.x)/c.zoom, wy=(cy-c.y)/c.zoom;
    c.zoom=Math.min(2.5,Math.max(.25,c.zoom*factor));
    c.x=cx-wx*c.zoom; c.y=cy-wy*c.zoom;
    this.applyTransform();
  },
  resetView(){
    App.project.desk.camera={x:120,y:80,zoom:1};
    this.applyTransform();
  },
  centerOn(objId){
    const o=App.getObj(objId); if(!o) return;
    const r=this.el.getBoundingClientRect(); const c=this.cam();
    c.x = r.width/2 - (o.x+o.w/2)*c.zoom;
    c.y = r.height/2 - (o.y+o.h/2)*c.zoom;
    this.applyTransform();
    App.select(objId);
  }
};

/* ---------------------------------------------------------- DeskManager (objects render + interactions) */
const DeskManager = {
  drag:null, resize:null, rotateDrag:null,

  renderAll(){
    const content=CanvasManager.content;
    content.innerHTML='';
    const objs=App.project.desk.objects;
    const list=Object.values(objs).sort((a,b)=>a.z-b.z);
    list.forEach(o=> content.appendChild(this.buildEl(o)));
    document.getElementById('empty-hint').style.display = list.length? 'none':'block';
    ConnectionManager.renderAll();
    UI.refreshSideLists();
  },

  buildEl(o){
    const el=document.createElement('div');
    el.className='desk-object obj-'+o.type+(o.tone?(' '+o.tone):'');
    el.dataset.id=o.id;
    this.positionEl(el,o);
    const frame=document.createElement('div'); frame.className='obj-frame';
    frame.appendChild(this.buildInner(o));
    el.appendChild(frame);

    const label=document.createElement('div'); label.className='obj-label';
    label.textContent=this.labelFor(o);
    el.appendChild(label);

    if(o.type!=='group'){
      const rh=document.createElement('div'); rh.className='resize-handle';
      rh.addEventListener('mousedown',e=>this.startResize(e,o));
      el.appendChild(rh);
      const roth=document.createElement('div'); roth.className='rotate-handle';
      roth.addEventListener('mousedown',e=>this.startRotate(e,o));
      el.appendChild(roth);
      ['n','s','e','w'].forEach(dir=>{
        const d=document.createElement('div'); d.className='conn-dot '+dir;
        d.addEventListener('mousedown',e=>{ e.stopPropagation(); ConnectionManager.startFrom(o.id,e); });
        el.appendChild(d);
      });
    }

    el.addEventListener('mousedown', e=>this.onObjMouseDown(e,o));
    el.addEventListener('dblclick', e=>{
      if(o.type==='manuscript'){ e.stopPropagation(); DocumentManager.open(o.id); }
    });
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation(); App.select(o.id); ContextMenuManager.openObjectMenu(e.clientX,e.clientY,o); });
    return el;
  },

  labelFor(o){
    const map={manuscript:'원고',memo:'메모',postit:'포스트잇',note:'노트',card:'카드',material:'자료',image:'이미지',file:'파일',group:'그룹'};
    return map[o.type]||o.type;
  },

  buildInner(o){
    const frag=document.createDocumentFragment();
    if(o.type==='manuscript'){
      const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;height:100%;';
      const t=document.createElement('div'); t.className='ms-title'; t.textContent=o.title;
      const p=document.createElement('div'); p.className='ms-preview'; p.textContent=this.plain(o.pages[0]?.html||'').slice(0,140);
      const f=document.createElement('div'); f.className='ms-foot'; f.textContent=`${o.pages.length}쪽 · ${o.pageSettings.size} · 더블클릭해 열기`;
      wrap.append(t,p,f); frag.appendChild(wrap);
    } else if(['memo','note','postit','card'].includes(o.type)){
      if(o.type==='card'){
        const t=document.createElement('div'); t.contentEditable='true'; t.style.cssText='font-weight:700;font-size:12.5px;margin-bottom:6px;';
        t.textContent=o.title; t.addEventListener('input',()=>{o.title=t.textContent; App.markDirty();});
        t.addEventListener('mousedown',e=>e.stopPropagation());
        frag.appendChild(t);
      }
      const c=document.createElement('div'); c.className='obj-content'; c.contentEditable='true';
      c.dataset.placeholder = o.type==='postit'?'메모를 남기세요…': o.type==='note'?'노트…' : '메모…';
      c.innerHTML=o.content||'';
      c.addEventListener('input',()=>{ o.content=c.innerHTML; App.markDirty(); DeskManager.updatePreview(o); });
      c.addEventListener('mousedown',e=>e.stopPropagation());
      c.addEventListener('dblclick',e=>e.stopPropagation());
      frag.appendChild(c);
    } else if(o.type==='material'){
      const k=document.createElement('div'); k.className='mat-kind'; k.textContent=({pdf:'PDF',image:'이미지',web:'웹자료',file:'파일',text:'텍스트'})[o.kind]||o.kind;
      const n=document.createElement('div'); n.className='mat-name'; n.textContent=o.name;
      const b=document.createElement('div'); b.className='mat-body'; b.textContent = o.kind==='web'? o.data : (o.kind==='text'? o.data.slice(0,120):'더블클릭해 열기');
      frag.append(k,n,b);
    } else if(o.type==='image'){
      if(o.data){ const img=document.createElement('img'); img.src=o.data; frag.appendChild(img); }
      else {
        const btn=document.createElement('div'); btn.className='img-empty'; btn.textContent='더블클릭해 이미지 추가';
        btn.addEventListener('dblclick', e=>{ e.stopPropagation(); DeskManager.pickImage(o); });
        frag.appendChild(btn);
      }
    } else if(o.type==='file'){
      const k=document.createElement('div'); k.className='mat-kind'; k.textContent='파일';
      const n=document.createElement('div'); n.className='mat-name'; n.textContent=o.name;
      frag.append(k,n);
    } else if(o.type==='group'){
      const l=document.createElement('div'); l.className='grp-label'; l.contentEditable='true';
      l.textContent=o.label; l.addEventListener('input',()=>{o.label=l.textContent; App.markDirty();});
      l.addEventListener('mousedown',e=>e.stopPropagation());
      frag.appendChild(l);
    }
    return frag;
  },
  plain(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent||''; },
  updatePreview(o){ const el=document.querySelector('.desk-object[data-id="'+o.id+'"] .ms-preview'); if(el) el.textContent=this.plain(o.pages?.[0]?.html||'').slice(0,140); },

  pickImage(o){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ o.data=r.result; DeskManager.renderAll(); App.markDirty(); };
      r.readAsDataURL(f);
    };
    inp.click();
  },

  positionEl(el,o){
    el.style.left=o.x+'px'; el.style.top=o.y+'px'; el.style.width=o.w+'px'; el.style.height=o.h+'px';
    el.style.zIndex=o.z; el.style.transform='rotate('+(o.rot||0)+'deg)';
  },

  onObjMouseDown(e,o){
    if(e.button!==0) return;
    if(CanvasManager.connecting) return;
    if(e.target.closest('.resize-handle')||e.target.closest('.rotate-handle')||e.target.closest('.conn-dot')) return;
    e.stopPropagation();
    App.select(o.id);
    if(e.target.isContentEditable) return; // let text editing happen
    const start=CanvasManager.toWorld(e.clientX,e.clientY);
    this.drag={id:o.id, ox:o.x, oy:o.y, sx:start.x, sy:start.y, moved:false};
    let snapped=false;
    const move=(ev)=>{
      if(!snapped){ HistoryManager.snapshot(); snapped=true; } // snapshot pre-drag state on first real move
      const w=CanvasManager.toWorld(ev.clientX,ev.clientY);
      let nx=this.drag.ox+(w.x-this.drag.sx), ny=this.drag.oy+(w.y-this.drag.sy);
      const snap=this.computeSnap(o,nx,ny);
      nx=snap.x; ny=snap.y;
      o.x=nx; o.y=ny; this.drag.moved=true;
      this.positionEl(document.querySelector('.desk-object[data-id="'+o.id+'"]'),o);
      ConnectionManager.renderAll();
    };
    const up=()=>{
      window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up);
      if(this.drag && this.drag.moved){ App.markDirty(); }
      this.drag=null;
    };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  },

  computeSnap(obj,nx,ny){
    const T=6/CanvasManager.cam().zoom;
    let x=nx,y=ny;
    const others=Object.values(App.project.desk.objects).filter(o=>o.id!==obj.id);
    for(const o of others){
      if(Math.abs(nx-o.x)<T) x=o.x;
      else if(Math.abs((nx+obj.w)-(o.x+o.w))<T) x=o.x+o.w-obj.w;
      else if(Math.abs((nx+obj.w/2)-(o.x+o.w/2))<T) x=o.x+o.w/2-obj.w/2;
      if(Math.abs(ny-o.y)<T) y=o.y;
      else if(Math.abs((ny+obj.h)-(o.y+o.h))<T) y=o.y+o.h-obj.h;
      else if(Math.abs((ny+obj.h/2)-(o.y+o.h/2))<T) y=o.y+o.h/2-obj.h/2;
    }
    return {x,y};
  },

  startResize(e,o){
    e.stopPropagation(); e.preventDefault();
    HistoryManager.snapshot();
    const start=CanvasManager.toWorld(e.clientX,e.clientY);
    const ow=o.w, oh=o.h;
    const move=(ev)=>{
      const w=CanvasManager.toWorld(ev.clientX,ev.clientY);
      o.w=Math.max(90,ow+(w.x-start.x)); o.h=Math.max(60,oh+(w.y-start.y));
      this.positionEl(document.querySelector('.desk-object[data-id="'+o.id+'"]'),o);
      ConnectionManager.renderAll();
    };
    const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); App.markDirty(); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  },

  startRotate(e,o){
    e.stopPropagation(); e.preventDefault();
    HistoryManager.snapshot();
    const el=document.querySelector('.desk-object[data-id="'+o.id+'"]');
    const move=(ev)=>{
      const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const ang=Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI + 90;
      o.rot=Math.round(ang);
      this.positionEl(el,o);
    };
    const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); App.markDirty(); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  },

  createAt(kind, worldX, worldY){
    HistoryManager.snapshot();
    let o;
    if(kind==='manuscript') o=newManuscript(worldX,worldY);
    else if(kind==='memo') o=newMemo(worldX,worldY);
    else if(kind==='postit') o=newPostit(worldX,worldY);
    else if(kind==='note') o=newNote(worldX,worldY);
    else if(kind==='card') o=newCard(worldX,worldY);
    else if(kind==='material') o=newMaterial(worldX,worldY,'text','새 자료','');
    else if(kind==='image') o=newImage(worldX,worldY,'');
    else if(kind==='file') o=newFile(worldX,worldY,'새 파일','');
    else if(kind==='group') o=newGroup(worldX,worldY);
    else return;
    App.project.desk.objects[o.id]=o;
    this.renderAll(); App.select(o.id); App.markDirty();
    return o;
  },

  duplicate(id){
    const o=App.getObj(id); if(!o) return;
    HistoryManager.snapshot();
    const copy=JSON.parse(JSON.stringify(o));
    copy.id=uid('obj'); copy.x+=24; copy.y+=24; copy.z=App.nextZ();
    App.project.desk.objects[copy.id]=copy;
    this.renderAll(); App.select(copy.id); App.markDirty();
  },
  bringFront(id){ const o=App.getObj(id); if(!o)return; HistoryManager.snapshot(); o.z=App.nextZ(); this.renderAll(); App.markDirty(); },
  sendBack(id){ const o=App.getObj(id); if(!o)return; HistoryManager.snapshot(); o.z=0.1; this.renderAll(); App.markDirty(); },

  deleteObj(id){
    const o=App.getObj(id); if(!o) return;
    HistoryManager.snapshot();
    delete App.project.desk.objects[id];
    App.project.desk.connections = App.project.desk.connections.filter(c=>c.from!==id && c.to!==id);
    App.project.trash.push({obj:o, deletedAt:Date.now()});
    if(App.selectedId===id) App.select(null);
    this.renderAll(); App.markDirty();
    toast('휴지통으로 이동했습니다');
  },

  deleteSelected(){ if(App.selectedId) this.deleteObj(App.selectedId); }
};

/* ---------------------------------------------------------- ConnectionManager */
const ConnectionManager = {
  startFrom(id,e){
    CanvasManager.connecting=true; CanvasManager.connectFromId=id;
    CanvasManager.el.classList.add('connecting');
    const move=(ev)=>this.updateTempLine(ev);
    const up=(ev)=>{
      window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up);
      const target=document.elementFromPoint(ev.clientX,ev.clientY);
      const objEl=target && target.closest('.desk-object');
      CanvasManager.connecting=false; CanvasManager.el.classList.remove('connecting');
      this.clearTemp();
      if(objEl && objEl.dataset.id!==id){
        this.connect(id, objEl.dataset.id);
      }
    };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  },
  updateTempLine(e){
    this.clearTemp();
    const from=App.getObj(CanvasManager.connectFromId); if(!from) return;
    const p1={x:from.x+from.w/2,y:from.y+from.h/2};
    const p2=CanvasManager.toWorld(e.clientX,e.clientY);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','temp');
    path.setAttribute('d', this.curve(p1,p2));
    path.id='temp-conn-line';
    CanvasManager.svg.appendChild(path);
  },
  clearTemp(){ const e=document.getElementById('temp-conn-line'); if(e) e.remove(); },
  connect(fromId,toId,type){
    if(App.project.desk.connections.some(c=>(c.from===fromId&&c.to===toId)||(c.from===toId&&c.to===fromId))){
      toast('이미 연결되어 있습니다'); return;
    }
    HistoryManager.snapshot();
    App.project.desk.connections.push({id:uid('conn'),from:fromId,to:toId,type:type||'link'});
    this.renderAll(); App.markDirty();
    toast('연결했습니다');
  },
  disconnectAllFor(id){
    HistoryManager.snapshot();
    App.project.desk.connections = App.project.desk.connections.filter(c=>c.from!==id && c.to!==id);
    this.renderAll(); App.markDirty();
  },
  disconnect(connId){
    HistoryManager.snapshot();
    App.project.desk.connections = App.project.desk.connections.filter(c=>c.id!==connId);
    this.renderAll(); App.markDirty();
  },
  curve(p1,p2){
    const dx=(p2.x-p1.x)/2;
    return `M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
  },
  renderAll(){
    const svg=CanvasManager.svg;
    svg.querySelectorAll('path:not(.temp)').forEach(p=>p.remove());
    (App.project?.desk?.connections||[]).forEach(c=>{
      const a=App.getObj(c.from), b=App.getObj(c.to); if(!a||!b) return;
      const p1={x:a.x+a.w/2,y:a.y+a.h/2}, p2={x:b.x+b.w/2,y:b.y+b.h/2};
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',this.curve(p1,p2));
      path.dataset.id=c.id;
      svg.appendChild(path);
    });
  }
};

/* ---------------------------------------------------------- DocumentManager (원고 편집기) */
const DocumentManager = {
  openId:null,
  open(id){
    const o=App.getObj(id); if(!o||o.type!=='manuscript') return;
    this.openId=id;
    App.select(id);
    this.render();
    UI.showWriteToolbar(true);
  },
  close(){
    this.openId=null;
    document.getElementById('ms-overlay-root').innerHTML='';
    UI.showWriteToolbar(false);
    DeskManager.renderAll();
  },
  cur(){ return App.getObj(this.openId); },

  render(){
    const o=this.cur(); if(!o) return;
    const root=document.getElementById('ms-overlay-root');
    root.innerHTML='';
    const overlay=document.createElement('div'); overlay.id='ms-overlay';
    const win=document.createElement('div'); win.id='ms-window';

    const top=document.createElement('div'); top.id='ms-topbar';
    const back=document.createElement('button'); back.className='back-btn'; back.textContent='← 데스크로';
    back.onclick=()=>this.close();
    const titleInp=document.createElement('input'); titleInp.id='ms-title-input'; titleInp.value=o.title;
    titleInp.addEventListener('input',()=>{ o.title=titleInp.value; App.markDirty(); });
    const meta=document.createElement('span'); meta.className='ms-meta'; meta.textContent=`${o.pageSettings.size} · ${o.pages.length}쪽`;
    const actions=document.createElement('div'); actions.className='ms-actions';
    const settingsBtn=document.createElement('button'); settingsBtn.textContent='페이지 설정'; settingsBtn.onclick=()=>UI.openPageSettingsModal(o,()=>this.render());
    actions.appendChild(settingsBtn);
    top.append(back,titleInp,meta,actions);

    const scroll=document.createElement('div'); scroll.id='ms-pages-scroll';
    o.pages.forEach((pg,idx)=> scroll.appendChild(this.buildPage(o,pg,idx)) );
    const addBtn=document.createElement('button'); addBtn.className='add-page-btn'; addBtn.textContent='+ 새 페이지';
    addBtn.onclick=()=>{ HistoryManager.snapshot(); o.pages.push({id:uid('pg'),html:''}); App.markDirty(); this.render(); };
    scroll.appendChild(addBtn);

    win.append(top,scroll);
    overlay.appendChild(win);
    overlay.addEventListener('mousedown',e=>{ if(e.target===overlay) this.close(); });
    root.appendChild(overlay);
    TextEditor.bindToolbar();
  },

  buildPage(o,pg,idx){
    const [mw,mh]=PAGE_SIZES_MM[o.pageSettings.size]||PAGE_SIZES_MM.A4;
    const ps=o.pageSettings;
    const page=document.createElement('div'); page.className='page bg-'+ (ps.bg==='white'?'white':ps.bg) + ' shadow-'+ps.shadow;
    page.style.width=mw+'mm'; page.style.height=mh+'mm';
    page.style.padding=`${ps.marginTop}mm ${ps.marginRight}mm ${ps.marginBottom}mm ${ps.marginLeft}mm`;
    const content=document.createElement('div'); content.className='page-content'; content.contentEditable='true';
    content.style.fontFamily = ps.font==='Pretendard' ? 'var(--font-ui)':'var(--font-serif)';
    content.dataset.pageId=pg.id;
    content.innerHTML=pg.html;
    content.addEventListener('focus',()=>{ TextEditor.activePageEl=content; });
    content.addEventListener('input',()=>{ pg.html=content.innerHTML; App.markDirty(); });
    page.appendChild(content);
    const num=document.createElement('div'); num.className='page-num'; num.textContent=(idx+1)+' / '+o.pages.length;
    page.appendChild(num);
    return page;
  },

  addPageIfNeeded(){},
  currentManuscriptObj(){ return this.cur(); }
};

/* ---------------------------------------------------------- TextEditor (서식 명령) */
const TextEditor = {
  activePageEl:null,
  exec(cmd,val){
    if(this.activePageEl) this.activePageEl.focus();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand(cmd,false,val);
    const o=DocumentManager.cur();
    if(this.activePageEl && o){
      const pg=o.pages.find(p=>p.id===this.activePageEl.dataset.pageId);
      if(pg){ pg.html=this.activePageEl.innerHTML; App.markDirty(); }
    }
  },
  insertHTML(html){
    if(this.activePageEl) this.activePageEl.focus();
    document.execCommand('insertHTML',false,html);
    const o=DocumentManager.cur();
    if(this.activePageEl && o){
      const pg=o.pages.find(p=>p.id===this.activePageEl.dataset.pageId);
      if(pg){ pg.html=this.activePageEl.innerHTML; App.markDirty(); }
    }
  },
  bindToolbar(){
    const bar=document.getElementById('write-toolbar');
    bar.querySelectorAll('[data-cmd]').forEach(btn=>{
      btn.onclick=()=>{
        const cmd=btn.dataset.cmd, val=btn.dataset.val;
        this.exec(cmd,val);
      };
    });
  }
};

/* ---------------------------------------------------------- ShortcutManager */
const ShortcutManager = {
  init(){
    window.addEventListener('keydown', e=>{
      const meta=e.metaKey||e.ctrlKey;
      const inEditable = document.activeElement && (document.activeElement.isContentEditable || ['INPUT','TEXTAREA'].includes(document.activeElement.tagName));
      if(meta && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); HistoryManager.undo(); return; }
      if(meta && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); HistoryManager.redo(); return; }
      if(meta && e.key.toLowerCase()==='s'){ e.preventDefault(); StorageManager.save(); toast('저장했습니다'); return; }
      if(meta && e.key.toLowerCase()==='d' && App.selectedId && !inEditable){ e.preventDefault(); DeskManager.duplicate(App.selectedId); return; }
      if(meta && e.key==='\\'){ e.preventDefault(); UI.toggleLeftSidebar(); return; }
      if(meta && e.shiftKey && e.key.toLowerCase()==='m'){ e.preventDefault(); UI.toggleMaterialPanel(); return; }
      if(e.key==='Escape'){
        if(DocumentManager.openId) DocumentManager.close();
        else if(!document.getElementById('modal-root').classList.contains('hidden')) UI.closeModal();
        App.select(null);
        return;
      }
      if((e.key==='Delete'||e.key==='Backspace') && App.selectedId && !inEditable){ e.preventDefault(); DeskManager.deleteSelected(); return; }
      if(meta && e.key.toLowerCase()==='b' && inEditable && DocumentManager.openId){ e.preventDefault(); TextEditor.exec('bold'); }
      if(meta && e.key.toLowerCase()==='i' && inEditable && DocumentManager.openId){ e.preventDefault(); TextEditor.exec('italic'); }
      if(meta && e.key.toLowerCase()==='u' && inEditable && DocumentManager.openId){ e.preventDefault(); TextEditor.exec('underline'); }
    });
  }
};

    const fly=document.createElement('div'); fly.className='menu-dropdown cm-flyout';
    buildFlyout(fly);
    d.appendChild(fly);
    return d;
  },

  openDeskMenu(x,y){
    this.el.innerHTML=''; this.worldPos=CanvasManager.toWorld(x,y);
    this.el.appendChild(this.sub('새로 만들기',(fly)=>{
      [['manuscript','원고'],['memo','메모'],['postit','포스트잇'],['note','노트'],['card','카드'],['material','자료'],['group','그룹'],['image','기타(이미지)']].forEach(([k,label])=>{
        fly.appendChild(this.item(label, ()=>DeskManager.createAt(k,this.worldPos.x,this.worldPos.y)));
      });
    }));
    this.el.appendChild(this.item('붙여넣기', ()=>toast('클립보드에 붙여넣을 항목이 없습니다')));
    this.el.appendChild(this.sep());
    this.el.appendChild(this.item('전체 보기(화면 맞춤)', ()=>CanvasManager.resetView()));
    this.el.appendChild(this.item('격자 스냅 켜져 있음', null, {disabled:true}));
    this.place(x,y);
  },

  openObjectMenu(x,y,o){
    this.el.innerHTML='';
    if(o.type==='manuscript'){
      this.el.appendChild(this.item('열기', ()=>DocumentManager.open(o.id)));
      this.el.appendChild(this.item('새 페이지', ()=>{ HistoryManager.snapshot(); o.pages.push({id:uid('pg'),html:''}); App.markDirty(); if(DocumentManager.openId===o.id) DocumentManager.render(); }));
      this.el.appendChild(this.item('페이지 설정', ()=>UI.openPageSettingsModal(o,()=>DocumentManager.openId===o.id&&DocumentManager.render())));
      this.el.appendChild(this.sep());
    } else {
      this.el.appendChild(this.item('열기/편집', ()=>{}));
    }
    this.el.appendChild(this.item('연결', ()=>toast('연결 도트를 드래그해 다른 객체에 놓으세요')));
    this.el.appendChild(this.item('연결 해제', ()=>ConnectionManager.disconnectAllFor(o.id)));
    this.el.appendChild(this.item('그룹화', ()=>toast('그룹 객체 위로 옮기면 함께 정리됩니다')));
    this.el.appendChild(this.sep());
    this.el.appendChild(this.item('복제', ()=>DeskManager.duplicate(o.id), {kbd:'⌘D'}));
    this.el.appendChild(this.item('앞으로 가져오기', ()=>DeskManager.bringFront(o.id)));
    this.el.appendChild(this.item('뒤로 보내기', ()=>DeskManager.sendBack(o.id)));
    this.el.appendChild(this.sep());
    this.el.appendChild(this.item('삭제', ()=>DeskManager.deleteObj(o.id), {kbd:'Del'}));
    this.place(x,y);
  }
};

    const box=document.createElement('div'); box.className='modal-box'+(wide?' wide':'');
    const h=document.createElement('div'); h.className='modal-title'; h.textContent=title;
    box.appendChild(h);
    if(sub){ const s=document.createElement('div'); s.className='modal-sub'; s.textContent=sub; box.appendChild(s); }
    const bodyWrap=document.createElement('div'); box.appendChild(bodyWrap);
    body && body(bodyWrap);
    const act=document.createElement('div'); act.className='modal-actions';
    (actions||[{label:'닫기',primary:true}]).forEach(a=>{
      const b=document.createElement('button'); b.className='btn'+(a.primary?' primary':'');
      b.textContent=a.label;
      b.onclick=()=>{
        let close=true;
        if(a.onClick) close = a.onClick(bodyWrap) !== false;
        if(close) UI.closeModal();
      };
      act.appendChild(b);
    });
    box.appendChild(act);
    backdrop.appendChild(box);
    if(dismissible!==false){ backdrop.addEventListener('mousedown',e=>{ if(e.target===backdrop) UI.closeModal(); }); }

    const el=document.getElementById('left-sidebar');
    const show = force!==undefined? force : el.classList.contains('hidden');
    el.classList.toggle('hidden',!show);
    document.getElementById('toggle-left').textContent = show ? '‹' : '›';
    if(show) this.refreshSideLists();
  },
  buildMaterialPanel(){
    const el=document.getElementById('material-panel');
    el.innerHTML='<div class="side-title">자료</div><div id="mat-list"></div>'+
                 '<button class="side-add-btn" id="mat-add-btn">+ 자료 추가</button>'+
                 '<div class="side-title">최근 자료</div><div id="mat-recent" class="side-empty">최근 자료 없음</div>';
    el.querySelector('#mat-add-btn').onclick=()=>MaterialManager.addFromPrompt();
  },
  toggleMaterialPanel(force){
    const el=document.getElementById('material-panel');
    const show = force!==undefined? force : el.classList.contains('hidden');
    el.classList.toggle('hidden',!show);
    document.getElementById('toggle-right').textContent = show ? '›' : '‹';
    if(show) this.refreshSideLists();
  },
  refreshSideLists(){
    if(!App.project) return;
    const objs=Object.values(App.project.desk.objects);
    const docs=objs.filter(o=>o.type==='manuscript');
    const memos=objs.filter(o=>['memo','note','postit'].includes(o.type));
    const docEl=document.getElementById('side-docs'); if(docEl){
      docEl.innerHTML='';
      if(!docs.length) docEl.innerHTML='<div class="side-empty">아직 원고가 없습니다</div>';
      docs.forEach(o=>{ const r=document.createElement('div'); r.className='side-row'; r.innerHTML=`<span class="ico">▤</span><span>${o.title}</span>`; r.onclick=()=>{CanvasManager.centerOn(o.id);}; r.ondblclick=()=>DocumentManager.open(o.id); docEl.appendChild(r); });
    }
    const memoEl=document.getElementById('side-memos'); if(memoEl){
      memoEl.innerHTML='';
      if(!memos.length) memoEl.innerHTML='<div class="side-empty">아직 메모가 없습니다</div>';
      memos.forEach(o=>{ const r=document.createElement('div'); r.className='side-row'; r.innerHTML=`<span class="ico">✎</span><span>${DeskManager.plain(o.content).slice(0,18)||'(빈 메모)'}</span>`; r.onclick=()=>CanvasManager.centerOn(o.id); memoEl.appendChild(r); });
    }
    const matMiniEl=document.getElementById('side-materials-mini'); if(matMiniEl){
      const mats=App.project.materials||[];
      matMiniEl.innerHTML='';
      if(!mats.length) matMiniEl.innerHTML='<div class="side-empty">아직 자료가 없습니다</div>';
      mats.forEach(m=>{ const r=document.createElement('div'); r.className='side-row'; r.innerHTML=`<span class="ico">🗂</span><span>${m.name}</span>`; matMiniEl.appendChild(r); });
    }
    const projEl=document.getElementById('side-project'); if(projEl){
      projEl.innerHTML=`<div class="side-row"><span class="ico">◆</span><span>${App.project.name}</span></div>`;
    }
    const matListEl=document.getElementById('mat-list'); if(matListEl){
      const mats=App.project.materials||[];
      matListEl.innerHTML='';
      if(!mats.length) matListEl.innerHTML='<div class="side-empty">자료가 없습니다. 아래 버튼으로 추가하세요.</div>';
      mats.forEach(m=>{
        const r=document.createElement('div'); r.className='side-row'; r.style.cursor='grab';
        r.innerHTML=`<span class="ico">${m.kind==='image'?'🖼':m.kind==='web'?'🔗':m.kind==='pdf'?'📄':'📝'}</span><span>${m.name}</span>`;
        r.title='클릭하면 데스크에 추가됩니다';
        r.onclick=()=>MaterialManager.addToDesk(m.id);
        matListEl.appendChild(r);
      });
    }
  },

  /* ---------- write toolbar ---------- */
  buildWriteToolbarShell(){
    const bar=document.getElementById('write-toolbar');
    bar.innerHTML=`
      <div class="tb-group">
        <button class="tb-btn" data-cmd="undo" title="실행 취소">↶</button>
        <button class="tb-btn" data-cmd="redo" title="다시 실행">↷</button>
      </div>
      <div class="tb-group">
        <select class="tb-select" id="tb-font">
          <option value="RIDIBatang">RIDIBatang</option>
          <option value="Pretendard">Pretendard</option>
        </select>
        <select class="tb-select" id="tb-size">
          <option value="2">작게</option>
          <option value="3" selected>보통</option>
          <option value="5">크게</option>
          <option value="7">특대</option>
        </select>
      </div>
      <div class="tb-group">
        <button class="tb-btn" data-cmd="bold"><b>B</b></button>
        <button class="tb-btn" data-cmd="italic"><i>I</i></button>
        <button class="tb-btn" data-cmd="underline"><u>U</u></button>
        <button class="tb-btn" data-cmd="strikeThrough"><s>S</s></button>
        <input type="color" class="tb-color" id="tb-color" title="글자색" value="#241f18">
      </div>
      <div class="tb-group">
        <button class="tb-btn" data-cmd="justifyLeft" title="왼쪽 정렬">≡</button>
        <button class="tb-btn" data-cmd="justifyCenter" title="가운데 정렬">≣</button>
        <button class="tb-btn" data-cmd="justifyRight" title="오른쪽 정렬">≡</button>
        <button class="tb-btn" data-cmd="indent" title="들여쓰기">⇥</button>
        <button class="tb-btn" data-cmd="outdent" title="내어쓰기">⇤</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" data-cmd="formatBlock" data-val="H2" title="제목">제목</button>
        <button class="tb-btn" data-cmd="formatBlock" data-val="H3" title="소제목">소제목</button>
        <button class="tb-btn" data-cmd="formatBlock" data-val="P" title="본문">본문</button>
        <button class="tb-btn" data-cmd="formatBlock" data-val="BLOCKQUOTE" title="인용">인용</button>
        <button class="tb-btn" data-cmd="insertUnorderedList" title="목록">•list</button>
        <button class="tb-btn" id="tb-checklist" title="체크리스트">☑</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="tb-image" title="이미지 삽입">🖼</button>
        <button class="tb-btn" id="tb-link" title="링크 삽입">🔗</button>
        <button class="tb-btn" id="tb-table" title="표 삽입">▦</button>
        <button class="tb-btn" id="tb-hr" title="구분선">―</button>
        <button class="tb-btn" id="tb-comment" title="주석">💬</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="tb-conn-material" title="자료 연결">자료↔</button>
        <button class="tb-btn" id="tb-conn-memo" title="메모 연결">메모↔</button>
        <button class="tb-btn" id="tb-conn-quote" title="인용 연결">인용↔</button>
        <button class="tb-btn" id="tb-conn-off" title="연결 해제">해제</button>
      </div>
    `;
    bar.querySelector('[data-cmd="undo"]').onclick=()=>HistoryManager.undo();
    bar.querySelector('[data-cmd="redo"]').onclick=()=>HistoryManager.redo();
    bar.querySelector('#tb-font').onchange=(e)=>TextEditor.exec('fontName', e.target.value==='Pretendard'?'Pretendard':'RIDIBatang, Georgia, serif');
    bar.querySelector('#tb-size').onchange=(e)=>TextEditor.exec('fontSize', e.target.value);
    bar.querySelector('#tb-color').oninput=(e)=>TextEditor.exec('foreColor', e.target.value);
    bar.querySelector('#tb-checklist').onclick=()=>TextEditor.insertHTML('<div class="checklist-item"><input type="checkbox"><span contenteditable="true">할 일</span></div>');
    bar.querySelector('#tb-image').onclick=()=>{
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>TextEditor.insertHTML(`<img src="${r.result}" style="max-width:100%;">`); r.readAsDataURL(f); };
      inp.click();
    };
    bar.querySelector('#tb-link').onclick=()=>UI.promptInsertLink();
    bar.querySelector('#tb-table').onclick=()=>TextEditor.insertHTML('<table><tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></table>');
    bar.querySelector('#tb-hr').onclick=()=>TextEditor.insertHTML('<hr>');
    bar.querySelector('#tb-comment').onclick=()=>{
      const note=prompt('주석 내용을 입력하세요'); if(!note) return;
      TextEditor.insertHTML(`<span class="comment-mark" title="${note.replace(/"/g,'&quot;')}">선택한 부분</span>`);
    };
    bar.querySelector('#tb-conn-material').onclick=()=>UI.openConnectPicker('material');
    bar.querySelector('#tb-conn-memo').onclick=()=>UI.openConnectPicker('memo');
    bar.querySelector('#tb-conn-quote').onclick=()=>UI.openConnectPicker('quote');
    bar.querySelector('#tb-conn-off').onclick=()=>UI.openDisconnectPicker();
  },
  showWriteToolbar(show){ document.getElementById('write-toolbar').classList.toggle('hidden',!show); },

  openConnectPicker(kind){
    const o=DocumentManager.cur(); if(!o) return;
    let candidates;
    if(kind==='material') candidates=Object.values(App.project.desk.objects).filter(x=>x.type==='material');
    else if(kind==='memo') candidates=Object.values(App.project.desk.objects).filter(x=>['memo','note','postit'].includes(x.type));
    else candidates=Object.values(App.project.desk.objects).filter(x=>x.type==='card');
    this.openModal({
      title: kind==='material'?'자료 연결':kind==='memo'?'메모 연결':'인용 연결',
      sub:'연결할 항목을 선택하세요',
      body:(box)=>{
        if(!candidates.length){ box.innerHTML='<div class="side-empty">연결할 수 있는 항목이 데스크에 없습니다. 먼저 만들어보세요.</div>'; return; }
        candidates.forEach(c=>{
          const row=document.createElement('div'); row.className='pick-row';
          row.innerHTML=`<span>${DeskManager.labelFor(c)} · ${c.title||c.name||DeskManager.plain(c.content).slice(0,16)||'제목 없음'}</span><button>연결</button>`;
          row.querySelector('button').onclick=()=>{ ConnectionManager.connect(o.id,c.id,kind); UI.closeModal(); };
          box.appendChild(row);
        });
      },
      actions:[{label:'닫기'}]
    });
  },
  openDisconnectPicker(){
    const o=DocumentManager.cur(); if(!o) return;
    const conns=App.project.desk.connections.filter(c=>c.from===o.id||c.to===o.id);
    this.openModal({
      title:'연결 해제', sub:'',
      body:(box)=>{
        if(!conns.length){ box.innerHTML='<div class="side-empty">연결된 항목이 없습니다</div>'; return; }
        conns.forEach(c=>{
          const other=App.getObj(c.from===o.id?c.to:c.from); if(!other) return;
          const row=document.createElement('div'); row.className='pick-row';
          row.innerHTML=`<span>${DeskManager.labelFor(other)} · ${other.title||other.name||'제목 없음'}</span><button>해제</button>`;
          row.querySelector('button').onclick=()=>{ ConnectionManager.disconnect(c.id); UI.closeModal(); UI.openDisconnectPicker(); };
          box.appendChild(row);
        });
      },
      actions:[{label:'닫기'}]
    });
  }
};

/* ---------------------------------------------------------- boot */
window.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
</body>
</html>
