<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>WEST150 · Editorial Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;
  --panel:#121214;
  --panel-2:#18181c;
  --line:#2c2c32;
  --line-soft:#232328;
  --text:#f2f2f4;
  --sub:#8e8e98;
  --muted:#6a6a74;
  --accent:#b91522;
  --accent-2:#e02332;
  --accent-soft:rgba(185,21,34,.18);
  --ok:#1b7a3d; --ok-bg:rgba(27,122,61,.14); --ok-fg:#7dcea0;
  --warn:#c45f00; --warn-bg:rgba(196,95,0,.14); --warn-fg:#ffb74d;
  --bad:#b71c1c; --bad-bg:rgba(183,28,28,.16); --bad-fg:#ef9a9a;
  --unk:#546e7a; --unk-bg:rgba(84,110,122,.18); --unk-fg:#b0bec5;
  --paper:#f3efe6; --paper-2:#ebe6db; --ink:#14131a; --ink-soft:#3d3a34;
  --rule:rgba(20,19,26,.12);
  --shadow:0 40px 100px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:Inter,"Noto Sans KR",system-ui,sans-serif;}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
::selection{background:var(--accent);color:#fff}
#app{display:flex;flex-direction:column;height:100vh;min-height:0}

/* ——— TOPBAR ——— */
#topbar{
  flex:none;display:flex;align-items:center;gap:16px;
  padding:0 18px;height:56px;
  background:linear-gradient(180deg,#121214 0%,#0e0e10 100%);
  border-bottom:1px solid var(--line);z-index:40;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .dot{
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft),0 0 16px rgba(185,21,34,.45);
}
.brand .name{font-weight:800;font-size:13px;letter-spacing:.08em}
.brand .name small{
  display:block;margin-top:2px;font-size:9px;font-weight:700;
  letter-spacing:.18em;color:var(--muted);
}
.modeSwitch{
  display:flex;gap:2px;padding:3px;border-radius:10px;
  background:#0a0a0c;border:1px solid var(--line);
}
.modeBtn{
  padding:8px 14px;border-radius:8px;background:transparent;
  color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.02em;
  transition:.15s;
}
.modeBtn:hover{color:var(--text)}
.modeBtn.active{
  background:var(--accent);color:#fff;
  box-shadow:0 6px 18px rgba(185,21,34,.28);
}
.actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.btn{
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  transition:.15s;
}
.btn:hover{background:#222228;border-color:#3a3a42}
.btn.ghost{background:transparent;color:var(--sub)}
.btn.ghost:hover{color:var(--text);border-color:#444}
.btn.primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 6px 16px rgba(185,21,34,.25);
}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 10px;font-size:11px}
.btn.full{width:100%}
.btn.danger{background:#2a1214;border-color:#4a2024;color:#ff9aa6}
.btn.danger:hover{background:#3a181c}

#body{flex:1;display:flex;min-height:0}

/* ——— LEFT ——— */
#left{
  width:240px;flex:none;background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#left .hd{
  padding:16px 16px 10px;font-size:10px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
#list{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.item{
  position:relative;border:1px solid var(--line-soft);border-radius:11px;
  padding:12px 12px 11px;cursor:pointer;background:#0e0e11;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.item:hover{border-color:#3a3a44}
.item.active{
  border-color:rgba(185,21,34,.55);
  box-shadow:0 0 0 2px var(--accent-soft), inset 3px 0 0 var(--accent);
  background:linear-gradient(90deg,rgba(185,21,34,.06),transparent 40%);
}
.item .t{
  font-size:13px;font-weight:700;line-height:1.4;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.item .m{
  margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:10px;color:var(--muted);font-weight:600;
}
.pill{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;
  font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
.pill.live{background:var(--accent-soft);color:#ff8a96}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill.unk{background:var(--unk-bg);color:var(--unk-fg)}
#addBtn{
  margin:0 12px 14px;padding:11px;border-radius:10px;width:calc(100% - 24px);
  background:transparent;color:var(--sub);font-size:12px;font-weight:700;
  border:1px dashed #35353c;
}
#addBtn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}

/* ——— STAGE ——— */
#stage{
  flex:1;min-width:0;overflow:auto;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, #2a1216 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, #121018 0%, var(--bg) 50%);
  padding:36px 28px 48px;
  display:flex;justify-content:center;align-items:flex-start;
}

/* ——— PAPER PAGE ——— */
.page{
  width:min(100%,680px);
  background:
    linear-gradient(180deg, #f6f2ea 0%, var(--paper) 12%, var(--paper) 100%);
  color:var(--ink);
  border-radius:2px;
  box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);
  padding:44px 48px 52px;
  position:relative;
}
.page:before{
  content:"";position:absolute;inset:12px;
  border:1px solid rgba(20,19,26,.1);pointer-events:none;z-index:1;
}
.page:after{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--accent), #6b0c14 60%, transparent);
}
.page .mast{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;padding-bottom:14px;
  border-bottom:1px solid var(--rule);
  position:relative;z-index:2;
}
.page .mast-left{
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);
}
.page .mast-right{
  font-size:10px;font-weight:600;letter-spacing:.08em;color:#8a8680;text-transform:uppercase;
}
.page .kicker{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px;position:relative;z-index:2;
}
.page .headline{
  font-family:"Playfair Display","Noto Serif KR",Georgia,serif;
  font-size:clamp(26px, 4vw, 34px);font-weight:700;
  line-height:1.18;letter-spacing:-.025em;
  margin:0 0 14px;word-break:keep-all;position:relative;z-index:2;
}
.page .deck{
  font-size:15px;line-height:1.65;color:var(--ink-soft);
  margin:0 0 8px;word-break:keep-all;max-width:36em;position:relative;z-index:2;
}
.page .meta-row{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  margin:20px 0 28px;padding:12px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:11px;font-weight:600;letter-spacing:.04em;color:#6e6a62;
  position:relative;z-index:2;
}
.page .meta-row strong{color:var(--ink);font-weight:800}

/* Timeline */
.tl{position:relative;padding-left:0;z-index:2}
.tl-item{
  display:grid;grid-template-columns:72px 16px 1fr;gap:0 12px;
  margin-bottom:0;position:relative;
}
.tl-item:last-child .tl-rail:after{display:none}
.tl-time{
  font-size:11px;font-weight:800;letter-spacing:.04em;
  color:var(--accent);padding-top:14px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.tl-rail{
  position:relative;display:flex;justify-content:center;padding-top:16px;
}
.tl-rail:before{
  content:"";width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent);
  box-shadow:0 0 0 4px rgba(185,21,34,.12);
  position:relative;z-index:2;
}
.tl-item.tl-first .tl-rail:before{
  width:13px;height:13px;background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(185,21,34,.2);
}
.tl-rail:after{
  content:"";position:absolute;top:28px;bottom:-2px;width:2px;
  background:linear-gradient(180deg, rgba(185,21,34,.35), rgba(20,19,26,.1));
  left:50%;transform:translateX(-50%);
}
.tl-body{
  margin-bottom:14px;padding:12px 14px 13px;
  background:rgba(20,19,26,.03);
  border:1px solid rgba(20,19,26,.07);
  border-radius:10px;
}
.tl-item.tl-first .tl-body{
  border-color:rgba(185,21,34,.22);
  background:linear-gradient(135deg, rgba(185,21,34,.06), rgba(20,19,26,.02));
}
.tl-text{font-size:14px;line-height:1.6;word-break:keep-all;color:var(--ink)}
.page .empty{
  text-align:center;padding:40px 16px;color:#9a958c;font-size:13px;font-weight:500;
}

/* Citation card */
.citeCard .stamp{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:6px;margin-bottom:18px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border:1.5px solid currentColor;position:relative;z-index:2;
}
.citeCard .stamp.ok{color:var(--ok);background:var(--ok-bg)}
.citeCard .stamp.warn{color:var(--warn);background:var(--warn-bg)}
.citeCard .stamp.bad{color:var(--bad);background:var(--bad-bg)}
.citeCard .stamp.unk{color:var(--unk);background:var(--unk-bg)}
.citeCard .quote{
  font-family:"Playfair Display","Noto Serif KR",Georgia,serif;
  font-size:clamp(20px, 3.2vw, 26px);font-weight:600;
  line-height:1.4;letter-spacing:-.015em;
  margin:0 0 22px;word-break:keep-all;position:relative;z-index:2;
  padding-left:18px;border-left:3px solid var(--accent);
}
.citeCard .byline{
  display:flex;flex-direction:column;gap:3px;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid var(--rule);position:relative;z-index:2;
}
.citeCard .who{font-size:14px;font-weight:800;letter-spacing:.01em}
.citeCard .role{font-size:12px;color:#6e6a62;font-weight:600}
.citeCard .src-block{
  font-size:12px;line-height:1.5;color:#5c5952;margin-bottom:18px;position:relative;z-index:2;
}
.citeCard .src-block a{color:var(--accent);text-decoration:none;font-weight:600}
.citeCard .notes-label{
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#8a8680;margin-bottom:6px;position:relative;z-index:2;
}
.citeCard .notes{
  font-size:13.5px;line-height:1.65;color:var(--ink-soft);
  white-space:pre-wrap;word-break:keep-all;position:relative;z-index:2;
}
.citeCard .tags{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:2}
.citeCard .tag{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:rgba(20,19,26,.06);color:#4a4740;letter-spacing:.02em;
}

/* ——— RIGHT ——— */
#right{
  width:310px;flex:none;background:var(--panel);
  border-left:1px solid var(--line);overflow-y:auto;padding:18px 16px 28px;min-height:0;
}
#rightTitle{
  margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
}
#rightHint{font-size:11px;color:var(--sub);line-height:1.5;margin:0 0 16px}
.sec{
  margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);
}
.sec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.field{margin-bottom:11px}
.field label{
  display:block;font-size:10px;color:var(--muted);margin-bottom:5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.field input,.field textarea,.field select{
  width:100%;background:#0a0a0c;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:13px;outline:0;transition:border-color .15s;
}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:#555;background:#0e0e12;
}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row > *{flex:1;min-width:0}
.updList{display:flex;flex-direction:column;gap:8px}
.updItem{
  background:#0a0a0c;border:1px solid var(--line);border-radius:10px;padding:10px;
}
.updItem .field{margin-bottom:8px}
.updItem .field:last-of-type{margin-bottom:0}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#1c1c22;border:1px solid #3a3a44;padding:11px 18px;border-radius:10px;
  font-size:12px;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;z-index:100;
  box-shadow:0 12px 40px #0008;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:980px){
  #body{flex-direction:column}
  #left{width:100%;max-height:26vh;border-right:0;border-bottom:1px solid var(--line)}
  #right{width:100%;max-height:42vh;border-left:0;border-top:1px solid var(--line)}
  #list{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .item{min-width:200px;flex:none}
  .page{padding:32px 24px 36px}
  #stage{padding:20px 14px 32px}
}
@media(max-width:600px){
  #topbar{flex-wrap:wrap;height:auto;padding:10px 12px;gap:10px}
  .actions{width:100%;margin-left:0}
  .tl-item{grid-template-columns:56px 14px 1fr}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div class="name">WEST150 DAILY<small>EDITORIAL DESK</small></div>
    </div>
    <div class="modeSwitch">
      <button type="button" class="modeBtn active" data-mode="event">사건 페이지</button>
      <button type="button" class="modeBtn" data-mode="cite">인용 검증</button>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnExport">내보내기</button>
      <button type="button" class="btn ghost" id="btnSave">이 기기 저장</button>
      <button type="button" class="btn primary" id="btnNew">＋ 새로 만들기</button>
    </div>
  </header>

  <div id="body">
    <aside id="left">
      <div class="hd" id="leftHd">사건 목록</div>
      <div id="list"></div>
      <button type="button" id="addBtn">＋ 항목 추가</button>
    </aside>
    <main id="stage"><article class="page" id="preview"></article></main>
    <aside id="right">
      <h2 id="rightTitle">편집</h2>
      <p id="rightHint">왼쪽에서 항목을 고르거나 새로 만드세요.</p>
      <div id="form"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='west150_editorial_desk_v1';
const $=id=>document.getElementById(id);
const VERDICTS=[
  {id:'fact',label:'사실',cls:'ok'},
  {id:'partial',label:'부분',cls:'warn'},
  {id:'false',label:'거짓',cls:'bad'},
  {id:'unverified',label:'미확인',cls:'unk'}
];
function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nowISO(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._tm);toast._tm=setTimeout(()=>t.classList.remove('show'),1800);
}
function blankEvent(){
  return{id:uid(),title:'새 사건 제목',summary:'한 줄 요약 또는 리드를 입력하세요.',status:'live',updatedAt:nowISO(),
    updates:[{id:uid(),time:nowISO().slice(11),text:'첫 업데이트를 입력하세요.'}]};
}
function blankCite(){
  return{id:uid(),quote:'인용할 발언을 입력하세요.',speaker:'발언자',role:'',source:'출처 · 날짜',url:'',
    verdict:'unverified',notes:'판정 근거·맥락을 적어두세요.',tags:'',createdAt:nowISO()};
}
let state={mode:'event',events:[blankEvent()],cites:[blankCite()],eventIdx:0,citeIdx:0};
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);
    if(d.events?.length)state.events=d.events;if(d.cites?.length)state.cites=d.cites;
    if(d.mode)state.mode=d.mode;
    state.eventIdx=Math.min(d.eventIdx||0,state.events.length-1);
    state.citeIdx=Math.min(d.citeIdx||0,state.cites.length-1);
  }catch(e){}
}
function save(){
  localStorage.setItem(KEY,JSON.stringify({mode:state.mode,events:state.events,cites:state.cites,eventIdx:state.eventIdx,citeIdx:state.citeIdx}));
  toast('이 기기에 저장했습니다');
}
function currentList(){return state.mode==='event'?state.events:state.cites}
function currentIdx(){return state.mode==='event'?state.eventIdx:state.citeIdx}
function setIdx(i){if(state.mode==='event')state.eventIdx=i;else state.citeIdx=i}
function current(){const list=currentList();return list[currentIdx()]||list[0]}
function verdictMeta(id){return VERDICTS.find(v=>v.id===id)||VERDICTS[3]}

function renderList(){
  const list=currentList(),idx=currentIdx();
  $('leftHd').textContent=state.mode==='event'?'사건 목록':'인용 목록';
  $('list').innerHTML=list.map((it,i)=>{
    if(state.mode==='event'){
      const n=(it.updates||[]).length;
      return `<div class="item ${i===idx?'active':''}" data-i="${i}">
        <div class="t">${escapeHtml(it.title||'제목 없음')}</div>
        <div class="m"><span class="pill live">${escapeHtml((it.status||'live').toUpperCase())}</span><span>UPDATE ${n}</span></div>
      </div>`;
    }
    const v=verdictMeta(it.verdict);
    return `<div class="item ${i===idx?'active':''}" data-i="${i}">
      <div class="t">${escapeHtml((it.quote||'').slice(0,52))}${(it.quote||'').length>52?'…':''}</div>
      <div class="m"><span class="pill ${v.cls}">${v.label}</span><span>${escapeHtml(it.speaker||'')}</span></div>
    </div>`;
  }).join('');
  $('list').querySelectorAll('.item').forEach(el=>{el.onclick=()=>{setIdx(+el.dataset.i);render()}});
}

function renderPreview(){
  const it=current(),box=$('preview');
  if(!it){box.innerHTML='<div class="empty">항목이 없습니다.</div>';return}

  if(state.mode==='event'){
    const ups=it.updates||[];
    box.className='page';
    box.innerHTML=`
      <div class="mast">
        <span class="mast-left">West150 Daily</span>
        <span class="mast-right">Event Timeline</span>
      </div>
      <div class="kicker">${escapeHtml((it.status||'live').toUpperCase())} · Developing Story</div>
      <h1 class="headline">${escapeHtml(it.title)}</h1>
      <p class="deck">${escapeHtml(it.summary||'')}</p>
      <div class="meta-row">
        <span>최종 <strong>${escapeHtml(it.updatedAt||'—')}</strong></span>
        <span>업데이트 <strong>${ups.length}</strong></span>
      </div>
      <div class="tl">
        ${ups.length?ups.map((u,i)=>`
          <div class="tl-item ${i===0?'tl-first':''}">
            <div class="tl-time">${escapeHtml(u.time||'—')}</div>
            <div class="tl-rail"></div>
            <div class="tl-body"><div class="tl-text">${escapeHtml(u.text||'')}</div></div>
          </div>`).join(''):'<div class="empty">업데이트를 추가하세요.</div>'}
      </div>`;
    return;
  }

  const v=verdictMeta(it.verdict);
  const tags=(it.tags||'').split(/[,#]+/).map(t=>t.trim()).filter(Boolean);
  box.className='page citeCard';
  box.innerHTML=`
    <div class="mast">
      <span class="mast-left">West150 Daily</span>
      <span class="mast-right">Citation Note</span>
    </div>
    <div class="stamp ${v.cls}">${v.label} · Verdict</div>
    <p class="quote">${escapeHtml(it.quote)}</p>
    <div class="byline">
      <div class="who">${escapeHtml(it.speaker||'')}</div>
      ${it.role?`<div class="role">${escapeHtml(it.role)}</div>`:''}
    </div>
    <div class="src-block">
      출처 · ${escapeHtml(it.source||'—')}
      ${it.url?`<br><a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.url)}</a>`:''}
    </div>
    <div class="notes-label">Notes / Context</div>
    <div class="notes">${escapeHtml(it.notes||'')}</div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>`:''}
  `;
}

function renderForm(){
  const it=current(),form=$('form');
  if(!it){form.innerHTML='';return}
  if(state.mode==='event'){
    $('rightTitle').textContent='사건 편집';
    $('rightHint').textContent='제목·요약·시간순 업데이트를 관리합니다.';
    form.innerHTML=`
      <div class="sec">
        <div class="field"><label>제목</label><input id="f_title" value="${escapeHtml(it.title)}"></div>
        <div class="field"><label>요약 / 리드</label><textarea id="f_summary">${escapeHtml(it.summary||'')}</textarea></div>
        <div class="field"><label>상태</label>
          <select id="f_status">
            <option value="live" ${it.status==='live'?'selected':''}>LIVE</option>
            <option value="developing" ${it.status==='developing'?'selected':''}>DEVELOPING</option>
            <option value="closed" ${it.status==='closed'?'selected':''}>CLOSED</option>
          </select>
        </div>
      </div>
      <div class="sec">
        <div class="row" style="margin-bottom:10px">
          <button type="button" class="btn small primary" id="btnAddUpd">＋ 업데이트</button>
          <button type="button" class="btn small danger" id="btnDelItem">사건 삭제</button>
        </div>
        <div class="updList" id="updList"></div>
      </div>`;
    bindEventForm(it);return;
  }
  $('rightTitle').textContent='인용 편집';
  $('rightHint').textContent='발언·출처·판정·근거를 아카이브합니다.';
  form.innerHTML=`
    <div class="sec">
      <div class="field"><label>발언</label><textarea id="f_quote">${escapeHtml(it.quote||'')}</textarea></div>
      <div class="field"><label>발언자</label><input id="f_speaker" value="${escapeHtml(it.speaker||'')}"></div>
      <div class="field"><label>직함 / 소속</label><input id="f_role" value="${escapeHtml(it.role||'')}"></div>
      <div class="field"><label>출처</label><input id="f_source" value="${escapeHtml(it.source||'')}"></div>
      <div class="field"><label>링크</label><input id="f_url" value="${escapeHtml(it.url||'')}" placeholder="https://"></div>
      <div class="field"><label>판정</label>
        <select id="f_verdict">${VERDICTS.map(v=>`<option value="${v.id}" ${it.verdict===v.id?'selected':''}>${v.label}</option>`).join('')}</select>
      </div>
      <div class="field"><label>근거 · 메모</label><textarea id="f_notes">${escapeHtml(it.notes||'')}</textarea></div>
      <div class="field"><label>태그</label><input id="f_tags" value="${escapeHtml(it.tags||'')}" placeholder="경제, 대선"></div>
      <button type="button" class="btn small danger full" id="btnDelItem">항목 삭제</button>
    </div>`;
  bindCiteForm(it);
}

function bindEventForm(it){
  const map={f_title:'title',f_summary:'summary',f_status:'status'};
  Object.keys(map).forEach(id=>{
    const el=$(id);if(!el)return;
    el.oninput=el.onchange=()=>{it[map[id]]=el.value;it.updatedAt=nowISO();renderList();renderPreview()};
  });
  renderUpdList(it);
  $('btnAddUpd').onclick=()=>{
    if(!it.updates)it.updates=[];
    it.updates.push({id:uid(),time:nowISO().slice(11),text:''});
    it.updatedAt=nowISO();render();
  };
  $('btnDelItem').onclick=()=>deleteCurrent();
}
function renderUpdList(it){
  const box=$('updList');if(!box)return;
  const ups=it.updates||[];
  box.innerHTML=ups.map((u,i)=>`
    <div class="updItem" data-i="${i}">
      <div class="field"><label>시간</label><input data-k="time" value="${escapeHtml(u.time||'')}"></div>
      <div class="field"><label>내용</label><textarea data-k="text" style="min-height:56px">${escapeHtml(u.text||'')}</textarea></div>
      <div class="row">
        <button type="button" class="btn small" data-act="up">↑</button>
        <button type="button" class="btn small" data-act="down">↓</button>
        <button type="button" class="btn small danger" data-act="del">삭제</button>
      </div>
    </div>`).join('')||'<p id="rightHint">업데이트가 없습니다.</p>';
  box.querySelectorAll('.updItem').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll('[data-k]').forEach(inp=>{
      inp.oninput=()=>{it.updates[i][inp.dataset.k]=inp.value;it.updatedAt=nowISO();renderPreview();renderList()};
    });
    row.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick=()=>{
        const act=btn.dataset.act;
        if(act==='del')it.updates.splice(i,1);
        else if(act==='up'&&i>0){const t=it.updates[i];it.updates[i]=it.updates[i-1];it.updates[i-1]=t}
        else if(act==='down'&&i<it.updates.length-1){const t=it.updates[i];it.updates[i]=it.updates[i+1];it.updates[i+1]=t}
        it.updatedAt=nowISO();render();
      };
    });
  });
}
function bindCiteForm(it){
  const map={f_quote:'quote',f_speaker:'speaker',f_role:'role',f_source:'source',f_url:'url',f_verdict:'verdict',f_notes:'notes',f_tags:'tags'};
  Object.keys(map).forEach(id=>{
    const el=$(id);if(!el)return;
    el.oninput=el.onchange=()=>{it[map[id]]=el.value;renderList();renderPreview()};
  });
  $('btnDelItem').onclick=()=>deleteCurrent();
}
function deleteCurrent(){
  const list=currentList();
  if(list.length<=1){
    if(state.mode==='event')state.events=[blankEvent()];else state.cites=[blankCite()];
    setIdx(0);
  }else{list.splice(currentIdx(),1);setIdx(Math.min(currentIdx(),list.length-1))}
  render();
}
function addItem(){
  if(state.mode==='event'){state.events.unshift(blankEvent());state.eventIdx=0}
  else{state.cites.unshift(blankCite());state.citeIdx=0}
  render();
}
function setMode(mode){
  state.mode=mode;
  document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  render();
}
function exportText(){
  const it=current();if(!it)return;
  let text='';
  if(state.mode==='event'){
    text=`# ${it.title}\n${it.summary||''}\n\n`;
    (it.updates||[]).forEach(u=>{text+=`## ${u.time||'—'}\n${u.text||''}\n\n`});
  }else{
    const v=verdictMeta(it.verdict);
    text=`"${it.quote}"\n— ${it.speaker}${it.role?' · '+it.role:''}\n출처: ${it.source}\n판정: ${v.label}\n\n${it.notes||''}\n`;
  }
  navigator.clipboard?.writeText(text).then(()=>toast('클립보드에 복사했습니다')).catch(()=>prompt('복사하세요',text));
}
function render(){renderList();renderPreview();renderForm()}
document.querySelectorAll('.modeBtn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('addBtn').onclick=addItem;$('btnNew').onclick=addItem;$('btnSave').onclick=save;$('btnExport').onclick=exportText;
load();setMode(state.mode);
</script>
</body>
</html>
