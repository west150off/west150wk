.rule{height:1px;background:currentColor;opacity:.25}.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}.accent-bar{width:54px;height:4px;background:var(--accent);margin:12px 0}.title{font-size:58px;line-height:1.06;font-weight:800;letter-spacing:-.05em;white-space:pre-wrap;word-break:keep-all}.deck{margin-top:18px;font-size:20px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}.byline{margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.68}.folio{position:absolute;left:46px;right:46px;bottom:26px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;opacity:.55}

.bodyStack{display:flex;flex-direction:column;gap:12px}.block{font-size:14px;line-height:1.5}.block .blockTitle{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}.block.summary{padding:13px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:9px}.block.quote{font-family:Nanum Myeongjo,serif;font-size:22px;line-height:1.5}.block.quote .author{margin-top:7px;font-family:inherit;font-size:11px;opacity:.55}.listItem{display:flex;gap:8px;margin-bottom:6px}.listNum{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:var(--accent);color:#111;font-size:9px;font-weight:900}.timelineItem{display:flex;gap:10px}.timelineDot{width:10px;height:10px;margin-top:5px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}.timelineBody{flex:1}.timelineDate{font-size:10px;font-weight:900;color:var(--accent)}.qaItem{padding:10px 12px;border-radius:10px;background:#00000007;border:1px solid #00000010}.qaQ{font-weight:900}.qaA{margin-top:5px;opacity:.75}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compareBox{padding:10px;border-radius:8px;background:#00000007;border:1px solid #0000000c}.compareBox.ac{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}.factItem{display:flex;gap:8px;margin-bottom:6px}.factBadge{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-size:11px;font-weight:900;flex:none}.sourceList{display:flex;flex-direction:column;gap:9px}.sourceItem{display:grid;grid-template-columns:22px 1fr;gap:8px}.sourceNo{font-weight:900;font-size:14px}.sourceTitle{font-weight:800;line-height:1.35}.sourceMeta{font-size:10px;opacity:.55;margin-top:2px}.sourceUrl{font-size:9px;opacity:.45;margin-top:2px;word-break:break-all}.sourceTag{display:inline-block;font-size:9px;font-weight:900;padding:2px 6px;border-radius:999px;color:#fff;background:var(--accent);margin-bottom:3px}
.watermark{position:absolute;z-index:70;font-size:13px;font-weight:800;pointer-events:none;opacity:.7}.wm-tl{left:28px;top:28px}.wm-tr{right:28px;top:28px}.wm-bl{left:28px;bottom:28px}.wm-br{right:28px;bottom:28px}.wm-center{left:50%;top:50%;transform:translate(-50%,-50%)}.wm-custom{left:var(--wmx);top:var(--wmy);transform:translate(-50%,-50%)}

.panel{padding:15px}.panel[hidden]{display:none}.field{margin-bottom:12px}.label{font-size:10px;color:var(--sub);margin-bottom:6px;display:block;font-weight:800}.input,.select,.textarea{width:100%;background:#10131a;color:#eef1f5;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:11px}.textarea{min-height:76px;resize:vertical;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rangeRow{display:grid;grid-template-columns:1fr 42px;gap:8px;align-items:center}.range{width:100%;accent-color:var(--accent)}.rangeVal{font-size:10px;color:var(--sub);text-align:right}.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{flex:1;padding:7px 3px;background:#10131a;color:var(--sub);font-size:10px}.seg button.active{background:var(--accent);color:#111}.note{font-size:9px;color:var(--sub);line-height:1.5}

/* ===== PREMIUM EDITORIAL SKIN ===== */
.card{
  background:#f1ede4;
  box-shadow:0 0 0 1px rgba(18,16,13,.10), inset 0 0 0 1px rgba(255,255,255,.28);
}
.card::before{
  content:"";position:absolute;inset:18px;border:1px solid rgba(28,24,18,.11);
  pointer-events:none;z-index:2;
}
.card.dark{background:#11100e;color:#efe9de;box-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.02)}
.card.dark::before{border-color:rgba(255,255,255,.10)}
.card .eyebrow{font-size:11px;letter-spacing:.24em;font-weight:700;opacity:.62}
.card .accent-bar{width:38px;height:2px;margin:16px 0 18px}
.card .title{
  font-family:RIDIBatang-subset,Nanum Myeongjo,serif!important;
  font-weight:400;
  letter-spacing:-.055em;
  line-height:1.13;
}
.card .deck{font-size:16px;line-height:1.75;letter-spacing:-.018em;max-width:82%}
.card .byline{font-size:9px;letter-spacing:.15em;margin-top:18px}
.cover-layout .title{font-size:68px;line-height:1.06;font-weight:400;max-width:86%;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.cover-layout .deck{font-size:17px;line-height:1.72}
.cover-layout .contentLayer{left:54px!important;top:118px!important;width:520px!important}
.cover-layout .shade{background:
  linear-gradient(90deg,rgba(0,0,0,.74) 0%,rgba(0,0,0,.34) 52%,rgba(0,0,0,.02) 100%),
  linear-gradient(0deg,rgba(0,0,0,.18),transparent 42%)}
.feature-layout{background:#f1ede4}
.feature-layout .featureImage{left:44px;right:44px;top:42px;height:42%;border-radius:1px}
.feature-layout .contentLayer{left:46px!important;top:53%!important;width:548px!important}
.feature-layout .contentLayer::before{content:"";display:block;position:absolute;left:0;top:-22px;width:100%;height:1px;background:currentColor;opacity:.12}
.feature-layout .bodyStack{gap:14px}
.feature-layout .bodyStack::before{content:"";display:block;width:100%;height:1px;background:currentColor;opacity:.10;margin-bottom:2px}
.interview-layout{background:#e5dccd}
.interview-layout .interviewPaper{padding:55px 40px 50px 42px}
.interview-layout .interviewPaper::before{content:"";position:absolute;left:40px;right:40px;top:34px;height:1px;background:#2b261f33}
.interview-layout .interviewPaper .title{
  font-size:34px!important;line-height:1.12;margin-top:20px;
}
.interview-layout .interviewPaper .deck{font-size:15px;line-height:1.7;max-width:100%;margin-bottom:22px}
.interview-layout .quote{font-family:RIDIBatang-subset,Nanum Myeongjo,serif;font-size:26px;line-height:1.62}
.interview-layout .qmark{color:#a77948;font-size:86px}
.data-layout .dataPaper{padding:42px 46px}
.data-layout .dataTitle{
  font-family:RIDIBatang-subset,Nanum Myeongjo,serif!important;
  font-weight:400;font-size:48px;letter-spacing:-.045em
}
.data-layout .statGrid{gap:0;margin-top:28px;border-top:1px solid #1b181433;border-bottom:1px solid #1b181433}
.data-layout .stat{border:0;border-radius:0;background:transparent;padding:16px 15px 16px 0;border-right:1px solid #1b181422}
.data-layout .stat:nth-child(even){padding-left:16px;border-right:0}
.data-layout .stat .v{font-family:RIDIBatang-subset,Nanum Myeongjo,serif;font-weight:400;font-size:38px}
.data-layout .stat .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.block{letter-spacing:-.012em}
.block.summary{
  border:0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;
  border-radius:0;background:transparent;padding:13px 0;
}
.block.summary .blockTitle{font-size:9px;letter-spacing:.18em;margin-bottom:8px}
.block.quote{font-size:24px;line-height:1.6}
.qaItem{border-radius:0;background:transparent;border:0;border-top:1px solid rgba(20,18,15,.12);padding:10px 0}
.compareBox{border-radius:0;padding:12px;border:1px solid rgba(20,18,15,.12);background:transparent}

.sourceItem{padding:10px 0;border-bottom:1px solid rgba(20,18,15,.12)}

.sourceTitle{font-family:RIDIBatang-subset,Nanum Myeongjo,serif;font-weight:400;font-size:13px}

.watermark{font-family:Pretendard Variable,Pretendard,sans-serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.fitArea{transform-origin:top left;will-change:transform}
.contentLayer{overflow:visible}

/* ============================================================
   NEWS MAGAZINE EDITORIAL SYSTEM
   ============================================================ */
.card{
  --ink:#181713;
  --paper:#f5f1e8;
  --muted:#6e6a62;
  --hair:#1a181422;
  --red:#9d2e27;
  background:var(--paper)!important;
  color:var(--ink)!important;
  border-radius:0;
  box-shadow:0 0 0 1px #0002, 0 24px 60px #0008;
  letter-spacing:-.015em;
}
.card.dark{
  --ink:#ece7dc;
  --paper:#171614;
  --muted:#aaa398;
  --hair:#ffffff22;
}
.card::before{
  inset:22px;
  border:0;
  border-top:2px solid currentColor;
  border-bottom:1px solid currentColor;
  opacity:.75;
  z-index:3;
}
.card::after{
  content:"";
  position:absolute;
  left:22px; right:22px; bottom:46px;
  border-top:1px solid currentColor;
  opacity:.18;
  z-index:3;
}
.card .eyebrow{
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:8px!important;
  letter-spacing:.24em!important;
  text-transform:uppercase;
  font-weight:800;
  color:var(--muted);
}
.card .accent-bar{
  width:26px;height:2px;margin:11px 0 15px;background:var(--red)!important;
}
.card .title,
.cover-layout .title,
.feature-layout .title,
.data-layout .dataTitle,
.interview-layout .interviewPaper .title{
  font-family:RIDIBatang-subset,Nanum Myeongjo,serif!important;
  font-weight:400!important;
  letter-spacing:-.065em!important;
  color:var(--ink)!important;
}
.card .deck{
  font-family:Pretendard Variable,Pretendard,Noto Sans KR,sans-serif!important;
  color:var(--ink);
  font-size:13px!important;
  line-height:1.72!important;
  letter-spacing:-.02em!important;
}
.card .byline{
  font-size:8px!important;
  letter-spacing:.17em!important;
  color:var(--muted)!important;
}
.card .folio{
  font-size:7px!important;
  letter-spacing:.18em!important;
  color:var(--muted)!important;
  bottom:29px!important;
}
.card .contentLayer{
  overflow:visible;
}
.card .contentLayer::after{
  content:"";
  display:block;
  position:absolute;
  left:0; right:0;
  margin-top:13px;
  border-bottom:1px solid currentColor;
  opacity:.12;
}
.card .bodyStack{
  gap:13px!important;
}
.card .block{
  color:var(--ink);
  font-family:Pretendard Variable,Pretendard,Noto Sans KR,sans-serif;
  font-size:11.5px;
  line-height:1.7;
}
.card .blockTitle{
  font-size:7px!important;
  letter-spacing:.18em!important;
  color:var(--red)!important;
  margin-bottom:6px!important;
}
.card .block.summary{
  border:0!important;
  border-left:3px solid var(--red)!important;
  border-radius:0!important;
  padding:8px 10px!important;
  background:rgba(157,46,39,.045)!important;
}
.card .block.quote{
  font-family:RIDIBatang-subset,Nanum Myeongjo,serif!important;
  font-size:17px!important;
  line-height:1.65!important;
  padding-top:5px;
}
.card .block.quote .qmark{
  color:var(--red)!important;
  font-family:Georgia,serif!important;
}
.card .author{
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:8px!important;
  letter-spacing:.06em!important;
  color:var(--muted)!important;
}
.card .listItem{gap:7px!important;margin-bottom:4px!important}
.card .listNum{
  width:17px!important;height:17px!important;
  border-radius:0!important;
  background:var(--ink)!important;
  color:var(--paper)!important;
  font-family:Pretendard Variable,Pretendard,sans-serif;

.card .timelineItem{gap:8px!important}

  margin-top:6px!important;

  font-size:8px!important;
  letter-spacing:.12em;
  color:var(--red)!important;

  border-top:1px solid var(--hair)!important;
  padding:8px 0!important;
  background:transparent!important;

/* =========================================================
   WEST150 DAILY — NEWS BRAND EDITORIAL VISUAL SYSTEM
   ========================================================= */

:root{
  --news-paper:#f3eee4;
  --news-paper-2:#ece6da;
  --news-ink:#171715;
  --news-muted:#777168;
  --news-rule:#201f1b;
  --news-red:#9f302a;
  --news-red-soft:#9f302a18;
  --news-white:#f4f0e8;
}

.card{
  width:640px!important;
  height:800px!important;
  overflow:hidden!important;
  border-radius:0!important;
  background:var(--news-paper)!important;
  color:var(--news-ink)!important;
  box-shadow:0 32px 80px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.20)!important;
  font-family:Pretendard Variable,Pretendard,Noto Sans KR,sans-serif!important;
  position:relative!important;
}
.card.dark{
  background:#171716!important;
  color:#f0ece4!important;
}

/* page frame — not decorative, editorial registration */
.card::before{
  content:"";
  position:absolute;
  left:26px; right:26px; top:24px;
  height:calc(100% - 48px);
  border-top:1.5px solid currentColor;
  border-bottom:1px solid currentColor;
  opacity:.72;
  pointer-events:none;
  z-index:100;
}
.card::after{
  content:"";
  position:absolute;
  left:26px; right:26px; bottom:52px;
  border-top:1px solid currentColor;
  opacity:.18;
  pointer-events:none;
  z-index:100;
}

/* masthead / folio */
.card .eyebrow{
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:8px!important;
  font-weight:800!important;
  letter-spacing:.24em!important;
  text-transform:uppercase!important;
  color:var(--news-muted)!important;
  opacity:1!important;
}
.card.dark .eyebrow{color:#a7a198!important}

.card .folio{
  left:42px!important;
  right:42px!important;
  bottom:29px!important;
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:7px!important;
  font-weight:700!important;
  letter-spacing:.18em!important;
  color:var(--news-muted)!important;
  opacity:1!important;
  z-index:110!important;
}
.card.dark .folio{color:#aaa39a!important}

.card .accent-bar{
  width:34px!important;
  height:3px!important;
  margin:13px 0 17px!important;
  background:var(--news-red)!important;
  border-radius:0!important;
}

/* headline system */
.card .title,
.cover-layout .title,
.feature-layout .title,
.data-layout .dataTitle,
.interview-layout .interviewPaper .title{
  font-family:RIDIBatang-subset,Nanum Myeongjo,serif!important;
  font-weight:400!important;
  letter-spacing:-.065em!important;
  color:var(--news-ink)!important;
  text-shadow:none!important;
}
.card.dark .title,
.card.dark .dataTitle{color:#f2ede4!important}

.card .deck{
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:13px!important;
  line-height:1.72!important;
  letter-spacing:-.025em!important;
  color:var(--news-ink)!important;
  opacity:1!important;
}
.card.dark .deck{color:#ddd6cb!important}

.card .byline{
  font-family:Pretendard Variable,Pretendard,sans-serif!important;
  font-size:8px!important;
  font-weight:700!important;
  letter-spacing:.16em!important;
  color:var(--news-muted)!important;
  opacity:1!important;
}

/* =========================================================
   COVER — newspaper/magazine front page
   ========================================================= */
.cover-layout .photo{
  inset:0!important;
  border-radius:0!important;
}
.cover-layout .shade{
  background:
    linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.54) 42%,rgba(0,0,0,.12) 73%,rgba(0,0,0,.03) 100%),
    linear-gradient(0deg,rgba(0,0,0,.42),transparent 46%)!important;
}
.cover-layout .contentLayer{
  left:var(--x)!important;
  top:var(--y)!important;
  width:var(--w)!important;
  color:#fff!important;
}
.cover-layout .contentLayer::before{
  content:"";
  position:absolute;
  left:0;top:-32px;
  width:45px;height:3px;
  background:#c5483f;
}
.cover-layout .contentLayer::after{display:none!important}

.cover-layout .title{

/* cover bottom kicker, generated visually */

  font-size:7px;
  letter-spacing:.18em;
}

/* =========================================================
   FEATURE — real editorial grid
   ========================================================= */

}

.interview-layout .quote{

.interview-layout .byline{

/* =========================================================
   DATA — business journal / index page
   ========================================================= */
.data-layout{
  background:var(--news-paper)!important;
}
.data-layout .dataPaper{
  inset:0!important;
  padding:43px 45px!important;
}
.data-layout .header{
  border-top:2px solid currentColor!important;
  border-bottom:1px solid currentColor!important;
  padding:10px 0 12px!important;
}

}

  margin-top:15px!important;

}
.data-layout .statGrid{
  grid-template-columns:repeat(4,1fr)!important;
  gap:0!important;
  margin-top:21px!important;

.data-layout .stat{
  min-width:0!important;

.data-layout .stat .l{
  margin-top:6px!important;
  font-size:7px!important;
  letter-spacing:.10em!important;
  text-transform:uppercase!important;
  line-height:1.35!important;
}
.data-layout .bodyStack{

.card .qaQ{

/* image is editorial photography, never card-ui */

<script>
'use strict';

function parseLines(v){return String(v||'').split(/\n/).map(x=>x.trim()).filter(Boolean)}
function renderBlock(b,s){
  const fs=(b.size!=null?b.size:(s.bodySize||14));

  const data=parseLines(b.data);

  if(b.type==='text')return `<div class="block" style="${style}">${esc(b.data).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div>`;
  if(b.type==='list')return `<div class="block" style="${style}">${data.map((x,i)=>`<div class="listItem"><span class="listNum">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div>`;
  if(b.type==='timeline')return `<div class="block" style="${style}">${data.map(x=>{const p=x.split('|');return `<div class="timelineItem"><span class="timelineDot"></span><div class="timelineBody"><div class="timelineDate">${esc((p[0]||'').trim())}</div><div>${esc((p[1]||'').trim())}</div></div></div>`}).join('')}</div>`;
  if(b.type==='quote'){const q=data[0]||'',a=data[1]||'';return `<div class="block quote" style="${style}"><div class="qmark">“</div>${esc(q)}${a?`<div class="author">— ${esc(a)}</div>`:''}</div>`}
  if(b.type==='qa')return `<div class="block" style="${style}">${data.map(x=>{const p=x.split('|');return `<div class="qaItem"><div class="qaQ">${esc((p[0]||'').trim())}</div><div class="qaA">${esc((p[1]||'').trim())}</div></div>`}).join('')}</div>`;
  if(b.type==='factlist')return `<div class="block" style="${style}">${data.map(x=>{const p=x.split('|');const t=(p[0]||'').trim();const body=(p[1]||'').trim();const m=t==='거짓'||t==='false'?'❌':t==='부분'?'~':t==='미확인'?'?':'✓';const c=t==='거짓'||t==='false'?'#c62828':t==='부분'?'#ef6c00':t==='미확인'?'#607d8b':'#2e7d32';return `<div class="factItem"><span class="factBadge" style="background:${c}">${m}</span><span>${esc(body)}</span></div>`}).join('')}</div>`;
  if(b.type==='compare'){const parts=String(b.data||'').split(/\n?===\n?/);return `<div class="block compare" style="${style}"><div class="compareBox">${esc(parts[0]||'').replace(/\n/g,'<br>')}</div><div class="compareBox ac">${esc(parts[1]||'').replace(/\n/g,'<br>')}</div></div>`}
  if(b.type==='sources')return (b.data&&b.data.trim())?renderSourcesFromText(b.data,s):renderSourcesFromModel(s);
  if(b.type==='stats'){
    return `<div class="block" style="${style}"><div class="statGrid" style="margin-top:0;grid-template-columns:repeat(2,1fr);">${data.map(x=>{
      const p=x.split('|'),v=(p[0]||'').trim(),l=(p[1]||'').trim();
      return `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
    }).join('')}</div></div>`;
  }
  if(b.type==='chart'){
    const vals=data.map(x=>{const p=x.split('|');return {label:(p[0]||'').trim(),value:Number(p[1])||0}}),max=Math.max(1,...vals.map(x=>x.value));
    return `<div class="block" style="${style}">${vals.map(x=>`<div style="display:grid;grid-template-columns:60px 1fr 28px;gap:7px;align-items:center;margin:5px 0;"><span style="font-size:9px;">${esc(x.label)}</span><span style="height:8px;background:#00000012;overflow:hidden;"><i style="display:block;height:100%;width:${Math.max(3,Math.round(x.value/max*100))}%;background:${s.accent};"></i></span><b style="font-size:9px;text-align:right;">${x.value}</b></div>`).join('')}</div>`;
  }

  return '';
}
function renderSourcesFromText(data,s){
  const lines=parseLines(data);if(!lines.length)return '';

    return `<div class="sourceItem">

}

}
function normalizedPhotoLayout(s, fallback='full'){

}
function photoForTemplate(s, fallback='full', extraClass=''){

function cardMarkup(s){
  const dark=s.theme==='dark', cls=`card ${dark?'dark ':''}${s.template}-layout tone-${s.editorialTone||'news'}`;

  }

function autoFitRenderedText(){
  const card=$('card'); if(!card)return;
  const s=current();
  const fitBox=(host,maxH)=>{
    if(!host)return;
    const inner=host.querySelector('.fitArea')||host;
    inner.style.transform='scale(1)';
    inner.style.width='100%';
    const natural=inner.scrollHeight||inner.getBoundingClientRect().height;
    if(natural>maxH){
      const scale=Math.max(.68, Math.min(1,maxH/natural));
      inner.style.transform=`scale(${scale})`;
      inner.style.width=`${100/scale}%`;
    }
  };
  if(s.template==='cover') fitBox(card.querySelector('.contentLayer'), card.clientHeight-s.contentY-75);
  if(s.template==='feature') fitBox(card.querySelector('.contentLayer'), card.clientHeight-s.contentY-55);
  if(s.template==='interview') fitBox(card.querySelector('.interviewPaper'), card.querySelector('.interviewPaper')?.clientHeight-35||500);
  if(s.template==='data') fitBox(card.querySelector('.dataPaper'), card.querySelector('.dataPaper')?.clientHeight-45||700);
}

function renderThumbs(){const old=active;const el=$('pages');el.innerHTML=pages.map((p,i)=>`<div class="thumb ${i===old?'active':''}" data-i="${i}"><div class="thumb-head"><span class="num">${String(i+1).padStart(2,'0')}</span><button class="thumb-delete" data-del="${i}">×</button></div><div class="mini"><div class="mini-inner" id="mini-${i}"></div></div><div class="name">${['Cover','Feature','Interview','Data / Closing'][i]||'Editorial'}</div></div>`).join('');pages.forEach((p,i)=>{active=i;const m=$('mini-'+i);m.innerHTML=cardMarkup(p).replace(' id="card"','');});active=old;

function renderStack(){
  const s=current(),wrap=$('blockStack');if(!wrap)return;
  wrap.innerHTML=s.blocks.map((b,i)=>`<div class="stackItem ${i===s.activeBlock?'active':''}" data-bi="${i}"><span class="stackNum">${String(i+1).padStart(2,'0')}</span><span class="stackName">${esc(b.title||blockName(b.type))}</span><span class="stackActions"><button class="iconBtn" data-bdup="${i}">+</button><button class="iconBtn" data-bdel="${i}">×</button></span></div>`).join('');
  wrap.querySelectorAll('.stackItem').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;s.activeBlock=+r.dataset.bi;render()});
  wrap.querySelectorAll('[data-bdup]').forEach(b=>b.onclick=e=>{e.stopPropagation();snapshot();const i=+b.dataset.bdup;s.blocks.splice(i+1,0,clone(s.blocks[i]));s.blocks[i+1].id=uid();s.activeBlock=i+1;render()});
  wrap.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();snapshot();const i=+b.dataset.bdel;s.blocks.splice(i,1);if(!s.blocks.length)s.blocks=[makeBlock('text','')];s.activeBlock=Math.min(s.activeBlock,s.blocks.length-1);render()});
}
function blockName(t){return {text:'텍스트',summary:'핵심 요약',list:'번호 리스트',timeline:'타임라인',quote:'인용문',qa:'Q&A',factlist:'팩트체크',compare:'원문 / 번역',sources:'출처',stats:'숫자 통계',chart:'막대 그래프'}[t]||'블록'}
function renderSources(){
  const s=current();
  $('sourceEditor').innerHTML=renderSourceManager(s);
  document.querySelectorAll('[data-source]').forEach(card=>{
    const i=s.sources.findIndex(x=>x.id===card.dataset.source);
    if(i<0)return;
    card.querySelector('.src-title').oninput=e=>{s.sources[i].title=e.target.value;renderCard();renderThumbs()};
    card.querySelector('.src-desc').oninput=e=>{s.sources[i].desc=e.target.value;renderCard()};
    card.querySelector('.src-url').oninput=e=>{s.sources[i].url=e.target.value;renderCard()};
    card.querySelector('.src-type').onchange=e=>{s.sources[i].type=e.target.value;renderSources();renderCard()};
  });
  document.querySelectorAll('[data-src-up]').forEach(b=>b.onclick=()=>moveSource(+b.dataset.srcUp,-1));
  document.querySelectorAll('[data-src-down]').forEach(b=>b.onclick=()=>moveSource(+b.dataset.srcDown,1));
  document.querySelectorAll('[data-src-del]').forEach(b=>b.onclick=()=>{
    snapshot();
    s.sources.splice(+b.dataset.srcDel,1);
    renderSources(); renderCard(); renderThumbs();
  });
}
function moveSource(i,d){snapshot();const s=current(),j=i+d;if(j<0||j>=s.sources.length)return;[s.sources[i],s.sources[j]]=[s.sources[j],s.sources[i]];renderSources();renderCard();renderThumbs()}
function syncForm(){
  const s=current();$('pageTemplate').value=s.template;$('eyebrow').value=s.eyebrow;$('title').value=s.title;$('deck').value=s.deck;$('byline').value=s.byline;$('contentX').value=s.contentX;$('contentY').value=s.contentY;$('contentW').value=s.contentW;
  $('contentXVal').textContent=s.contentX;$('contentYVal').textContent=s.contentY;$('contentWVal').textContent=s.contentW;$('editorialTone').value=s.editorialTone||'news';if($('toneHint'))$('toneHint').textContent=toneHints[s.editorialTone||'news']||'';$('themeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===s.theme));$('accentHex').value=s.accent;$('folioRight').value=s.folioRight;$('wmText').value=s.wmText;
  $('imgPreview').style.backgroundImage=s.photo?`url("${s.photo}")`:'none';$('photoX').value=s.photoX;$('photoY').value=s.photoY;$('photoScale').value=s.photoScale;$('brightness').value=s.brightness;$('contrast').value=s.contrast;$('photoXVal').textContent=s.photoX;$('photoYVal').textContent=s.photoY;$('photoScaleVal').textContent=s.photoScale;$('brightnessVal').textContent=s.brightness;$('contrastVal').textContent=s.contrast;
  $('photoLayout').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===s.photoLayout));$('baseFont').value=s.baseFont;$('titleFont').value=s.titleFont||'';$('titleSize').value=s.titleSize;$('titleSizeVal').textContent=s.titleSize;$('bodySize').value=s.bodySize||14;$('bodySizeVal').textContent=s.bodySize||14;$('titleWeight').value=s.titleWeight;$('letterSpacing').value=s.letterSpacing;$('letterSpacingVal').textContent=s.letterSpacing;$('lineHeight').value=Math.round(s.lineHeight*100);$('lineHeightVal').textContent=s.lineHeight.toFixed(2);$('textColor').value=s.textColor;
  $('alignSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===s.align));const b=activeBlock();$('blockType').value=b.type;$('blockTitle').value=b.title||'';$('blockData').value=b.data||'';$('blockSize').value=b.size||14;$('blockSizeVal').textContent=b.size||14;$('blockHint').textContent=blockHints[b.type]||'';
}
function render(){renderCard();renderThumbs();renderStack();renderSources();syncForm()}
function updateText(key,val,commit=false){if(commit)snapshot();current()[key]=val;render()}
function bindInput(id,key,parse=v=>v){
  $(id).addEventListener('input',e=>{
    const s=current();
    s[key]=parse(e.target.value);
    const card=$('card');
    const layer=card?.querySelector('.contentLayer');
    if(id==='contentX'||id==='contentY'||id==='contentW'){
      if(layer){
        layer.style.setProperty('--x',s.contentX+'px');
        layer.style.setProperty('--y',s.contentY+'px');
        layer.style.setProperty('--w',s.contentW+'px');
      }
    }else if(id==='titleSize'){
      if(layer)layer.style.setProperty('--title-size',s.titleSize+'px');
      const extra=card?.querySelectorAll('.interviewPaper,.dataPaper');
      extra?.forEach(el=>el.style.setProperty('--title-size',s.titleSize+'px'));
    }else if(id==='bodySize'){
      if(layer)layer.style.setProperty('--body-size',s.bodySize+'px');
      const extra=card?.querySelectorAll('.interviewPaper,.dataPaper');
      extra?.forEach(el=>el.style.setProperty('--body-size',s.bodySize+'px'));
      /* bodySize controls the entire editorial body layer, not just the selected block */
      card?.querySelectorAll('.contentLayer .deck,.contentLayer .byline').forEach(el=>{
        if(el.classList.contains('deck')) el.style.fontSize=Math.max(11,s.bodySize*.95)+'px';
      });
    }else{
      renderCard();
      renderThumbs();
    }
    syncForm();
  })
}

function addPage(){snapshot();const p=page('feature',{title:'새 에디토리얼 카드',folioRight:`${pages.length+1} / ${pages.length+1}`});p.blocks=[makeBlock('summary','핵심 메시지를 입력하세요.')];pages.push(p);active=pages.length-1;normalizeFolios();render()}
function duplicatePage(){snapshot();const p=clone(current());p.id=uid();p.blocks=(p.blocks||[]).map(b=>Object.assign({},b,{id:uid()}));p.sources=(p.sources||[]).map(s=>Object.assign({},s,{id:uid()}));pages.splice(active+1,0,p);active++;normalizeFolios();render()}
function deletePage(i){if(pages.length<=1){alert('최소 1장의 카드는 남겨야 합니다.');return}snapshot();pages.splice(i,1);active=Math.min(active,pages.length-1);normalizeFolios();render()}
function normalizeFolios(){pages.forEach((p,i)=>p.folioRight=`${String(i+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}`)}
function movePage(d){snapshot();const j=active+d;if(j<0||j>=pages.length)return;[pages[active],pages[j]]=[pages[j],pages[active]];active=j;normalizeFolios();render()}
function addBlock(){snapshot();const s=current();const b=makeBlock('summary','핵심 요약을 입력하세요.');s.blocks.splice(s.activeBlock+1,0,b);s.activeBlock++;render()}
function duplicateBlock(){snapshot();const s=current(),b=s.blocks[s.activeBlock];s.blocks.splice(s.activeBlock+1,0,Object.assign({},clone(b),{id:uid()}));s.activeBlock++;render()}
function moveBlock(d){snapshot();const s=current(),i=s.activeBlock,j=i+d;if(j<0||j>=s.blocks.length)return;[s.blocks[i],s.blocks[j]]=[s.blocks[j],s.blocks[i]];s.activeBlock=j;render()}

function bindCanvasDrag(){
 const card=$('card'),layer=card?.querySelector('.contentLayer');if(!layer)return;
 layer.onpointerdown=e=>{
   if(e.target.classList.contains('resize'))return;
   snapshot();
   selectedLayer='content';
   const s=current();
   dragState={sx:e.clientX,sy:e.clientY,x:s.contentX,y:s.contentY,el:layer};
   layer.classList.add('selected');
   layer.setPointerCapture(e.pointerId);
   e.preventDefault();
 };
 layer.onpointermove=e=>{
   if(!dragState)return;
   const k=dragState,s=current();
   s.contentX=Math.max(0,Math.min(590,k.x+(e.clientX-k.sx)/zoom));
   s.contentY=Math.max(20,Math.min(720,k.y+(e.clientY-k.sy)/zoom));
   layer.style.setProperty('--x',s.contentX+'px');
   layer.style.setProperty('--y',s.contentY+'px');
   const xVal=$('contentXVal'),yVal=$('contentYVal');
   if(xVal)xVal.textContent=Math.round(s.contentX);
   if(yVal)yVal.textContent=Math.round(s.contentY);
   const xRange=$('contentX'),yRange=$('contentY');
   if(xRange)xRange.value=s.contentX;
   if(yRange)yRange.value=s.contentY;
   e.preventDefault();
 };
 const end=()=>{dragState=null};
 layer.onpointerup=end;layer.onpointercancel=end;layer.onclick=()=>{selectedLayer='content';layer.classList.add('selected')};
}
// Canvas click handler must be delegated because #card is rebuilt on every render.
document.addEventListener('click',e=>{
  const card=e.target.closest('#card');
  if(card && e.target===card){selectedLayer=null;const layer=card.querySelector('.contentLayer');if(layer)layer.classList.remove('selected');}
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.panel!==t.dataset.tab)});

bindInput('eyebrow','eyebrow');bindInput('title','title');bindInput('deck','deck');bindInput('byline','byline');bindInput('contentX','contentX',Number);bindInput('contentY','contentY',Number);bindInput('contentW','contentW',Number);
bindInput('photoX','photoX',Number);bindInput('photoY','photoY',Number);bindInput('photoScale','photoScale',Number);bindInput('brightness','brightness',Number);bindInput('contrast','contrast',Number);
bindInput('titleSize','titleSize',Number);bindInput('bodySize','bodySize',Number);bindInput('titleWeight','titleWeight',Number);bindInput('letterSpacing','letterSpacing',Number);bindInput('lineHeight','lineHeight',v=>Number(v)/100);
bindInput('accentHex','accentHex');$('editorialTone').addEventListener('change',e=>{snapshot();current().editorialTone=e.target.value;render()});bindInput('folioRight','folioRight');bindInput('wmText','wmText');bindInput('textColor','textColor');bindInput('baseFont','baseFont');bindInput('titleFont','titleFont');

const blockSamples={
  text:'본문 내용을 입력하세요.\n두 번째 문단을 입력하세요.',
  summary:'이 기사의 핵심 결론을 한 문장으로 정리하세요.',
  list:'첫 번째 핵심 내용\n두 번째 핵심 내용\n세 번째 핵심 내용',
  timeline:'2026.08 | 첫 번째 사건\n2026.09 | 두 번째 사건\n2026.10 | 다음 단계',
  quote:'인상적인 인용문을 입력하세요.\n발언자 이름',
  qa:'질문을 입력하세요 | 답변을 입력하세요.\n두 번째 질문 | 두 번째 답변',
  factlist:'사실 | 공식 자료로 확인된 내용\n부분 | 맥락 일부가 빠진 주장\n거짓 | 확인 결과 사실과 다름',
  compare:'원문 또는 기존 내용\n===\n번역 또는 새로운 내용',
  sources:''
};
function activeBlock(){
  const s=current();
  if(!Array.isArray(s.blocks)||!s.blocks.length)s.blocks=[makeBlock('text','')];
  s.activeBlock=Math.max(0,Math.min(Number(s.activeBlock)||0,s.blocks.length-1));
  return s.blocks[s.activeBlock];
}
$('blockData').addEventListener('input',e=>{
  const b=activeBlock();
  b.data=e.target.value;
  renderCard();
  renderStack();
});
$('blockSize').addEventListener('input',e=>{
  const b=activeBlock();
  b.size=Number(e.target.value)||14;
  $('blockSizeVal').textContent=b.size;
  renderCard();
  renderStack();
});
$('blockType').addEventListener('change',e=>{
  snapshot();
  const b=activeBlock();
  const next=e.target.value;
  b.type=next;
  if(!(b.data||'').trim()) b.data=blockSamples[next]||'';
  if(next==='sources') b.data='';
  b.title=b.title||'';
  render();
});
$('blockTitle').addEventListener('input',e=>{
  activeBlock().title=e.target.value;
  renderCard();
  renderStack();
});
$('addBlock').onclick=addBlock;
$('duplicateBlock').onclick=duplicateBlock;
$('blockUp').onclick=()=>moveBlock(-1);
$('blockDown').onclick=()=>moveBlock(1);

document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{snapshot();current().theme=b.dataset.v;render()});
document.querySelectorAll('#alignSeg button').forEach(b=>b.onclick=()=>{snapshot();current().align=b.dataset.v;render()});
document.querySelectorAll('#photoLayout button').forEach(b=>b.onclick=()=>{
  if(current().photoLayout===b.dataset.v)return;
  snapshot();
  current().photoLayout=b.dataset.v;
  render();
});
document.querySelectorAll('#presetPos button').forEach(b=>b.onclick=()=>{snapshot();current().contentY=b.dataset.v==='top'?80:b.dataset.v==='middle'?290:520;render()});
$('pageTemplate').onchange=e=>{snapshot();current().template=e.target.value;render()};
$('addSource').onclick=()=>{
  snapshot();
  const s=current();
  const newSource=makeSource({title:'새 출처'});
  s.sources.push(newSource);
  let idx=s.blocks.findIndex(b=>b.type==='sources');
  if(idx<0){
    s.blocks.push(makeBlock('sources',''));
    idx=s.blocks.length-1;
  } else {
    s.blocks[idx].data='';
  }
  s.activeBlock=idx;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='source'));
  document.querySelectorAll('.panel').forEach(panel=>panel.hidden=panel.dataset.panel!=='source');
  render();
};
$('photoUpload').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{snapshot();current().photo=r.result;render()};r.readAsDataURL(f)};
$('removePhoto').onclick=()=>{snapshot();current().photo=null;render()};
$('addPage').onclick=addPage;$('duplicatePage').onclick=duplicatePage;$('resetPages').onclick=()=>{snapshot();pages=defaultPages();active=0;normalizeFolios();render()};$('movePageUp').onclick=()=>movePage(-1);$('movePageDown').onclick=()=>movePage(1);
$('zoomIn').onclick=()=>{zoom=Math.min(1.5,zoom+.1);render()};$('zoomOut').onclick=()=>{zoom=Math.max(.55,zoom-.1);render()};function fitPreviewToStage(){
  const stage=document.querySelector('.stage');
  const stageInner=document.querySelector('.stage-inner');
  const card=$('card');
  if(!stage||!stageInner||!card)return;
  const stageRect=stage.getBoundingClientRect();
  const toolbar=document.querySelector('.toolbar');
  const note=document.querySelector('.stage-inner .note');
  const toolbarH=toolbar?toolbar.getBoundingClientRect().height:34;
  const noteH=note?note.getBoundingClientRect().height:18;
  const padX=54, padY=42, extraY=toolbarH+noteH+26;
  const availableW=Math.max(240,stageRect.width-padX*2);
  const availableH=Math.max(240,stageRect.height-padY*2-extraY);
  const baseW=card.clientWidth||640;
  const baseH=card.clientHeight||800;
  zoom=Math.max(.42,Math.min(1.15,availableW/baseW,availableH/baseH));
  renderCard();
  $('zoomLabel').textContent=Math.round(zoom*100)+'%';
}
$('fitScreen').onclick=fitPreviewToStage;

$('undo').onclick=()=>{if(!history.length)return;future.push(clone(pages));restore(history.pop())};
$('redo').onclick=()=>{if(!future.length)return;history.push(clone(pages));restore(future.pop())};

$('saveJson').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,pages},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='editorial-studio-project.json';a.click()};
$('loadJson').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.pages)||!x.pages.length)throw 0;snapshot();pages=x.pages.slice(0,12);pages.forEach(p=>{p.blocks=p.blocks?.length?p.blocks:[makeBlock('text',p.body||'')];p.sources=p.sources||[];p.activeBlock=Math.min(p.activeBlock||0,p.blocks.length-1)});active=0;normalizeFolios();render()}catch(err){alert('프로젝트 파일을 읽을 수 없습니다.')}};r.readAsText(f)};

async function exportOne(i){const old=active;active=i;renderCard();document.body.classList.add('exporting');await new Promise(r=>setTimeout(r,100));const canvas=await html2canvas($('card'),{scale:3,useCORS:true,backgroundColor:null});document.body.classList.remove('exporting');active=old;render();return canvas.toDataURL('image/png')}
$('exportPng').onclick=async()=>{const d=await exportOne(active),a=document.createElement('a');a.href=d;a.download=`editorial-${String(active+1).padStart(2,'0')}.png`;a.click()};
$('exportZip').onclick=async()=>{const z=new JSZip();for(let i=0;i<pages.length;i++){const d=await exportOne(i);z.file(`editorial-${String(i+1).padStart(2,'0')}.png`,d.split(',')[1],{base64:true})}const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='editorial-studio-cards.zip';a.click()};

window.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}
 if(mod&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();$('redo').click()}
 if(e.key==='Delete'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){const s=current();if(s.blocks.length>1){snapshot();s.blocks.splice(s.activeBlock,1);s.activeBlock=Math.min(s.activeBlock,s.blocks.length-1);render()}}
});
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.pages?.length)pages=saved.pages.slice(0,12)}catch(_){}
render();
requestAnimationFrame(fitPreviewToStage);
window.addEventListener('resize',()=>requestAnimationFrame(fitPreviewToStage));
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>requestAnimationFrame(fitPreviewToStage));
  const stageEl=document.querySelector('.stage');
  if(stageEl)ro.observe(stageEl);
}
</script>
