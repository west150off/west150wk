<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Editor - Apple Style</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;700&family=Montserrat:wght@500;700&family=Oswald:wght@500;700&family=Lora:wght@400;700&family=Poppins:wght@500;700&family=Source+Sans+3:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif; }
    .apple-bg { background: #f5f5f7; }
    .card-shadow { box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
    input[type=range] { accent-color: #0071e3; }
  </style>
</head>
<body class="apple-bg min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const freeFonts = [
      { name: 'Inter', value: 'Inter' },
      { name: 'Playfair Display', value: 'Playfair Display' },
      { name: 'Noto Sans KR', value: 'Noto Sans KR' },
      { name: 'Roboto', value: 'Roboto' },
      { name: 'Montserrat', value: 'Montserrat' },
      { name: 'Oswald', value: 'Oswald' },
      { name: 'Lora', value: 'Lora' },
      { name: 'Poppins', value: 'Poppins' },
      { name: 'Source Sans 3', value: 'Source Sans 3' },
      { name: 'Merriweather', value: 'Merriweather' },
    ];

    const defaultTexts = {
      category: { content: 'WORLD NEWS', fontSize: 13, fontFamily: 'Inter', color: '#ffffff', bold: true, highlight: null },
      live: { content: 'LIVE UPDATE', fontSize: 12, fontFamily: 'Inter', color: '#ff3b30', bold: true, highlight: null },
      title: { content: 'Hurricane Lala\nhits Hawaii', fontSize: 52, fontFamily: 'Playfair Display', color: '#ffffff', bold: true, highlight: null },
      description: { content: 'Hurricane Lala is battering Hawaii with heavy rain and strong winds, prompting flood warnings and emergency rescues across the islands.', fontSize: 15, fontFamily: 'Inter', color: '#e5e5e5', bold: false, highlight: null },
      source: { content: 'SOURCE: REUTERS', fontSize: 11, fontFamily: 'Inter', color: '#ff3b30', bold: true, highlight: null },
      brand: { content: 'WEST150DAILY', fontSize: 11, fontFamily: 'Inter', color: '#ffffff', bold: true, highlight: null },
    };

    const createNewCard = () => ({
      id: Date.now() + Math.random(),
      layout: 'news',
      backgroundImage: 'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1200&q=80',
      overlayOpacity: 0.55,
      texts: JSON.parse(JSON.stringify(defaultTexts)),
    });

    function App() {
      const [cards, setCards] = useState([createNewCard()]);
      const [selectedId, setSelectedId] = useState(cards[0].id);
      const [activeTab, setActiveTab] = useState('layout');
      const [selectedTextKey, setSelectedTextKey] = useState('title');
      const previewRef = useRef(null);

      const selectedCard = cards.find(c => c.id === selectedId) || cards[0];

      const updateCard = (updates) => {
        setCards(prev => prev.map(c => c.id === selectedId ? { ...c, ...updates } : c));
      };

      const updateText = (key, field, value) => {
        setCards(prev => prev.map(c => {
          if (c.id !== selectedId) return c;
          return {
            ...c,
            texts: {
              ...c.texts,
              [key]: { ...c.texts[key], [field]: value }
            }
          };
        }));
      };

      const addCard = () => {
        const newCard = createNewCard();
        setCards([...cards, newCard]);
        setSelectedId(newCard.id);
      };

      const duplicateCard = (id) => {
        const original = cards.find(c => c.id === id);
        const newCard = {
          ...JSON.parse(JSON.stringify(original)),
          id: Date.now() + Math.random()
        };
        setCards([...cards, newCard]);
        setSelectedId(newCard.id);
      };

      const deleteCard = (id) => {
        if (cards.length <= 1) {
          alert('최소 1개의 카드는 필요합니다.');
          return;
        }
        const newCards = cards.filter(c => c.id !== id);
        setCards(newCards);
        if (selectedId === id) setSelectedId(newCards[0].id);
      };

      const downloadCard = async () => {
        if (!previewRef.current) return;
        try {
          const canvas = await html2canvas(previewRef.current, {
            scale: 3,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false,
          });
          const link = document.createElement('a');
          link.download = `card-${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png', 1.0);
          link.click();
        } catch (err) {
          alert('저장 중 오류가 발생했습니다. 이미지를 CORS 허용된 URL로 바꿔보세요.');
          console.error(err);
        }
      };

      // 카드 미리보기 렌더링
      const renderCard = (card, isPreview = true) => {
        const t = card.texts;
        const layout = card.layout;

        return (
          <div
            ref={isPreview ? previewRef : null}
            className="relative w-full aspect-[3/4] max-w-[380px] mx-auto overflow-hidden rounded-2xl card-shadow bg-black"
            style={{ fontFamily: 'Inter' }}
          >
            {/* 배경 이미지 */}
            <div
              className="absolute inset-0 bg-cover bg-center"
              style={{ backgroundImage: `url(${card.backgroundImage})` }}
            />
            {/* 어두운 오버레이 */}
            <div
              className="absolute inset-0"
              style={{ background: `linear-gradient(to bottom, rgba(0,0,0,${card.overlayOpacity * 0.4}) 0%, rgba(0,0,0,${card.overlayOpacity}) 60%, rgba(0,0,0,0.92) 100%)` }}
            />

            {/* 콘텐츠 */}
            <div className="relative h-full flex flex-col p-6 text-white">
              {/* 상단 */}
              <div className="flex items-center gap-3 mb-auto">
                <span
                  style={{
                    fontSize: t.category.fontSize,
                    fontFamily: t.category.fontFamily,
                    color: t.category.color,
                    fontWeight: t.category.bold ? 700 : 400,
                    backgroundColor: t.category.highlight || 'transparent',
                    padding: t.category.highlight ? '2px 6px' : 0,
                    borderRadius: 4
                  }}
                >
                  {t.category.content}
                </span>
                <div className="w-8 h-0.5 bg-red-500" />
              </div>

              {/* 중간/하단 텍스트 영역 */}
              <div className={`mt-auto ${layout === 'center' ? 'text-center' : ''}`}>
                <div
                  className="mb-2"
                  style={{
                    fontSize: t.live.fontSize,
                    fontFamily: t.live.fontFamily,
                    color: t.live.color,
                    fontWeight: t.live.bold ? 700 : 400,
                    backgroundColor: t.live.highlight || 'transparent',
                    display: 'inline-block',
                    padding: t.live.highlight ? '2px 6px' : 0,
                    borderRadius: 4
                  }}
                >
                  {t.live.content}
                </div>

                <h1
                  className="leading-tight mb-4 whitespace-pre-line"
                  style={{
                    fontSize: t.title.fontSize,
                    fontFamily: t.title.fontFamily,
                    color: t.title.color,
                    fontWeight: t.title.bold ? 700 : 400,
                    backgroundColor: t.title.highlight || 'transparent',
                    padding: t.title.highlight ? '4px 8px' : 0,
                    borderRadius: 6
                  }}
                >
                  {t.title.content}
                </h1>

                <div className="w-10 h-0.5 bg-red-500 mb-4" />

                <p
                  className="mb-6 leading-relaxed"
                  style={{
                    fontSize: t.description.fontSize,
                    fontFamily: t.description.fontFamily,
                    color: t.description.color,
                    fontWeight: t.description.bold ? 700 : 400,
                    backgroundColor: t.description.highlight || 'transparent',
                    padding: t.description.highlight ? '4px 6px' : 0,
                    borderRadius: 4
                  }}
                >
                  {t.description.content}
                </p>

                <div className="flex justify-between items-center text-xs tracking-wider">
                  <span
                    style={{
                      fontSize: t.source.fontSize,
                      fontFamily: t.source.fontFamily,
                      color: t.source.color,
                      fontWeight: t.source.bold ? 700 : 400,
                    }}
                  >
                    {t.source.content}
                  </span>
                  <span
                    style={{
                      fontSize: t.brand.fontSize,
                      fontFamily: t.brand.fontFamily,
                      color: t.brand.color,
                      fontWeight: t.brand.bold ? 700 : 400,
                    }}
                  >
                    {t.brand.content}
                  </span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const tabs = [
        { id: 'layout', label: '레이아웃' },
        { id: 'text', label: '텍스트' },
        { id: 'image', label: '이미지' },
        { id: 'style', label: '스타일' },
        { id: 'export', label: '내보내기' },
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* ===== 상단 메뉴 ===== */}
          <header className="bg-white/80 backdrop-blur-xl border-b border-gray-200/80 sticky top-0 z-50">
            <div className="max-w-[1600px] mx-auto px-6 h-14 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white font-bold text-sm">C</div>
                <span className="font-semibold text-gray-900">Card Editor</span>
              </div>

              <nav className="flex items-center gap-1 bg-gray-100/80 p-1 rounded-full">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-5 py-1.5 rounded-full text-sm font-medium transition-all ${
                      activeTab === tab.id
                        ? 'bg-white text-gray-900 shadow-sm'
                        : 'text-gray-600 hover:text-gray-900'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>

              <button
                onClick={downloadCard}
                className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-full transition"
              >
                저장하기
              </button>
            </div>
          </header>

          {/* ===== 본문 ===== */}
          <div className="flex-1 flex max-w-[1600px] mx-auto w-full">
            {/* 왼쪽 패널 - 카드 목록 */}
            <aside className="w-64 border-r border-gray-200/80 bg-white/50 p-4 flex flex-col">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-sm font-semibold text-gray-700">내 카드</h2>
                <button
                  onClick={addCard}
                  className="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-lg hover:bg-blue-700"
                >
                  +
                </button>
              </div>

              <div className="space-y-3 overflow-y-auto flex-1">
                {cards.map(card => (
                  <div
                    key={card.id}
                    onClick={() => setSelectedId(card.id)}
                    className={`relative group rounded-xl overflow-hidden cursor-pointer border-2 transition ${
                      selectedId === card.id ? 'border-blue-500' : 'border-transparent hover:border-gray-300'
                    }`}
                  >
                    <div className="aspect-[3/4] bg-gray-200 relative">
                      <div
                        className="absolute inset-0 bg-cover bg-center opacity-80"
                        style={{ backgroundImage: `url(${card.backgroundImage})` }}
                      />
                      <div className="absolute inset-0 bg-black/40" />
                      <div className="absolute bottom-2 left-2 right-2 text-white text-xs font-medium truncate">
                        {card.texts.title.content.split('\n')[0]}
                      </div>
                    </div>

                    {/* 복제 / 삭제 버튼 */}
                    <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                      <button
                        onClick={(e) => { e.stopPropagation(); duplicateCard(card.id); }}
                        className="w-7 h-7 bg-white/90 rounded-full text-xs flex items-center justify-center hover:bg-white"
                        title="복제"
                      >
                        ⧉
                      </button>
                      <button
                        onClick={(e) => { e.stopPropagation(); deleteCard(card.id); }}
                        className="w-7 h-7 bg-white/90 rounded-full text-xs flex items-center justify-center hover:bg-red-100 text-red-600"
                        title="삭제"
                      >
                        ×
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </aside>

            {/* 가운데 - 미리보기 */}
            <main className="flex-1 flex items-center justify-center p-8 bg-gradient-to-b from-gray-50 to-gray-100">
              {renderCard(selectedCard)}
            </main>

            {/* 오른쪽 패널 - 기능 설정 */}
            <aside className="w-80 border-l border-gray-200/80 bg-white/70 backdrop-blur p-5 overflow-y-auto">
              {/* ===== 레이아웃 탭 ===== */}
              {activeTab === 'layout' && (
                <div className="space-y-4">
                  <h3 className="font-semibold text-gray-900 mb-3">레이아웃 선택</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { id: 'news', name: '뉴스형' },
                      { id: 'big-title', name: '큰 타이틀' },
                      { id: 'bottom', name: '하단 텍스트' },
                      { id: 'center', name: '중앙 집중' },
                    ].map(l => (
                      <button
                        key={l.id}
                        onClick={() => updateCard({ layout: l.id })}
                        className={`p-4 rounded-xl border-2 text-sm font-medium transition ${
                          selectedCard.layout === l.id
                            ? 'border-blue-500 bg-blue-50 text-blue-700'
                            : 'border-gray-200 hover:border-gray-300'
                        }`}
                      >
                        {l.name}
                      </button>
                    ))}
                  </div>
                  <p className="text-xs text-gray-500 mt-4">
                    * 현재는 뉴스형 레이아웃이 기본으로 적용됩니다. 다른 레이아웃도 동일한 요소를 사용합니다.
                  </p>
                </div>
              )}

              {/* ===== 텍스트 탭 ===== */}
              {activeTab === 'text' && (
                <div className="space-y-5">
                  <h3 className="font-semibold text-gray-900">텍스트 편집</h3>

                  {/* 텍스트 선택 */}
                  <div>
                    <label className="text-xs font-medium text-gray-500 mb-1 block">편집할 텍스트</label>
                    <select
                      value={selectedTextKey}
                      onChange={(e) => setSelectedTextKey(e.target.value)}
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white"
                    >
                      <option value="category">카테고리</option>
                      <option value="live">라이브 태그</option>
                      <option value="title">타이틀</option>
                      <option value="description">설명</option>
                      <option value="source">출처</option>
                      <option value="brand">브랜드</option>
                    </select>
                  </div>

                  {/* 내용 */}
                  <div>
                    <label className="text-xs font-medium text-gray-500 mb-1 block">내용</label>
                    <textarea
                      value={selectedCard.texts[selectedTextKey].content}
                      onChange={(e) => updateText(selectedTextKey, 'content', e.target.value)}
                      rows={selectedTextKey === 'title' || selectedTextKey === 'description' ? 3 : 2}
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none"
                    />
                  </div>

                  {/* 글꼴 */}
                  <div>
                    <label className="text-xs font-medium text-gray-500 mb-1 block">글꼴</label>
                    <select
                      value={selectedCard.texts[selectedTextKey].fontFamily}
                      onChange={(e) => updateText(selectedTextKey, 'fontFamily', e.target.value)}
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"
                    >
                      {freeFonts.map(f => (
                        <option key={f.value} value={f.value} style={{ fontFamily: f.value }}>
                          {f.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* 크기 슬라이더 */}
                  <div>
                    <div className="flex justify-between text-xs font-medium text-gray-500 mb-1">
                      <span>크기</span>
                      <span>{selectedCard.texts[selectedTextKey].fontSize}px</span>
                    </div>
                    <input
                      type="range"
                      min="10"
                      max="80"
                      value={selectedCard.texts[selectedTextKey].fontSize}
                      onChange={(e) => updateText(selectedTextKey, 'fontSize', Number(e.target.value))}
                      className="w-full"
                    />
                  </div>

                  {/* 강조 */}
                  <div className="space-y-3">
                    <label className="text-xs font-medium text-gray-500 block">강조</label>
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => updateText(selectedTextKey, 'bold', !selectedCard.texts[selectedTextKey].bold)}
                        className={`px-4 py-1.5 rounded-lg text-sm font-bold border ${
                          selectedCard.texts[selectedTextKey].bold
                            ? 'bg-gray-900 text-white border-gray-900'
                            : 'bg-white border-gray-200'
                        }`}
                      >
                        B
                      </button>

                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-500">글자색</span>
                        <input
                          type="color"
                          value={selectedCard.texts[selectedTextKey].color}
                          onChange={(e) => updateText(selectedTextKey, 'color', e.target.value)}
                          className="w-8 h-8 rounded cursor-pointer border-0"
                        />
                      </div>

                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-500">하이라이트</span>
                        <input
                          type="color"
                          value={selectedCard.texts[selectedTextKey].highlight || '#000000'}
                          onChange={(e) => updateText(selectedTextKey, 'highlight', e.target.value)}
                          className="w-8 h-8 rounded cursor-pointer border-0"
                        />
                        <button
                          onClick={() => updateText(selectedTextKey, 'highlight', null)}
                          className="text-xs text-gray-400 hover:text-gray-600"
                        >
                          제거
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ===== 이미지 탭 ===== */}
              {activeTab === 'image' && (
                <div className="space-y-5">
                  <h3 className="font-semibold text-gray-900">배경 이미지</h3>
                  <div>
                    <label className="text-xs font-medium text-gray-500 mb-1 block">이미지 URL</label>
                    <input
                      type="text"
                      value={selectedCard.backgroundImage}
                      onChange={(e) => updateCard({ backgroundImage: e.target.value })}
                      placeholder="https://..."
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-gray-500 mb-1 block">파일 업로드</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const url = URL.createObjectURL(file);
                          updateCard({ backgroundImage: url });
                        }
                      }}
                      className="w-full text-sm"
                    />
                  </div>
                  <div>
                    <div className="flex justify-between text-xs font-medium text-gray-500 mb-1">
                      <span>오버레이 어두움</span>
                      <span>{Math.round(selectedCard.overlayOpacity * 100)}%</span>
                    </div>
                    <input
                      type="range"
                      min="0.2"
                      max="0.9"
                      step="0.05"
                      value={selectedCard.overlayOpacity}
                      onChange={(e) => updateCard({ overlayOpacity: Number(e.target.value) })}
                      className="w-full"
                    />
                  </div>
                </div>
              )}

              {/* ===== 스타일 탭 ===== */}
              {activeTab === 'style' && (
                <div className="space-y-4">
                  <h3 className="font-semibold text-gray-900">추가 스타일</h3>
                  <p className="text-sm text-gray-500">
                    현재 버전에서는 텍스트와 이미지 설정이 주요 스타일 컨트롤입니다.
                    더 필요한 옵션이 있으면 말씀해 주세요.
                  </p>
                </div>
              )}

              {/* ===== 내보내기 탭 ===== */}
              {activeTab === 'export' && (
                <div className="space-y-5">
                  <h3 className="font-semibold text-gray-900">내보내기</h3>
                  <p className="text-sm text-gray-600">
                    iPhone과 MacBook에서 선명하게 저장되도록 3배 해상도로 내보냅니다.
                  </p>
                  <button
                    onClick={downloadCard}
                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition"
                  >
                    PNG로 저장하기
                  </button>
                  <p className="text-xs text-gray-400">
                    * 외부 이미지 URL을 사용할 경우 CORS 문제가 발생할 수 있습니다.  
                    가능하면 직접 업로드한 이미지를 사용하세요.
                  </p>
                </div>
              )}
            </aside>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
